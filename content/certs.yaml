# Certification blueprints used for readiness (separate from recreational XP).
# Weights are relative importance of each branch, derived from the public exam guides.
certs:
  - id: ACE
    name: Associate Cloud Engineer
    level: associate
    guide: https://cloud.google.com/learn/certification/cloud-engineer?hl=es
    weights: {foundations: 12, compute: 20, storage: 10, networking: 18, iam: 18, observability: 10, databases: 6, devops: 6}
    en:
      name: Associate Cloud Engineer
      guide: https://cloud.google.com/learn/certification/cloud-engineer
  - id: PCA
    name: Professional Cloud Architect
    level: professional
    guide: https://cloud.google.com/learn/certification/cloud-architect?hl=es
    weights: {architecture: 25, networking: 15, security: 12, compute: 10, databases: 10, data: 8, devops: 8, observability: 6, iam: 6}
    en:
      name: Professional Cloud Architect
      guide: https://cloud.google.com/learn/certification/cloud-architect
  - id: PCDE
    name: Professional Cloud DevOps Engineer
    level: professional
    guide: https://cloud.google.com/learn/certification/cloud-devops-engineer?hl=es

    en:
      name: Professional Cloud DevOps Engineer
      guide: https://cloud.google.com/learn/certification/cloud-devops-engineer
  - id: PCSE
    name: Professional Cloud Security Engineer
    level: professional
    guide: https://cloud.google.com/learn/certification/cloud-security-engineer?hl=es
    weights: {security: 35, iam: 30, networking: 20, observability: 10, storage: 5}

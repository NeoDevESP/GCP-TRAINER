      guide: https://cloud.google.com/learn/certification/cloud-network-engineer
  - id: PDE
    name: Professional Data Engineer
    level: professional
    guide: https://cloud.google.com/learn/certification/data-engineer?hl=es
    weights: {data: 60, databases: 20, storage: 10, iam: 10}

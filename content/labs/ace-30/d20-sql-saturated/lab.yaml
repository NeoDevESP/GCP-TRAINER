id: ace-d20-sql-saturated
title: "Día 20 · INC: Cloud SQL saturado tras una versión"
summary: Relaciona métricas, registros y configuración para encontrar la regresión del pool de conexiones y recuperar la base de datos.
track: ace-30
day: 20
level: intermediate
branch: databases
type: incident
skills: [databases.performance, observability.incident, compute.serverless]
wellArchitected: [reliability, performance]
certs: [ACE, PCDBE]
difficulty: 3
minutes: 60
params:
  pool: ["60", "80", "120"]
baseline: [default-network]
setup: |
  gcloud iam service-accounts create stock-sa
  gcloud projects add-iam-policy-binding {{.project}} --member=serviceAccount:stock-sa@{{.project}}.iam.gserviceaccount.com --role=roles/cloudsql.client
  gcloud sql instances create stock-db --database-version=POSTGRES_15 --tier=db-g1-small --region={{.region}}
  gcloud sql databases create stock --instance=stock-db
  gcloud sql users create app --instance=stock-db --password=pw-stock-1
  gcloud run deploy stock-api --image=europe-docker.pkg.dev/gcplab-public/apps/inventory-api:1.0 --region={{.region}} --service-account=stock-sa@{{.project}}.iam.gserviceaccount.com --add-cloudsql-instances={{.project}}:{{.region}}:stock-db --set-env-vars=DB_HOST=/cloudsql/{{.project}}:{{.region}}:stock-db,DB_USER=app,DB_PASSWORD=pw-stock-1,DB_NAME=stock,DB_POOL_SIZE=5 --max-instances=10 --allow-unauthenticated
faults:
  - {type: run_env, service: stock-api, key: DB_POOL_SIZE, value: "{{.pool}}", actor: "release-bot@{{.project}}.iam.gserviceaccount.com"}
  - {type: log_noise, severity: WARNING, resourceType: cloudsql_database, lines: ["checkpoint complete: wrote 812 buffers", "autovacuum: VACUUM public.stock"]}
traffic:
  - {name: stock, target: "run:stock-api", path: /stock, rps: 60}
story: |
  **INC-2291** — Desde la versión 7.3 (09:00) `stock-api` devuelve 503 y la CPU de Cloud SQL está al
  100 %. Las notas de la versión dicen *«mejoras de rendimiento»*. Recupera el servicio y explica qué ha pasado.
objectives:
  - Relaciona métricas, registros y configuración
  - Identifica el ajuste defectuoso
  - Corrígelo y valida la recuperación
  - Propón medidas de prevención
hints:
  - text: "Los registros de Cloud SQL mencionan el número de conexiones activas y max_connections."
  - text: "Conexiones ≈ tamaño del pool × instancias en ejecución. Compara el diff de la versión en el registro de auditoría."
solution: |
  gcloud logging read 'resource.type="cloudsql_database" severity>=ERROR' --limit=2 --format='value(textPayload)'
  gcloud logging read 'logName:cloudaudit protoPayload.methodName:ReplaceService' --limit=2 --format='value(protoPayload.authenticationInfo.principalEmail)'
  gcloud run services describe stock-api --region={{.region}}
  gcloud run services update stock-api --region={{.region}} --update-env-vars=DB_POOL_SIZE=5
  sleep 120
  curl -s $(gcloud run services describe stock-api --region={{.region}} --format='value(status.url)')/stock
evidence:
  fields: [rootCause, prevention]
  sample:
    rootCause: La versión 7.3 subió DB_POOL_SIZE a {{.pool}}; con varias instancias de Cloud Run, el pool abría más conexiones que el max_connections de db-g1-small (50), así que Postgres rechazaba clientes y la API devolvía 503.
    prevention: Hacer pruebas de carga de las versiones, alertar cuando las conexiones de Cloud SQL se acerquen a max_connections y limitar max-instances por el tamaño del pool por debajo del límite de la base de datos.
rubric:
  - name: Diagnóstico
    validator: evidence
    points: 35
    checks:
      - {type: evidence, fields: [rootCause], keywords: [[pool], [connection, conexion, max_connections, conexiones]], desc: "Explica el mecanismo de saturación"}
  - name: Remediación
    validator: functional
    points: 30
    all: true
    checks:
      - {type: sql_healthy, instance: stock-db, settle: 2, desc: "Conexiones por debajo de max_connections"}
      - {type: http, target: "run:stock-api", path: /stock, status: 200, desc: "/stock recuperado"}
  - name: Validación
    validator: diagnosis
    points: 20
    checks:
      - {type: command, regex: "logging read|sql instances describe|run services describe", desc: "Evidencias reunidas"}
  - name: Prevención
    validator: evidence
    points: 15
    checks:
      - {type: evidence, fields: [prevention], keywords: [[alert, alerta, load test, prueba de carga, max-instances, limit, limite]], desc: "Control preventivo"}
en:
  title: 'Day 20 · INC: Cloud SQL saturated after a release'
  summary: Correlate metrics, logs and configuration to find the connection-pool regression and restore the database.
  story: |
    **INC-2291** — Since release 7.3 (09:00) `stock-api` returns 503 and Cloud SQL CPU is at
    100%. The release notes say *"performance improvements"*. Restore the service and explain.
  objectives:
    - Correlate metrics, logs and configuration
    - Identify the defective setting
    - Fix it and validate recovery
    - Propose prevention
  hints:
    - Cloud SQL logs mention the number of active connections and max_connections.
    - Connections ≈ pool size × running instances. Compare the release diff in the audit log.
  text:
    Diagnóstico: Diagnosis
    Explica el mecanismo de saturación: Explain the saturation mechanism
    Remediación: Remediation
    Conexiones por debajo de max_connections: Connections under max_connections
    /stock recuperado: /stock recovered
    Validación: Validation
    Evidencias reunidas: Evidence gathered
    Prevención: Prevention
    Control preventivo: Preventive control

id: ace-d03-secure-bucket
title: "Day 3 · A secure documents bucket with lifecycle"
summary: Create a regional bucket that can never become public, keeps versions and moves old documents to cheaper storage.
track: ace-30
day: 3
level: basic
branch: storage
type: challenge
skills: [storage.buckets, storage.lifecycle, storage.access]
wellArchitected: [security, cost]
certs: [ACE]
difficulty: 2
minutes: 45
params:
  region: [europe-west1, europe-southwest1, europe-west3]
  nearline: ["30", "60"]
baseline: [default-network]
setup: |
  gcloud storage buckets create gs://tmp-upload-{{.project}} --location={{.region}}
story: |
  Legal needs a bucket **docs-{{.project}}** for signed contracts:

  - data residency: region **{{.region}}** only
  - it must be impossible to make any object public
  - access controlled only with IAM (no ACLs)
  - accidental overwrites must be recoverable
  - after **{{.nearline}} days** documents move to Nearline; after 365 days they are deleted

  The temporary bucket `tmp-upload-{{.project}}` used during the migration must be removed.
objectives:
  - Bucket in the required region with uniform bucket-level access
  - Public access prevention enforced and versioning enabled
  - Lifecycle rules for Nearline and deletion
  - Remove the temporary bucket
hints:
  - text: "`gcloud storage buckets create` accepts `--uniform-bucket-level-access` and `--public-access-prevention`."
  - text: "A lifecycle file is JSON with a `rule` array; actions `SetStorageClass` and `Delete`, conditions `age`."
solution: |
  gcloud storage buckets create gs://docs-{{.project}} --location={{.region}} --uniform-bucket-level-access --public-access-prevention
  cat > lifecycle.json <<'JSON'
  {"rule": [
    {"action": {"type": "SetStorageClass", "storageClass": "NEARLINE"}, "condition": {"age": {{.nearline}}}},
    {"action": {"type": "Delete"}, "condition": {"age": 365}}
  ]}
  JSON
  gcloud storage buckets update gs://docs-{{.project}} --versioning --lifecycle-file=lifecycle.json
  gcloud storage buckets delete gs://tmp-upload-{{.project}}
rubric:
  - name: Bucket state
    validator: state
    points: 40
    checks:
      - {type: exists, path: "buckets[\"docs-{{.project}}\"]", expect: {location: {eq: "{{.region}}"}, locationType: region}, desc: "Bucket in the required region"}
      - {type: exists, path: "buckets[\"docs-{{.project}}\"]", expect: {versioning: true}, desc: "Versioning enabled"}
  - name: Security
    validator: security
    points: 30
    critical: true
    checks:
      - {type: exists, path: "buckets[\"docs-{{.project}}\"]", expect: {uniformBucketLevelAccess: true}, desc: "Uniform bucket-level access"}
      - {type: exists, path: "buckets[\"docs-{{.project}}\"]", expect: {publicAccessPrevention: enforced}, desc: "Public access prevention enforced"}
      - {type: policy, package: gcplab.security, ids: [PUBLIC_BUCKET], desc: "No public bindings"}
  - name: Lifecycle
    validator: state
    points: 20
    checks:
      - {type: exists, path: "buckets[\"docs-{{.project}}\"]", expect: {"lifecycle": {regex: "SetStorageClass.*NEARLINE.*\"age\":{{.nearline}}"}}, desc: "Transition to Nearline at the requested age"}
      - {type: exists, path: "buckets[\"docs-{{.project}}\"]", expect: {"lifecycle": {regex: "Delete.*\"age\":365"}}, desc: "Deletion after 365 days"}
  - name: Cleanup
    validator: cost
    points: 10
    checks:
      - {type: absent, path: "buckets[\"tmp-upload-{{.project}}\"]", desc: "Temporary bucket removed"}

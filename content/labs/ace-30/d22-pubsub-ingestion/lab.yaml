id: ace-d22-pubsub-ingestion
title: "Día 22 · Ingesta de eventos casi en tiempo real"
summary: Conecta los productores con un procesador privado en Cloud Run mediante push de Pub/Sub con autenticación y un tema de mensajes fallidos (dead-letter).
track: ace-30
day: 22
level: advanced
branch: data
type: challenge
skills: [data.pubsub, data.pipelines, iam.serviceaccounts]
wellArchitected: [reliability, security]
certs: [PDE, PCDE]
difficulty: 3
minutes: 75
baseline: [default-network]
setup: |
  gcloud storage buckets create gs://events-sink-{{.project}} --location={{.region}} --uniform-bucket-level-access
  gcloud iam service-accounts create processor-sa
  gcloud iam service-accounts create push-sa
  gcloud run deploy processor --image=europe-docker.pkg.dev/gcplab-public/apps/events-processor:1.0 --region={{.region}} --service-account=processor-sa@{{.project}}.iam.gserviceaccount.com --set-env-vars=SINK_BUCKET=events-sink-{{.project}} --no-allow-unauthenticated
traffic:
  - {name: producer, target: "pubsub:events", rps: 100}
story: |
  Los productores publican eventos de pedidos en el tema **events** (créalo). Construye el canal:

  - suscripción push `events-push` → servicio `processor` en la ruta `/push`, autenticada como `push-sa`
    (el procesador debe seguir siendo privado)
  - el procesador escribe en `gs://events-sink-{{.project}}` como `processor-sa`
  - los mensajes que fallen 5 veces van al tema `events-dlq` (con una suscripción pull `events-dlq-sub` para inspeccionarlos)
  - una alerta sobre los mensajes no entregados de `events-push`
objectives:
  - Productor → Pub/Sub → procesamiento → destino
  - Mensajes procesados y almacenados
  - Gestión de fallos con un tema de dead-letter
  - Observabilidad de la cola pendiente
hints:
  - text: "Concede `roles/run.invoker` en el servicio a push-sa y usa `--push-auth-service-account`."
  - text: "El agente de servicio de Pub/Sub necesita permiso de publicación en el tema DLQ."
solution: |
  gcloud pubsub topics create events
  gcloud pubsub topics create events-dlq
  gcloud pubsub subscriptions create events-dlq-sub --topic=events-dlq
  gcloud run services add-iam-policy-binding processor --region={{.region}} --member=serviceAccount:push-sa@{{.project}}.iam.gserviceaccount.com --role=roles/run.invoker
  gcloud storage buckets add-iam-policy-binding gs://events-sink-{{.project}} --member=serviceAccount:processor-sa@{{.project}}.iam.gserviceaccount.com --role=roles/storage.objectCreator
  gcloud pubsub subscriptions create events-push --topic=events --push-endpoint=$(gcloud run services describe processor --region={{.region}} --format='value(status.url)')/push --push-auth-service-account=push-sa@{{.project}}.iam.gserviceaccount.com --dead-letter-topic=events-dlq --max-delivery-attempts=5
  gcloud alpha monitoring policies create --display-name="events backlog" --condition-display-name=backlog --condition-filter='metric.type="pubsub.googleapis.com/subscription/num_undelivered_messages"' --if='> 1000' --duration=300s
  sleep 300
  gcloud pubsub subscriptions describe events-push
rubric:
  - name: Canal
    validator: functional
    points: 35
    checks:
      - {type: pubsub, subscription: events-push, ackedMin: 10, backlogMax: 50, settle: 3, desc: "Mensajes entregados y confirmados"}
  - name: Corrección
    validator: security
    points: 30
    all: true
    checks:
      - {type: http, target: "run:processor", path: /push, status: 403, desc: "El procesador no es público"}
      - {type: iam, principal: "serviceAccount:processor-sa@{{.project}}.iam.gserviceaccount.com", permission: storage.objects.create, resource: "bucket:events-sink-{{.project}}/data/x", desc: "El procesador puede escribir en el destino"}
      - {type: iam, principal: "serviceAccount:processor-sa@{{.project}}.iam.gserviceaccount.com", permission: storage.objects.delete, resource: "bucket:events-sink-{{.project}}/data/x", expect: false, desc: "El procesador no puede borrar"}
  - name: Resiliencia
    validator: state
    points: 20
    checks:
      - {type: exists, path: "subscriptions[\"events-push\"]", expect: {deadLetterTopic: events-dlq, maxDeliveryAttempts: {gte: 5}}, desc: "Política de dead-letter"}
      - {type: exists, path: "subscriptions[\"events-dlq-sub\"]", expect: {topic: events-dlq}, desc: "Se puede inspeccionar la DLQ"}
  - name: Observabilidad
    validator: state
    points: 15
    checks:
      - {type: alert_policy, filterContains: num_undelivered_messages, desc: "Alerta sobre la cola pendiente"}
tutor:
  - {match: "@intro", title: "", why: "Pub/Sub desacopla productores y consumidores. Una suscripción push entrega a una URL, autenticada; los mensajes que fallan varias veces van a un tema de mensajes fallidos para no perderlos."}
  - {match: "roles/run.invoker", title: "", why: "push-sa es quien llama al procesador: necesita permiso para invocarlo."}
  - {match: "subscriptions create events-push", title: "", why: "--dead-letter-topic y --max-delivery-attempts: tras 5 fallos el mensaje se aparta en lugar de reintentarse sin fin."}
  - {match: "num_undelivered_messages", title: "", why: "Alertar sobre la cola pendiente avisa si el procesador se queda atrás."}
en:
  title: Day 22 · Near-real-time event ingestion
  summary: Connect producers to a private Cloud Run processor through Pub/Sub push with authentication and a dead-letter topic.
  story: |
    Producers publish order events to topic **events** (create it). Build the pipeline:

    - push subscription `events-push` → `processor` service at path `/push`, authenticated as `push-sa`
      (the processor must stay private)
    - the processor writes to `gs://events-sink-{{.project}}` as `processor-sa`
    - messages failing 5 times go to topic `events-dlq` (with a pull subscription `events-dlq-sub` for inspection)
    - an alert on undelivered messages of `events-push`
  objectives:
    - Producer → Pub/Sub → processing → sink
    - Messages processed and stored
    - Failure handling with a dead-letter topic
    - Observability of the backlog
  hints:
    - Grant `roles/run.invoker` on the service to push-sa and use `--push-auth-service-account`.
    - The Pub/Sub service agent needs publisher on the DLQ topic.
  text:
    Canal: Pipeline
    Mensajes entregados y confirmados: Messages delivered and acknowledged
    Corrección: Correctness
    El procesador no es público: Processor is not public
    El procesador puede escribir en el destino: Processor can write the sink
    El procesador no puede borrar: Processor cannot delete
    Resiliencia: Resilience
    Política de dead-letter: Dead-letter policy
    Se puede inspeccionar la DLQ: DLQ can be inspected
    Observabilidad: Observability
    Alerta sobre la cola pendiente: Backlog alert
    "Pub/Sub desacopla productores y consumidores. Una suscripción push entrega a una URL, autenticada; los mensajes que fallan varias veces van a un tema de mensajes fallidos para no perderlos.": "Pub/Sub decouples producers and consumers. A push subscription delivers to a URL, authenticated; messages failing several times go to a dead-letter topic so they are not lost."
    "push-sa es quien llama al procesador: necesita permiso para invocarlo.": "push-sa is who calls the processor: it needs permission to invoke it."
    "--dead-letter-topic y --max-delivery-attempts: tras 5 fallos el mensaje se aparta en lugar de reintentarse sin fin.": "--dead-letter-topic and --max-delivery-attempts: after 5 failures the message is set aside instead of retried forever."
    "Alertar sobre la cola pendiente avisa si el procesador se queda atrás.": "Alerting on the backlog warns you when the processor falls behind."

id: ace-d07-cloud-sql
title: "Día 7 · Conectar una aplicación a Cloud SQL"
summary: Crea una instancia de PostgreSQL, una base de datos y un usuario, y conecta un servicio de Cloud Run de forma segura con el conector de Cloud SQL.
track: ace-30
day: 7
level: basic
branch: databases
type: guided
skills: [databases.cloudsql, iam.serviceaccounts]
wellArchitected: [security, reliability]
certs: [ACE, PCDBE]
difficulty: 2
minutes: 60
params:
  db: [inventory-db, stock-pg, warehouse-db]
baseline: [default-network]
setup: |
  gcloud iam service-accounts create inventory-sa --display-name="inventory service"
  gcloud run deploy inventory --image=europe-docker.pkg.dev/gcplab-public/apps/inventory-api:1.0 --region={{.region}} --service-account=inventory-sa@{{.project}}.iam.gserviceaccount.com --allow-unauthenticated
traffic:
  - {name: stock, target: "run:inventory", path: /stock, rps: 10}
story: |
  El servicio de Cloud Run `inventory` (identidad `inventory-sa`) necesita PostgreSQL 15:

  - instancia **{{.db}}** en {{.region}}, base de datos `inventory`, usuario `app`
  - no se puede autorizar ninguna red en la IP pública: conéctate con el **conector de Cloud SQL**
    (`/cloudsql/PROJECT:REGION:INSTANCE`), autorizado por IAM
  - el servicio lee `DB_HOST`, `DB_USER`, `DB_PASSWORD`, `DB_NAME`
objectives:
  - Instancia, base de datos y usuario creados
  - Servicio conectado y /stock respondiendo
  - Conectividad segura con mínimo privilegio para inventory-sa
hints:
  - text: "`gcloud run services update inventory --add-cloudsql-instances=CONNECTION_NAME` monta el socket."
  - text: "La cuenta de servicio necesita `roles/cloudsql.client`."
solution: |
  gcloud sql instances create {{.db}} --database-version=POSTGRES_15 --tier=db-custom-1-3840 --region={{.region}}
  gcloud sql databases create inventory --instance={{.db}}
  gcloud sql users create app --instance={{.db}} --password=S3cure-Pass-1
  gcloud projects add-iam-policy-binding {{.project}} --member=serviceAccount:inventory-sa@{{.project}}.iam.gserviceaccount.com --role=roles/cloudsql.client
  gcloud run services update inventory --region={{.region}} --add-cloudsql-instances={{.project}}:{{.region}}:{{.db}} --set-env-vars=DB_HOST=/cloudsql/{{.project}}:{{.region}}:{{.db}},DB_USER=app,DB_PASSWORD=S3cure-Pass-1,DB_NAME=inventory
  curl -s $(gcloud run services describe inventory --region={{.region}} --format='value(status.url)')/stock
rubric:
  - name: Base de datos
    validator: state
    points: 35
    checks:
      - {type: exists, path: "sqlInstances[\"{{.db}}\"]", expect: {databaseVersion: {regex: "POSTGRES"}, region: "{{.region}}", state: RUNNABLE}, desc: "Instancia de PostgreSQL en la región"}
      - {type: exists, path: "sqlInstances[\"{{.db}}\"]", expect: {databases: {contains: inventory}}, desc: "Base de datos inventory"}
      - {type: exists, path: "sqlInstances[\"{{.db}}\"].users.app", desc: "Usuario app"}
  - name: Conexión
    validator: functional
    points: 35
    checks:
      - {type: http, target: "run:inventory", path: /stock, status: 200, desc: "/stock devuelve datos de PostgreSQL"}
  - name: Seguridad
    validator: security
    points: 20
    critical: true
    checks:
      - {type: policy, package: gcplab.security, ids: [PUBLIC_SQL], desc: "Ninguna base de datos abierta a internet"}
      - {type: iam, principal: "serviceAccount:inventory-sa@{{.project}}.iam.gserviceaccount.com", permission: cloudsql.instances.connect, resource: project, desc: "La identidad del servicio puede conectarse"}
      - {type: no_basic_roles, members: ["serviceAccount:inventory-sa@{{.project}}.iam.gserviceaccount.com"], desc: "Sin roles básicos para el servicio"}
  - name: Prueba
    validator: functional
    points: 10
    checks:
      - {type: exists, path: "sqlInstances[\"{{.db}}\"]", expect: {authorizedNetworks: {empty: true}}, desc: "Sin redes autorizadas"}
tutor:
  - {match: "@intro", title: "", why: "Cloud Run se conecta a Cloud SQL con el conector de Cloud SQL, autorizado por IAM, sin abrir la base de datos a ninguna red."}
  - {match: "roles/cloudsql.client", title: "Da a la app permiso para conectarse", why: "Cloud SQL Client es el rol que permite a la identidad del servicio usar el conector."}
  - {match: "add-cloudsql-instances", title: "", why: "DB_HOST=/cloudsql/PROYECTO:REGIÓN:INSTANCIA es el socket que abre el conector dentro del contenedor."}
en:
  title: Day 7 · Connect an application to Cloud SQL
  summary: Create a PostgreSQL instance, database and user, and connect a Cloud Run service securely through the Cloud SQL connector.
  story: |
    The `inventory` Cloud Run service (identity `inventory-sa`) needs PostgreSQL 15:

    - instance **{{.db}}** in {{.region}}, database `inventory`, user `app`
    - no network may be authorised on the public IP: connect through the **Cloud SQL connector**
      (`/cloudsql/PROJECT:REGION:INSTANCE`), authorised by IAM
    - the service reads `DB_HOST`, `DB_USER`, `DB_PASSWORD`, `DB_NAME`
  objectives:
    - Instance, database and user created
    - Service connected and /stock answering
    - Secure connectivity with least privilege for inventory-sa
  hints:
    - '`gcloud run services update inventory --add-cloudsql-instances=CONNECTION_NAME` mounts the socket.'
    - The service account needs `roles/cloudsql.client`.
  text:
    Base de datos: Database
    Instancia de PostgreSQL en la región: PostgreSQL instance in the region
    Base de datos inventory: inventory database
    Usuario app: app user
    Conexión: Connection
    /stock devuelve datos de PostgreSQL: /stock returns data from PostgreSQL
    Seguridad: Security
    Ninguna base de datos abierta a internet: No database open to the internet
    La identidad del servicio puede conectarse: Service identity can connect
    Sin roles básicos para el servicio: No basic roles for the service
    Prueba: Test
    Sin redes autorizadas: No authorised networks
    "Cloud Run se conecta a Cloud SQL con el conector de Cloud SQL, autorizado por IAM, sin abrir la base de datos a ninguna red.": "Cloud Run connects to Cloud SQL through the Cloud SQL connector, authorized by IAM, without opening the database to any network."
    "Cloud SQL Client es el rol que permite a la identidad del servicio usar el conector.": "Cloud SQL Client is the role that lets the service identity use the connector."
    "Da a la app permiso para conectarse": "Let the app connect"
    "DB_HOST=/cloudsql/PROYECTO:REGIÓN:INSTANCIA es el socket que abre el conector dentro del contenedor.": "DB_HOST=/cloudsql/PROJECT:REGION:INSTANCE is the socket the connector opens inside the container."

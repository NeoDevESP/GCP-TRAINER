id: ace-d07-cloud-sql
title: "Day 7 · Connect an application to Cloud SQL"
summary: Create a PostgreSQL instance, database and user, and connect a Cloud Run service securely through the Cloud SQL connector.
track: ace-30
day: 7
level: basic
branch: databases
type: guided
skills: [databases.cloudsql, iam.serviceaccounts]
wellArchitected: [security, reliability]
certs: [ACE, PCDBE]
difficulty: 2
minutes: 60
params:
  db: [inventory-db, stock-pg, warehouse-db]
baseline: [default-network]
setup: |
  gcloud iam service-accounts create inventory-sa --display-name="inventory service"
  gcloud run deploy inventory --image=europe-docker.pkg.dev/gcplab-public/apps/inventory-api:1.0 --region={{.region}} --service-account=inventory-sa@{{.project}}.iam.gserviceaccount.com --allow-unauthenticated
traffic:
  - {name: stock, target: "run:inventory", path: /stock, rps: 10}
story: |
  The `inventory` Cloud Run service (identity `inventory-sa`) needs PostgreSQL 15:

  - instance **{{.db}}** in {{.region}}, database `inventory`, user `app`
  - no network may be authorised on the public IP: connect through the **Cloud SQL connector**
    (`/cloudsql/PROJECT:REGION:INSTANCE`), authorised by IAM
  - the service reads `DB_HOST`, `DB_USER`, `DB_PASSWORD`, `DB_NAME`
objectives:
  - Instance, database and user created
  - Service connected and /stock answering
  - Secure connectivity with least privilege for inventory-sa
hints:
  - text: "`gcloud run services update inventory --add-cloudsql-instances=CONNECTION_NAME` mounts the socket."
  - text: "The service account needs `roles/cloudsql.client`."
solution: |
  gcloud sql instances create {{.db}} --database-version=POSTGRES_15 --tier=db-custom-1-3840 --region={{.region}}
  gcloud sql databases create inventory --instance={{.db}}
  gcloud sql users create app --instance={{.db}} --password=S3cure-Pass-1
  gcloud projects add-iam-policy-binding {{.project}} --member=serviceAccount:inventory-sa@{{.project}}.iam.gserviceaccount.com --role=roles/cloudsql.client
  gcloud run services update inventory --region={{.region}} --add-cloudsql-instances={{.project}}:{{.region}}:{{.db}} --set-env-vars=DB_HOST=/cloudsql/{{.project}}:{{.region}}:{{.db}},DB_USER=app,DB_PASSWORD=S3cure-Pass-1,DB_NAME=inventory
  curl -s $(gcloud run services describe inventory --region={{.region}} --format='value(status.url)')/stock
rubric:
  - name: Database
    validator: state
    points: 35
    checks:
      - {type: exists, path: "sqlInstances[\"{{.db}}\"]", expect: {databaseVersion: {regex: "POSTGRES"}, region: "{{.region}}", state: RUNNABLE}, desc: "PostgreSQL instance in the region"}
      - {type: exists, path: "sqlInstances[\"{{.db}}\"]", expect: {databases: {contains: inventory}}, desc: "inventory database"}
      - {type: exists, path: "sqlInstances[\"{{.db}}\"].users.app", desc: "app user"}
  - name: Connection
    validator: functional
    points: 35
    checks:
      - {type: http, target: "run:inventory", path: /stock, status: 200, desc: "/stock returns data from PostgreSQL"}
  - name: Security
    validator: security
    points: 20
    critical: true
    checks:
      - {type: policy, package: gcplab.security, ids: [PUBLIC_SQL], desc: "No database open to the internet"}
      - {type: iam, principal: "serviceAccount:inventory-sa@{{.project}}.iam.gserviceaccount.com", permission: cloudsql.instances.connect, resource: project, desc: "Service identity can connect"}
      - {type: no_basic_roles, members: ["serviceAccount:inventory-sa@{{.project}}.iam.gserviceaccount.com"], desc: "No basic roles for the service"}
  - name: Test
    validator: functional
    points: 10
    checks:
      - {type: exists, path: "sqlInstances[\"{{.db}}\"]", expect: {authorizedNetworks: {empty: true}}, desc: "No authorised networks"}

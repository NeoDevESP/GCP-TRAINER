id: ace-d02-iam-storage-read
title: "Día 2 · Acceso de lectura a informes sin Owner ni Editor"
summary: Da a una analista acceso de lectura a un único bucket aplicando mínimo privilegio, y demuestra tanto el acceso como la denegación.
track: ace-30
day: 2
level: basic
branch: iam
type: guided
skills: [iam.roles, iam.leastprivilege, storage.access]
wellArchitected: [security]
certs: [ACE, PCSE]
difficulty: 1
minutes: 45
params:
  analyst: [ana.analyst, luis.bi, marta.data]
baseline: [default-network]
story: |
  Ticket FIN-311: *«{{.analyst}}@gcplab.dev necesita leer los informes mensuales de
  `gs://reports-{{.project}}`. No debe modificar ni borrar nada, y no debe
  ver el bucket de exportaciones de finanzas».*
setup: |
  gcloud storage buckets create gs://reports-{{.project}} --location={{.region}} --uniform-bucket-level-access
  gcloud storage buckets create gs://finance-{{.project}} --location={{.region}} --uniform-bucket-level-access
  echo "month,revenue" > report.csv
  gcloud storage cp report.csv gs://reports-{{.project}}/data/report.csv
  gcloud storage cp report.csv gs://finance-{{.project}}/exports/2026-08.csv
objectives:
  - Concede acceso de solo lectura únicamente al bucket de informes
  - No uses roles básicos (Owner/Editor/Viewer)
  - Demuestra que la lectura está permitida y el borrado denegado
hints:
  - text: "Busca un rol predefinido de Storage que solo contenga storage.objects.get y storage.objects.list."
  - text: "Concédelo en el bucket (`gcloud storage buckets add-iam-policy-binding`), no en el proyecto."
  - text: "Usa `gcloud policy-intelligence troubleshoot-policy iam` para demostrar el acceso y la denegación."
    kind: partial
solution: |
  gcloud iam roles describe roles/storage.objectViewer
  gcloud storage buckets add-iam-policy-binding gs://reports-{{.project}} --member=user:{{.analyst}}@gcplab.dev --role=roles/storage.objectViewer
  gcloud policy-intelligence troubleshoot-policy iam //storage.googleapis.com/projects/_/buckets/reports-{{.project}}/objects/data/report.csv --principal-email={{.analyst}}@gcplab.dev --permission=storage.objects.get
  gcloud policy-intelligence troubleshoot-policy iam //storage.googleapis.com/projects/_/buckets/reports-{{.project}}/objects/data/report.csv --principal-email={{.analyst}}@gcplab.dev --permission=storage.objects.delete
rubric:
  - name: Acceso de lectura concedido
    validator: state
    points: 50
    checks:
      - {type: iam, principal: "user:{{.analyst}}@gcplab.dev", permission: storage.objects.get, resource: "bucket:reports-{{.project}}/data/report.csv", desc: "La analista puede leer los informes"}
      - {type: iam, principal: "user:{{.analyst}}@gcplab.dev", permission: storage.objects.list, resource: "bucket:reports-{{.project}}", desc: "La analista puede listar los informes"}
  - name: Mínimo privilegio
    validator: security
    points: 30
    critical: true
    all: true
    checks:
      - {type: iam, principal: "user:{{.analyst}}@gcplab.dev", permission: storage.objects.delete, resource: "bucket:reports-{{.project}}/data/report.csv", expect: false, desc: "La analista no debe poder borrar objetos"}
      - {type: iam, principal: "user:{{.analyst}}@gcplab.dev", permission: storage.objects.get, resource: "bucket:finance-{{.project}}/exports/2026-08.csv", expect: false, desc: "La analista no debe poder leer las exportaciones de finanzas"}
      - {type: no_basic_roles, members: ["user:{{.analyst}}@gcplab.dev"], desc: "Sin roles básicos para la analista"}
  - name: Acceso verificado
    validator: functional
    points: 20
    checks:
      - {type: command, regex: "troubleshoot-policy|get-iam-policy", desc: "Verifica la política efectiva"}
tutor:
  - {match: "@intro", title: "", why: "Principio de mínimo privilegio: da exactamente el permiso necesario, sobre el recurso concreto. Owner o Editor en el proyecto sería darle las llaves de todo."}
  - {match: "iam roles describe", title: "", why: "Mira qué permisos trae el rol antes de darlo: Storage Object Viewer solo permite listar y leer objetos."}
  - {match: "add-iam-policy-binding gs://reports", title: "Da acceso de lectura solo a ese bucket", why: "Al concederlo en el bucket (y no en el proyecto), el analista no ve el bucket de finanzas."}
  - {match: "storage.objects.delete", title: "", why: "Comprueba también lo que NO debe poder hacer: borrar tiene que salir denegado."}
en:
  title: Day 2 · Read access to reports without Owner or Editor
  summary: Give an analyst read access to one bucket, applying least privilege, and prove access and denial.
  story: |
    Ticket FIN-311: *"{{.analyst}}@gcplab.dev needs to read the monthly reports in
    `gs://reports-{{.project}}`. She must not modify or delete anything, and must
    not see the finance exports bucket."*
  objectives:
    - Grant read-only access to the reports bucket only
    - Do not use basic roles (Owner/Editor/Viewer)
    - Prove that reading is allowed and deleting is denied
  hints:
    - Look for a predefined Storage role that only contains storage.objects.get and storage.objects.list.
    - Grant it on the bucket (`gcloud storage buckets add-iam-policy-binding`), not on the project.
    - Use `gcloud policy-intelligence troubleshoot-policy iam` to prove access and denial.
  text:
    Acceso de lectura concedido: Read access granted
    La analista puede leer los informes: The analyst can read reports
    La analista puede listar los informes: The analyst can list reports
    Mínimo privilegio: Least privilege
    La analista no debe poder borrar objetos: The analyst must not delete objects
    La analista no debe poder leer las exportaciones de finanzas: The analyst must not read finance exports
    Sin roles básicos para la analista: No basic roles for the analyst
    Acceso verificado: Access verified
    Verifica la política efectiva: Verify the effective policy
    "Principio de mínimo privilegio: da exactamente el permiso necesario, sobre el recurso concreto. Owner o Editor en el proyecto sería darle las llaves de todo.": "Principle of least privilege: grant exactly the permission needed, on the specific resource. Owner or Editor on the project would hand over the keys to everything."
    "Mira qué permisos trae el rol antes de darlo: Storage Object Viewer solo permite listar y leer objetos.": "Check which permissions a role carries before granting it: Storage Object Viewer only lists and reads objects."
    "Al concederlo en el bucket (y no en el proyecto), el analista no ve el bucket de finanzas.": "Granting it on the bucket (not the project) keeps the finance bucket out of the analyst's reach."
    "Da acceso de lectura solo a ese bucket": "Grant read access to that bucket only"
    "Comprueba también lo que NO debe poder hacer: borrar tiene que salir denegado.": "Also check what they must NOT be able to do: delete must come out denied."

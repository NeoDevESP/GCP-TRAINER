id: ace-d17-gke-hpa
title: "Día 17 · La aplicación no escala durante el pico"
summary: Haz que funcione el Horizontal Pod Autoscaler, genera carga y demuestra el escalado hacia fuera y hacia dentro.
track: ace-30
day: 17
level: intermediate
branch: gke
type: challenge
skills: [gke.autoscaling, gke.troubleshooting]
wellArchitected: [performance, cost]
certs: [ACE, PCDE]
difficulty: 3
minutes: 60
baseline: [default-network]
setup: |
  gcloud container clusters create peak-gke --zone={{.zone}} --num-nodes=3 --machine-type=e2-standard-4
  cat > api.yaml <<'YAML'
  apiVersion: apps/v1
  kind: Deployment
  metadata: {name: api}
  spec:
    replicas: 1
    selector: {matchLabels: {app: api}}
    template:
      metadata: {labels: {app: api}}
      spec:
        containers:
        - name: api
          image: europe-docker.pkg.dev/gcplab-public/apps/cpu-burner:1.0
          ports: [{containerPort: 8080}]
  ---
  apiVersion: v1
  kind: Service
  metadata: {name: api}
  spec:
    selector: {app: api}
    ports: [{port: 8080, targetPort: 8080}]
  ---
  apiVersion: autoscaling/v2
  kind: HorizontalPodAutoscaler
  metadata: {name: api}
  spec:
    scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
    minReplicas: 1
    maxReplicas: 6
    metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 50}}
  YAML
  gcloud container clusters get-credentials peak-gke --zone={{.zone}}
  kubectl apply -f api.yaml
traffic:
  - {name: api, target: "k8s:peak-gke/api", rps: 2}
story: |
  Ensayo del Black Friday: `api` se quedó en 1 réplica mientras la latencia se disparaba.
  El HPA existe (mín. 1, máx. 6, 50 % de CPU). Haz que funcione y **demuestra** que escala hacia fuera
  con carga y hacia dentro cuando la carga se detiene.
objectives:
  - Requests/limits de recursos para que el HPA pueda calcular la utilización
  - El HPA escala hacia fuera con la carga generada
  - Escalado hacia dentro cuando se detiene la carga
hints:
  - text: "`kubectl describe hpa api` explica por qué no puede calcular las métricas."
  - text: "`kubectl run load --image=busybox -- /bin/sh -c 'while true; do wget -q -O- http://api:8080; done'` y después `sleep` para dejar pasar el tiempo."
solution: |
  gcloud container clusters get-credentials peak-gke --zone={{.zone}}
  kubectl describe hpa api
  kubectl set resources deployment api --requests=cpu=200m,memory=128Mi --limits=cpu=500m,memory=256Mi
  kubectl run load --image=busybox --restart=Never -- /bin/sh -c "while true; do wget -q -O- http://api:8080; done"
  sleep 300
  kubectl get hpa api
  kubectl delete pod load
  sleep 600
  kubectl get hpa api
evidence:
  fields: [explanation]
  sample:
    explanation: Sin requests de CPU el HPA mostraba una utilización desconocida; tras configurar los requests escaló hasta 6 réplicas con la carga y volvió a reducir cuando borré el generador de carga.
rubric:
  - name: Recursos
    validator: state
    points: 30
    checks:
      - {type: exists, path: "clusters[\"peak-gke\"].k8s.namespaces.default.deployments.api.template.containers[0].requests", expect: {cpu: {regex: "m$|^[0-9.]+$"}}, desc: "Requests de CPU configurados"}
  - name: HPA
    validator: functional
    points: 30
    checks:
      - {type: hpa_scaled, cluster: peak-gke, deployment: api, desc: "El HPA escaló hacia fuera"}
  - name: Validación
    validator: functional
    points: 30
    checks:
      - {type: hpa_scaled, cluster: peak-gke, deployment: api, requireScaleIn: true, desc: "Escalado hacia dentro demostrado"}
  - name: Explicación
    validator: evidence
    points: 10
    checks:
      - {type: evidence, fields: [explanation], keywords: [[request, solicitud, peticion], [scale, escal]], desc: "Explica la causa y la demostración"}
tutor:
  - {match: "@intro", title: "", why: "El autoescalado horizontal (HPA) calcula el uso de CPU en porcentaje de lo que cada pod pide (requests). Sin requests, no sabe calcularlo y no escala."}
  - {match: "describe hpa", title: "", why: "Aquí verás el aviso: falta el request de CPU."}
  - {match: "set resources", title: "Pon requests y limits de CPU y memoria", why: "Con requests definidos el HPA ya puede calcular el porcentaje de uso."}
  - {match: "kubectl run load", title: "", why: "Genera carga para demostrar que escala hacia fuera; al quitarla debe volver a bajar."}
en:
  title: Day 17 · The app does not scale during the peak
  summary: Make the Horizontal Pod Autoscaler work, generate load and demonstrate scale-out and scale-in.
  story: |
    Black Friday rehearsal: `api` stayed at 1 replica while latency exploded.
    The HPA exists (min 1, max 6, 50% CPU). Make it work and **demonstrate** scale-out
    under load and scale-in when the load stops.
  objectives:
    - Resource requests/limits so the HPA can compute utilisation
    - HPA scaling out under generated load
    - Scale-in after the load stops
  hints:
    - '`kubectl describe hpa api` explains why it cannot compute metrics.'
    - '`kubectl run load --image=busybox -- /bin/sh -c ''while true; do wget -q -O- http://api:8080; done''`, then `sleep` to let time pass.'
  text:
    Recursos: Resources
    Requests de CPU configurados: CPU requests set
    HPA: HPA
    El HPA escaló hacia fuera: HPA scaled out
    Validación: Validation
    Escalado hacia dentro demostrado: Scale-in demonstrated
    Explicación: Explanation
    Explica la causa y la demostración: Explain the cause and demonstration
    "El autoescalado horizontal (HPA) calcula el uso de CPU en porcentaje de lo que cada pod pide (requests). Sin requests, no sabe calcularlo y no escala.": "The Horizontal Pod Autoscaler measures CPU as a percentage of what each pod requests. Without requests it cannot compute it and does not scale."
    "Aquí verás el aviso: falta el request de CPU.": "You will see the warning here: the CPU request is missing."
    "Con requests definidos el HPA ya puede calcular el porcentaje de uso.": "With requests defined the HPA can compute the usage percentage."
    "Pon requests y limits de CPU y memoria": "Set CPU and memory requests and limits"
    "Genera carga para demostrar que escala hacia fuera; al quitarla debe volver a bajar.": "Generates load to prove it scales out; removing it must bring it back down."

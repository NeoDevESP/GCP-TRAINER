id: ace-d15-cloud-build
title: "Día 15 · Compilaciones automáticas: commit → Cloud Build → Artifact Registry"
summary: Crea un activador que compile cada commit en main con una cuenta de servicio dedicada y publique una imagen etiquetada con el SHA del commit.
track: ace-30
day: 15
level: intermediate
branch: devops
type: challenge
skills: [devops.cicd, devops.artifacts, security.supplychain]
wellArchitected: [operations, security]
certs: [ACE, PCDE]
difficulty: 3
minutes: 60
baseline: [empty]
setup: |
  gcloud source repos create storefront
  gcloud iam service-accounts create builder-sa --display-name="CI builder"
files:
  Dockerfile: |
    FROM gcr.io/distroless/static
    LABEL sim.behavior=web-frontend
    COPY app /app
    ENTRYPOINT ["/app"]
  app: "(storefront binary)"
story: |
  El equipo de release engineering quiere imágenes reproducibles:

  - repositorio Docker `releases` en {{.region}}
  - activador `storefront-main` en el repositorio `storefront`, rama `main`
  - la compilación se ejecuta como **builder-sa** (no con la cuenta por defecto de Cloud Build), que solo puede publicar imágenes
  - imágenes etiquetadas con el commit (`$SHORT_SHA`)

  Haz tu primer commit y comprueba la compilación.
objectives:
  - Canal de despliegue del commit al artefacto
  - Artefacto reproducible y etiquetado con el commit
  - Identidad de compilación con mínimo privilegio
  - Evidencia de la compilación correcta
hints:
  - text: "Un `cloudbuild.yaml` con un paso docker build + push y `images:` usando `${SHORT_SHA}`."
  - text: "`roles/artifactregistry.writer` permite a builder-sa publicar."
solution: |
  gcloud artifacts repositories create releases --repository-format=docker --location={{.region}}
  gcloud projects add-iam-policy-binding {{.project}} --member=serviceAccount:builder-sa@{{.project}}.iam.gserviceaccount.com --role=roles/artifactregistry.writer
  cat > cloudbuild.yaml <<'YAML'
  steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, {{.region}}-docker.pkg.dev/$PROJECT_ID/releases/storefront:$SHORT_SHA, .]
  images:
  - {{.region}}-docker.pkg.dev/$PROJECT_ID/releases/storefront:$SHORT_SHA
  options:
    logging: CLOUD_LOGGING_ONLY
  YAML
  gcloud builds triggers create cloud-source-repositories --name=storefront-main --repo=storefront --branch-pattern='^main$' --build-config=cloudbuild.yaml --service-account=projects/{{.project}}/serviceAccounts/builder-sa@{{.project}}.iam.gserviceaccount.com
  git init
  git add .
  git commit -m "first release"
  git remote add origin https://source.developers.google.com/p/{{.project}}/r/storefront
  git push origin main
  gcloud builds list --limit=1
evidence:
  fields: [explanation]
  sample:
    explanation: El activador storefront-main compiló el commit con builder-sa y publicó storefront etiquetada con el SHA corto; gcloud builds list muestra SUCCESS.
rubric:
  - name: Canal de despliegue
    validator: functional
    points: 40
    checks:
      - {type: build, trigger: true, imageRegex: "releases/storefront", desc: "Una compilación activada terminó bien"}
  - name: Artefacto
    validator: state
    points: 25
    checks:
      - {type: build, trigger: true, imageRegex: "{{.region}}-docker.pkg.dev/{{.project}}/releases/storefront:", shaTag: true, desc: "Imagen etiquetada con el SHA del commit"}
  - name: IAM
    validator: security
    points: 20
    all: true
    checks:
      - {type: exists, path: "buildTriggers[\"storefront-main\"]", expect: {serviceAccount: "builder-sa@{{.project}}.iam.gserviceaccount.com"}, desc: "El activador se ejecuta como builder-sa"}
      - {type: no_basic_roles, members: ["serviceAccount:builder-sa@{{.project}}.iam.gserviceaccount.com"], desc: "Sin roles básicos para la compilación"}
  - name: Evidencias
    validator: evidence
    points: 15
    checks:
      - {type: evidence, fields: [explanation], keywords: [[build, compil, compilacion], [sha, commit]], desc: "Explica las evidencias"}
tutor:
  - {match: "@intro", title: "", why: "Integración continua: cada commit en main lanza una compilación que publica una imagen con el SHA del commit. Así sabes siempre qué código hay en cada imagen."}
  - {match: "artifactregistry.writer", title: "", why: "La cuenta de compilación necesita escribir en el repositorio, y nada más."}
  - {match: "triggers create", title: "", why: "El activador une repositorio, rama, archivo de compilación y cuenta de servicio."}
  - {match: "git push", title: "", why: "El push a main es lo que dispara el activador."}
en:
  title: 'Day 15 · Automatic builds: commit → Cloud Build → Artifact Registry'
  summary: Create a trigger that builds every commit on main with a dedicated service account and publishes an image tagged with the commit SHA.
  story: |
    Release engineering wants reproducible images:

    - Docker repository `releases` in {{.region}}
    - trigger `storefront-main` on repository `storefront`, branch `main`
    - the build runs as **builder-sa** (not the default Cloud Build account), which may only push images
    - images tagged with the commit (`$SHORT_SHA`)

    Push your first commit and check the build.
  objectives:
    - Pipeline from commit to artifact
    - Reproducible, commit-tagged artifact
    - Least-privilege build identity
    - Evidence of the successful build
  hints:
    - A `cloudbuild.yaml` with a docker build + push step and `images:` using `${SHORT_SHA}`.
    - '`roles/artifactregistry.writer` lets builder-sa push.'
  text:
    Canal de despliegue: Pipeline
    Una compilación activada terminó bien: A triggered build succeeded
    Artefacto: Artifact
    Imagen etiquetada con el SHA del commit: Image tagged with the commit SHA
    IAM: IAM
    El activador se ejecuta como builder-sa: Trigger runs as builder-sa
    Sin roles básicos para la compilación: No basic roles for the builder
    Evidencias: Evidence
    Explica las evidencias: Explain the evidence
    "Integración continua: cada commit en main lanza una compilación que publica una imagen con el SHA del commit. Así sabes siempre qué código hay en cada imagen.": "Continuous integration: every commit on main starts a build that publishes an image tagged with the commit SHA. You always know which code is in each image."
    "La cuenta de compilación necesita escribir en el repositorio, y nada más.": "The build account needs to write to the repository, nothing more."
    "El activador une repositorio, rama, archivo de compilación y cuenta de servicio.": "The trigger ties together repository, branch, build file and service account."
    "El push a main es lo que dispara el activador.": "Pushing to main is what fires the trigger."

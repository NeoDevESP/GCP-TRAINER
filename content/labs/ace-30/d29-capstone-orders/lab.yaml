id: ace-d29-capstone-orders
title: "Day 29 · Capstone: orders platform"
summary: Build an end-to-end orders platform — API, database, events, analytics sink, least privilege, observability and budget.
track: ace-30
day: 29
level: advanced
branch: architecture
type: capstone
skills: [compute.serverless, databases.cloudsql, data.pubsub, data.bigquery, iam.serviceaccounts, security.secrets, observability.monitoring, architecture.cost]
wellArchitected: [security, reliability, operations, cost]
certs: [ACE, PCA]
difficulty: 5
minutes: 180
baseline: [default-network]
setup: |
  gcloud sql instances create orders-db --database-version=POSTGRES_15 --tier=db-g1-small --region={{.region}} --availability-type=REGIONAL --backup-start-time=02:00
  gcloud sql databases create orders --instance=orders-db
  gcloud sql users create orders-app --instance=orders-db --password=Pr0d-Orders-{{.project}}
traffic:
  - {name: shoppers, target: "run:orders-api", path: /orders, rps: 25}
story: |
  Build the **orders platform** for launch day. Images (already in the public registry):
  `europe-docker.pkg.dev/gcplab-public/apps/orders-api:1.0` and `.../orders-worker:1.0`.

  | Component | Requirement |
  |---|---|
  | `orders-api` (Cloud Run, public) | reads/writes `orders-db` via the Cloud SQL connector (`DB_HOST=/cloudsql/...`, `DB_USER=orders-app`, `DB_NAME=orders`), password from Secret Manager secret `orders-db-password` (value `Pr0d-Orders-{{.project}}`), publishes to topic `orders` (`TOPIC=orders`) |
  | `orders-worker` (Cloud Run, **private**) | receives push from subscription `orders-to-bq` (authenticated as `orders-push`), writes to BigQuery `sales.orders` (`BQ_TABLE=sales.orders`) |
  | Identities | `orders-api-sa`, `orders-worker-sa`, `orders-push` — no basic roles |
  | Operations | alert on 5xx of `orders-api`, monthly estimate under 250 EUR |
objectives:
  - Working end-to-end flow (API → DB → Pub/Sub → worker → BigQuery)
  - Least privilege and no plaintext secrets
  - Observability and cost control
  - Architecture note
hints:
  - text: "orders-api-sa needs cloudsql.client, pubsub publisher on the topic and secretAccessor on the secret."
  - text: "orders-worker-sa needs bigquery.dataEditor on the dataset (or table) — create `sales` dataset and `orders` table first."
solution: |
  gcloud iam service-accounts create orders-api-sa
  gcloud iam service-accounts create orders-worker-sa
  gcloud iam service-accounts create orders-push
  echo -n "Pr0d-Orders-{{.project}}" | gcloud secrets create orders-db-password --data-file=-
  gcloud secrets add-iam-policy-binding orders-db-password --member=serviceAccount:orders-api-sa@{{.project}}.iam.gserviceaccount.com --role=roles/secretmanager.secretAccessor
  gcloud projects add-iam-policy-binding {{.project}} --member=serviceAccount:orders-api-sa@{{.project}}.iam.gserviceaccount.com --role=roles/cloudsql.client
  gcloud pubsub topics create orders
  gcloud pubsub topics add-iam-policy-binding orders --member=serviceAccount:orders-api-sa@{{.project}}.iam.gserviceaccount.com --role=roles/pubsub.publisher
  bq mk --dataset --location=EU sales
  bq mk --table sales.orders order_id:STRING,amount:NUMERIC,created:TIMESTAMP
  gcloud projects add-iam-policy-binding {{.project}} --member=serviceAccount:orders-worker-sa@{{.project}}.iam.gserviceaccount.com --role=roles/bigquery.dataEditor
  gcloud run deploy orders-api --image=europe-docker.pkg.dev/gcplab-public/apps/orders-api:1.0 --region={{.region}} --service-account=orders-api-sa@{{.project}}.iam.gserviceaccount.com --add-cloudsql-instances={{.project}}:{{.region}}:orders-db --set-env-vars=DB_HOST=/cloudsql/{{.project}}:{{.region}}:orders-db,DB_USER=orders-app,DB_NAME=orders,TOPIC=orders --set-secrets=DB_PASSWORD=orders-db-password:latest --max-instances=5 --allow-unauthenticated
  gcloud run deploy orders-worker --image=europe-docker.pkg.dev/gcplab-public/apps/orders-worker:1.0 --region={{.region}} --service-account=orders-worker-sa@{{.project}}.iam.gserviceaccount.com --set-env-vars=BQ_TABLE=sales.orders --max-instances=3 --no-allow-unauthenticated
  gcloud run services add-iam-policy-binding orders-worker --region={{.region}} --member=serviceAccount:orders-push@{{.project}}.iam.gserviceaccount.com --role=roles/run.invoker
  gcloud pubsub subscriptions create orders-to-bq --topic=orders --push-endpoint=$(gcloud run services describe orders-worker --region={{.region}} --format='value(status.url)')/push --push-auth-service-account=orders-push@{{.project}}.iam.gserviceaccount.com
  gcloud logging metrics create orders_5xx --description="orders-api 5xx" --log-filter='resource.type="cloud_run_revision" resource.labels.service_name="orders-api" httpRequest.status>=500'
  gcloud alpha monitoring policies create --display-name="orders 5xx" --condition-display-name=5xx --condition-filter='metric.type="logging.googleapis.com/user/orders_5xx"' --if='> 5' --duration=60s
  sleep 180
  curl -s -X POST $(gcloud run services describe orders-api --region={{.region}} --format='value(status.url)')/orders
evidence:
  fields: [architecture]
  sample:
    architecture: Cloud Run orders-api writes to a regional Cloud SQL instance through the connector using a Secret Manager password and publishes events to Pub/Sub; an authenticated push subscription invokes the private orders-worker which writes to BigQuery. Each component has its own service account with least privilege, and a log-based metric alerts on 5xx.
rubric:
  - name: End-to-end flow
    validator: functional
    points: 35
    all: true
    checks:
      - {type: http, target: "run:orders-api", path: /orders, status: 200, desc: "API serves orders"}
      - {type: pubsub, subscription: orders-to-bq, ackedMin: 10, backlogMax: 50, settle: 3, desc: "Events reach the worker"}
      - {type: exists, path: "datasets.sales.tables.orders", desc: "Analytics sink"}
  - name: Security
    validator: security
    points: 30
    critical: true
    all: true
    checks:
      - {type: policy, package: gcplab.security, ids: [SECRET_IN_ENV, BASIC_ROLE_SERVICE_ACCOUNT, PUBLIC_SQL], desc: "No plaintext secrets, basic roles or public DB"}
      - {type: http, target: "run:orders-worker", path: /push, status: 403, desc: "Worker is private"}
      - {type: iam, principal: "serviceAccount:orders-api-sa@{{.project}}.iam.gserviceaccount.com", permission: bigquery.tables.updateData, resource: project, expect: false, desc: "API cannot write analytics"}
  - name: Operations
    validator: state
    points: 15
    checks:
      - {type: alert_policy, filterContains: orders_5xx, desc: "5xx alert"}
      - {type: cost_max, eur: 250, desc: "Within budget"}
  - name: Architecture note
    validator: evidence
    points: 20
    checks:
      - {type: evidence, fields: [architecture], keywords: [[pub/sub, pubsub], [service account, cuenta de servicio], [secret], [bigquery]], desc: "Architecture explained"}

id: ace-d23-ml-endpoint
title: "Día 23 · Publicar un endpoint de inferencia controlado"
summary: Sirve un modelo entrenado en un endpoint de Vertex AI con una identidad dedicada, sin GPU, un llamante con mínimo privilegio y monitorización.
track: ace-30
day: 23
level: advanced
branch: data
type: challenge
skills: [data.ml, iam.leastprivilege, architecture.cost]
wellArchitected: [cost, security, operations]
certs: [PMLE, PCA]
difficulty: 3
minutes: 60
baseline: [default-network]
setup: |
  gcloud storage buckets create gs://models-{{.project}} --location={{.region}} --uniform-bucket-level-access
  echo "model" > model.bst
  gcloud storage cp model.bst gs://models-{{.project}}/churn/v1/model.bst
  gcloud iam service-accounts create predictor-sa
  gcloud iam service-accounts create churn-app
files:
  request.json: |
    {"instances": [{"tenure": 12, "plan": "pro", "tickets": 3}]}
story: |
  Ciencia de datos ha entrenado `churn` (artefactos en `gs://models-{{.project}}/churn/v1/`, imagen de servicio
  `europe-docker.pkg.dev/vertex-ai/prediction/xgboost-cpu.1-7:latest`). Publícalo:

  - endpoint `churn-endpoint` en {{.region}}, modelo desplegado en `n1-standard-2`, 1–2 réplicas, **sin GPU**
  - el modelo se ejecuta como `predictor-sa`
  - solo la identidad de la aplicación `churn-app` puede pedir predicciones (`roles/aiplatform.user` es aceptable en este laboratorio)
  - activa la monitorización del modelo y envía una petición de prueba (`request.json`)
objectives:
  - Modelo subido y endpoint sirviendo
  - Inferencia de prueba correcta
  - IAM controlado para los llamantes
  - Monitorización activada y coste acotado
hints:
  - text: "`gcloud ai models upload`, `gcloud ai endpoints create`, `gcloud ai endpoints deploy-model`."
solution: |
  gcloud ai models upload --region={{.region}} --display-name=churn --container-image-uri=europe-docker.pkg.dev/vertex-ai/prediction/xgboost-cpu.1-7:latest --artifact-uri=gs://models-{{.project}}/churn/v1/
  gcloud ai endpoints create --region={{.region}} --display-name=churn-endpoint
  gcloud ai endpoints deploy-model churn-endpoint --region={{.region}} --model=$(gcloud ai models list --region={{.region}} --format='value(id)') --display-name=churn-v1 --machine-type=n1-standard-2 --min-replica-count=1 --max-replica-count=2 --service-account=predictor-sa@{{.project}}.iam.gserviceaccount.com --traffic-split=0=100
  gcloud projects add-iam-policy-binding {{.project}} --member=serviceAccount:churn-app@{{.project}}.iam.gserviceaccount.com --role=roles/aiplatform.user
  gcloud ai endpoints update churn-endpoint --region={{.region}} --enable-monitoring
  gcloud ai endpoints predict churn-endpoint --region={{.region}} --json-request=request.json
rubric:
  - name: Endpoint
    validator: state
    points: 30
    checks:
      - {type: count, collection: aiEndpoints, where: {displayName: churn-endpoint, deployedModels: {minLen: 1}}, min: 1, desc: "Modelo desplegado en el endpoint"}
      - {type: count, collection: aiEndpoints, where: {deployedModels: {regex: "predictor-sa"}}, min: 1, desc: "Se ejecuta como predictor-sa"}
  - name: Inferencia
    validator: functional
    points: 30
    checks:
      - {type: count, collection: aiEndpoints, where: {predictionCount: {gte: 1}}, min: 1, desc: "Se ha servido una predicción de prueba"}
  - name: IAM
    validator: security
    points: 20
    all: true
    checks:
      - {type: iam, principal: "serviceAccount:churn-app@{{.project}}.iam.gserviceaccount.com", permission: aiplatform.endpoints.predict, resource: project, desc: "La aplicación puede pedir predicciones"}
      - {type: no_basic_roles, members: ["serviceAccount:churn-app@{{.project}}.iam.gserviceaccount.com", "serviceAccount:predictor-sa@{{.project}}.iam.gserviceaccount.com"], desc: "Sin roles básicos"}
  - name: Monitorización y coste
    validator: cost
    points: 20
    checks:
      - {type: count, collection: aiEndpoints, where: {modelMonitoring: true}, min: 1, desc: "Monitorización activada"}
      - {type: count, collection: aiEndpoints, where: {deployedModels: {regex: "\"acceleratorCount\":[1-9]"}}, max: 0, desc: "Sin GPU"}
tutor:
  - {match: "@intro", title: "", why: "Servir un modelo en Vertex AI: se sube al registro de modelos, se crea un endpoint y se despliega el modelo en él con máquinas y réplicas acotadas."}
  - {match: "deploy-model", title: "", why: "Réplicas mínimas y máximas limitan coste y capacidad; la cuenta de servicio es la identidad del modelo."}
  - {match: "aiplatform.user", title: "", why: "La app cliente necesita este rol para pedir predicciones."}
en:
  title: Day 23 · Publish a controlled inference endpoint
  summary: Serve a trained model on a Vertex AI endpoint with a dedicated identity, no GPUs, a caller with least privilege and monitoring.
  story: |
    Data science trained `churn` (artifacts in `gs://models-{{.project}}/churn/v1/`, serving image
    `europe-docker.pkg.dev/vertex-ai/prediction/xgboost-cpu.1-7:latest`). Publish it:

    - endpoint `churn-endpoint` in {{.region}}, model deployed on `n1-standard-2`, 1–2 replicas, **no GPU**
    - the model runs as `predictor-sa`
    - only the application identity `churn-app` may call predictions (`roles/aiplatform.user` is acceptable for this lab)
    - enable model monitoring and send a test request (`request.json`)
  objectives:
    - Model uploaded and endpoint serving
    - Successful test inference
    - Controlled IAM for callers
    - Monitoring enabled, cost bounded
  hints:
    - '`gcloud ai models upload`, `gcloud ai endpoints create`, `gcloud ai endpoints deploy-model`.'
  text:
    Endpoint: Endpoint
    Modelo desplegado en el endpoint: Model deployed to the endpoint
    Se ejecuta como predictor-sa: Runs as predictor-sa
    Inferencia: Inference
    Se ha servido una predicción de prueba: A test prediction was served
    IAM: IAM
    La aplicación puede pedir predicciones: The app can predict
    Sin roles básicos: No basic roles
    Monitorización y coste: Monitoring & cost
    Monitorización activada: Monitoring enabled
    Sin GPU: No GPUs
    "Servir un modelo en Vertex AI: se sube al registro de modelos, se crea un endpoint y se despliega el modelo en él con máquinas y réplicas acotadas.": "Serving a model on Vertex AI: upload it to the model registry, create an endpoint and deploy the model on it with bounded machines and replicas."
    "Réplicas mínimas y máximas limitan coste y capacidad; la cuenta de servicio es la identidad del modelo.": "Minimum and maximum replicas bound cost and capacity; the service account is the model's identity."
    "La app cliente necesita este rol para pedir predicciones.": "The client app needs this role to request predictions."

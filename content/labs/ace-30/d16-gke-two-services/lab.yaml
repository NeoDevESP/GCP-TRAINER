id: ace-d16-gke-two-services
title: "Día 16 · Desplegar una aplicación de dos servicios en GKE"
summary: Despliega los Deployments frontend y catalog con sondas y Services y demuestra la comunicación interna.
track: ace-30
day: 16
level: intermediate
branch: gke
type: guided
skills: [gke.workloads, gke.networking]
wellArchitected: [reliability]
certs: [ACE, PCDE]
difficulty: 3
minutes: 60
baseline: [default-network]
setup: |
  gcloud container clusters create shop-gke --zone={{.zone}} --num-nodes=3 --machine-type=e2-standard-2
story: |
  Despliega la tienda en el clúster **shop-gke** ({{.zone}}):

  | Deployment | Imagen | Réplicas | Puerto | Sondas |
  |---|---|---|---|---|
  | catalog | europe-docker.pkg.dev/gcplab-public/apps/catalog-api:1.0 | 2 | 8080 | `/healthz` |
  | frontend | europe-docker.pkg.dev/gcplab-public/apps/web-frontend:1.0 | 2 | 8080 | `/healthz` |

  - `catalog` accesible dentro del clúster como `http://catalog:8080`
  - `frontend` recibe `BACKEND_URL=http://catalog:8080/products` y se expone públicamente en el puerto 80
objectives:
  - Deployments y Services correctos
  - Sondas de readiness y liveness
  - Comunicación interna frontend → catalog
hints:
  - text: "Primero `gcloud container clusters get-credentials shop-gke --zone=...`."
  - text: "El `targetPort` del Service debe coincidir con el puerto del contenedor."
solution: |
  gcloud container clusters get-credentials shop-gke --zone={{.zone}}
  cat > app.yaml <<'YAML'
  apiVersion: apps/v1
  kind: Deployment
  metadata: {name: catalog}
  spec:
    replicas: 2
    selector: {matchLabels: {app: catalog}}
    template:
      metadata: {labels: {app: catalog}}
      spec:
        containers:
        - name: catalog
          image: europe-docker.pkg.dev/gcplab-public/apps/catalog-api:1.0
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}}
  ---
  apiVersion: v1
  kind: Service
  metadata: {name: catalog}
  spec:
    selector: {app: catalog}
    ports: [{port: 8080, targetPort: 8080}]
  ---
  apiVersion: apps/v1
  kind: Deployment
  metadata: {name: frontend}
  spec:
    replicas: 2
    selector: {matchLabels: {app: frontend}}
    template:
      metadata: {labels: {app: frontend}}
      spec:
        containers:
        - name: frontend
          image: europe-docker.pkg.dev/gcplab-public/apps/web-frontend:1.0
          env: [{name: BACKEND_URL, value: "http://catalog:8080/products"}]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}}
  ---
  apiVersion: v1
  kind: Service
  metadata: {name: frontend}
  spec:
    type: LoadBalancer
    selector: {app: frontend}
    ports: [{port: 80, targetPort: 8080}]
  YAML
  kubectl apply -f app.yaml
  kubectl get pods
  curl -s http://$(kubectl get svc frontend -o jsonpath='{.status.loadBalancer.ingress[0].ip}')/shop || true
evidence:
  fields: [explanation]
  sample:
    explanation: Los dos deployments tienen 2 pods listos; el frontend llama a http://catalog:8080 a través del servicio ClusterIP y /shop devuelve 200 a través del servicio LoadBalancer.
rubric:
  - name: Estado de Kubernetes
    validator: state
    points: 35
    checks:
      - {type: k8s_ready, cluster: shop-gke, deployment: catalog, min: 2, desc: "catalog tiene 2 pods listos"}
      - {type: k8s_ready, cluster: shop-gke, deployment: frontend, min: 2, desc: "frontend tiene 2 pods listos"}
  - name: Sondas
    validator: state
    points: 25
    checks:
      - {type: exists, path: "clusters[\"shop-gke\"].k8s.namespaces.default.deployments.catalog.template.containers[0].readinessProbe", expect: {port: 8080}, desc: "Sonda de readiness de catalog"}
      - {type: exists, path: "clusters[\"shop-gke\"].k8s.namespaces.default.deployments.frontend.template.containers[0].livenessProbe", expect: {port: 8080}, desc: "Sonda de liveness de frontend"}
  - name: Red
    validator: functional
    points: 25
    checks:
      - {type: http, target: "k8s:shop-gke/frontend", path: /shop, status: 200, desc: "frontend → catalog funciona de extremo a extremo"}
  - name: Evidencias
    validator: evidence
    points: 15
    checks:
      - {type: evidence, fields: [explanation], keywords: [[service, servicio], [ready, listo, pods, preparad]], desc: "Explica cómo lo has verificado"}
en:
  title: Day 16 · Deploy a two-service app on GKE
  summary: Deploy frontend and catalog Deployments with probes and Services and prove internal communication.
  story: |
    Deploy the shop on cluster **shop-gke** ({{.zone}}):

    | Deployment | Image | Replicas | Port | Probes |
    |---|---|---|---|---|
    | catalog | europe-docker.pkg.dev/gcplab-public/apps/catalog-api:1.0 | 2 | 8080 | `/healthz` |
    | frontend | europe-docker.pkg.dev/gcplab-public/apps/web-frontend:1.0 | 2 | 8080 | `/healthz` |

    - `catalog` reachable inside the cluster as `http://catalog:8080`
    - `frontend` gets `BACKEND_URL=http://catalog:8080/products` and is exposed publicly on port 80
  objectives:
    - Correct Deployments and Services
    - Readiness and liveness probes
    - Internal communication frontend → catalog
  hints:
    - '`gcloud container clusters get-credentials shop-gke --zone=...` first.'
    - Service `targetPort` must match the container port.
  text:
    Estado de Kubernetes: Kubernetes state
    catalog tiene 2 pods listos: catalog has 2 ready pods
    frontend tiene 2 pods listos: frontend has 2 ready pods
    Sondas: Probes
    Sonda de readiness de catalog: catalog readiness probe
    Sonda de liveness de frontend: frontend liveness probe
    Red: Networking
    frontend → catalog funciona de extremo a extremo: frontend → catalog works end to end
    Evidencias: Evidence
    Explica cómo lo has verificado: Explain how you verified

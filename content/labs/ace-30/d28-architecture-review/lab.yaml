id: ace-d28-architecture-review
title: "Día 28 · Revisión de arquitectura: fiable y asequible"
summary: Rediseña un stack sobredimensionado y frágil para cumplir los objetivos de fiabilidad y presupuesto, justificando cada compromiso.
track: ace-30
day: 28
level: advanced
branch: architecture
type: challenge
skills: [architecture.reliability, architecture.cost, compute.mig, databases.ha]
wellArchitected: [reliability, cost]
certs: [PCA, ACE]
difficulty: 4
minutes: 90
params:
  budget: ["900", "1000"]
baseline: [default-network]
setup: |
  gcloud compute instance-templates create web-tpl --machine-type=e2-small --image-family=debian-12 --image-project=debian-cloud --tags=web --metadata=startup-script='apt-get install -y nginx'
  gcloud compute instance-groups managed create web-mig --template=web-tpl --size=1 --zone={{.zone}}
  gcloud compute health-checks create http web-hc --port=80 --request-path=/
  gcloud compute instances create reports-vm --zone={{.zone}} --machine-type=e2-standard-32 --image-family=debian-12 --image-project=debian-cloud
  gcloud compute addresses create old-lb-ip --region={{.region}}
  gcloud sql instances create orders-db --database-version=POSTGRES_15 --tier=db-custom-2-7680 --region={{.region}} --availability-type=ZONAL --no-backup
story: |
  El comité de revisión ha señalado `{{.project}}`:

  - `web-mig` ejecuta una sola VM sin autorreparación: un fallo supone una caída
  - `orders-db` es zonal y **no tiene copias de seguridad** (objetivo de RPO 24 h, debe sobrevivir a la caída de una zona)
  - `reports-vm` es una `e2-standard-32` que ejecuta un informe nocturno al 3 % de CPU
  - hay una IP estática `old-lb-ip` reservada y sin usar desde hace meses

  Corrige el diseño para que la estimación mensual se quede **por debajo de {{.budget}} EUR** y responde a las preguntas de la revisión.
objectives:
  - Cumple los requisitos de fiabilidad (base de datos en HA con copias de seguridad, capa web resiliente)
  - Ajusta el tamaño y elimina el desperdicio
  - Justifica los compromisos
quiz:
  - id: q1
    question: ¿Qué configuración de Cloud SQL sobrevive a la caída de una zona con un RPO de 24 horas?
    options: ["Zonal con réplica de lectura en la misma zona", "Regional (HA) con copias de seguridad automáticas", "Zonal sin copias de seguridad más snapshots de la VM", "Exportar a Cloud Storage una vez al mes"]
    answer: [1]
    justify: true
    keywords: [[regional, ha, standby], [backup, copia, copia de seguridad, copias de seguridad, respaldo]]
  - id: q2
    question: ¿Cuál es la mejor acción para reports-vm?
    options: ["Mantenerla: puede que haga falta", "Ajustar su tamaño a un tipo de máquina pequeño (o programarla)", "Añadirle GPU", "Moverla a una región más grande"]
    answer: [1]
hints:
  - text: "`gcloud sql instances patch orders-db --availability-type=REGIONAL --backup-start-time=02:00`"
  - text: "Autorreparación: `gcloud compute instance-groups managed update web-mig --health-check=web-hc --initial-delay=120`"
solution: |
  gcloud billing estimate
  gcloud sql instances patch orders-db --availability-type=REGIONAL --backup-start-time=02:00
  gcloud compute instance-groups managed resize web-mig --size=2 --zone={{.zone}}
  gcloud compute instance-groups managed update web-mig --health-check=web-hc --initial-delay=120 --zone={{.zone}}
  gcloud compute instances stop reports-vm --zone={{.zone}}
  gcloud compute instances set-machine-type reports-vm --machine-type=e2-standard-2 --zone={{.zone}}
  gcloud compute instances start reports-vm --zone={{.zone}}
  gcloud compute addresses delete old-lb-ip --region={{.region}} --quiet
  gcloud billing estimate
rubric:
  - name: Fiabilidad
    validator: reliability
    points: 35
    all: true
    checks:
      - {type: policy, package: gcplab.reliability, params: {haDatabases: [orders-db], resilientGroups: [web-mig]}, desc: "Base de datos en HA con copias de seguridad y capa web resiliente"}
  - name: Coste
    validator: cost
    points: 30
    all: true
    checks:
      - {type: policy, package: gcplab.cost, params: {maxMonthlyEur: "{{.budget}}"}, desc: "Sin desperdicio y dentro del presupuesto"}
      - {type: exists, path: "instances[\"reports-vm\"]", desc: "VM de informes conservada (redimensionada, no borrada)"}
  - name: Compromisos
    validator: quiz
    points: 25
    checks:
      - {type: quiz, ratio: 1, desc: "Preguntas de la revisión respondidas y justificadas"}
  - name: Medición
    validator: diagnosis
    points: 10
    checks:
      - {type: command, regex: "billing estimate", min: 2, desc: "Coste medido antes y después"}
tutor:
  - {match: "@intro", title: "", why: "Una revisión de arquitectura equilibra fiabilidad y coste: quita puntos únicos de fallo y a la vez ajusta lo que está sobredimensionado o sin usar."}
  - {match: "availability-type=REGIONAL", title: "", why: "Regional = réplica en otra zona con conmutación automática; las copias diarias cubren el RPO de 24 h."}
  - {match: "resize web-mig", title: "", why: "Con 2 VMs y autorreparación, un fallo ya no es una caída."}
  - {match: "set-machine-type", title: "", why: "Ajustar el tamaño de la máquina al uso real ahorra sin perder servicio."}
en:
  title: 'Day 28 · Architecture review: reliable and affordable'
  summary: Redesign an over-provisioned, fragile stack to meet reliability and budget targets, justifying each trade-off.
  story: |
    The review board flagged `{{.project}}`:

    - `web-mig` runs a single VM without autohealing — one crash means downtime
    - `orders-db` is zonal and has **no backups** (RPO target 24 h, must survive a zone outage)
    - `reports-vm` is an `e2-standard-32` running a nightly report at 3% CPU
    - a static IP `old-lb-ip` has been reserved and unused for months

    Fix the design so the monthly estimate stays **under {{.budget}} EUR** and answer the review questions.
  objectives:
    - Meet reliability requirements (HA database with backups, resilient web tier)
    - Rightsize and remove waste
    - Justify trade-offs
  hints:
    - '`gcloud sql instances patch orders-db --availability-type=REGIONAL --backup-start-time=02:00`'
    - 'Autohealing: `gcloud compute instance-groups managed update web-mig --health-check=web-hc --initial-delay=120`'
  text:
    ¿Qué configuración de Cloud SQL sobrevive a la caída de una zona con un RPO de 24 horas?: Which Cloud SQL configuration survives a zone outage with an RPO of 24 hours?
    Zonal con réplica de lectura en la misma zona: Zonal with read replica in the same zone
    Regional (HA) con copias de seguridad automáticas: Regional (HA) with automated backups
    Zonal sin copias de seguridad más snapshots de la VM: Zonal without backups plus snapshots of the VM
    Exportar a Cloud Storage una vez al mes: Export to Cloud Storage once per month
    ¿Cuál es la mejor acción para reports-vm?: What is the best action for reports-vm?
    'Mantenerla: puede que haga falta': Keep it — it may be needed
    Ajustar su tamaño a un tipo de máquina pequeño (o programarla): Rightsize to a small machine type (or schedule it)
    Añadirle GPU: Add GPUs
    Moverla a una región más grande: Move it to a bigger region
    Fiabilidad: Reliability
    Base de datos en HA con copias de seguridad y capa web resiliente: HA database with backups, resilient web tier
    Coste: Cost
    Sin desperdicio y dentro del presupuesto: No waste and within budget
    VM de informes conservada (redimensionada, no borrada): Report VM kept (rightsized, not deleted)
    Compromisos: Trade-offs
    Preguntas de la revisión respondidas y justificadas: Review questions answered and justified
    Medición: Measurement
    Coste medido antes y después: Cost measured before and after
    "Una revisión de arquitectura equilibra fiabilidad y coste: quita puntos únicos de fallo y a la vez ajusta lo que está sobredimensionado o sin usar.": "An architecture review balances reliability and cost: remove single points of failure while resizing what is oversized or unused."
    "Regional = réplica en otra zona con conmutación automática; las copias diarias cubren el RPO de 24 h.": "Regional = a standby in another zone with automatic failover; daily backups cover the 24 h RPO."
    "Con 2 VMs y autorreparación, un fallo ya no es una caída.": "With 2 VMs and autohealing a failure is no longer an outage."
    "Ajustar el tamaño de la máquina al uso real ahorra sin perder servicio.": "Right-sizing the machine to real usage saves money without losing service."

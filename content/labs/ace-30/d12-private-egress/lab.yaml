id: ace-d12-private-egress
title: "Día 12 · INC: una VM privada no puede descargar dependencias"
summary: Una VM de compilación sin IP pública ha perdido la salida a internet. Restablece la salida sin darle una IP pública.
track: ace-30
day: 12
level: intermediate
branch: networking
type: incident
skills: [networking.nat, compute.troubleshooting, observability.incident]
wellArchitected: [security, reliability]
certs: [ACE, PCNE]
difficulty: 3
minutes: 45
params:
  vm: [builder-1, ci-runner, pkg-mirror]
baseline: [empty]
setup: |
  gcloud compute networks create ops-vpc --subnet-mode=custom
  gcloud compute networks subnets create private-ops --network=ops-vpc --range=10.40.0.0/24 --region={{.region}}
  gcloud compute firewall-rules create ops-iap --network=ops-vpc --allow=tcp:22 --source-ranges=35.235.240.0/20
  gcloud compute routers create ops-router --network=ops-vpc --region={{.region}}
  gcloud compute routers nats create ops-nat --router=ops-router --region={{.region}} --nat-all-subnet-ip-ranges --auto-allocate-nat-external-ips
  gcloud compute instances create {{.vm}} --zone={{.zone}} --subnet=private-ops --no-address --tags=build --metadata=startup-script='apt-get update && apt-get install -y nginx'
faults:
  - {type: nat_delete, router: ops-router, actor: "cost-cleanup@{{.project}}.iam.gserviceaccount.com"}
story: |
  **INC-2210** — *«{{.vm}} no puede hacer `apt-get install` de nada desde anoche. ¿Le damos una
  IP pública y ya?»* — La política de seguridad prohíbe IP públicas en las máquinas de compilación.
objectives:
  - Identifica por qué se ha cortado la salida (usa la consola serie y los registros de auditoría)
  - Restablece la salida sin IP pública
  - Mantén el SSH restringido a IAP
  - Demuestra que la VM llega a internet
hints:
  - text: "`gcloud compute instances get-serial-port-output {{.vm}}` muestra los errores de arranque."
  - text: "Revisa el registro de auditoría para ver cambios en los routers: `gcloud logging read 'protoPayload.methodName:routers'`."
solution: |
  gcloud compute instances get-serial-port-output {{.vm}} --zone={{.zone}}
  gcloud logging read 'logName:cloudaudit protoPayload.methodName:routers' --limit=3 --format='value(protoPayload.authenticationInfo.principalEmail,protoPayload.methodName)'
  gcloud compute routers nats create ops-nat --router=ops-router --region={{.region}} --nat-all-subnet-ip-ranges --auto-allocate-nat-external-ips
  gcloud compute ssh {{.vm}} --zone={{.zone}} --tunnel-through-iap --command='sudo apt-get update && curl -s -o /dev/null -w %{http_code} https://deb.debian.org'
evidence:
  fields: [rootCause]
  sample:
    rootCause: La configuración de Cloud NAT ops-nat se eliminó de ops-router en la limpieza de costes (cost-cleanup), así que la VM privada sin IP externa perdió su ruta de salida a internet.
rubric:
  - name: Causa
    validator: evidence
    points: 30
    checks:
      - {type: evidence, fields: [rootCause], keywords: [[nat], [egress, salida, internet, router]], desc: "Explica qué camino de salida falta"}
  - name: NAT restablecido
    validator: functional
    points: 30
    all: true
    checks:
      - {type: egress, from: "vm:{{.vm}}", desc: "La VM llega a internet"}
      - {type: exists, path: "routers[\"ops-router\"].nats[0]", desc: "Cloud NAT configurado"}
  - name: Seguridad
    validator: security
    points: 20
    critical: true
    all: true
    checks:
      - {type: exists, path: "instances[\"{{.vm}}\"]", expect: {natIP: {empty: true}}, desc: "Sin IP pública en la VM de compilación"}
      - {type: forbid_firewall, port: 22, desc: "SSH solo a través de IAP"}
  - name: Prueba
    validator: functional
    points: 20
    checks:
      - {type: command, regex: "ssh .*(apt|curl)", desc: "Demuestra la salida desde la VM"}
en:
  title: 'Day 12 · INC: a private VM cannot download dependencies'
  summary: A build VM without public IP lost internet egress. Restore egress without giving it a public IP.
  story: |
    **INC-2210** — *"{{.vm}} cannot `apt-get install` anything since last night. Just give it a
    public IP?"* — Security policy forbids public IPs on build machines.
  objectives:
    - Identify why egress stopped (use the serial console and audit logs)
    - Restore egress without a public IP
    - Keep SSH restricted to IAP
    - Prove the VM can reach the internet
  hints:
    - '`gcloud compute instances get-serial-port-output {{.vm}}` shows the startup errors.'
    - 'Check the audit log for changes on routers: `gcloud logging read ''protoPayload.methodName:routers''`.'
  text:
    Causa: Cause
    Explica qué camino de salida falta: Explain the missing egress path
    NAT restablecido: NAT restored
    La VM llega a internet: The VM reaches the internet
    Cloud NAT configurado: Cloud NAT configured
    Seguridad: Security
    Sin IP pública en la VM de compilación: No public IP on the build VM
    SSH solo a través de IAP: SSH only via IAP
    Prueba: Test
    Demuestra la salida desde la VM: Prove egress from the VM

id: ace-d14-terraform
title: "Día 14 · Reproducir el entorno con Terraform"
summary: Codifica una red, un cortafuegos y una VM en Terraform idempotente con variables y outputs.
track: ace-30
day: 14
level: intermediate
branch: devops
type: challenge
skills: [devops.iac, networking.vpc, compute.vm]
wellArchitected: [operations]
certs: [ACE, PCDE]
difficulty: 3
minutes: 90
baseline: [empty]
story: |
  El entorno de staging se construyó a mano y nadie puede reproducirlo. Escribe Terraform
  (en la pestaña Archivos o con `cat > main.tf`) que cree:

  - la red `stg-vpc` (personalizada) y la subred `stg-app` 10.50.0.0/24 en la región indicada por una **variable `region`**
  - el cortafuegos `stg-allow-http` tcp:80 desde cualquier origen hacia la etiqueta `app`
  - la VM `stg-app-1` (e2-small, etiqueta `app`, nginx mediante script de arranque, IP pública)
  - un **output** con el nombre de la VM

  `terraform plan` después de `apply` no debe mostrar **ningún cambio**. El SSH no puede estar abierto a internet.
objectives:
  - Código declarativo e idempotente
  - Variables y outputs
  - Estructura y seguridad correctas
hints:
  - text: "Referencia atributos (`google_compute_network.vpc.id`) en lugar de escribir los nombres a mano."
  - text: "`access_config {}` dentro de `network_interface` da una IP pública efímera."
solution: |
  cat > main.tf <<'HCL'
  variable "region" {
    type    = string
    default = "{{.region}}"
  }
  provider "google" {
    project = "{{.project}}"
    region  = var.region
    zone    = "${var.region}-b"
  }
  resource "google_compute_network" "vpc" {
    name                    = "stg-vpc"
    auto_create_subnetworks = false
  }
  resource "google_compute_subnetwork" "app" {
    name          = "stg-app"
    ip_cidr_range = "10.50.0.0/24"
    region        = var.region
    network       = google_compute_network.vpc.id
  }
  resource "google_compute_firewall" "http" {
    name          = "stg-allow-http"
    network       = google_compute_network.vpc.name
    source_ranges = ["0.0.0.0/0"]
    target_tags   = ["app"]
    allow {
      protocol = "tcp"
      ports    = ["80"]
    }
  }
  resource "google_compute_instance" "app" {
    name         = "stg-app-1"
    machine_type = "e2-small"
    tags         = ["app"]
    boot_disk {
      initialize_params {
        image = "debian-cloud/debian-12"
      }
    }
    network_interface {
      subnetwork = google_compute_subnetwork.app.self_link
      access_config {}
    }
    metadata_startup_script = "apt-get install -y nginx"
  }
  output "vm_name" {
    value = google_compute_instance.app.name
  }
  HCL
  terraform init
  terraform plan
  terraform apply -auto-approve
  terraform plan
rubric:
  - name: IaC aplicada
    validator: state
    points: 40
    checks:
      - {type: exists, path: "networks[\"stg-vpc\"]", expect: {subnetMode: custom}, desc: "Red"}
      - {type: exists, path: "subnets[\"stg-app\"]", expect: {ipCidrRange: 10.50.0.0/24}, desc: "Subred"}
      - {type: exists, path: "instances[\"stg-app-1\"]", expect: {machineType: e2-small, tags: {contains: app}}, desc: "VM"}
      - {type: http, target: "vm:stg-app-1:80", status: 200, desc: "La VM sirve HTTP"}
  - name: Idempotencia
    validator: functional
    points: 25
    checks:
      - {type: terraform_clean, minResources: 4, desc: "El segundo plan no muestra cambios"}
  - name: Estructura
    validator: state
    points: 20
    checks:
      - {type: terraform_clean, minResources: 4, requireVariables: [region], requireOutputs: true, desc: "Variables y outputs declarados"}
  - name: Seguridad
    validator: security
    points: 15
    checks:
      - {type: forbid_firewall, port: 22, desc: "SSH no abierto a internet"}
tutor:
  - {match: "@intro", title: "", why: "Infraestructura como código: describes en Terraform lo que quieres y la herramienta lo crea igual cada vez. Así el entorno se puede reproducir."}
  - {match: "terraform init", title: "", why: "Descarga el proveedor de Google y prepara el estado."}
  - {match: "terraform plan", title: "", why: "Lee el plan siempre antes de aplicar: dice qué se crea, cambia o destruye."}
en:
  title: Day 14 · Reproduce the environment with Terraform
  summary: Codify a network, firewall and VM in idempotent Terraform with variables and outputs.
  story: |
    The staging environment was built by hand and nobody can reproduce it. Write Terraform
    (in the Files tab or with `cat > main.tf`) that creates:

    - network `stg-vpc` (custom) and subnet `stg-app` 10.50.0.0/24 in the region given by a **variable `region`**
    - firewall `stg-allow-http` tcp:80 from anywhere to tag `app`
    - VM `stg-app-1` (e2-small, tag `app`, nginx via startup script, public IP)
    - an **output** with the VM name

    `terraform plan` after `apply` must show **no changes**. SSH must not be open to the internet.
  objectives:
    - Declarative, idempotent code
    - Variables and outputs
    - Correct structure and security
  hints:
    - Reference attributes (`google_compute_network.vpc.id`) instead of hard-coding names.
    - '`access_config {}` inside `network_interface` gives an ephemeral public IP.'
  text:
    IaC aplicada: IaC applied
    Red: Network
    Subred: Subnet
    VM: VM
    La VM sirve HTTP: The VM serves HTTP
    Idempotencia: Idempotence
    El segundo plan no muestra cambios: Second plan shows no changes
    Estructura: Structure
    Variables y outputs declarados: Variables and outputs declared
    Seguridad: Security
    SSH no abierto a internet: SSH not open to the internet
    "Infraestructura como código: describes en Terraform lo que quieres y la herramienta lo crea igual cada vez. Así el entorno se puede reproducir.": "Infrastructure as code: you describe what you want in Terraform and the tool builds it the same way every time. The environment becomes reproducible."
    "Descarga el proveedor de Google y prepara el estado.": "Downloads the Google provider and prepares the state."
    "Lee el plan siempre antes de aplicar: dice qué se crea, cambia o destruye.": "Always read the plan before applying: it says what gets created, changed or destroyed."

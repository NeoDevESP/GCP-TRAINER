id: net-n02-shared-services-peering
title: "Reach the shared license server over VPC peering"
summary: Peer two VPCs, resolve an overlapping range without renumbering the other team, and open exactly one port to exactly one subnet.
track: network
day: 1
level: intermediate
branch: networking
type: challenge
skills: [networking.vpc, networking.routing, networking.firewall, netfund.cidr]
wellArchitected: [security, reliability]
certs: [PCNE, ACE]
difficulty: 3
minutes: 45
baseline: [empty]
setup: |
  gcloud compute networks create app-vpc --subnet-mode=custom
  gcloud compute networks subnets create app-subnet --network=app-vpc --range=10.10.0.0/24 --region={{.region}}
  gcloud compute networks subnets create legacy-subnet --network=app-vpc --range=10.20.4.0/24 --region={{.region}} --description="old batch network, decommissioned in Q2"
  gcloud compute networks create shared-vpc --subnet-mode=custom
  gcloud compute networks subnets create shared-subnet --network=shared-vpc --range=10.20.0.0/16 --region={{.region}}
  gcloud compute instances create app-1 --zone={{.zone}} --subnet=app-subnet --no-address --tags=app --image-family=debian-12 --image-project=debian-cloud
  gcloud compute instances create license-1 --zone={{.zone}} --subnet=shared-subnet --no-address --tags=license-server --metadata=startup-script='python3 -m http.server 27000' --image-family=debian-12 --image-project=debian-cloud
  gcloud compute firewall-rules create app-iap --network=app-vpc --allow=tcp:22 --source-ranges=35.235.240.0/20
ticket:
  id: REQ-880
  kind: REQ
  priority: P3
  sla: 2d
  summary: "app-1 must reach the shared license server license-1 on tcp:27000. The platform team says 'just peer the VPCs'."
  reporter: Dana (app team)
actors:
  - role: developer
    name: Dana (app team)
    fallback: "Our app only needs the license port 27000, nothing else."
  - role: sre
    name: Ravi (shared services)
    persona: owns shared-vpc and license-1
    fallback: "shared-vpc uses 10.20.0.0/16 and we can't renumber it — twenty teams depend on it."
    facts:
      - {keywords: [[firewall, allow, port, puerto, rule]], answer: "shared-vpc denies ingress by default. Add a rule for 27000 from your app subnet only — we audit anything wider."}
      - {keywords: [[tag, etiqueta, source-tags]], answer: "Careful: network tags from a peered VPC don't match our firewall rules. Use the source range of your subnet."}
  - role: manager
    name: Irene (engineering manager)
    fallback: "Close the request with what you changed."
    facts:
      - {keywords: [[legacy, subnet, batch, delete, borrar]], answer: "legacy-subnet belonged to the old batch system, decommissioned in Q2. If nothing uses it, it can go."}
story: |
  `app-1` (in **app-vpc**) must use the license server `license-1` (in **shared-vpc**, owned by another team)
  on **tcp:27000**. Peer the networks, but:

  - `shared-vpc` (10.20.0.0/16) cannot be renumbered
  - only `app-subnet` may reach the license port — nothing else, nothing wider
  - neither VM gets a public address

  Try the obvious command first and read the error carefully.
constraints: [protect:license-1, protect:shared-subnet, no-public]
objectives:
  - Understand why the peering is rejected
  - Remove the conflict on your side, after checking it is unused
  - Establish the peering in both directions
  - Allow tcp:27000 from 10.10.0.0/24 only, and verify the path
hints:
  - text: "Peered VPCs cannot have overlapping subnet ranges. Which of your subnets overlaps 10.20.0.0/16?"
  - text: "A peering is ACTIVE only when both networks create it (`--network=app-vpc --peer-network=shared-vpc` and the reverse)."
  - text: "Firewall rules in shared-vpc cannot use app-vpc's tags as sources; use `--source-ranges=10.10.0.0/24` and `--target-tags=license-server`."
evidence:
  fields: [explanation]
  sample:
    explanation: "The peering failed because legacy-subnet 10.20.4.0/24 overlapped shared-vpc 10.20.0.0/16; it was unused, so I deleted it, peered both directions and allowed tcp:27000 only from 10.10.0.0/24 to the license-server tag. I verified with nc from app-1."
solution: |
  !gcloud compute networks peerings create app-to-shared --network=app-vpc --peer-network=shared-vpc
  gcloud compute networks subnets list --format='table(name,network,ipCidrRange)'
  gcloud compute instances list --format='table(name,networkInterfaces[0].subnetwork)'
  gcloud compute networks subnets delete legacy-subnet --region={{.region}} --quiet
  gcloud compute networks peerings create app-to-shared --network=app-vpc --peer-network=shared-vpc
  gcloud compute networks peerings create shared-to-app --network=shared-vpc --peer-network=app-vpc
  gcloud compute firewall-rules create shared-allow-license-from-app --network=shared-vpc --allow=tcp:27000 --source-ranges=10.10.0.0/24 --target-tags=license-server
  gcloud compute ssh app-1 --zone={{.zone}} --tunnel-through-iap --command='nc -zv license-1 27000'
  ticket resolve "Deleted the unused legacy-subnet that overlapped shared-vpc, peered app-vpc and shared-vpc both ways, and allowed tcp:27000 only from 10.10.0.0/24 to license-server."
shortcuts:
  - name: open the license port to all private ranges
    run: |
      gcloud compute networks subnets delete legacy-subnet --region={{.region}} --quiet
      gcloud compute networks peerings create app-to-shared --network=app-vpc --peer-network=shared-vpc
      gcloud compute networks peerings create shared-to-app --network=shared-vpc --peer-network=app-vpc
      gcloud compute firewall-rules create shared-allow-license --network=shared-vpc --allow=tcp:27000 --source-ranges=10.0.0.0/8
      ticket resolve "Peered the VPCs and opened 27000 on shared-vpc for our private ranges."
  - name: peer only one side
    run: |
      gcloud compute networks subnets delete legacy-subnet --region={{.region}} --quiet
      gcloud compute networks peerings create app-to-shared --network=app-vpc --peer-network=shared-vpc
      gcloud compute firewall-rules create shared-allow-license-from-app --network=shared-vpc --allow=tcp:27000 --source-ranges=10.10.0.0/24 --target-tags=license-server
      ticket resolve "Created the peering from app-vpc and allowed 27000 from the app subnet."
rubric:
  - name: Path works
    validator: functional
    points: 35
    checks:
      - {type: tcp, from: "vm:app-1", to: "vm:license-1", port: 27000, desc: "app-1 reaches license-1 on tcp:27000"}
  - name: Peering
    validator: state
    points: 20
    all: true
    checks:
      - {type: exists, path: "networks[\"app-vpc\"]", expect: {peerings: {regex: "shared-vpc"}}, desc: "app-vpc peers with shared-vpc"}
      - {type: exists, path: "networks[\"shared-vpc\"]", expect: {peerings: {regex: "app-vpc"}}, desc: "shared-vpc peers back with app-vpc"}
      - {type: exists, path: "subnets[\"shared-subnet\"]", expect: {ipCidrRange: 10.20.0.0/16}, desc: "shared-vpc was not renumbered"}
  - name: Least exposure
    validator: security
    points: 30
    critical: true
    all: true
    checks:
      - {type: forbid_firewall, port: 27000, desc: "License port not open to the internet"}
      - {type: count, collection: firewalls, where: {network: {eq: shared-vpc}, sourceRanges: {regex: "10\\.0\\.0\\.0/8|10\\.0\\.0\\.0/9|10\\.20\\.0\\.0/16|10\\.10\\.0\\.0/16"}}, max: 0, desc: "No rule wider than app-subnet in shared-vpc"}
      - {type: exists, path: "instances[\"license-1\"]", expect: {natIP: {empty: true}}, desc: "license-1 has no public address"}
  - name: Communication
    validator: evidence
    points: 15
    checks:
      - {type: ticket_resolved, desc: "Request closed with what changed"}
      - {type: evidence, fields: [explanation], keywords: [[overlap, solap, 10.20], [peer, peering], [27000, firewall]], desc: "Explains the overlap, the peering and the rule"}

id: fundamentals-f01-compute-models
title: "IT fundamentals: VM, container or serverless?"
summary: Run the same web app as a VM and as a serverless container, compare what you manage and what you pay, and choose deliberately.
track: foundations
day: 1
level: basic
branch: fundamentals
type: guided
mode: learn
skills: [fundamentals.virtualization, fundamentals.os, compute.vm, compute.serverless]
wellArchitected: [cost, operations]
certs: [ACE]
difficulty: 1
minutes: 30
baseline: [default-network]
story: |
  **Learn mode.** The same `hello` web app can run on a **virtual machine** (you manage the OS) or as a
  **serverless container** on Cloud Run (Google manages servers, scaling to zero).

  1. Create VM `hello-vm` (e2-small, tag `web`) whose startup script installs `nginx`, and open tcp:80 to it.
  2. Deploy Cloud Run service `hello-run` from `europe-docker.pkg.dev/gcplab-public/apps/hello:1.0` (public).
  3. Compare `gcloud billing estimate` and answer the questions.
objectives:
  - Run a workload on a VM and on serverless
  - Understand the responsibility split
  - Compare cost behaviour at idle
quiz:
  - {id: q1, question: "Who patches the operating system of hello-vm?", options: ["Google", "You", "Nobody — it is immutable", "The load balancer"], answer: [1]}
  - {id: q2, question: "What does hello-run cost when it receives no traffic (min instances 0)?", options: ["The same as the VM", "Close to nothing: it scales to zero", "It cannot scale to zero", "Double"], answer: [1]}
  - {id: q3, question: "When is a VM the better choice?", options: ["Always", "When you need OS-level control, special software or long-running stateful processes", "For bursty HTTP APIs", "Never"], answer: [1]}
solution: |
  gcloud compute firewall-rules create allow-web --network=default --allow=tcp:80 --source-ranges=0.0.0.0/0 --target-tags=web
  gcloud compute instances create hello-vm --zone={{.zone}} --machine-type=e2-small --tags=web --metadata=startup-script='apt-get install -y nginx'
  gcloud run deploy hello-run --image=europe-docker.pkg.dev/gcplab-public/apps/hello:1.0 --region={{.region}} --allow-unauthenticated
  gcloud billing estimate
rubric:
  - name: VM workload
    validator: functional
    points: 25
    checks:
      - {type: http, target: "vm:hello-vm:80", path: /, status: 200, desc: "VM serves the page"}
  - name: Serverless workload
    validator: functional
    points: 25
    checks:
      - {type: http, target: "run:hello-run", path: /, status: 200, desc: "Cloud Run serves the page"}
  - name: Compared
    validator: diagnosis
    points: 10
    checks:
      - {type: command, regex: "billing estimate", desc: "Compared costs"}
  - name: Concepts
    validator: quiz
    points: 40
    checks:
      - {type: quiz, ratio: 1, desc: "Responsibility and cost questions"}

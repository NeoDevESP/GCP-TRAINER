id: sre-c01-zone-chaos
title: "Ingeniería del caos: demostrar que la tienda sobrevive a la caída de una zona"
summary: Plantea una hipótesis, rompe cosas a propósito, vigila el SLO y rediseña la capa web hasta que el experimento se cumpla.
track: sre
day: 1
level: advanced
branch: observability
type: challenge
mode: production
skills: [observability.chaos, compute.mig, architecture.reliability, observability.slo]
wellArchitected: [reliability]
certs: [PCDE, PCA]
difficulty: 3
minutes: 60
baseline: [default-network]
setup: |
  gcloud compute firewall-rules create allow-health-web --network=default --allow=tcp:80 --source-ranges=35.191.0.0/16,130.211.0.0/22 --target-tags=web
  gcloud compute instance-templates create web-tpl --machine-type=e2-small --tags=web --metadata=startup-script='apt-get install -y nginx'
  gcloud compute instances create web-1 --zone={{.zone}} --machine-type=e2-small --tags=web --metadata=startup-script='apt-get install -y nginx'
  gcloud compute instance-groups unmanaged create web-ig --zone={{.zone}}
  gcloud compute instance-groups unmanaged add-instances web-ig --instances=web-1 --zone={{.zone}}
  gcloud compute instance-groups set-named-ports web-ig --named-ports=http:80 --zone={{.zone}}
  gcloud compute health-checks create http web-hc --port=80 --request-path=/
  gcloud compute backend-services create web-be --protocol=HTTP --port-name=http --health-checks=web-hc --global
  gcloud compute backend-services add-backend web-be --instance-group=web-ig --instance-group-zone={{.zone}} --global
  gcloud compute url-maps create web-map --default-service=web-be
  gcloud compute target-http-proxies create web-proxy --url-map=web-map
  gcloud compute forwarding-rules create web-lb --global --target-http-proxy=web-proxy --ports=80
traffic:
  - {name: shoppers, target: "lb:web-lb", path: /, rps: 30}
ticket:
  id: PRB-71
  kind: PRB
  priority: P3
  summary: "Nuestro SLO es un 99 % de disponibilidad. La revisión de arquitectura dice que la capa web «debería» sobrevivir a la caída de una zona. Demuéstralo con un experimento, no con una diapositiva."
  reporter: Sam (SRE)
story: |
  La tienda `web-lb` la sirve una única VM `web-1` en `{{.zone}}`. Usa la herramienta **chaos**:

  ```
  chaos run zone-outage --zone={{.zone}} --target=lb:web-lb --slo=99 --duration=5
  chaos run kill-instance --instance=NOMBRE --target=lb:web-lb --slo=99 --duration=5
  chaos history
  ```

  1. Ejecuta el experimento de zona contra el diseño actual y observa cómo falla la hipótesis.
  2. Reconstruye la capa web a partir de la plantilla `web-tpl` como un grupo de instancias gestionado **regional** (3 zonas,
     autorreparación con `web-hc`) tras el mismo balanceador y retira el grupo zonal.
  3. Vuelve a ejecutar los dos experimentos hasta que la hipótesis se cumpla y escribe el informe del experimento.
objectives:
  - Define el estado estable y la hipótesis
  - Observa el fallo con el diseño actual
  - Rediseña para soportar la caída de una zona y la pérdida de instancias
  - Demuéstralo con experimentos e informa
hints:
  - text: "`gcloud compute instance-groups managed create NOMBRE --region=REGIÓN --template=... --size=3 --health-check=web-hc`"
  - text: "Añade el nuevo grupo a `web-be` (`--instance-group-region`) y quita `web-ig` antes de volver a experimentar."
evidence:
  fields: [report]
  sample:
    report: "Hipótesis: la tienda se mantiene por encima del 99 % de disponibilidad cuando cae una zona. El primer experimento falló (0 % durante la caída) porque la única VM era zonal. Tras pasar a un grupo de instancias gestionado regional en tres zonas con autorreparación, el experimento zone-outage se mantuvo al 100 % y el experimento kill-instance se cumplió porque el balanceador esquivó la VM perdida y el MIG la recreó."
solution: |
  chaos run zone-outage --zone={{.zone}} --target=lb:web-lb --slo=99 --duration=5
  gcloud compute instance-groups managed create web-mig --template=web-tpl --size=3 --region={{.region}} --health-check=web-hc --initial-delay=60
  gcloud compute instance-groups managed set-named-ports web-mig --named-ports=http:80 --region={{.region}}
  gcloud compute backend-services add-backend web-be --instance-group=web-mig --instance-group-region={{.region}} --global
  gcloud compute backend-services remove-backend web-be --instance-group=web-ig --instance-group-zone={{.zone}} --global
  gcloud compute backend-services get-health web-be --global
  chaos run zone-outage --zone={{.zone}} --target=lb:web-lb --slo=99 --duration=10
  chaos run kill-instance --instance=$(gcloud compute instances list --filter="name~web-mig" --format="value(name)" --limit=1) --target=lb:web-lb --slo=99 --duration=5
  chaos history
rubric:
  - name: Fallo observado primero
    validator: diagnosis
    points: 15
    checks:
      - {type: chaos, experiment: zone-outage, held: false, desc: "Experimento ejecutado contra el diseño original"}
  - name: Diseño resiliente
    validator: reliability
    points: 25
    all: true
    checks:
      - {type: exists, path: "instanceGroups[\"web-mig\"]", expect: {distributionZones: {minLen: 3}, autoHealing: {regex: "web-hc"}}, desc: "MIG regional en 3 zonas con autorreparación"}
      - {type: http, target: "lb:web-lb", path: /, status: 200, desc: "La tienda sirve"}
  - name: Caída de zona superada
    validator: functional
    points: 25
    checks:
      - {type: chaos, experiment: zone-outage, minSlo: 99, minMinutes: 5, desc: "El experimento zone-outage se mantuvo en ≥99 %"}
  - name: Pérdida de instancia superada
    validator: functional
    points: 15
    checks:
      - {type: chaos, experiment: kill-instance, minSlo: 99, desc: "El experimento kill-instance se cumplió"}
  - name: Informe del experimento
    validator: evidence
    points: 20
    checks:
      - {type: evidence, fields: [report], keywords: [[hypothesis, hipotesis], [zone, zona], [regional, managed instance group, mig, grupo de instancias gestionado], [99, slo]], desc: "Hipótesis, observaciones y conclusión"}
en:
  title: 'Chaos Engineering: prove the storefront survives a zone failure'
  summary: State a hypothesis, break things on purpose, watch the SLO — then redesign the web tier until the experiment holds.
  story: |
    The storefront `web-lb` is served by a single VM `web-1` in `{{.zone}}`. Use the **chaos** tool:

    ```
    chaos run zone-outage --zone={{.zone}} --target=lb:web-lb --slo=99 --duration=5
    chaos run kill-instance --instance=NAME --target=lb:web-lb --slo=99 --duration=5
    chaos history
    ```

    1. Run the zone experiment against the current design and watch the hypothesis fail.
    2. Rebuild the web tier from the `web-tpl` template as a **regional** managed instance group (3 zones,
       autohealing with `web-hc`) behind the same load balancer, and retire the zonal group.
    3. Re-run both experiments until the hypothesis holds, and write the experiment report.
  objectives:
    - Define steady state and hypothesis
    - Observe the failure on the current design
    - Redesign for zonal failure and instance loss
    - Prove it with experiments and report
  hints:
    - '`gcloud compute instance-groups managed create NAME --region=REGION --template=... --size=3 --health-check=web-hc`'
    - Add the new group to `web-be` (`--instance-group-region`) and remove `web-ig` before experimenting again.
  ticket:
    summary: Our SLO is 99% availability. Architecture review says the web tier 'should' survive a zone outage. Prove it — with an experiment, not a slide.
  text:
    Fallo observado primero: Failure observed first
    Experimento ejecutado contra el diseño original: Ran the experiment against the original design
    Diseño resiliente: Resilient design
    MIG regional en 3 zonas con autorreparación: Regional MIG over 3 zones with autohealing
    La tienda sirve: Storefront serving
    Caída de zona superada: Zone failure survived
    El experimento zone-outage se mantuvo en ≥99 %: Zone-outage experiment held at ≥99%
    Pérdida de instancia superada: Instance loss survived
    El experimento kill-instance se cumplió: Kill-instance experiment held
    Informe del experimento: Experiment report
    Hipótesis, observaciones y conclusión: Hypothesis, observations and conclusion
    Sam (SRE): Sam (SRE)

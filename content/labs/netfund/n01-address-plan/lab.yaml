id: netfund-n01-address-plan
title: "Fundamentos de redes: un plan de direccionamiento que no choque"
summary: Dimensiona las subredes a partir del número de hosts, mantenlas dentro de la asignación, evita el rango on-premise y deja margen para crecer.
track: foundations
day: 2
level: basic
branch: netfund
type: challenge
mode: learn
skills: [netfund.cidr, netfund.tcpip, networking.vpc]
wellArchitected: [reliability, operations]
certs: [ACE, PCNE]
difficulty: 2
minutes: 30
params:
  # variants are coherent tuples chosen by index
  block: ["10.40.0.0/16"]
  onprem: ["10.40.0.0/21", "10.40.64.0/19"]
  web: ["10.40.8.0/24"]
  app: ["10.40.12.0/22"]
  db: ["10.40.9.0/26"]
baseline: [empty]
story: |
  El equipo de red de Nebula ha asignado **{{.block}}** a la nueva `corp-vpc` (modo personalizado, región {{.region}}).
  El centro de datos de Madrid ya usa **{{.onprem}}**: se conectará por VPN, así que nunca debe solaparse.

  | Subred | Hosts necesarios |
  |---|---|
  | `web` | 200 |
  | `app` | 900 |
  | `db`  | 50 |

  Recuerda que Google Cloud reserva **4 direcciones** en cada subred. Elige el prefijo más pequeño que encaje
  en cada subred (no más de 4 veces lo necesario), créalas y responde a las preguntas.
objectives:
  - Convierte el número de hosts en prefijos
  - Mantén todas las subredes dentro de la asignación y lejos de on-premise
  - Evita solapamientos y desperdicio
quiz:
  - {id: q1, question: "¿Cuántas direcciones utilizables te da una subred /26 en Google Cloud?", options: ["64", "62", "60", "58"], answer: [2]}
  - {id: q2, question: "¿Cuál es el prefijo más pequeño en el que caben 900 hosts?", options: ["/23", "/22", "/21", "/24"], answer: [1]}
  - {id: q3, question: "¿Por qué los rangos de la VPC no deben solaparse con on-premise cuando se usa VPN?", options: ["Las rutas serían ambiguas: el mismo destino existiría a ambos lados", "La VPN solo admite rangos /8", "Las reglas de cortafuegos lo prohíben", "Cuesta más"], answer: [0]}
solution: |
  gcloud compute networks create corp-vpc --subnet-mode=custom
  gcloud compute networks subnets create web --network=corp-vpc --region={{.region}} --range={{.web}}
  gcloud compute networks subnets create app --network=corp-vpc --region={{.region}} --range={{.app}}
  gcloud compute networks subnets create db --network=corp-vpc --region={{.region}} --range={{.db}}
rubric:
  - name: Plan de direccionamiento
    validator: state
    points: 60
    checks:
      - {type: subnet_plan, network: corp-vpc, subnets: {web: 200, app: 900, db: 50}, within: "{{.block}}", avoid: ["{{.onprem}}"], maxWasteFactor: 4, desc: "Subredes bien dimensionadas, contenidas y sin solapes"}
  - name: Fundamentos
    validator: quiz
    points: 40
    checks:
      - {type: quiz, ratio: 1, desc: "Preguntas de CIDR y enrutamiento"}
en:
  title: 'Networking fundamentals: an address plan that will not collide'
  summary: Size subnets from host counts, keep them inside the allocation, avoid the on-premises range and leave room to grow.
  story: |
    Nebula's network team allocated **{{.block}}** to the new `corp-vpc` (custom mode, region {{.region}}).
    The Madrid datacenter already uses **{{.onprem}}** — it will be connected by VPN, so it must never overlap.

    | Subnet | Hosts needed |
    |---|---|
    | `web` | 200 |
    | `app` | 900 |
    | `db`  | 50 |

    Remember that Google Cloud reserves **4 addresses** in every subnet. Pick the smallest prefix that fits
    each subnet (no more than 4× the need), create them, and answer the questions.
  objectives:
    - Convert host counts into prefixes
    - Keep every subnet inside the allocation and away from on-prem
    - Avoid overlaps and waste
  text:
    ¿Cuántas direcciones utilizables te da una subred /26 en Google Cloud?: How many usable addresses does a /26 subnet give you in Google Cloud?
    64: 64
    62: 62
    60: 60
    58: 58
    ¿Cuál es el prefijo más pequeño en el que caben 900 hosts?: Which prefix is the smallest that fits 900 hosts?
    /23: /23
    /22: /22
    /21: /21
    /24: /24
    ¿Por qué los rangos de la VPC no deben solaparse con on-premise cuando se usa VPN?: Why must the VPC ranges not overlap with on-prem when using VPN?
    'Las rutas serían ambiguas: el mismo destino existiría a ambos lados': 'Routes would be ambiguous: the same destination would exist on both sides'
    La VPN solo admite rangos /8: VPN only supports /8 ranges
    Las reglas de cortafuegos lo prohíben: Firewall rules forbid it
    Cuesta más: It costs more
    Plan de direccionamiento: Address plan
    Subredes bien dimensionadas, contenidas y sin solapes: Right-sized, contained, non-overlapping subnets
    Fundamentos: Fundamentals
    Preguntas de CIDR y enrutamiento: CIDR and routing questions

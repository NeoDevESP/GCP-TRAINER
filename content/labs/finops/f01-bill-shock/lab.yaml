id: finops-f01-bill-shock
title: "Simulador FinOps: la factura ha pasado de 100 a 3.000 EUR"
summary: Lee la factura, encuentra anomalías y desperdicio, actúa según el recomendador con el acuerdo de los responsables y pon barreras, sin tocar producción.
track: finops
day: 1
level: intermediate
branch: finops
type: incident
mode: production
skills: [finops.visibility, finops.optimization, architecture.cost, foundations.billing]
wellArchitected: [cost]
certs: [ACE, PCA]
difficulty: 3
minutes: 50
baseline: [three-tier-app]
faults:
  - {type: bill_snapshot}
  - {type: command, run: "gcloud compute instances create ml-experiment --zone={{.zone}} --machine-type=g2-standard-4 --accelerator=type=nvidia-l4,count=1 --subnet=app-subnet --no-address --labels=team=data,sim-cpu=idle --image-family=debian-12 --image-project=debian-cloud"}
  - {type: command, run: "gcloud compute instances create batch-1 --zone={{.zone}} --machine-type=n2-standard-16 --subnet=app-subnet --no-address --labels=team=finance,sim-cpu=low --image-family=debian-12 --image-project=debian-cloud"}
  - {type: command, run: "gcloud compute disks create old-backup-1 old-backup-2 old-backup-3 --zone={{.zone}} --size=500 --type=pd-ssd"}
  - {type: command, run: "gcloud compute addresses create legacy-ip-1 legacy-ip-2 --region={{.region}}"}
traffic:
  - {name: checkout, target: "lb:checkout-lb", path: /checkout, rps: 20}
constraints: ['protect:api-1', 'protect:sql-1']
ticket:
  id: COST-44
  kind: COST
  priority: P2
  summary: "La previsión de este mes es de ~3.300 EUR; el mes pasado fue de ~100 EUR. ¿Qué ha pasado y cómo volvemos a la normalidad sin romper checkout?"
  reporter: Marta (FinOps)
actors:
  - role: data
    name: Lucía (ciencia de datos)
    fallback: "Hace tres semanas estuvimos probando un modelo en una GPU."
    facts:
      - {keywords: [[ml-experiment, gpu, experiment, delete, borrar, borr, elimin]], answer: "¿ml-experiment? El experimento terminó hace mucho: bórrala, los resultados están en el bucket."}
  - role: finance
    name: Marta (FinOps)
    facts:
      - {keywords: [[batch, batch-1, report, informe, lote]], answer: "batch-1 ejecuta nuestros informes nocturnos para Finanzas. Tiene que quedarse, pero no necesita ser enorme."}
      - {keywords: [[disk, disco, backup, old-backup, copia de seguridad, copias de seguridad, respaldo]], answer: "Los discos old-backup pertenecen a una migración que terminó en mayo. Conserva un snapshot para auditoría y borra los discos."}
story: |
  La factura del mes pasado de `{{.project}}` fue de unos **100 EUR**. La previsión de este mes es **30 veces mayor**.
  Usa las herramientas de FinOps para explicarlo y volver a bajar el coste:

  - `gcloud billing report` (compara con el mes pasado; `--group-by=resource` o `--group-by=label:team`)
  - `gcloud recommender recommendations list --recommender=google.compute.instance.IdleResourceRecommender`
    (también `...MachineTypeRecommender`, `google.compute.disk.IdleResourceRecommender`, `google.compute.address.IdleResourceRecommender`)

  Confírmalo con los responsables antes de borrar nada, mantén checkout funcionando, conserva un snapshot de las
  copias antiguas y añade un **presupuesto de 300 EUR** con alertas al 50/90/100 %.
objectives:
  - Explica el aumento con evidencias
  - Actúa sobre cada recomendación tras confirmarlo con su responsable
  - Mantén en marcha producción y las cargas necesarias
  - Evita la próxima sorpresa
evidence:
  fields: [savings]
  sample:
    savings: El aumento venía de una VM con GPU ociosa, ml-experiment, olvidada tras un experimento (~2.300 EUR), un batch-1 sobredimensionado en n2-standard-16 con poca CPU, tres discos SSD de 500 GB sin conectar y dos IP estáticas sin usar. Borrar la VM con GPU ociosa, redimensionar batch-1 a n2-standard-4, hacer un snapshot y borrar los discos antiguos y liberar las IP devuelve la previsión por debajo de 300 EUR; un presupuesto con alertas detectará la próxima anomalía.
solution: |
  gcloud billing report
  gcloud billing report --group-by=resource
  gcloud recommender recommendations list --recommender=google.compute.instance.IdleResourceRecommender --location={{.zone}}
  gcloud recommender recommendations list --recommender=google.compute.instance.MachineTypeRecommender --location={{.zone}}
  gcloud recommender recommendations list --recommender=google.compute.disk.IdleResourceRecommender --location={{.zone}}
  ask data "can we delete ml-experiment?"
  ask finance "what is batch-1 and the old-backup disks?"
  gcloud compute instances delete ml-experiment --zone={{.zone}} --quiet
  gcloud compute instances stop batch-1 --zone={{.zone}}
  gcloud compute instances set-machine-type batch-1 --machine-type=n2-standard-4 --zone={{.zone}}
  gcloud compute instances start batch-1 --zone={{.zone}}
  gcloud compute disks snapshot old-backup-1 --zone={{.zone}} --snapshot-names=old-backups-audit
  gcloud compute disks delete old-backup-1 old-backup-2 old-backup-3 --zone={{.zone}} --quiet
  gcloud compute addresses delete legacy-ip-1 legacy-ip-2 --region={{.region}} --quiet
  gcloud billing budgets create --billing-account=0X0X0X-0X0X0X-0X0X0X --display-name=monthly --budget-amount=300EUR --threshold-rule=percent=0.5 --threshold-rule=percent=0.9 --threshold-rule=percent=1.0
  gcloud billing report
rubric:
  - name: Gasto de vuelta a la normalidad
    validator: cost
    points: 30
    all: true
    checks:
      - {type: cost_max, eur: 400, desc: "Previsión mensual por debajo de 400 EUR"}
      - {type: absent, path: "instances[\"ml-experiment\"]", desc: "VM con GPU ociosa eliminada"}
      - {type: count, collection: disks, where: {name: {regex: "^old-backup"}}, max: 0, desc: "Discos sin conectar eliminados"}
  - name: Cargas necesarias conservadas
    validator: functional
    points: 25
    critical: true
    all: true
    checks:
      - {type: http, target: "lb:checkout-lb", path: /checkout, status: 200, desc: "Checkout sigue funcionando"}
      - {type: exists, path: "instances[\"batch-1\"]", expect: {machineType: {regex: "n2-standard-(2|4|8)$"}, status: RUNNING}, desc: "batch-1 redimensionado y en marcha"}
      - {type: count, collection: snapshots, min: 1, desc: "Snapshot de auditoría conservado"}
  - name: Primero las evidencias
    validator: diagnosis
    points: 15
    checks:
      - {type: command, regex: "billing report|recommender recommendations list", min: 2, desc: "Se han usado la factura y el recomendador"}
      - {type: asked, min: 2, desc: "Confirmado con los responsables"}
  - name: Barrera de costes
    validator: cost
    points: 15
    checks:
      - {type: exists, path: "budgets.monthly", expect: {amount: 300, thresholds: {minLen: 3}}, desc: "Presupuesto de 300 EUR con tres umbrales"}
  - name: Explicación
    validator: evidence
    points: 15
    checks:
      - {type: evidence, fields: [savings], keywords: [[gpu], [rightsiz, n2-standard-4, machine type, dimension, ajust, tipo de maquina], [disk, disco], [budget, alert, presupuesto, alerta]], desc: "Origen del coste y ahorros explicados"}
en:
  title: 'FinOps Simulator: the bill went from 100 to 3,000 EUR'
  summary: Read the invoice, find anomalies and waste, act on recommender advice with the owners' agreement and put guardrails in place — without touching production.
  story: |
    Last month's bill for `{{.project}}` was about **100 EUR**. This month's forecast is **30× higher**.
    Use the FinOps tools to explain it and bring the cost back down:

    - `gcloud billing report` (compare with last month; `--group-by=resource` or `--group-by=label:team`)
    - `gcloud recommender recommendations list --recommender=google.compute.instance.IdleResourceRecommender`
      (also `...MachineTypeRecommender`, `google.compute.disk.IdleResourceRecommender`, `google.compute.address.IdleResourceRecommender`)

    Confirm with the owners before deleting anything, keep checkout working, keep one snapshot of the old
    backups, and add a **budget of 300 EUR** with alerts at 50/90/100%.
  objectives:
    - Explain the increase with evidence
    - Act on each recommendation after confirming with the owner
    - Keep production and required workloads running
    - Prevent the next surprise
  ticket:
    summary: The forecast for this month is ~3,300 EUR; last month was ~100 EUR. What happened, and how do we get back to normal without breaking checkout?
  text:
    Gasto de vuelta a la normalidad: Spend back to normal
    Previsión mensual por debajo de 400 EUR: Monthly forecast below 400 EUR
    VM con GPU ociosa eliminada: Idle GPU VM removed
    Discos sin conectar eliminados: Unattached disks removed
    Cargas necesarias conservadas: Required workloads kept
    Checkout sigue funcionando: Checkout still works
    batch-1 redimensionado y en marcha: batch-1 rightsized and running
    Snapshot de auditoría conservado: Audit snapshot kept
    Primero las evidencias: Evidence first
    Se han usado la factura y el recomendador: Used the invoice and the recommender
    Confirmado con los responsables: Confirmed with the owners
    Barrera de costes: Guardrail
    Presupuesto de 300 EUR con tres umbrales: 300 EUR budget with three thresholds
    Explicación: Explanation
    Origen del coste y ahorros explicados: Cost drivers and savings explained
    Marta (FinOps): Marta (FinOps)
    Lucía (ciencia de datos): Lucía (data science)
    Hace tres semanas estuvimos probando un modelo en una GPU.: We were testing a model on a GPU three weeks ago.
    '¿ml-experiment? El experimento terminó hace mucho: bórrala, los resultados están en el bucket.': ml-experiment? The experiment finished long ago — delete it, the results are in the bucket.
    batch-1 ejecuta nuestros informes nocturnos para Finanzas. Tiene que quedarse, pero no necesita ser enorme.: batch-1 runs our nightly reports for Finance. It must stay, but it doesn't need to be huge.
    Los discos old-backup pertenecen a una migración que terminó en mayo. Conserva un snapshot para auditoría y borra los discos.: The old-backup disks belong to a migration that ended in May. Keep one snapshot for audit and remove the disks.

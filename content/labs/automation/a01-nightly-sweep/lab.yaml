id: automation-a01-nightly-sweep
title: "Automatización: el script nocturno de ahorro de costes"
summary: 'Sustituye una tarea manual por un script idempotente: bucles, filtros, condicionales y códigos de salida sobre la CLI.'
track: foundations
day: 5
level: basic
branch: automation
type: challenge
mode: lab
skills: [automation.bash, automation.sdk, devtools.formats, foundations.billing]
wellArchitected: [operations, cost]
certs: [ACE]
difficulty: 2
minutes: 35
baseline: [default-network]
setup: |
  for n in dev-a dev-b dev-c; do gcloud compute instances create $n --zone={{.zone}} --machine-type=e2-standard-2 --labels=env=dev; done
  for n in dev-d dev-e; do gcloud compute instances create $n --zone={{.zone}} --machine-type=e2-standard-2 --labels=env=dev,owner=web; done
  for n in prod-a prod-b prod-c; do gcloud compute instances create $n --zone={{.zone}} --machine-type=e2-standard-2 --labels=env=prod,owner=platform; done
story: |
  Cada tarde alguien detiene a mano las VM de desarrollo y se olvida de la mitad. Escribe `sweep.sh` que:

  1. etiquete con `owner=unknown` cada VM que **no tenga propietario** (para que FinOps pueda perseguirla), y
  2. **detenga todas las VM `env=dev`**, nunca una de producción,

  usando un bucle sobre `gcloud compute instances list --filter=... --format='value(name)'`. Ejecútalo y asegúrate
  de que ejecutarlo dos veces no hace daño (idempotente). La terminal admite `for …; do …; done` e `if …; then …; fi`.
objectives:
  - Selecciona los recursos con filtros en lugar de nombres escritos a mano
  - Usa bucles y condiciones de forma segura
  - "Idempotente: una segunda ejecución no cambia nada"
  - Producción intacta
hints:
  - text: "`gcloud compute instances list --filter='labels.env=dev' --format='value(name)'`"
  - text: "`if gcloud compute instances describe $vm --zone=... --format='value(labels.owner)' | grep -q .; then ...`"
evidence:
  fields: [explanation]
  sample:
    explanation: El script selecciona las VM con filtros, etiqueta como owner=unknown las que no tienen propietario y detiene solo las instancias env=dev; al volver a ejecutarlo no encuentra nada que cambiar, así que es idempotente y nunca toca producción.
solution: |
  cat > sweep.sh <<'SH'
  for vm in $(gcloud compute instances list --format='value(name)'); do
    if gcloud compute instances describe $vm --zone={{.zone}} --format='value(labels.owner)' | grep -q .; then
      echo "$vm has an owner"
    else
      gcloud compute instances update $vm --zone={{.zone}} --update-labels=owner=unknown
    fi
  done
  for vm in $(gcloud compute instances list --filter='labels.env=dev AND status=RUNNING' --format='value(name)'); do
    gcloud compute instances stop $vm --zone={{.zone}}
  done
  SH
  for vm in $(gcloud compute instances list --format='value(name)'); do
    if gcloud compute instances describe $vm --zone={{.zone}} --format='value(labels.owner)' | grep -q .; then
      echo "$vm has an owner"
    else
      gcloud compute instances update $vm --zone={{.zone}} --update-labels=owner=unknown
    fi
  done
  for vm in $(gcloud compute instances list --filter='labels.env=dev AND status=RUNNING' --format='value(name)'); do
    gcloud compute instances stop $vm --zone={{.zone}}
  done
  for vm in $(gcloud compute instances list --filter='labels.env=dev AND status=RUNNING' --format='value(name)'); do
    gcloud compute instances stop $vm --zone={{.zone}}
  done
rubric:
  - name: Todas las VM con propietario
    validator: state
    points: 25
    checks:
      - {type: count, collection: instances, where: {labels: {regex: "owner"}}, min: 8, desc: "Las 8 VM tienen etiqueta de propietario"}
  - name: Desarrollo detenido
    validator: cost
    points: 25
    checks:
      - {type: count, collection: instances, where: {labels: {regex: "\"env\":\"dev\""}, status: RUNNING}, max: 0, desc: "Ninguna VM de desarrollo en marcha"}
  - name: Producción intacta
    validator: security
    points: 25
    critical: true
    all: true
    checks:
      - {type: count, collection: instances, where: {labels: {regex: "\"env\":\"prod\""}, status: RUNNING}, min: 3, desc: "Las VM de producción siguen en marcha"}
      - {type: count, collection: instances, where: {labels: {regex: "\"owner\":\"platform\""}}, min: 3, desc: "Se conservan los propietarios existentes"}
  - name: Con script, no a mano
    validator: diagnosis
    points: 15
    all: true
    checks:
      - {type: file_contains, file: sweep.sh, regex: "for .* in \\$\\(gcloud", desc: "sweep.sh recorre en bucle una consulta de gcloud"}
      - {type: file_contains, file: sweep.sh, regex: "--filter", desc: "sweep.sh selecciona con filtros"}
  - name: Explicación
    validator: evidence
    points: 10
    checks:
      - {type: evidence, fields: [explanation], keywords: [[filter, filtro], [idempot]], desc: "Explica el diseño"}
en:
  title: 'Automation: the nightly cost sweep script'
  summary: Replace a manual chore with an idempotent script — loops, filters, conditionals and exit codes over the CLI.
  story: |
    Every evening someone stops the development VMs by hand and forgets half of them. Write `sweep.sh` that:

    1. labels every VM that has **no owner** with `owner=unknown` (so FinOps can chase it), and
    2. **stops every `env=dev` VM** — never a production one,

    using a loop over `gcloud compute instances list --filter=... --format='value(name)'`. Run it, and make sure
    running it twice is harmless (idempotent). The terminal supports `for …; do …; done` and `if …; then …; fi`.
  objectives:
    - Select resources with filters instead of hard-coded names
    - Loop and branch safely
    - 'Idempotent: a second run changes nothing'
    - Production untouched
  hints:
    - '`gcloud compute instances list --filter=''labels.env=dev'' --format=''value(name)''`'
    - '`if gcloud compute instances describe $vm --zone=... --format=''value(labels.owner)'' | grep -q .; then ...`'
  text:
    Todas las VM con propietario: Every VM owned
    Las 8 VM tienen etiqueta de propietario: All 8 VMs carry an owner label
    Desarrollo detenido: Dev stopped
    Ninguna VM de desarrollo en marcha: No dev VM running
    Producción intacta: Production untouched
    Las VM de producción siguen en marcha: Production VMs still running
    Se conservan los propietarios existentes: Existing owners preserved
    Con script, no a mano: Scripted, not manual
    sweep.sh recorre en bucle una consulta de gcloud: sweep.sh loops over a gcloud query
    sweep.sh selecciona con filtros: sweep.sh selects with filters
    Explicación: Explanation
    Explica el diseño: Explain the design

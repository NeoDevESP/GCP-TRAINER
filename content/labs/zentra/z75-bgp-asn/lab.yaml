story: |-
  **Proyecto `{{.project}}`** (*zentra-pagos-prod*).

  > **INC-31075 · P1** · NOC: *«pagos-batch no conecta con el core bancario (192.168.20.10:443) desde las 02:10. La conciliación tiene que salir antes de las 07:00.»*

  **La conexión con el CPD.** Zentra tiene su **centro de datos propio** en Madrid (el core bancario, la mensajería MQ, los batch) unido a Google Cloud por **Cloud VPN**: un túnel cifrado (`tunel-cpd-0`) y, por encima, una sesión **BGP** en el Cloud Router `cpd-router` que intercambia rutas. Para que haya tráfico hacen falta tres cosas: el **túnel** arriba, la **sesión BGP** establecida (los dos lados de acuerdo en los números de sistema autónomo, ASN) y **rutas en los dos sentidos** (Google aprende `192.168.0.0/16` del CPD y el CPD aprende lo que el Cloud Router anuncia).

  1. ¿Llega o no? `gcloud compute ssh pagos-batch --zone={{.zone}} --tunnel-through-iap --command='curl -s -m 5 https://192.168.20.10'`.
  2. El túnel: `gcloud compute vpn-tunnels describe tunel-cpd-0 --region={{.region}}`.
  3. La sesión BGP y las rutas: `gcloud compute routers get-status cpd-router --region={{.region}}`. Lee bien el motivo.
  4. Habla con Red (Tomás) y con el CPD: ¿qué ha cambiado?
  5. Con cambio de emergencia, ajusta nuestro lado: `gcloud compute routers update-bgp-peer cpd-router --region={{.region}} --peer-name=cpd-madrid --peer-asn=…`.
  6. Comprueba la sesión y la conexión, comunica y deja en la nota interna el fallo de proceso (un cambio del CPD que no llegó a Cloud).
objectives:
- Confirma que no llega
- Túnel arriba, BGP caído
- Corrige el ASN con cambio de emergencia
- Verifica y comunica
hints:
- text: 'get-status dice «Bad Peer AS: configured peer ASN 65001, the peer announced ASN 65010».'
quiz:
- id: q1
  question: El túnel VPN está ESTABLISHED pero no hay tráfico. ¿Qué miras después?
  options:
  - La sesión BGP y las rutas aprendidas del Cloud Router
  - Reiniciar la VM
  - Abrir el cortafuegos a 0.0.0.0/0
  - Crear otro túnel
  answer:
  - 0
solution: |
  ticket
  ticket update "Estamos investigando la conexión entre Google Cloud y el CPD que afecta a la conciliación. Próxima actualización a las 03:00."
  gcloud compute vpn-tunnels describe tunel-cpd-0 --region={{.region}}
  gcloud compute routers get-status cpd-router --region={{.region}}
  ask network "La sesión BGP de cpd-router está Idle con Bad Peer AS, ¿qué ASN tenemos para el CPD?"
  ask datacenter "¿Habéis cambiado el ASN o el router del CPD?"
  ask change "Necesito cambiar el ASN del peer BGP cpd-madrid a 65010 como cambio de emergencia"
  gcloud compute routers update-bgp-peer cpd-router --region={{.region}} --peer-name=cpd-madrid --peer-asn=65010
  gcloud compute routers get-status cpd-router --region={{.region}}
  gcloud compute ssh pagos-batch --zone={{.zone}} --tunnel-through-iap --command='curl -s -m 5 https://192.168.20.10'
  ticket comment "Causa: anoche el CPD migró de router (CHG-7712) y anuncia el ASN 65010; cpd-router seguía esperando 65001 y la sesión BGP quedó Idle (Bad Peer AS) con el túnel arriba. Cambiado el peer cpd-madrid a 65010 (CHG-7795). Pendiente: que los cambios del CPD que afectan a BGP pasen también por Cloud."
  ticket update "Resuelto: desde las 02:55 la conciliación vuelve a conectar con el core bancario. Fue un cambio de configuración en el CPD que no se reflejó en la nube; ya está alineado y la conciliación saldrá a tiempo."
  ticket resolve "Peer BGP cpd-madrid con el ASN nuevo del CPD (65010); sesión establecida y core accesible desde pagos-batch."
shortcuts:
- name: static route over the tunnel
  run: |
    gcloud compute routes create a-cpd --network=zentra-vpc --destination-range=192.168.0.0/16 --next-hop-vpn-tunnel=tunel-cpd-0 --next-hop-vpn-tunnel-region={{.region}}
    ticket resolve "Ruta estática al CPD para saltarnos el BGP."

en:
  title: INC P1 · The tunnel is up but nothing reaches core banking
  summary: 'Reconciliation can''t connect to the data centre. The VPN tunnel says ESTABLISHED, but the BGP session is down: last night the data centre replaced its router and its autonomous system number.'
  story: |-
    **Project `{{.project}}`** (*zentra-pagos-prod*).

    > **INC-31075 · P1** · NOC: *"pagos-batch can't connect to core banking (192.168.20.10:443) since 02:10. Reconciliation must go out before 07:00."*

    **The data-centre link.** Zentra has its **own data centre** in Madrid (core banking, MQ messaging, batch) joined to Google Cloud by **Cloud VPN**: an encrypted tunnel (`tunel-cpd-0`) and, on top, a **BGP** session on Cloud Router `cpd-router` that exchanges routes. Traffic needs three things: the **tunnel** up, the **BGP session** established (both sides agreeing on the autonomous system numbers, ASN) and **routes both ways** (Google learns `192.168.0.0/16` from the data centre and the data centre learns what the Cloud Router advertises).

    1. Does it get through? `gcloud compute ssh pagos-batch --zone={{.zone}} --tunnel-through-iap --command='curl -s -m 5 https://192.168.20.10'`.
    2. The tunnel: `gcloud compute vpn-tunnels describe tunel-cpd-0 --region={{.region}}`.
    3. The BGP session and routes: `gcloud compute routers get-status cpd-router --region={{.region}}`. Read the reason carefully.
    4. Talk to Network (Tomás) and the data centre: what changed?
    5. With an emergency change, adjust our side: `gcloud compute routers update-bgp-peer cpd-router --region={{.region}} --peer-name=cpd-madrid --peer-asn=…`.
    6. Check the session and the connection, communicate and put the process failure in the internal note (a data-centre change that never reached Cloud).
  objectives:
  - Confirm it doesn't get through
  - Tunnel up, BGP down
  - Fix the ASN with an emergency change
  - Verify and communicate
  hints:
  - 'get-status says "Bad Peer AS: configured peer ASN 65001, the peer announced ASN 65010".'
  ticket:
    summary: pagos-batch can't connect to core banking (core.zentra.corp, 192.168.20.10:443) since 02:10. Reconciliation with correspondent banks must go out before 07:00.
  text:
    NOC 24x7: NOC 24x7
    Tomás Vidal (Arquitecto de red): Tomás Vidal (Network architect)
    Dueño de la VPC, la VPN y el Interconnect con el CPD.: Owner of the VPC, the VPN and the Interconnect with the data centre.
    'Primero mira el túnel y luego la sesión BGP: que el túnel esté arriba no significa que haya rutas.': 'Check the tunnel first, then the BGP session: a tunnel being up doesn''t mean there are routes.'
    ? Si la sesión BGP está Idle con «Bad Peer AS», es que los ASN no cuadran. Nosotros tenemos configurado 65001 para el CPD; pregunta al CPD qué ASN anuncian ahora.
    : If the BGP session is Idle with "Bad Peer AS", the ASNs don't match. We have 65001 configured for the data centre; ask them which ASN they announce now.
    Redes CPD Madrid: Madrid data-centre networking
    El equipo de red del centro de datos propio del banco.: The networking team of the bank's own data centre.
    Por nuestro lado todo está como siempre. ¿Qué veis en la sesión BGP?: On our side everything is as usual. What do you see in the BGP session?
    Anoche migramos al router nuevo del CPD (CHG-7712) y ahora anunciamos el ASN 65010. Se avisó por correo… ¿no os llegó?: Last night we migrated to the data centre's new router (CHG-7712) and we now announce ASN 65010. It was emailed… didn't you get it?
    Javier Luna (Gestión de cambios): Javier Luna (Change management)
    Gestor de cambios (CAB).: Change manager (CAB).
    Ningún cambio en producción sin registro. Si hay clientes afectados, lo apruebo como emergencia.: No production change without a record. If customers are affected, I approve it as an emergency.
    Aprobado como cambio de emergencia (CHG-7795). Anótalo en el ticket con lo que cambias y cómo se vuelve atrás.: Approved as an emergency change (CHG-7795). Note it in the ticket with what you change and how to roll back.
    El túnel VPN está ESTABLISHED pero no hay tráfico. ¿Qué miras después?: The VPN tunnel is ESTABLISHED but there's no traffic. What do you check next?
    La sesión BGP y las rutas aprendidas del Cloud Router: The Cloud Router's BGP session and learned routes
    Reiniciar la VM: Restart the VM
    Abrir el cortafuegos a 0.0.0.0/0: Open the firewall to 0.0.0.0/0
    Crear otro túnel: Create another tunnel
    Core bancario accesible: Core banking reachable
    Sesión BGP establecida: BGP session established
    pagos-batch llega al core: pagos-batch reaches core
    Diagnóstico por capas: Layered diagnosis
    Túnel revisado: Tunnel checked
    Sesión BGP revisada: BGP session checked
    Preguntado al CPD qué cambió: Asked the data centre what changed
    Cambio y comunicación: Change and communication
    Cambio de emergencia: Emergency change
    Inicio y resolución: Start and resolution
    Nota interna con BGP y ASN: Internal note with BGP and ASN
    Lo has entendido: You understood it
    Pregunta del caso: Case question
    El túnel: The tunnel
    'ESTABLISHED: el cifrado funciona. Eso no garantiza rutas.': 'ESTABLISHED: encryption works. That doesn''t guarantee routes.'
    BGP: BGP
    'Idle, «Bad Peer AS»: nosotros esperamos 65001 y el CPD anuncia 65010.': 'Idle, "Bad Peer AS": we expect 65001 and the data centre announces 65010.'
    El arreglo: The fix
    Nuestro lado alineado con el router nuevo del CPD.: Our side aligned with the data centre's new router.

setup: |
  gcloud kms keyrings create zentra-datos --location={{.region}}
  gcloud kms keys create informes --keyring=zentra-datos --location={{.region}} --purpose=encryption
  gcloud kms keys versions create --key=informes --keyring=zentra-datos --location={{.region}}
  gcloud kms keys add-iam-policy-binding informes --keyring=zentra-datos --location={{.region}} --member=serviceAccount:$(gcloud storage service-agent) --role=roles/cloudkms.cryptoKeyEncrypterDecrypter
  gcloud storage buckets create gs://zentra-informes-{{.project}} --location={{.region}} --uniform-bucket-level-access --public-access-prevention --default-encryption-key=projects/{{.project}}/locations/{{.region}}/keyRings/zentra-datos/cryptoKeys/informes
  echo "informe de riesgos Q3" > q3.pdf
  gcloud storage cp q3.pdf gs://zentra-informes-{{.project}}/data/report.csv
  gcloud iam service-accounts create informes-sa --display-name="informes-api"
  gcloud storage buckets add-iam-policy-binding gs://zentra-informes-{{.project}} --member=serviceAccount:informes-sa@{{.project}}.iam.gserviceaccount.com --role=roles/storage.objectViewer
  gcloud run deploy informes-api --image=europe-docker.pkg.dev/gcplab-public/apps/reports-api:1.0 --region={{.region}} --service-account=informes-sa@{{.project}}.iam.gserviceaccount.com --set-env-vars=BUCKET=zentra-informes-{{.project}} --no-allow-unauthenticated
  gcloud run services add-iam-policy-binding informes-api --region={{.region}} --member=serviceAccount:app-gateway-sa@{{.project}}.iam.gserviceaccount.com --role=roles/run.invoker

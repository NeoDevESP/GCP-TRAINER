en:
  title: INC P1 · A clean-up script disabled the key version
  summary: 'Nobody can download their reports: the key version they''re encrypted with is disabled. Re-enable it (never destroy it), find out who and why, and tell Security.'
  story: |-
    **Project `{{.project}}`** (*zentra-empresas-prod*).

    > **INC-31074 · P1** · NOC: *"Every report download has failed since 10:02 (storage error 400)."*

    A Cloud KMS key has **versions**: rotating creates a new one (the **primary**, used to encrypt new data) and the older ones are kept to **decrypt** old data. Each version can be **enabled**, **disabled** (unusable, but can be re-enabled) or **scheduled for destruction** (24 h or more to change your mind; after that, data encrypted with it is lost **forever**).

    1. The error: `gcloud logging read 'resource.type=cloud_run_revision severity>=ERROR' --limit=3`.
    2. The versions: `gcloud kms keys versions list --key=informes --keyring=zentra-datos --location={{.region}}`.
    3. Who and when: the `cloudkms.googleapis.com` audit log.
    4. Talk to Security (key owner) and ask for the emergency change.
    5. **Re-enable** the version (`versions enable`). Never destroy it.
    6. Communicate on a cadence and put who disabled it in the internal note.
  objectives:
  - Find the disabled version
  - Find out who
  - Re-enable it with an emergency change
  - Communicate
  hints:
  - '`gcloud kms keys versions enable 2 --key=informes --keyring=zentra-datos --location={{.region}}`'
  ticket:
    summary: Every report download in the business app has failed since 10:02 (storage error 400). Business customers can't download their tax statements.
  text:
    NOC 24x7: NOC 24x7
    Nadia Kowalski (Seguridad cloud): Nadia Kowalski (Cloud security)
    Ingeniera de seguridad cloud, dueña de perímetros, claves y políticas de denegación.: Cloud security engineer, owner of perimeters, keys and deny policies.
    'Los controles de seguridad no se quitan: se ajustan con el mínimo alcance. Dime identidad, origen y servicio.': 'Security controls aren''t removed: they''re adjusted with the minimum scope. Tell me identity, source and service.'
    ? 'Uf. El script kms-limpieza desactiva versiones «antiguas» y se ha equivocado: la 2 es la primaria. Reactívala ya, no destruyas nada, y paramos el script nosotros. Desactivar una versión deja ilegible todo lo cifrado con ella.'
    : 'Ugh. The kms-limpieza script disables "old" versions and got it wrong: version 2 is the primary. Re-enable it now, don''t destroy anything, and we''ll stop the script. Disabling a version makes everything encrypted with it unreadable.'
    Javier Luna (Gestión de cambios): Javier Luna (Change management)
    Gestor de cambios (CAB).: Change manager (CAB).
    Ningún cambio en producción sin registro. Si hay clientes afectados, lo apruebo como emergencia.: No production change without a record. If customers are affected, I approve it as an emergency.
    Aprobado como cambio de emergencia (CHG-7795). Anótalo en el ticket con lo que cambias y cómo se vuelve atrás.: Approved as an emergency change (CHG-7795). Note it in the ticket with what you change and how to roll back.
    ¿Qué pasa con los datos si destruyes una versión de clave?: What happens to the data if you destroy a key version?
    Lo cifrado con ella es ilegible para siempre: What's encrypted with it is unreadable forever
    Se recifra solo con la siguiente: It's re-encrypted with the next one automatically
    Nada, Google guarda una copia: Nothing, Google keeps a copy
    Se vuelve público: It becomes public
    Informes descargándose: Reports downloading
    /reports responde 200: /reports returns 200
    Sin destruir nada: Nothing destroyed
    Ninguna versión destruida: No version destroyed
    Versión reactivada: Version re-enabled
    Diagnóstico y cambio: Diagnosis and change
    Versiones o auditoría revisadas: Versions or audit log checked
    Cambio de emergencia: Emergency change
    Comunicación de P1: P1 communication
    Inicio y resolución: Start and resolution
    Nota interna con quién y qué: Internal note with who and what
    Lo has entendido: You understood it
    Pregunta del caso: Case question
    Las versiones: The versions
    'La 2 (primaria) está DISABLED: todo lo cifrado con ella es ilegible.': 'Version 2 (primary) is DISABLED: everything encrypted with it is unreadable.'
    Quién: Who
    kms-limpieza, un script de mantenimiento, a las 10:02.: kms-limpieza, a maintenance script, at 10:02.
    Reactivar: Re-enable
    Deshabilitar es reversible; destruir, no.: Disabling is reversible; destroying isn't.

story: |-
  **Proyecto `{{.project}}`** (*zentra-empresas-prod*).

  > **INC-31074 · P1** · NOC: *«Todas las descargas de informes fallan desde las 10:02 (error 400 de almacenamiento).»*

  Una clave de Cloud KMS tiene **versiones**: al rotar se crea una nueva (la **primaria**, con la que se cifra lo nuevo) y las anteriores se conservan para **descifrar** lo antiguo. Cada versión puede estar **habilitada**, **deshabilitada** (no se puede usar, pero se puede reactivar) o **programada para destrucción** (24 h o más para arrepentirse; después, los datos cifrados con ella se pierden **para siempre**).

  1. El error: `gcloud logging read 'resource.type=cloud_run_revision severity>=ERROR' --limit=3`.
  2. Las versiones: `gcloud kms keys versions list --key=informes --keyring=zentra-datos --location={{.region}}`.
  3. Quién y cuándo: auditoría de `cloudkms.googleapis.com`.
  4. Habla con Seguridad (dueña de las claves) y pide el cambio de emergencia.
  5. **Reactiva** la versión (`versions enable`). Nunca la destruyas.
  6. Comunica con cadencia y deja en la nota interna quién la desactivó.
objectives:
- Encuentra la versión deshabilitada
- Averigua quién
- Reactívala con cambio de emergencia
- Comunica
hints:
- text: '`gcloud kms keys versions enable 2 --key=informes --keyring=zentra-datos --location={{.region}}`'
quiz:
- id: q1
  question: ¿Qué pasa con los datos si destruyes una versión de clave?
  options:
  - Lo cifrado con ella es ilegible para siempre
  - Se recifra solo con la siguiente
  - Nada, Google guarda una copia
  - Se vuelve público
  answer:
  - 0
solution: |
  ticket
  ticket update "Estamos investigando el fallo en las descargas de informes. Próxima actualización a las 10:45."
  gcloud logging read 'resource.type=cloud_run_revision severity>=ERROR' --limit=3
  gcloud kms keys versions list --key=informes --keyring=zentra-datos --location={{.region}}
  gcloud logging read 'protoPayload.serviceName="cloudkms.googleapis.com"' --limit=5
  ask security "La versión 2 de la clave informes está deshabilitada por kms-limpieza, ¿la reactivo?"
  ask change "Necesito reactivar la versión 2 de la clave informes como cambio de emergencia"
  gcloud kms keys versions enable 2 --key=informes --keyring=zentra-datos --location={{.region}}
  gcloud kms keys versions list --key=informes --keyring=zentra-datos --location={{.region}}
  ticket comment "Causa: a las 10:02 la cuenta kms-limpieza deshabilitó la versión 2 (primaria) de la clave informes; el bucket es CMEK y no se podía leer ni escribir. Reactivada con CHG-7795. Seguridad para el script."
  ticket update "Resuelto: desde las 10:40 los clientes empresa vuelven a descargar sus informes. Un proceso automático de mantenimiento bloqueó por error la clave de cifrado; ya está corregido y el proceso detenido. Ningún dato se ha perdido."
  ticket resolve "Versión 2 de la clave informes reactivada (no destruida); el script kms-limpieza queda parado por Seguridad."
shortcuts:
- name: new key version instead
  run: |
    gcloud kms keys versions create --key=informes --keyring=zentra-datos --location={{.region}}
    ticket resolve "Creada una versión nueva de la clave."
- name: destroy the disabled version
  run: |
    gcloud kms keys versions destroy 2 --key=informes --keyring=zentra-datos --location={{.region}}
    ticket resolve "Eliminada la versión mala de la clave."

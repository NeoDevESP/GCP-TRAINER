id: zentra-z74-cmek-version
title: INC P1 · Un script de limpieza desactivó la versión de la clave
summary: 'Nadie puede descargar sus informes: la versión de la clave con la que están cifrados está desactivada. Reactívala (nunca la destruyas), averigua quién y por qué, y avisa a Seguridad.'

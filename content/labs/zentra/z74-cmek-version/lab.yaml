    answer: 'Uf. El script kms-limpieza desactiva versiones «antiguas» y se ha equivocado: la 2 es la primaria. Reactívala ya, no destruyas nada, y paramos el script nosotros. Desactivar una versión deja ilegible todo lo cifrado con ella.'
- role: change
  name: Javier Luna (Gestión de cambios)
  persona: Gestor de cambios (CAB).
  fallback: Ningún cambio en producción sin registro. Si hay clientes afectados, lo apruebo como emergencia.

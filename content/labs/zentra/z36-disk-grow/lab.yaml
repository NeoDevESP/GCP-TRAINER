en:
  title: INC P2 · The reconciliation server ran out of disk
  summary: Full disk, but what takes the space are regulatory files that can't be deleted. The fix is to grow the disk online, inside the VM too.
  story: |-
    **Project `{{.project}}`** (*zentra-operaciones-prod*).

    > **INC-31036 · P2** · *"The internal reconciliation portal won't load and tonight's job fails with "No space left on device". Can you free some space? Careful, the close files are required by the regulator."*

    SSH into `conciliacion` through IAP and measure before touching anything (`df -h`, `du`, `find / -size +500M`). In a bank you **don't delete regulatory evidence** to make room: ask Compliance. Growing a Compute Engine disk is done online, in two steps: **in the cloud** (`gcloud compute disks resize`) and **inside the VM** (`growpart` + `resize2fs`), because the file system doesn't grow by itself until you reboot.
  objectives:
  - Measure what fills the disk
  - Confirm what can be deleted
  - Grow the disk in the cloud and inside the VM
  - Bring the portal back and document
  hints:
  - '`gcloud compute disks resize conciliacion --zone={{.zone}} --size=50`'
  - 'Inside: `sudo growpart /dev/sda 1` and `sudo resize2fs /dev/sda1`; then restart nginx.'
  ticket:
    summary: The internal reconciliation portal won't load and tonight's job fails with "No space left on device". Can you free some space? Careful, the close files are required by the regulator.
  text:
    Operaciones · Conciliación: Operations · Reconciliation
    Irene Soler (Cumplimiento): Irene Soler (Compliance)
    Cumplimiento normativo.: Regulatory compliance.
    Los ficheros de cierre se guardan 10 años. No se borran ni se mueven sin un procedimiento aprobado.: Close files are kept for 10 years. They aren't deleted or moved without an approved procedure.
    'No. Los cierre-*.zip son evidencia regulatoria: ni se borran ni se tocan. Si falta sitio, ampliad el disco.': 'No. The cierre-*.zip files are regulatory evidence: not deleted, not touched. If space is short, grow the disk.'
    Javier Luna (Gestión de cambios): Javier Luna (Change management)
    Gestor de cambios.: Change manager.
    ? Cualquier cambio en producción necesita un registro de cambio. Si es urgente, dime el riesgo y lo apruebo como cambio de emergencia.
    : Any production change needs a change record. If it's urgent, tell me the risk and I'll approve it as an emergency change.
    Aprobado como cambio de emergencia (CHG-7741). Déjalo anotado en el ticket con el motivo.: Approved as an emergency change (CHG-7741). Note it in the ticket with the reason.
    Portal recuperado: Portal back
    El portal responde: The portal responds
    Disco por debajo del 80 %: Disk under 80%
    Evidencia regulatoria intacta: Regulatory evidence intact
    Cierre de julio conservado: July close kept
    Cierre de agosto conservado: August close kept
    Cierre de septiembre conservado: September close kept
    Medir y preguntar: Measure and ask
    Espacio medido: Space measured
    Preguntado a Cumplimiento: Asked Compliance
    Documentado: Documented
    Nota con la causa y la acción: Note with the cause and the action
    Ticket cerrado: Ticket closed
    Qué ocupa: What takes the space
    '17 GB de cierres regulatorios: no son basura.': '17 GB of regulatory closes: they aren''t junk.'
    'Paso 1: el disco': 'Step 1: the disk'
    Compute Engine amplía el disco en caliente, pero el sistema de archivos aún no lo ve.: Compute Engine grows the disk online, but the file system can't see it yet.
    'Paso 2: dentro de la VM': 'Step 2: inside the VM'
    growpart amplía la partición y resize2fs el sistema de archivos, sin reiniciar.: growpart grows the partition and resize2fs the file system, with no reboot.

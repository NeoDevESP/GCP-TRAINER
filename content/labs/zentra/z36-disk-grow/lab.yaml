story: |-
  **Proyecto `{{.project}}`** (*zentra-operaciones-prod*).

  > **INC-31036 · P2** · *«El portal interno de conciliación no carga y el proceso de esta noche falla con «No space left on device». ¿Podéis liberar espacio? Ojo, los ficheros de cierre los pide el regulador.»*

  Entra en `conciliacion` por IAP y mide antes de tocar nada (`df -h`, `du`, `find / -size +500M`). En un banco **no se borra evidencia regulatoria** para hacer sitio: pregunta a Cumplimiento. Ampliar un disco de Compute Engine se hace en caliente, en dos pasos: **en la nube** (`gcloud compute disks resize`) y **dentro de la VM** (`growpart` + `resize2fs`), porque el sistema de archivos no crece solo hasta que reinicias.
objectives:
- Mide qué ocupa el disco
- Confirma qué se puede borrar
- Amplía el disco en la nube y dentro de la VM
- Recupera el portal y documenta
hints:
- text: '`gcloud compute disks resize conciliacion --zone={{.zone}} --size=50`'
- text: 'Dentro: `sudo growpart /dev/sda 1` y `sudo resize2fs /dev/sda1`; después reinicia nginx.'
solution: |
  ticket
  gcloud compute ssh conciliacion --zone={{.zone}} --tunnel-through-iap --command='df -h'
  gcloud compute ssh conciliacion --zone={{.zone}} --tunnel-through-iap --command='sudo du -sh /srv/*'
  gcloud compute ssh conciliacion --zone={{.zone}} --tunnel-through-iap --command='sudo find / -size +500M'
  ask compliance "¿se pueden borrar o mover los cierre-*.zip para hacer sitio?"
  ask change "¿apruebas ampliar el disco de conciliacion a 50 GB?"
  gcloud compute disks resize conciliacion --zone={{.zone}} --size=50 --quiet
  gcloud compute ssh conciliacion --zone={{.zone}} --tunnel-through-iap --command='sudo growpart /dev/sda 1'
  gcloud compute ssh conciliacion --zone={{.zone}} --tunnel-through-iap --command='sudo resize2fs /dev/sda1'
  gcloud compute ssh conciliacion --zone={{.zone}} --tunnel-through-iap --command='sudo systemctl restart nginx'
  gcloud compute ssh conciliacion --zone={{.zone}} --tunnel-through-iap --command='df -h'
  ticket comment "Causa: los cierres regulatorios de julio a septiembre (17 GB) llenaron el disco de 20 GB. Cumplimiento no permite borrarlos. Ampliado el disco a 50 GB en caliente (resize + growpart + resize2fs) con CHG-7741 y reiniciado nginx. Propuesta: archivar los cierres en un bucket con retención bloqueada."
  ticket update "Resuelto: el portal de conciliación vuelve a funcionar y hay espacio para el proceso de esta noche. No se ha borrado ningún fichero de cierre."
  ticket resolve "Disco de conciliacion ampliado a 50 GB sin borrar evidencia regulatoria; nginx en marcha."
shortcuts:
- name: delete the oldest close
  run: |
    gcloud compute ssh conciliacion --zone={{.zone}} --tunnel-through-iap --command='sudo rm /srv/regulatorio/cierre-2026-07.zip'
    gcloud compute ssh conciliacion --zone={{.zone}} --tunnel-through-iap --command='sudo systemctl restart nginx'
    ticket resolve "Borrado el cierre más antiguo para liberar espacio."

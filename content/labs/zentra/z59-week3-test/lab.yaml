    Anoche rotamos los secretos de proveedores.: Last night we rotated the provider secrets.
    ? El proceso de rotación recreó la política del secreto y se dejó a pagos-sa. Devuélvele secretAccessor solo en proveedor-psp.
    : The rotation job recreated the secret's policy and left pagos-sa out. Give it secretAccessor back only on proveedor-psp.
    Product owner.: Product owner.

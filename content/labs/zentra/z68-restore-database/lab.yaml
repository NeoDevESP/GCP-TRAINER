  all: true
  checks:
  - type: ticket_update
    public: true
    keywords:
    - - 02:00
      - copia
      - backup
    - - auditor
    desc: Qué se recupera y qué no
  - type: ticket_resolved
    desc: Ticket cerrado
tutor:
- match: backups restore
  title: En una temporal
  why: Así la copia no sustituye auditoria en ledger-db.
- match: sql import sql ledger-db
  title: Solo ledger
  why: Se trae una base de datos, no la instancia entera.
- match: --enable-point-in-time-recovery
  title: ''
  why: La próxima vez se podrá volver al minuto anterior al borrado.
en:
  title: INC P1 · A migration dropped the ledger database
  summary: Restore last night's backup to a temporary instance and bring back only the dropped database, without overwriting the audit one. Then enable point-in-time recovery.
  story: |-
    **Project `{{.project}}`** (*zentra-ledger-prod*).

    > **INC-31068 · P1** · *"The 09:00 migration dropped the ledger database from ledger-db. The audit one is still there and can't be touched (the regulator uses it)."*

    Restoring a Cloud SQL backup **over** the instance replaces **all** its databases, `auditoria` included. The safe path: restore to a **temporary instance**, export only `ledger` to Cloud Storage, import it into `ledger-db`, delete the temporary one and enable **point-in-time recovery** (PITR) for next time.
  objectives:
  - Confirm what was dropped and by whom
  - Restore to a temporary instance
  - Bring back only ledger
  - Clean up, enable PITR and communicate
  hints:
  - '`gcloud sql backups restore BACKUP_ID --restore-instance=ledger-restore --backup-instance=ledger-db`'
  - The temporary instance needs write permission on the bucket to export.
  ticket:
    summary: The 09:00 migration dropped the ledger database from ledger-db. The audit one is still there and can't be touched (the regulator uses it).
  text:
    Lucía Navarro (Pagos): Lucía Navarro (Payments)
    Javier Luna (Gestión de cambios): Javier Luna (Change management)
    Gestor de cambios.: Change manager.
    Cambios en producción con registro; si es urgente, emergencia.: Production changes with a record; if urgent, emergency.
    Aprobado (CHG-7830). Déjalo anotado en el ticket.: Approved (CHG-7830). Note it in the ticket.
    Tech lead de Pagos.: Payments tech lead.
    Lo que se haya movido desde las 02:00 lo podemos reconstruir desde el proveedor.: Whatever moved since 02:00 we can rebuild from the provider.
    ? 'Restaurar encima de ledger-db borraría auditoria con la copia de anoche: no. Usad una instancia temporal y traed solo ledger.'
    : 'Restoring over ledger-db would replace auditoria with last night''s copy: no. Use a temporary instance and bring back only ledger.'
    Libro mayor recuperado: Ledger recovered
    ledger vuelve a existir: ledger exists again
    Importada solo ledger: Only ledger imported
    Auditoría intacta: Audit intact
    auditoria sigue ahí: auditoria is still there
    No se restauró encima: Not restored over it
    Prevención y limpieza: Prevention and clean-up
    PITR activado: PITR enabled
    Instancia temporal borrada: Temporary instance deleted
    Comunicación: Communication
    Qué se recupera y qué no: What's recovered and what isn't
    Ticket cerrado: Ticket closed
    En una temporal: Into a temporary one
    Así la copia no sustituye auditoria en ledger-db.: That way the backup doesn't replace auditoria in ledger-db.
    Solo ledger: Only ledger
    Se trae una base de datos, no la instancia entera.: You bring back one database, not the whole instance.
    La próxima vez se podrá volver al minuto anterior al borrado.: Next time you can go back to the minute before the drop.

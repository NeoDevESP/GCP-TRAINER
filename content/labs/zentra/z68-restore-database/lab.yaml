id: zentra-z68-restore-database
title: INC P1 · Una migración borró la base de datos del libro mayor
summary: Restaurar la copia de anoche en una instancia temporal y traer solo la base de datos borrada, sin pisar la de auditoría. Después, activar la recuperación a un punto en el tiempo.
track: zentra
day: 68
level: advanced
branch: databases
type: incident
mode: production
skills:
- databases.cloudsql
- databases.ha
- observability.incident
wellArchitected:
- reliability
certs:
- ACE
- PCA
difficulty: 4
minutes: 45
baseline:
- zentra-core
setup: |
  gcloud sql instances create ledger-db --database-version=POSTGRES_15 --tier=db-custom-2-7680 --region={{.region}} --no-assign-ip --network=zentra-vpc --backup-start-time=02:00
  gcloud sql databases create ledger --instance=ledger-db
  gcloud sql databases create auditoria --instance=ledger-db
  gcloud sql backups create --instance=ledger-db
  gcloud storage buckets create gs://zentra-volcados-{{.project}} --location=EU --uniform-bucket-level-access --public-access-prevention
  gcloud iam service-accounts create migracion-sa --display-name="migraciones de esquema"

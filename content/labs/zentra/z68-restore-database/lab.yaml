  run: |
    gcloud sql databases delete ledger --instance=ledger-db --quiet
ticket:
  id: INC-31068
  kind: INC
  priority: P1
  sla: 30m
  reporter: Lucía Navarro (Pagos)
  summary: La migración de las 09:00 ha borrado la base de datos ledger de ledger-db. La de auditoría sigue ahí y no se puede tocar (la usa el regulador).
actors:
- role: change
  name: Javier Luna (Gestión de cambios)
  persona: Gestor de cambios.
  fallback: Cambios en producción con registro; si es urgente, emergencia.
  facts:
  - keywords:
    - - cambio
      - change
      - réplica
      - replica
      - tier
      - nat
      - puerto
      - port
      - restaur
      - restore
      - emergencia
      - emergency
      - canary
      - canario
    answer: Aprobado (CHG-7830). Déjalo anotado en el ticket.
- role: payments
  name: Lucía Navarro (Pagos)
  persona: Tech lead de Pagos.
  fallback: Lo que se haya movido desde las 02:00 lo podemos reconstruir desde el proveedor.
  facts:
  - keywords:
    - - copia
      - backup
      - restaur
      - restore
      - auditoria
      - sobrescrib
      - overwrite
    answer: 'Restaurar encima de ledger-db borraría auditoria con la copia de anoche: no. Usad una instancia temporal y traed solo ledger.'
story: |-
  **Proyecto `{{.project}}`** (*zentra-ledger-prod*).

  > **INC-31068 · P1** · *«La migración de las 09:00 ha borrado la base de datos ledger de ledger-db. La de auditoría sigue ahí y no se puede tocar (la usa el regulador).»*

  Restaurar una copia de Cloud SQL **encima** de la instancia sustituye **todas** sus bases de datos, también `auditoria`. El camino seguro: restaurar en una **instancia temporal**, exportar solo `ledger` a Cloud Storage, importarla en `ledger-db`, borrar la temporal y activar la **recuperación a un punto en el tiempo** (PITR) para la próxima vez.
objectives:
- Confirma qué se borró y quién
- Restaura en una instancia temporal
- Trae solo ledger
- Limpia, activa PITR y comunica
hints:
- text: '`gcloud sql backups restore BACKUP_ID --restore-instance=ledger-restore --backup-instance=ledger-db`'
- text: La instancia temporal necesita permiso de escritura en el bucket para exportar.
solution: |
  ticket
  gcloud logging read 'protoPayload.methodName:databases.delete' --limit=3
  gcloud sql databases list --instance=ledger-db
  gcloud sql backups list --instance=ledger-db
  ask payments "¿restauramos encima de ledger-db o en una instancia temporal?"
  ask change "¿apruebas la restauración como cambio de emergencia?"
  ticket update "Restaurando la base de datos del libro mayor desde la copia de las 02:00 en una instancia temporal; auditoría no se toca. Próxima actualización en 30 minutos."
  gcloud sql instances create ledger-restore --database-version=POSTGRES_15 --tier=db-custom-2-7680 --region={{.region}} --no-assign-ip --network=zentra-vpc
  gcloud sql backups restore $(gcloud sql backups list --instance=ledger-db --format='value(id)' --limit=1) --restore-instance=ledger-restore --backup-instance=ledger-db --quiet
  gcloud storage buckets add-iam-policy-binding gs://zentra-volcados-{{.project}} --member=serviceAccount:$(gcloud sql instances describe ledger-restore --format='value(serviceAccountEmailAddress)') --role=roles/storage.objectAdmin
  gcloud sql export sql ledger-restore gs://zentra-volcados-{{.project}}/ledger.sql --database=ledger
  gcloud sql databases create ledger --instance=ledger-db
  gcloud sql import sql ledger-db gs://zentra-volcados-{{.project}}/ledger.sql --database=ledger --quiet
  gcloud sql databases list --instance=ledger-db
  gcloud sql instances patch ledger-db --enable-point-in-time-recovery
  gcloud sql instances delete ledger-restore --quiet
  ticket comment "Causa: migracion-sa borró la base de datos ledger a las 09:00. Restaurada la copia de las 02:00 en ledger-restore, exportada solo ledger e importada en ledger-db; auditoria intacta. PITR activado y temporal borrada (CHG-7830). Los movimientos de 02:00 a 09:00 se reconstruyen desde el proveedor."
  ticket update "Resuelto: el libro mayor está recuperado con los datos de las 02:00 y Pagos reconstruye los movimientos posteriores desde el proveedor. La base de datos de auditoría no se ha tocado."
  ticket resolve "Restaurada ledger vía instancia temporal sin tocar auditoria; PITR activado."
shortcuts:
- name: restore over the instance
  run: |
    gcloud sql backups restore $(gcloud sql backups list --instance=ledger-db --format='value(id)' --limit=1) --restore-instance=ledger-db --quiet
    ticket resolve "Restaurada la copia de anoche sobre ledger-db."

- name: Datos sin internet
  validator: security
  points: 30
  critical: true
  checks:
  - type: egress
    from: vm:extractor-regulatorio
    expect: false
    desc: La subred datos sigue sin salida a internet
- name: Diagnóstico
  validator: diagnosis
  points: 15
  checks:
  - type: command
    regex: subnets describe|logging read
    min: 2
    desc: Subred y auditoría revisadas
- name: Documentado
  validator: evidence
  points: 20
  all: true
  checks:
  - type: ticket_update
    public: false
    keywords:
    - - private google access
      - pga
      - acceso privado
    - - terraform
      - subred
      - subnet
    desc: Nota con la causa
  - type: ticket_resolved
    desc: Ticket cerrado
tutor:
- match: subnets describe datos
  title: La subred
  why: 'privateIpGoogleAccess: false. Sin NAT ni IP pública, no hay camino a storage.googleapis.com.'
- match: setPrivateIpGoogleAccess
  title: Quién lo cambió
  why: La auditoría muestra la cuenta del Terraform de red.
- match: enable-private-ip-google-access
  title: ''
  why: Acceso a las APIs de Google por la red interna de Google, sin internet.
en:
  title: INC P2 · The regulatory extractor can't upload files to Cloud Storage
  summary: The data subnet has no internet egress on purpose; it reaches Google through Private Google Access, and someone turned it off. Fix it without opening the internet.
  story: |-
    **Project `{{.project}}`** (*zentra-riesgos-prod*).

    > **INC-31037 · P2** · *"extractor-regulatorio can't upload the daily file to the bucket: "dial tcp storage.googleapis.com:443: i/o timeout". It worked yesterday. It must be delivered before 10:00."*

    The VM lives in the **`datos`** subnet, which by rule **has no internet egress** (Cloud NAT only covers `apps` and `gke`). To talk to Google APIs (Cloud Storage, BigQuery…) without internet there is **Private Google Access**, enabled per subnet. Check the subnet, find who changed it in the audit log and fix it **without** giving the data internet egress.
  objectives:
  - Check the VM's path to Google APIs
  - Find the change in the audit log
  - Turn Private Google Access back on
  - Check datos still has no internet
  hints:
  - '`gcloud compute networks subnets describe datos --region={{.region}} --format=''value(privateIpGoogleAccess)''`'
  - '`gcloud compute networks subnets update datos --region={{.region}} --enable-private-ip-google-access`'
  ticket:
    summary: 'extractor-regulatorio can''t upload the daily file to the bucket: "dial tcp storage.googleapis.com:443: i/o timeout". It worked yesterday. It must be delivered before 10:00.'
  text:
    Riesgos · Reporting regulatorio: Risk · Regulatory reporting
    Tomás Vidal (Red): Tomás Vidal (Network)
    Arquitecto de red.: Network architect.
    'La subred datos no sale a internet por diseño: ni NAT ni IP pública.': 'The datos subnet has no internet egress by design: no NAT, no public IP.'
    ? Ayer aplicamos un Terraform de la red y puede que la subred datos perdiera el Private Google Access. Vuelve a activarlo; nada de NAT ni IP pública en datos.
    : Yesterday we applied a network Terraform and the datos subnet may have lost Private Google Access. Turn it back on; no NAT or public IP in datos.
    Nadia Kowalski (Seguridad cloud): Nadia Kowalski (Cloud security)
    Ingeniera de seguridad cloud.: Cloud security engineer.
    'Las reglas seg-* son nuestras: no se borran. Si algo bloquea de más, dímelo y lo vemos.': 'The seg-* rules are ours: they don''t get deleted. If something blocks too much, tell me and we''ll look at it.'
    ? ¡Uy! El script de endurecimiento le puso prioridad 900. Esa regla es la red de seguridad y debe ir en 65000, por debajo de las allow. Devuélvela a 65000, no la borres.
    : Oops! The hardening script set it to priority 900. That rule is the safety net and must be at 65000, below the allow rules. Put it back to 65000, don't delete it.
    Fichero entregado: File delivered
    El extractor sube a Cloud Storage: The extractor uploads to Cloud Storage
    Llega a las APIs de Google: Reaches Google APIs
    Datos sin internet: Data without internet
    La subred datos sigue sin salida a internet: The datos subnet still has no internet egress
    Diagnóstico: Diagnosis
    Subred y auditoría revisadas: Subnet and audit checked
    Documentado: Documented
    Nota con la causa: Note with the cause
    Ticket cerrado: Ticket closed
    La subred: The subnet
    'privateIpGoogleAccess: false. Sin NAT ni IP pública, no hay camino a storage.googleapis.com.': 'privateIpGoogleAccess: false. With no NAT or public IP, there''s no path to storage.googleapis.com.'
    Quién lo cambió: Who changed it
    La auditoría muestra la cuenta del Terraform de red.: The audit log shows the network Terraform account.
    Acceso a las APIs de Google por la red interna de Google, sin internet.: Access to Google APIs over Google's internal network, without internet.

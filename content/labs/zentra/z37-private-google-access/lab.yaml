id: zentra-z37-private-google-access
title: INC P2 · El extractor regulatorio no sube los ficheros a Cloud Storage
summary: La subred de datos no tiene salida a internet a propósito; llega a Google por Private Google Access, y alguien lo desactivó. Se arregla sin abrir internet.
track: zentra
day: 37
level: advanced
branch: networking
type: incident
mode: production
skills:
- networking.vpc
- networking.nat
- observability.logging
wellArchitected:
- security
- reliability
certs:
- ACE
- PCA
difficulty: 3
minutes: 30
baseline:
- zentra-core
setup: |
  gcloud compute routers nats update zentra-nat --router=zentra-router --region={{.region}} --nat-custom-subnet-ip-ranges=apps,gke
  gcloud iam service-accounts create extractor-sa --display-name="extractor regulatorio"
  gcloud storage buckets create gs://zentra-regulatorio-{{.project}} --location=EU --uniform-bucket-level-access
  gcloud storage buckets add-iam-policy-binding gs://zentra-regulatorio-{{.project}} --member=serviceAccount:extractor-sa@{{.project}}.iam.gserviceaccount.com --role=roles/storage.objectCreator
  gcloud compute instances create extractor-regulatorio --zone={{.zone}} --machine-type=e2-small --subnet=datos --no-address --tags=extractor --service-account=extractor-sa@{{.project}}.iam.gserviceaccount.com --scopes=cloud-platform --metadata=sim-preinstalled=docker-images,startup-script='docker run -d -p 8080:8080 -e BUCKET=zentra-regulatorio-{{.project}} europe-docker.pkg.dev/gcplab-public/apps/uploader:1.0'
  gcloud compute instances create ops-consola --zone={{.zone}} --machine-type=e2-small --subnet=apps --no-address --tags=ops
  gcloud compute firewall-rules create allow-ops-to-extractor --network=zentra-vpc --allow=tcp:8080 --source-tags=ops --target-tags=extractor
faults:
- type: subnet_pga_off
  subnet: datos
  actor: terraform-red@{{.project}}.iam.gserviceaccount.com
ticket:
  id: INC-31037
  kind: INC
  priority: P2
  sla: 1h
  reporter: Riesgos · Reporting regulatorio
  summary: 'El extractor-regulatorio no consigue subir el fichero diario al bucket: «dial tcp storage.googleapis.com:443: i/o timeout». Ayer funcionaba. Hay que entregarlo antes de las 10:00.'
actors:
- role: network
  name: Tomás Vidal (Red)
  persona: Arquitecto de red.
  fallback: 'La subred datos no sale a internet por diseño: ni NAT ni IP pública.'
  facts:
  - keywords:
    - - private google access
      - acceso privado
      - pga
      - terraform
      - subred
      - subnet
      - datos
    answer: Ayer aplicamos un Terraform de la red y puede que la subred datos perdiera el Private Google Access. Vuelve a activarlo; nada de NAT ni IP pública en datos.
- role: security
  name: Nadia Kowalski (Seguridad cloud)
  persona: Ingeniera de seguridad cloud.
  fallback: 'Las reglas seg-* son nuestras: no se borran. Si algo bloquea de más, dímelo y lo vemos.'
  facts:
  - keywords:
    - - prioridad
      - priority
      - seg-deny
      - regla
      - rule
      - '900'
      - '65000'
    answer: ¡Uy! El script de endurecimiento le puso prioridad 900. Esa regla es la red de seguridad y debe ir en 65000, por debajo de las allow. Devuélvela a 65000, no la borres.
story: |-
  **Proyecto `{{.project}}`** (*zentra-riesgos-prod*).

  > **INC-31037 · P2** · *«El extractor-regulatorio no consigue subir el fichero diario al bucket: «dial tcp storage.googleapis.com:443: i/o timeout». Ayer funcionaba. Hay que entregarlo antes de las 10:00.»*

  La VM vive en la subred **`datos`**, que por norma **no sale a internet** (Cloud NAT solo cubre `apps` y `gke`). Para hablar con las APIs de Google (Cloud Storage, BigQuery…) sin internet existe **Private Google Access**, que se activa por subred. Revisa la subred, busca en la auditoría quién la cambió y arréglalo **sin** dar salida a internet a los datos.
objectives:
- Comprueba la ruta de la VM a las APIs de Google
- Encuentra el cambio en la auditoría
- Vuelve a activar Private Google Access
- Valida que datos sigue sin internet
hints:
- text: '`gcloud compute networks subnets describe datos --region={{.region}} --format=''value(privateIpGoogleAccess)''`'
- text: '`gcloud compute networks subnets update datos --region={{.region}} --enable-private-ip-google-access`'
solution: |
  ticket
  gcloud compute networks subnets describe datos --region={{.region}}
  gcloud compute routers nats describe zentra-nat --router=zentra-router --region={{.region}}
  gcloud logging read 'protoPayload.methodName:"setPrivateIpGoogleAccess"' --limit=3
  ask network "¿qué cambió ayer en la subred datos?"
  gcloud compute networks subnets update datos --region={{.region}} --enable-private-ip-google-access
  gcloud compute networks subnets describe datos --region={{.region}} --format='value(privateIpGoogleAccess)'
  ticket comment "Causa: el Terraform de red de ayer (terraform-red) desactivó Private Google Access en la subred datos; sin NAT ni IP pública, la VM no llegaba a storage.googleapis.com. Reactivado PGA; la subred sigue sin salida a internet. Pedido a Red que fije privateIpGoogleAccess=true en su Terraform."
  ticket update "Resuelto: el extractor vuelve a subir el fichero diario al bucket. Un cambio de red de ayer le quitó el acceso privado a Google; está restaurado sin abrir internet."
  ticket resolve "Reactivado Private Google Access en la subred datos; el extractor sube a Cloud Storage y datos sigue sin internet."
shortcuts:
- name: give datos internet through NAT
  run: |
    gcloud compute routers nats update zentra-nat --router=zentra-router --region={{.region}} --nat-all-subnet-ip-ranges
    ticket resolve "Añadida la subred datos al NAT para que salga a Google."

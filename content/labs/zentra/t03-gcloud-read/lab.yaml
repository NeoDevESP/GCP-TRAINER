setup: |
  gcloud compute instances create informes-1 --zone={{.zone}} --machine-type=e2-small --subnet=apps --no-address --labels=equipo=riesgos
  gcloud compute instances create batch-noche --zone={{.zone}} --machine-type=e2-standard-2 --subnet=datos --no-address --labels=equipo=pagos
  gcloud compute instances create pruebas-ana --zone={{.region}}-c --machine-type=e2-micro --subnet=apps --no-address --labels=equipo=sre
ticket:
  id: FOR-0003
  kind: REQ
  priority: P4
  sla: 5d
  reporter: Formación Zentra
  summary: 'Tercer taller: aprende a consultar con gcloud sin cambiar nada. Al final, apunta en vm.txt qué VM está en la subred «datos».'
actors:
- role: manager
  name: Marta Ibáñez (responsable de Plataforma)
  persona: Tu responsable en Zentra.
  fallback: 'Sin prisa: esta semana es para aprender lo básico. Pregunta todo lo que necesites.'
  facts: []
story: |-
  > 🧰 **Taller desde cero.** No necesitas saber nada antes. Lee cada bloque, copia el comando en el terminal de abajo y mira qué sale. Si te pierdes, abre la pestaña **Profesor**: te acompaña paso a paso.

  **gcloud** es la herramienta de línea de comandos de Google Cloud. Casi todos los comandos siguen el patrón `gcloud PRODUCTO RECURSO ACCIÓN`, por ejemplo `gcloud compute instances list`.

  **Regla de oro en soporte: primero leer.** Los verbos `list` y `describe` **solo leen**; `create`, `update` y `delete` **cambian** cosas. En un banco nunca se cambia nada sin entender antes qué hay.

  **1 · Listar.** `gcloud compute instances list` → todas las máquinas virtuales (VMs) del proyecto.

  **2 · Elegir columnas con `--format`.** `gcloud compute instances list --format="table(name,zone,machineType,labels)"`.

  **3 · Filtrar con `--filter`.** `gcloud compute instances list --filter="labels.equipo=pagos"` → solo las del equipo de Pagos.

  **4 · El detalle con `describe`.** `gcloud compute instances describe batch-noche --zone={{.zone}}` → todo sobre una VM, incluida su subred (en `networkInterfaces`).

  **5 · Ayuda.** Si dudas, añade `--help` a cualquier comando.

  **Tarea:** escribe en `vm.txt` el nombre de la VM que está en la subred `datos` (por ejemplo `echo "nombre" > vm.txt`) y cierra.
objectives:
- Lista las VMs
- Usa --format y --filter
- Mira el detalle con describe
- Anota la VM de «datos» y cierra
hints:
- text: La subred aparece en `networkInterfaces[0].subnetwork` del describe.
quiz:

solution: |
  ticket
  gcloud compute instances list
  gcloud compute instances list --format="table(name,zone,machineType,labels)"
  gcloud compute instances list --filter="labels.equipo=pagos"
  gcloud compute instances describe batch-noche --zone={{.zone}}
  echo "batch-noche" > vm.txt
  ticket resolve "Taller 3 hecho: list y describe solo leen; con --format elijo columnas y con --filter filtro. La VM de la subred datos es batch-noche."

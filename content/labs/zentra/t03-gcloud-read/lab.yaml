en:
  title: 'Workshop 3 · gcloud: read before you touch'
  summary: 'Support''s golden rule: look without changing anything. list, describe, --format and --filter.'
  story: |-
    > 🧰 **Workshop from zero.** You don't need to know anything beforehand. Read each block, copy the command into the terminal below and see what comes out. If you get lost, open the **Tutor** tab: it walks you through step by step.

    **gcloud** is Google Cloud's command-line tool. Nearly every command follows `gcloud PRODUCT RESOURCE ACTION`, e.g. `gcloud compute instances list`.

    **Support's golden rule: read first.** The verbs `list` and `describe` **only read**; `create`, `update` and `delete` **change** things. In a bank you never change anything before understanding what's there.

    **1 · List.** `gcloud compute instances list` → every virtual machine (VM) in the project.

    **2 · Choose columns with `--format`.** `gcloud compute instances list --format="table(name,zone,machineType,labels)"`.

    **3 · Filter with `--filter`.** `gcloud compute instances list --filter="labels.equipo=pagos"` → only the Payments team's.

    **4 · Detail with `describe`.** `gcloud compute instances describe batch-noche --zone={{.zone}}` → everything about a VM, including its subnet (in `networkInterfaces`).

    **5 · Help.** If in doubt, add `--help` to any command.

    **Task:** write in `vm.txt` the name of the VM in the `datos` subnet (e.g. `echo "name" > vm.txt`) and close.
  objectives:
  - List the VMs
  - Use --format and --filter
  - See the detail with describe
  - Note the "datos" VM and close
  hints:
  - The subnet shows in the describe's `networkInterfaces[0].subnetwork`.
  ticket:
    summary: 'Third workshop: learn to query with gcloud without changing anything. At the end, write in vm.txt which VM is in the "datos" subnet.'

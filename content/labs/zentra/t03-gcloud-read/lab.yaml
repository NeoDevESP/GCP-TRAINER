id: zentra-t03-gcloud-read
title: 'Taller 3 · gcloud: leer antes de tocar'
summary: 'La regla de oro del soporte: mirar sin cambiar nada. list, describe, --format y --filter.'
track: zentra
day: 3
level: basic
branch: foundations

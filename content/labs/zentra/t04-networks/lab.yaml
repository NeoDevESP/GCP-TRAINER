en:
  title: 'Workshop 4 · Networking from zero: IPs, ranges and ports'
  summary: What a private IP is, how to read 10.40.1.0/24 and what a port is. You'll create your own subnet.
  story: |-
    > 🧰 **Workshop from zero.** You don't need to know anything beforehand. Read each block, copy the command into the terminal below and see what comes out. If you get lost, open the **Tutor** tab: it walks you through step by step.

    **An IP** is a machine's address on a network, like `10.40.1.5`. Those starting with `10.`, `172.16–31.` or `192.168.` are **private**: they only exist inside your network, not on the internet.

    **A range (CIDR)** like `10.40.1.0/24` describes a block of addresses. The number after the slash says how many bits are fixed: **/24 = 256 addresses** (10.40.1.0 to 10.40.1.255), /23 = 512, /22 = 1024. The **smaller** the number, the **bigger** the block.

    **The VPC** is your private network in Google Cloud (at Zentra, `zentra-vpc`). It's global and split into **subnets**, each in one region with its own range. Two subnets **can't overlap**.

    **A port** is a service's "door" inside a machine: **22** SSH, **80** web, **443** secure web (HTTPS), **5432** PostgreSQL. To talk to a service you need IP **and** port.

    **1 · Look at the network.** `gcloud compute networks list` and `gcloud compute networks subnets list --format="table(name,region,ipCidrRange)"`.
    **2 · Ask Network** which range you can use (`ask network "…"`).
    **3 · Create your subnet:** `gcloud compute networks subnets create formacion --network=zentra-vpc --region={{.region}} --range=10.40.50.0/24 --enable-private-ip-google-access`.
    **4 · Check** with `subnets list` and close.
  objectives:
  - Look at the VPC and its subnets
  - Pick a non-overlapping range
  - Create the formacion subnet
  - Answer and close
  hints:
  - '`gcloud compute networks subnets create formacion --network=zentra-vpc --region={{.region}} --range=10.40.50.0/24 --enable-private-ip-google-access`'
  ticket:

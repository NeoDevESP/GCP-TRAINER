story: |-
  > 🧰 **Taller desde cero.** No necesitas saber nada antes. Lee cada bloque, copia el comando en el terminal de abajo y mira qué sale. Si te pierdes, abre la pestaña **Profesor**: te acompaña paso a paso.

  **Una IP** es la dirección de una máquina en una red, como `10.40.1.5`. Las que empiezan por `10.`, `172.16–31.` o `192.168.` son **privadas**: solo existen dentro de tu red, no en internet.

  **Un rango (CIDR)** como `10.40.1.0/24` describe un bloque de direcciones. El número tras la barra dice cuántos bits son fijos: **/24 = 256 direcciones** (de 10.40.1.0 a 10.40.1.255), /23 = 512, /22 = 1024. Cuanto **más pequeño** el número, **más grande** el bloque.

  **La VPC** es tu red privada en Google Cloud (en Zentra, `zentra-vpc`). Es mundial, y se divide en **subredes**, cada una en una región y con su rango. Dos subredes **no pueden solaparse**.

  **Un puerto** es la «puerta» de un servicio dentro de una máquina: **22** SSH, **80** web, **443** web segura (HTTPS), **5432** PostgreSQL. Para hablar con un servicio necesitas IP **y** puerto.

  **1 · Mira la red.** `gcloud compute networks list` y `gcloud compute networks subnets list --format="table(name,region,ipCidrRange)"`.
  **2 · Pregunta a Red** qué rango puedes usar (`ask network "…"`).
  **3 · Crea tu subred:** `gcloud compute networks subnets create formacion --network=zentra-vpc --region={{.region}} --range=10.40.50.0/24 --enable-private-ip-google-access`.
  **4 · Comprueba** con `subnets list` y cierra.

story: |-
  > 🧰 **Taller desde cero.** No necesitas saber nada antes. Lee cada bloque, copia el comando en el terminal de abajo y mira qué sale. Si te pierdes, abre la pestaña **Profesor**: te acompaña paso a paso.

  **Cloud Storage** guarda ficheros de cualquier tamaño. Los ficheros se llaman **objetos** y viven en **buckets** (cubos). El nombre de un bucket es **único en todo el mundo**, por eso en Zentra lleva el ID del proyecto.

  **Los estándares de Zentra para un bucket:**
  - **Ubicación en la UE** (`--location=EU`): los datos de clientes no salen de Europa.
  - **Acceso uniforme** (`--uniform-bucket-level-access`): permisos solo con IAM, no fichero a fichero.
  - **Prevención de acceso público** (`--public-access-prevention`): nadie puede hacerlo público por error.
  - **Etiquetas** `equipo` y `uso`: de quién es y para qué (sirve para la factura).

  **1 · Crea el bucket:** `gcloud storage buckets create gs://zentra-formacion-{{.project}} --location=EU --uniform-bucket-level-access --public-access-prevention`.
  **2 · Etiquétalo:** `gcloud storage buckets update gs://zentra-formacion-{{.project}} --update-labels=equipo=soporte,uso=formacion`.
  **3 · Sube un fichero:** crea uno con `echo "hola" > saludo.txt` y súbelo con `gcloud storage cp saludo.txt gs://zentra-formacion-{{.project}}/saludo.txt`.
  **4 · Comprueba:** `gcloud storage ls gs://zentra-formacion-{{.project}}` y `gcloud storage buckets describe gs://zentra-formacion-{{.project}}`.
objectives:
- Crea el bucket con los estándares
- Etiquétalo
- Sube un fichero
- Comprueba y cierra

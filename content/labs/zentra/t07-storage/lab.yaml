en:
  title: 'Workshop 7 · Storage from zero: buckets and objects'
  summary: Cloud Storage keeps files (objects) in containers (buckets). Create one to the bank's standards and upload a file.
  story: |-
    > 🧰 **Workshop from zero.** You don't need to know anything beforehand. Read each block, copy the command into the terminal below and see what comes out. If you get lost, open the **Tutor** tab: it walks you through step by step.

    **Cloud Storage** stores files of any size. Files are called **objects** and live in **buckets**. A bucket name is **unique worldwide**, so at Zentra it includes the project ID.

    **Zentra's standards for a bucket:**
    - **EU location** (`--location=EU`): customer data doesn't leave Europe.
    - **Uniform access** (`--uniform-bucket-level-access`): permissions only through IAM, not file by file.
    - **Public access prevention** (`--public-access-prevention`): nobody can make it public by mistake.
    - **Labels** `equipo` and `uso`: whose it is and what for (used for billing).

    **1 · Create the bucket:** `gcloud storage buckets create gs://zentra-formacion-{{.project}} --location=EU --uniform-bucket-level-access --public-access-prevention`.
    **2 · Label it:** `gcloud storage buckets update gs://zentra-formacion-{{.project}} --update-labels=equipo=soporte,uso=formacion`.
    **3 · Upload a file:** create one with `echo "hola" > saludo.txt` and upload it with `gcloud storage cp saludo.txt gs://zentra-formacion-{{.project}}/saludo.txt`.
    **4 · Check:** `gcloud storage ls gs://zentra-formacion-{{.project}}` and `gcloud storage buckets describe gs://zentra-formacion-{{.project}}`.
  objectives:
  - Create the bucket to standard
  - Label it
  - Upload a file
  - Check and close
  hints:
  - '`gcloud storage cp saludo.txt gs://zentra-formacion-{{.project}}/saludo.txt`'
  ticket:
    summary: 'Seventh workshop: create gs://zentra-formacion-{{.project}} to Zentra''s standards and upload your first file.'
  text:

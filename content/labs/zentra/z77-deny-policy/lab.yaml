en:
  title: REQ · "I have Storage Admin and it won't let me delete"
  summary: 'An SRE with every role can''t delete some files from the evidence bucket. No role is missing: a deny policy prevents it on purpose. Explain it, don''t touch it and route the deletion through the break-glass procedure.'
  story: |-
    **Project `{{.project}}`** (*zentra-auditoria-prod*).

    > **REQ-31077 · P4** · Diego: *"It won't let me delete some test files even though I have Storage Admin. Am I missing a role? Give me whatever is needed."*

    IAM has **two kinds of policies**: **allow** policies (the usual roles) and **deny** policies. Deny **is evaluated first** and always wins: if a policy denies `objects.delete`, it doesn't matter that you have Storage Admin or Owner. Banks use them for what must **never** happen (deleting audit evidence, disabling logs), with one controlled exception: a **break-glass** group.

    1. Check what happens: `gcloud policy-intelligence troubleshoot-policy iam //storage.googleapis.com/projects/_/buckets/zentra-evidencias-{{.project}} --principal-email=diego.ferrer@zentra.dev --permission=storage.objects.delete`.
    2. Look at the deny policies: `gcloud iam policies list --attachment-point=cloudresourcemanager.googleapis.com/projects/{{.project}} --kind=denypolicies` and `get`.
    3. Talk to Security, the policy owner.
    4. **Don't** delete or change the policy, **don't** add anyone to `gcp-breakglass` and **don't** grant more roles: they wouldn't help.
    5. Escalate to Security with the exact path so they do it via break-glass, and explain to Diego why.
  objectives:
  - Check why it's denied
  - Find the deny policy
  - Without touching the policy
  - Escalate to break-glass and explain
  hints:
  - '`gcloud iam policies get proteger-evidencias --attachment-point=cloudresourcemanager.googleapis.com/projects/{{.project}} --kind=denypolicies`'
  ticket:
    summary: I uploaded some test files to gs://zentra-evidencias by mistake (pruebas/ folder) and it won't let me delete them even though I have Storage Admin on the bucket. Am I missing a role? Give me whatever is needed.
  text:
    Diego Ferrer (SRE): Diego Ferrer (SRE)
    Nadia Kowalski (Seguridad cloud): Nadia Kowalski (Cloud security)
    Ingeniera de seguridad cloud, dueña de perímetros, claves y políticas de denegación.: Cloud security engineer, owner of perimeters, keys and deny policies.
    'Los controles de seguridad no se quitan: se ajustan con el mínimo alcance. Dime identidad, origen y servicio.': 'Security controls aren''t removed: they''re adjusted with the minimum scope. Tell me identity, source and service.'
    ? 'La política de denegación proteger-evidencias es a propósito: es el bucket de evidencias de auditoría (DORA) y nadie borra nada, ni Owner. Los ficheros de prueba los borro yo por break-glass con el ticket aprobado. No toques la política ni metas a nadie en gcp-breakglass; escálame el ticket con la ruta exacta.'
    : 'The proteger-evidencias deny policy is on purpose: it''s the audit evidence bucket (DORA) and nobody deletes anything, not even Owner. I''ll delete the test files via break-glass with the approved ticket. Don''t touch the policy or add anyone to gcp-breakglass; escalate the ticket to me with the exact path.'
    SRE de guardia.: On-call SRE.
    Solo quiero limpiar lo que subí por error.: I just want to clean up what I uploaded by mistake.
    'Solo uno: gs://zentra-evidencias-{{.project}}/pruebas/prueba1.csv.': 'Just one: gs://zentra-evidencias-{{.project}}/pruebas/prueba1.csv.'
    Una política de denegación y un rol Owner chocan. ¿Qué gana?: A deny policy and an Owner role clash. Which wins?
    La denegación: The deny
    Owner: Owner
    El más reciente: The most recent
    Depende del recurso: Depends on the resource
    La protección sigue intacta: Protection intact
    La política de denegación sigue: The deny policy is still there
    Diego sigue sin poder borrar evidencias: Diego still can't delete evidence
    Sin tocar la política ni el grupo de emergencia: Policy and break-glass group untouched
    Diagnóstico: Diagnosis
    Encontrada la denegación: Deny found
    Seguridad consultada: Security consulted
    Escalado y explicación: Escalation and explanation
    A Seguridad con la ruta para break-glass: To Security with the path for break-glass
    Explica que no es un rol: Explains it isn't a role
    Lo has entendido: You understood it
    Pregunta del caso: Case question
    ¿Por qué no?: Why not?
    'NOT_GRANTED por una política de denegación: ningún rol lo arregla.': 'NOT_GRANTED because of a deny policy: no role fixes it.'
    La política: The policy
    Deniega objects.delete a todos excepto gcp-breakglass.: Denies objects.delete to everyone except gcp-breakglass.
    Break-glass: Break-glass

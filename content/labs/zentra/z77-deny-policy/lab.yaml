id: zentra-z77-deny-policy
title: REQ · «Tengo Storage Admin y no me deja borrar»
summary: 'Un SRE con todos los roles no puede borrar unos ficheros del bucket de evidencias. No le falta ningún rol: una política de denegación lo impide a propósito. Explícalo, no la toques y pasa el borrado por el procedimiento de emergencia.'
track: zentra
day: 87
level: professional
branch: iam
type: incident
mode: production
skills:
- iam.leastprivilege
- iam.roles
- security.audit
wellArchitected:
- security
certs:
- PCSE
- PCNE
difficulty: 3
minutes: 30
baseline:
- zentra-core
setup: |
  gcloud identity groups create gcp-breakglass@zentra.dev --organization=zentra.dev --display-name="Break-glass (Seguridad)" --labels=cloudidentity.googleapis.com/groups.security
  gcloud identity groups memberships add --group-email=gcp-breakglass@zentra.dev --member-email=nadia.kowalski@zentra.dev
  gcloud storage buckets create gs://zentra-evidencias-{{.project}} --location=EU --uniform-bucket-level-access --public-access-prevention
  gcloud storage buckets add-iam-policy-binding gs://zentra-evidencias-{{.project}} --member=group:gcp-sre@zentra.dev --role=roles/storage.admin
  echo "prueba" > prueba1.csv
  gcloud storage cp prueba1.csv gs://zentra-evidencias-{{.project}}/pruebas/prueba1.csv
  cat > deny.json <<'JSON'
  {"displayName":"Proteger evidencias de auditoria","rules":[{"description":"Nadie borra evidencias salvo break-glass","denyRule":{"deniedPrincipals":["principalSet://goog/public:all"],"exceptionPrincipals":["principalSet://goog/group/gcp-breakglass@zentra.dev"],"deniedPermissions":["storage.googleapis.com/objects.delete","storage.googleapis.com/buckets.delete"]}}]}
  JSON
  gcloud iam policies create proteger-evidencias --attachment-point=cloudresourcemanager.googleapis.com/projects/{{.project}} --kind=denypolicies --policy-file=deny.json
ticket:
  id: REQ-31077
  kind: REQ
  priority: P4
  sla: 3d
  reporter: Diego Ferrer (SRE)
  summary: Subí por error unos ficheros de prueba a gs://zentra-evidencias (carpeta pruebas/) y no me deja borrarlos aunque tengo Storage Admin en el bucket. ¿Me falta algún rol? Dame lo que haga falta.
actors:
- role: security
  name: Nadia Kowalski (Seguridad cloud)
  persona: Ingeniera de seguridad cloud, dueña de perímetros, claves y políticas de denegación.
  fallback: 'Los controles de seguridad no se quitan: se ajustan con el mínimo alcance. Dime identidad, origen y servicio.'
  facts:
  - keywords:
    - - deneg
      - deny
      - politica
      - política
      - policy
      - evidencias
      - borrar
      - delete
      - break
      - pruebas
    answer: 'La política de denegación proteger-evidencias es a propósito: es el bucket de evidencias de auditoría (DORA) y nadie borra nada, ni Owner. Los ficheros de prueba los borro yo por break-glass con el ticket aprobado. No toques la política ni metas a nadie en gcp-breakglass; escálame el ticket con la ruta exacta.'
- role: sre
  name: Diego Ferrer (SRE)
  persona: SRE de guardia.
  fallback: Solo quiero limpiar lo que subí por error.
  facts:
  - keywords:
    - - que fichero
      - qué fichero
      - ruta
      - path
      - cuales
      - cuáles
      - which
      - nombre
    answer: 'Solo uno: gs://zentra-evidencias-{{.project}}/pruebas/prueba1.csv.'
story: |-
  **Proyecto `{{.project}}`** (*zentra-auditoria-prod*).

  > **REQ-31077 · P4** · Diego: *«No me deja borrar unos ficheros de prueba aunque tengo Storage Admin. ¿Me falta algún rol? Dame lo que haga falta.»*

  En IAM hay **dos tipos de políticas**: las de **permitir** (los roles de siempre) y las de **denegación** (*deny policies*). La denegación **se evalúa antes** y gana siempre: si una política deniega `objects.delete`, da igual que tengas Storage Admin u Owner. Los bancos las usan para lo que **nunca** debe pasar (borrar evidencias de auditoría, desactivar registros), con una excepción controlada: un grupo de **emergencia** (*break-glass*).

  1. Comprueba qué pasa: `gcloud policy-intelligence troubleshoot-policy iam //storage.googleapis.com/projects/_/buckets/zentra-evidencias-{{.project}} --principal-email=diego.ferrer@zentra.dev --permission=storage.objects.delete`.
  2. Mira las políticas de denegación: `gcloud iam policies list --attachment-point=cloudresourcemanager.googleapis.com/projects/{{.project}} --kind=denypolicies` y `get`.
  3. Habla con Seguridad, dueña de la política.
  4. **No** borres ni cambies la política, **no** metas a nadie en `gcp-breakglass` y **no** des más roles: no servirían.
  5. Escala a Seguridad con la ruta exacta para que lo hagan por break-glass y explica a Diego por qué.
objectives:
- Comprueba por qué se deniega
- Encuentra la política de denegación
- Sin tocar la política
- Escala a break-glass y explica
hints:
- text: '`gcloud iam policies get proteger-evidencias --attachment-point=cloudresourcemanager.googleapis.com/projects/{{.project}} --kind=denypolicies`'
quiz:
- id: q1
  question: Una política de denegación y un rol Owner chocan. ¿Qué gana?
  options:
  - La denegación
  - Owner
  - El más reciente
  - Depende del recurso
  answer:
  - 0
solution: |
  ticket
  gcloud policy-intelligence troubleshoot-policy iam //storage.googleapis.com/projects/_/buckets/zentra-evidencias-{{.project}} --principal-email=diego.ferrer@zentra.dev --permission=storage.objects.delete
  gcloud iam policies list --attachment-point=cloudresourcemanager.googleapis.com/projects/{{.project}} --kind=denypolicies
  gcloud iam policies get proteger-evidencias --attachment-point=cloudresourcemanager.googleapis.com/projects/{{.project}} --kind=denypolicies
  ask sre "¿Qué ficheros exactos quieres borrar?"
  ask security "Diego quiere borrar pruebas/prueba1.csv del bucket de evidencias; la política proteger-evidencias lo deniega. ¿Break-glass?"
  ticket escalate seguridad "Borrado por break-glass: Diego subió por error gs://zentra-evidencias-{{.project}}/pruebas/prueba1.csv (fichero de prueba, no evidencia). La política de denegación proteger-evidencias impide borrar a todos salvo gcp-breakglass. No se ha tocado la política ni el grupo."
  ticket update "Hola Diego: no te falta ningún rol. El bucket de evidencias tiene una política de denegación que impide borrar a cualquiera, incluso con Storage Admin u Owner, para cumplir con auditoría. Ni yo puedo. He pasado el ticket a Seguridad con la ruta exacta para que lo borren por el procedimiento de emergencia (break-glass)."
shortcuts:
- name: delete the deny policy
  run: |
    gcloud iam policies delete proteger-evidencias --attachment-point=cloudresourcemanager.googleapis.com/projects/{{.project}} --kind=denypolicies
    gcloud storage rm gs://zentra-evidencias-{{.project}}/pruebas/prueba1.csv
    ticket resolve "Quitada la política que molestaba y borrados los ficheros."
- name: add him to break-glass
  run: |
    gcloud identity groups memberships add --group-email=gcp-breakglass@zentra.dev --member-email=diego.ferrer@zentra.dev
    ticket resolve "Metido Diego en el grupo de emergencia para que pueda borrar."

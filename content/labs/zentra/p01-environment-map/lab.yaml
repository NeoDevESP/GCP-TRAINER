ticket:
  id: REQ-41190
  kind: REQ
  priority: P4
  sla: 3d
  reporter: Elena Ríos (FinOps)
  summary: 'Para el informe de costes necesito el número de proyecto de PRO de cartera y saber en qué carpeta está. ¿Me lo pasáis?'
story: |-
  En el banco cada aplicación tiene **tres proyectos**, uno por entorno:

  | Entorno | Para qué | ID del proyecto (cartera) |
  |---|---|---|
  | **DEV** (desarrollo) | probar sin miedo | `dev-zentra-cartera` |
  | **AU** (aceptación de usuario) | la prueba final con datos de prueba | `au-zentra-cartera` |
  | **PRO** (producción) | los clientes de verdad | `zentra-cartera` |

  Se llaman casi igual: **el error más caro de este trabajo es hacer en PRO lo que iba para DEV**. Cada proyecto tiene tres identificadores: el **nombre** (lo que ves), el **ID** (`dev-zentra-cartera`, no cambia) y el **número** (`418526730194`, lo usan Google y muchos nombres de recursos, como los buckets o las cuentas de servicio de Google).

  **En la consola**
  1. Lee el ticket (pestaña **Ticket**).
  2. Abre el **selector de proyectos** (arriba, junto al logo): verás todos los proyectos a los que tienes acceso, con su ID y su número. Usa el buscador: escribe `cartera`.
  3. Elige `zentra-cartera`. Fíjate en que el nombre del proyecto cambia en la barra y en Cloud Shell.
  4. En el **Panel** mira la tarjeta «Información del proyecto»: el **número**.
  5. **Menú › IAM y administración › Etiquetas**: `env=pro` y `app=cartera` confirman el entorno.
  6. Responde al ticket con el número de PRO y la carpeta (los proyectos de PRO cuelgan de `zentra-produccion`; DEV y AU de `zentra-previos`) y resuélvelo.

  En Cloud Shell: `gcloud projects list` enseña lo mismo que el selector y `gcloud projects describe zentra-cartera` el detalle.
objectives:
- Abre el selector de proyectos
- Cámbiate al PRO de cartera
- Lee el número y las etiquetas
- Responde con el número de PRO
hints:
- text: 'Selector de proyectos › busca «cartera» › zentra-cartera. El número está en el Panel y en la columna «Número» del selector.'
quiz:
- id: q1
  question: ¿Cómo sabes con seguridad que estás en PRO y no en DEV?
  options:
  - Por el ID del proyecto y la etiqueta env
  - Por el color de la consola
  - Porque PRO tiene más recursos
  - Por el nombre del bucket
  answer:
  - 0
- id: q2
  question: ¿Qué identificador del proyecto usan los nombres como gcs-intercambio-dev-418526730194?
  options:
  - El número del proyecto
  - El ID del proyecto
  - El nombre visible
  - El ID de la organización
  answer:
  - 0
solution: |
  ticket
  gcloud projects list
  gcloud config set project zentra-cartera
  gcloud projects describe zentra-cartera
  ticket update "Hola Elena: el proyecto de PRO de cartera es zentra-cartera, número 903174625518, en la carpeta zentra-produccion (etiquetas app=cartera, env=pro). DEV y AU (dev-zentra-cartera y au-zentra-cartera) están en zentra-previos."
  ticket resolve "Número de proyecto de PRO de cartera y su carpeta comunicados a FinOps."

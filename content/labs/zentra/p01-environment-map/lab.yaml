en:
  title: Tutorial · Your environment map (DEV, AU and PRO)
  summary: 'Before touching anything: each application has three projects that look very much alike. Learn to move with the project picker and to read the ID, number and labels of each.'
  story: |-
    At the bank each application has **three projects**, one per environment:

    | Environment | What for | Project ID (cartera) |
    |---|---|---|
    | **DEV** (development) | testing without fear | `dev-zentra-cartera` |
    | **AU** (user acceptance) | the final test with test data | `au-zentra-cartera` |
    | **PRO** (production) | real customers | `zentra-cartera` |

    Their names are almost the same: **the most expensive mistake in this job is doing in PRO what was meant for DEV**. Each project has three identifiers: the **name** (what you see), the **ID** (`dev-zentra-cartera`, it never changes) and the **number** (`418526730194`, used by Google and by many resource names, like buckets or Google's service accounts).

    **In the console**
    1. Read the ticket (**Ticket** tab).
    2. Open the **project picker** (top, next to the logo): you will see every project you can access, with its ID and number. Use the search box: type `cartera`.
    3. Choose `zentra-cartera`. Notice the project name changes in the bar and in Cloud Shell.
    4. In the **Dashboard** look at the "Project info" card: the **number**.
    5. **Menu › IAM & Admin › Labels**: `env=pro` and `app=cartera` confirm the environment.
    6. Reply on the ticket with the PRO number and the folder (PRO projects hang from `zentra-produccion`; DEV and AU from `zentra-previos`) and resolve it.

    In Cloud Shell: `gcloud projects list` shows the same as the picker and `gcloud projects describe zentra-cartera` the details.
  objectives:
  - Open the project picker
  - Switch to the cartera PRO project
  - Read the number and the labels
  - Reply with the PRO number
  hints:
  - 'Project picker › search "cartera" › zentra-cartera. The number is on the Dashboard and in the "Number" column of the picker.'
  ticket:
    summary: 'For the cost report I need the project number of the cartera PRO project and which folder it is in. Can you send it over?'
  text:
    Elena Ríos (FinOps): Elena Ríos (FinOps)
    ¿Cómo sabes con seguridad que estás en PRO y no en DEV?: How do you know for sure you are in PRO and not in DEV?
    Por el ID del proyecto y la etiqueta env: By the project ID and the env label
    Por el color de la consola: By the colour of the console
    Porque PRO tiene más recursos: Because PRO has more resources
    Por el nombre del bucket: By the bucket name
    ¿Qué identificador del proyecto usan los nombres como gcs-intercambio-dev-418526730194?: Which project identifier do names like gcs-intercambio-dev-418526730194 use?
    El número del proyecto: The project number
    El ID del proyecto: The project ID
    El nombre visible: The display name
    El ID de la organización: The organisation ID
    Te mueves entre entornos: You move between environments
    Has abierto el proyecto de PRO: You opened the PRO project
    El dato correcto: The right data
    Número de PRO y su carpeta: PRO number and its folder
    Ticket resuelto: Ticket resolved
    Lo has entendido: You understood it
    Preguntas del caso: Case questions
    'El selector de proyectos de la consola es lo primero que se mira en cada ticket: DEV, AU y PRO se llaman casi igual.': 'The console project picker is the first thing to check on every ticket: DEV, AU and PRO have almost the same name.'
    Todos tus proyectos: All your projects
    Lo mismo que el selector de proyectos, con el ID y el número de cada uno.: The same as the project picker, with each one's ID and number.
    Cambiar de proyecto: Switch project
    'Es lo que hace el selector de la consola. Desde aquí, todo lo que hagas va a ese proyecto.': 'It is what the console picker does. From here on, everything you do goes to that project.'

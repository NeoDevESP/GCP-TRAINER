story: |-
  **Proyecto `{{.project}}`** (*zentra-datos-prod*).

  > **INC-31073 · P2** · *«La generación de extractos falla al guardar los PDF: Permission denied on Cloud KMS key. ¿Le damos permiso de KMS a la aplicación?»*

  Los datos de clientes del banco se cifran con **claves propias** en Cloud KMS (**CMEK**): el banco controla la clave y puede revocarla. Lo que mucha gente no sabe: con CMEK en un bucket, **quien usa la clave no es tu aplicación**, es el **agente de servicio de Cloud Storage** del proyecto (`service-NÚMERO@gs-project-accounts.iam.gserviceaccount.com`). Si pierde el rol `cryptoKeyEncrypterDecrypter` en la clave, **nadie puede escribir ni leer** en el bucket, tenga los permisos que tenga.

  1. Mira el error: `gcloud logging read 'resource.type=cloud_run_revision severity>=ERROR' --limit=3`.
  2. El bucket y su clave: `gcloud storage buckets describe gs://zentra-extractos-{{.project}}`.
  3. Quién puede usar la clave: `gcloud kms keys get-iam-policy extractos --keyring=zentra-datos --location={{.region}}`, y qué cambió en la auditoría.
  4. El agente de Storage del proyecto: `gcloud storage service-agent`.
  5. Arreglo mínimo, con cambio de emergencia: el rol **solo al agente** y **solo en esa clave**. A la aplicación no le hace falta nada de KMS.
objectives:
- Lee el error
- Mira la clave y quién puede usarla
- Devuelve el rol solo al agente
- Comunica y avisa al dueño
hints:
- text: '`gcloud kms keys add-iam-policy-binding extractos --keyring=zentra-datos --location={{.region}} --member=serviceAccount:$(gcloud storage service-agent) --role=roles/cloudkms.cryptoKeyEncrypterDecrypter`'
solution: |
  ticket
  gcloud logging read 'resource.type=cloud_run_revision severity>=ERROR' --limit=3
  gcloud storage buckets describe gs://zentra-extractos-{{.project}}
  gcloud kms keys get-iam-policy extractos --keyring=zentra-datos --location={{.region}}
  gcloud logging read 'protoPayload.serviceName="cloudkms.googleapis.com"' --limit=5
  gcloud storage service-agent
  ask security "El agente de Storage ha perdido el rol en la clave extractos, ¿se lo devuelvo?"
  ask change "Necesito devolver el rol de cifrado al agente de Storage en la clave extractos como cambio de emergencia"
  gcloud kms keys add-iam-policy-binding extractos --keyring=zentra-datos --location={{.region}} --member=serviceAccount:$(gcloud storage service-agent) --role=roles/cloudkms.cryptoKeyEncrypterDecrypter
  gcloud kms keys get-iam-policy extractos --keyring=zentra-datos --location={{.region}}
  ticket comment "Causa: el Terraform de Seguridad (terraform-seguridad) quitó roles/cloudkms.cryptoKeyEncrypterDecrypter del agente de servicio de Cloud Storage en la clave extractos; el bucket es CMEK y no podía cifrar. Devuelto el rol solo al agente en esa clave (CHG-7795). Seguridad corrige su Terraform."
  ticket update "Hola: los extractos vuelven a guardarse. Fallaba un permiso de la clave de cifrado del almacenamiento, no de la aplicación, así que no hace falta darle permisos nuevos. Ya está corregido y Seguridad lo deja fijado para que no se repita."
  ticket resolve "Rol de cifrado devuelto al agente de Cloud Storage en la clave extractos; aplicación sin permisos de KMS; Seguridad corrige su Terraform."
shortcuts:
- name: KMS admin for the app
  run: |
    gcloud kms keys add-iam-policy-binding extractos --keyring=zentra-datos --location={{.region}} --member=serviceAccount:extractos-sa@{{.project}}.iam.gserviceaccount.com --role=roles/cloudkms.admin
    ticket resolve "Dado KMS a la aplicación para que pueda cifrar."
- name: drop the CMEK
  run: |
    gcloud storage buckets update gs://zentra-extractos-{{.project}} --clear-default-encryption-key
    ticket resolve "Quitado el cifrado con clave propia del bucket para que funcione."

setup: |
  gcloud kms keyrings create zentra-datos --location={{.region}}
  gcloud kms keys create extractos --keyring=zentra-datos --location={{.region}} --purpose=encryption --rotation-period=90d --next-rotation-time=2026-12-01T00:00:00Z
  gcloud kms keys add-iam-policy-binding extractos --keyring=zentra-datos --location={{.region}} --member=serviceAccount:$(gcloud storage service-agent) --role=roles/cloudkms.cryptoKeyEncrypterDecrypter
  gcloud storage buckets create gs://zentra-extractos-{{.project}} --location={{.region}} --uniform-bucket-level-access --public-access-prevention --default-encryption-key=projects/{{.project}}/locations/{{.region}}/keyRings/zentra-datos/cryptoKeys/extractos
  gcloud iam service-accounts create extractos-sa --display-name="extractos-api"
  gcloud storage buckets add-iam-policy-binding gs://zentra-extractos-{{.project}} --member=serviceAccount:extractos-sa@{{.project}}.iam.gserviceaccount.com --role=roles/storage.objectCreator
  gcloud run deploy extractos-api --image=europe-docker.pkg.dev/gcplab-public/apps/uploader:1.0 --region={{.region}} --service-account=extractos-sa@{{.project}}.iam.gserviceaccount.com --set-env-vars=BUCKET=zentra-extractos-{{.project}} --no-allow-unauthenticated
  gcloud run services add-iam-policy-binding extractos-api --region={{.region}} --member=serviceAccount:app-gateway-sa@{{.project}}.iam.gserviceaccount.com --role=roles/run.invoker

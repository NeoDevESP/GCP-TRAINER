id: zentra-z73-cmek-agent
title: 'INC · «Permission denied on Cloud KMS key»: los extractos no se guardan'
summary: El bucket de extractos está cifrado con una clave propia (CMEK). Quien cifra no es la aplicación sino el agente de servicio de Cloud Storage, y alguien le quitó el permiso en la clave.
track: zentra
day: 83
level: professional
branch: security
type: incident
mode: production

en:
  title: 'INC · "Permission denied on Cloud KMS key": statements aren''t saved'
  summary: The statements bucket is encrypted with a customer-managed key (CMEK). What encrypts isn't the application but the Cloud Storage service agent, and someone removed its permission on the key.
  story: |-
    **Project `{{.project}}`** (*zentra-datos-prod*).

    > **INC-31073 · P2** · *"Statement generation fails saving the PDFs: Permission denied on Cloud KMS key. Should we give the application KMS permission?"*

    The bank's customer data is encrypted with **its own keys** in Cloud KMS (**CMEK**): the bank controls the key and can revoke it. What many people don't know: with CMEK on a bucket, **your application isn't what uses the key**, the project's **Cloud Storage service agent** is (`service-NUMBER@gs-project-accounts.iam.gserviceaccount.com`). If it loses the `cryptoKeyEncrypterDecrypter` role on the key, **nobody can write or read** the bucket, whatever permissions they have.

    1. Check the error: `gcloud logging read 'resource.type=cloud_run_revision severity>=ERROR' --limit=3`.
    2. The bucket and its key: `gcloud storage buckets describe gs://zentra-extractos-{{.project}}`.
    3. Who can use the key: `gcloud kms keys get-iam-policy extractos --keyring=zentra-datos --location={{.region}}`, and what changed in the audit log.
    4. The project's Storage agent: `gcloud storage service-agent`.
    5. Minimal fix, with an emergency change: the role **only to the agent** and **only on that key**. The application needs nothing in KMS.
  objectives:
  - Read the error
  - Check the key and who may use it
  - Restore the role to the agent only
  - Communicate and tell the owner
  hints:
  - '`gcloud kms keys add-iam-policy-binding extractos --keyring=zentra-datos --location={{.region}} --member=serviceAccount:$(gcloud storage service-agent) --role=roles/cloudkms.cryptoKeyEncrypterDecrypter`'
  ticket:
    summary: Monthly statement generation has been failing to save PDFs for an hour. The error mentions "Permission denied on Cloud KMS key". Should we give the application KMS permission?
  text:
    Operaciones de clientes: Customer operations
    Nadia Kowalski (Seguridad cloud): Nadia Kowalski (Cloud security)
    Ingeniera de seguridad cloud, dueña de perímetros, claves y políticas de denegación.: Cloud security engineer, owner of perimeters, keys and deny policies.
    'Los controles de seguridad no se quitan: se ajustan con el mínimo alcance. Dime identidad, origen y servicio.': 'Security controls aren''t removed: they''re adjusted with the minimum scope. Tell me identity, source and service.'
    ? 'Ayer cambiamos el Terraform de las claves y se perdió el permiso del agente de Storage en extractos: error nuestro. Devuélveselo solo a ese agente y solo en esa clave; a la aplicación no le des nada de KMS. Lo corregimos en el código hoy.'
    : 'Yesterday we changed the keys'' Terraform and the Storage agent''s permission on extractos was lost: our mistake. Give it back only to that agent and only on that key; don''t give the application anything in KMS. We''ll fix it in the code today.'
    Javier Luna (Gestión de cambios): Javier Luna (Change management)
    Gestor de cambios (CAB).: Change manager (CAB).
    Ningún cambio en producción sin registro. Si hay clientes afectados, lo apruebo como emergencia.: No production change without a record. If customers are affected, I approve it as an emergency.
    Aprobado como cambio de emergencia (CHG-7795). Anótalo en el ticket con lo que cambias y cómo se vuelve atrás.: Approved as an emergency change (CHG-7795). Note it in the ticket with what you change and how to roll back.
    Extractos guardándose: Statements saving
    /upload responde 200: /upload returns 200
    CMEK intacta y mínimo privilegio: CMEK intact, least privilege
    El bucket sigue cifrado con la clave del banco: The bucket is still encrypted with the bank's key
    Ningún permiso de KMS a la aplicación: No KMS permission for the application
    Diagnóstico: Diagnosis
    Clave, agente o auditoría revisados: Key, agent or audit log checked
    Cambio de emergencia: Emergency change
    Comunicación: Communication
    'Nota interna: agente y Terraform': 'Internal note: agent and Terraform'
    Respuesta clara al solicitante: Clear reply to the requester
    El error: The error
    '«Permission denied on Cloud KMS key… Cloud Storage service account»: el que falla es el agente de Storage.': '"Permission denied on Cloud KMS key… Cloud Storage service account": the failing one is the Storage agent.'
    La clave: The key
    'Nadie tiene el rol de cifrado: lo quitó terraform-seguridad (auditoría).': 'Nobody has the encryption role: terraform-seguridad removed it (audit log).'
    El arreglo: The fix
    Solo el agente, solo esta clave. La aplicación no toca KMS.: Only the agent, only this key. The application doesn't touch KMS.

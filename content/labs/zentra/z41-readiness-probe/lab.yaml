tutor:
- match: describe pod
  title: Los eventos
  why: '«Readiness probe failed … port 8081»: la app escucha en el 8080.'
- match: rollout undo
  title: ''
  why: 'Vuelve a la plantilla anterior: sonda en el 8080 y pods Ready.'
en:
  title: 'INC P2 · Push notifications down: pods "Running" but 0/1 Ready'
  summary: The new release changed the readiness probe port and no pod becomes Ready, so the Service has nowhere to send traffic. Roll back to the previous version.
  story: |-
    **Project `{{.project}}`** (*zentra-apps-prod*).

    > **INC-31041 · P2** · *"Since the 11:00 deployment, payment push notifications aren't arriving. kubectl says the pods are Running, but the service doesn't respond."*

    In Kubernetes, **Running** only means the container started. A Service only sends traffic to **Ready** pods, and Ready is decided by the **readiness probe**. Look at the READY column, the pod events (`kubectl describe pod`) and the deployment history. If the latest release is the culprit, the fast and safe move is **rolling back**.
  objectives:
  - Check READY and the pod events
  - Link the failure to the deployment
  - Roll back to the previous version
  - Validate and document
  hints:
  - '`kubectl get pods` and `kubectl describe pod -l app=notificaciones`'
  - '`kubectl rollout undo deployment/notificaciones`'
  ticket:
    summary: Since the 11:00 deployment, payment push notifications aren't arriving. kubectl says the pods are Running, but the service doesn't respond.
  text:
    Carla Méndez (producto): Carla Méndez (product)
    Equipo de Notificaciones: Notifications team
    Mantienen el servicio de notificaciones.: They maintain the notifications service.
    La aplicación escucha en el 8080, como siempre.: The app listens on 8080, as always.
    ? 'En el despliegue de las 11:00 tocamos la sonda: pensábamos mover la salud al 8081, pero no llegamos a cambiar la app. Volved a la versión anterior.'
    : 'In the 11:00 deployment we changed the probe: we planned to move health to 8081, but never changed the app. Roll back to the previous version.'
    Product owner.: Product owner.
    Necesito saber cuándo vuelven las notificaciones.: I need to know when notifications are back.
    Notificaciones en marcha: Notifications running
    El Service responde: The Service responds
    Diagnóstico: Diagnosis
    Pods y eventos revisados: Pods and events checked
    Historial del despliegue revisado: Deployment history checked
    Documentado: Documented
    Nota con la causa: Note with the cause
    Ticket cerrado: Ticket closed
    Los eventos: The events
    '«Readiness probe failed … port 8081»: la app escucha en el 8080.': '"Readiness probe failed … port 8081": the app listens on 8080.'
    'Vuelve a la plantilla anterior: sonda en el 8080 y pods Ready.': 'Back to the previous template: probe on 8080 and pods Ready.'

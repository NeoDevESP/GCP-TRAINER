setup: |
  gcloud container clusters create apps-gke --zone={{.zone}} --num-nodes=2 --machine-type=e2-standard-2 --network=zentra-vpc --subnetwork=gke --enable-private-nodes
  cat > notificaciones.yaml <<'YAML'
  apiVersion: apps/v1
  kind: Deployment
  metadata: {name: notificaciones}
  spec:
    replicas: 2
    selector: {matchLabels: {app: notificaciones}}
    template:
      metadata: {labels: {app: notificaciones}}
      spec:
        containers:
        - name: notificaciones
          image: europe-docker.pkg.dev/gcplab-public/apps/hello:1.0
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 5
  ---
  apiVersion: v1
  kind: Service
  metadata:
    name: notificaciones
    annotations: {networking.gke.io/load-balancer-type: "Internal"}
  spec:
    type: LoadBalancer
    selector: {app: notificaciones}
    ports: [{port: 80, targetPort: 8080}]
  YAML
  gcloud compute instances create ops-consola --zone={{.zone}} --machine-type=e2-small --subnet=apps --no-address --tags=ops
  gcloud container clusters get-credentials apps-gke --zone={{.zone}}
  kubectl apply -f notificaciones.yaml
faults:
- type: k8s_probe_port
  cluster: apps-gke
  deployment: notificaciones
  port: 8081
ticket:
  id: INC-31041
  kind: INC
  priority: P2
  sla: 1h
  reporter: Carla Méndez (producto)
  summary: Desde el despliegue de las 11:00 no llegan las notificaciones push de pagos. kubectl dice que los pods están Running, pero el servicio no responde.
actors:
- role: dev
  name: Equipo de Notificaciones
  persona: Mantienen el servicio de notificaciones.
  fallback: La aplicación escucha en el 8080, como siempre.
  facts:
  - keywords:
    - - puerto
      - port
      - '8081'
      - sonda
      - probe
      - readiness
      - despliegue
      - deploy
      - version
    answer: 'En el despliegue de las 11:00 tocamos la sonda: pensábamos mover la salud al 8081, pero no llegamos a cambiar la app. Volved a la versión anterior.'
- role: product
  name: Carla Méndez (producto)
  persona: Product owner.
  fallback: Necesito saber cuándo vuelven las notificaciones.
  facts: []
story: |-
  **Proyecto `{{.project}}`** (*zentra-apps-prod*).

  > **INC-31041 · P2** · *«Desde el despliegue de las 11:00 no llegan las notificaciones push de pagos. kubectl dice que los pods están Running, pero el servicio no responde.»*

  En Kubernetes, **Running** solo significa que el contenedor arrancó. Un Service solo envía tráfico a pods **Ready**, y Ready lo decide la **sonda de preparación** (*readinessProbe*). Mira la columna READY, los eventos del pod (`kubectl describe pod`) y el historial del despliegue. Si la última versión es la culpable, lo rápido y seguro es **volver a la anterior**.
objectives:
- Mira READY y los eventos del pod
- Relaciona el fallo con el despliegue
- Vuelve a la versión anterior
- Valida y documenta
hints:
- text: '`kubectl get pods` y `kubectl describe pod -l app=notificaciones`'
- text: '`kubectl rollout undo deployment/notificaciones`'
solution: |
  ticket
  gcloud container clusters get-credentials apps-gke --zone={{.zone}}
  kubectl get pods
  kubectl describe pod -l app=notificaciones
  kubectl rollout history deployment/notificaciones
  ask dev "¿qué cambió en el despliegue de las 11:00?"
  kubectl rollout undo deployment/notificaciones
  kubectl get pods
  ticket comment "Causa: el despliegue de las 11:00 movió la readinessProbe al puerto 8081, pero la aplicación sigue escuchando en el 8080; ningún pod pasaba a Ready y el Service se quedó sin endpoints. Hecho rollout undo a la revisión anterior. Pedido al equipo que no cambie la sonda sin cambiar la app."
  ticket update "Resuelto: las notificaciones push vuelven a enviarse. La última versión tenía mal configurada una comprobación de salud y hemos vuelto a la anterior."
  ticket resolve "rollout undo de notificaciones; pods Ready y servicio respondiendo."
shortcuts:
- name: restart the pods
  run: |
    gcloud container clusters get-credentials apps-gke --zone={{.zone}}
    kubectl rollout restart deployment/notificaciones
    ticket resolve "Reiniciados los pods de notificaciones."

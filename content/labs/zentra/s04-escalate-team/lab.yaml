id: zentra-s04-escalate-team
title: Oficio 4 · Escalar al equipo dueño con evidencia
summary: 'La pantalla de límites de tarjeta da error. La plataforma está bien: el fallo está en el código de la versión nueva. Descarta lo tuyo, reúne la evidencia y pásalo a Tarjetas de forma que no tengan que preguntarte nada.'

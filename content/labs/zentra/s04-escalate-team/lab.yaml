ticket:
  id: INC-40104
  kind: INC
  priority: P3
  sla: 8h
  reporter: Carla Méndez (Producto)
  summary: En la app, la pantalla «Límites de tarjeta» da error a todos desde esta mañana. El resto de la app va bien. Los clientes pueden cambiar el límite por teléfono mientras tanto.
actors:
- role: po
  name: Carla Méndez (Producto)
  persona: Product owner de Tarjetas.
  fallback: Solo falla Límites; ver tarjetas y bloquearlas funciona.
  facts:
  - keywords:
    - - cuando
      - cuándo
      - desde
      - since
      - when
      - hora
      - time
      - cambio
      - change
      - version
      - versión
      - release
    answer: Desde las 09:30 más o menos. Ayer por la tarde Tarjetas sacó la versión 2.1 con los límites nuevos.
- role: dev
  name: Hugo Martín (Tarjetas)
  persona: Desarrollador de Tarjetas.
  fallback: Pásanos el ticket con lo que tengas y lo miramos.
  facts: []
story: |-
  > 🎧 **Taller del oficio.** Aquí no aprendes un producto nuevo: aprendes a **trabajar un ticket** como lo hace un buen técnico de Soporte N2 en un banco. Lee la explicación, sigue los pasos en el terminal y, si te pierdes, abre la pestaña **Profesor**.

  > **INC-40104 · P3** · Producto: *«La pantalla Límites de tarjeta da error a todos desde esta mañana. El resto de la app va bien.»*

  En un banco, Soporte GCP es dueño de la **plataforma** (proyectos, red, permisos, Cloud Run, bases de datos…), no del **código** de cada equipo. Escalar no es «pasar la pelota»: es entregar el problema **a quien puede arreglarlo**, con todo lo necesario para que **no tenga que volver a preguntarte**.

  **1 · Descarta lo tuyo.** ¿Está el servicio desplegado y listo? ¿Llegan las peticiones (permisos)? ¿Falla todo o una parte?
  `gcloud run services describe tarjetas-api --region={{.region}}`
  `gcloud run revisions list --service=tarjetas-api --region={{.region}}`

  **2 · Busca la evidencia.** Los **registros** dicen qué falla y la **auditoría** qué cambió y quién:
  `gcloud logging read 'resource.type=cloud_run_revision severity>=ERROR' --limit=5`
  `gcloud logging read 'protoPayload.serviceName="run.googleapis.com"' --limit=5`

  **3 · Escala con una buena nota.** `ticket escalate tarjetas "…"` con: **síntoma** (qué falla y a quién), **desde cuándo**, **el error literal**, **qué cambió** (versión/revisión), **qué has descartado** (plataforma, permisos) y **una propuesta** (por ejemplo, volver a la revisión `estable` si lo aprueban).

  **4 · Avisa a quien abrió el ticket** de quién lo lleva ahora y qué esperar: `ticket update "…"`.

  No cierres el ticket: ahora es de Tarjetas.
objectives:
- Descarta la plataforma
- Reúne el error y qué cambió
- Escala a Tarjetas con evidencia
- Avisa a Producto
hints:
- text: 'El error dice «panic … handler /limits (release regression)»: es código, no plataforma.'
- text: '`ticket escalate tarjetas "Desde las 09:30 /limits da 500 (panic…) en la revisión 2.1 desplegada ayer; /cards va bien, plataforma y permisos OK. Propuesta: volver a estable si lo aprobáis."`'
quiz:
- id: q1
  question: Una buena nota de escalado tiene…
  options:
  - Síntoma, desde cuándo, error literal, qué cambió y qué has descartado
  - «No funciona, mirad»
  - Solo el número de ticket
  - La captura del cliente
  answer:
  - 0
- id: q2
  question: /cards responde bien y /limits da un panic tras desplegar la 2.1. ¿De quién es?
  options:
  - 'Del equipo de Tarjetas: es su código'
  - 'De Soporte GCP: es Cloud Run'
  - De Google
  - De Seguridad
  answer:
  - 0
- id: q3
  question: Después de escalar…
  options:
  - Avisas a quien abrió el ticket de quién lo lleva ahora
  - Cierras el ticket
  - Ya no tienes que hacer nada
  - Lo reabres cada hora
  answer:
  - 0
solution: |
  ticket
  ask po "¿Desde cuándo pasa? ¿Ha habido algún cambio o versión nueva?"
  gcloud run services describe tarjetas-api --region={{.region}}
  gcloud run revisions list --service=tarjetas-api --region={{.region}}
  gcloud logging read 'resource.type=cloud_run_revision severity>=ERROR' --limit=5
  gcloud logging read 'protoPayload.serviceName="run.googleapis.com"' --limit=5
  ticket escalate tarjetas "Desde las 09:30 la ruta /limits de tarjetas-api devuelve 500 a todos: panic: runtime error: invalid memory address in handler /limits. Empezó con la revisión 2.1 (cards-api:2.1) que desplegó el pipeline ayer. Descartado plataforma: la revisión está lista, /cards responde 200 y los permisos del gateway están bien. Propuesta: si lo aprobáis, volvemos a la revisión estable (2.0) como cambio de emergencia mientras lo corregís."
  ticket update "Hola Carla: hemos revisado la plataforma y está bien; el fallo está en la versión nueva de la pantalla de límites. Lo lleva ya el equipo de Tarjetas con toda la información. Mientras tanto los clientes pueden cambiar el límite por teléfono. Te avisarán ellos en este mismo ticket."
shortcuts:
- name: bounce it without evidence
  run: |
    ticket escalate google "No funciona la app de tarjetas, mirad qué pasa por favor."

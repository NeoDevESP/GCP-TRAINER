tutor:
- match: revisions list
  title: ¿Plataforma?
  why: 'La 2.1 está lista y sirviendo: Cloud Run hace su trabajo.'
- match: severity>=ERROR
  title: El error
  why: '«panic … handler /limits (release regression)»: un fallo del código en una ruta.'
- match: run.googleapis.com
  title: ¿Qué cambió?
  why: deploy-sa (el pipeline) desplegó la 2.1. Es la versión de Tarjetas.
- match: ticket escalate tarjetas
  title: Escalar bien
  why: Síntoma, cuándo, error literal, versión, lo descartado y una propuesta.
en:
  title: Craft 4 · Escalating to the owning team with evidence
  summary: 'The card limits screen errors out. The platform is fine: the bug is in the new version''s code. Rule out your part, gather the evidence and hand it to Cards so they don''t need to ask you anything.'
  story: |-
    > 🎧 **Craft workshop.** You won't learn a new product here: you'll learn to **work a ticket** the way a good L2 Support engineer at a bank does. Read the explanation, follow the steps in the terminal and, if you get lost, open the **Tutor** tab.

    > **INC-40104 · P3** · Product: *"The Card limits screen errors out for everyone since this morning. The rest of the app works."*

    At a bank, GCP Support owns the **platform** (projects, network, permissions, Cloud Run, databases…), not each team's **code**. Escalating isn't "passing the buck": it's handing the problem **to whoever can fix it**, with everything they need so they **never have to come back to ask you**.

    **1 · Rule out your part.** Is the service deployed and ready? Do requests get in (permissions)? Does everything fail or just one part?
    `gcloud run services describe tarjetas-api --region={{.region}}`
    `gcloud run revisions list --service=tarjetas-api --region={{.region}}`

    **2 · Find the evidence.** The **logs** say what fails and the **audit log** what changed and who:
    `gcloud logging read 'resource.type=cloud_run_revision severity>=ERROR' --limit=5`
    `gcloud logging read 'protoPayload.serviceName="run.googleapis.com"' --limit=5`

    **3 · Escalate with a good note.** `ticket escalate tarjetas "…"` with: **symptom** (what fails and for whom), **since when**, **the verbatim error**, **what changed** (version/revision), **what you've ruled out** (platform, permissions) and **a proposal** (e.g. going back to the `estable` revision if they approve).

    **4 · Tell whoever opened the ticket** who owns it now and what to expect: `ticket update "…"`.

    Don't close the ticket: it belongs to Cards now.
  objectives:
  - Rule out the platform
  - Gather the error and what changed
  - Escalate to Cards with evidence
  - Tell Product
  hints:
  - 'The error says "panic … handler /limits (release regression)": it''s code, not platform.'
  - '`ticket escalate tarjetas "Since 09:30 /limits returns 500 (panic…) on revision 2.1 deployed yesterday; /cards works, platform and permissions OK. Proposal: go back to estable if you approve."`'

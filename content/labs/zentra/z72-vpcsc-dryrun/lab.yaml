en:
  title: 'CHG · Before enforcing a perimeter: dry-run mode'
  summary: On Monday Security enforces the payments project perimeter. Today it's in dry-run and the logs say what it would break. Tell the legitimate from what must stay blocked and leave the configuration ready, without enforcing it.
  story: |-
    **Project `{{.project}}`** (*zentra-pagos-prod*).

    > **CHG-31072 · P3** · Security: *"On Monday we enforce the zentra-pagos perimeter. Review the dry-run logs and prepare the configuration for what's legitimate. Don't enforce it."*

    Enforcing a perimeter blindly breaks production. That's why it first goes into **dry-run**: it blocks nothing, but **logs what it would block** (`metadata.dryRun="true"`). For a few days those logs are reviewed, rules are added for the **legitimate** flows and the ones that **shouldn't** exist are left out.

    1. Look at the dry-run configuration: `gcloud access-context-manager perimeters dry-run describe zentra-pagos`.
    2. Read the dry-run violations: `gcloud logging read 'protoPayload.metadata.dryRun="true"' --limit=10`. Note each flow: identity, source, service.
    3. Ask Security about each flow: is it legitimate?
    4. For the legitimate one, a minimal ingress rule in the dry-run configuration: `perimeters dry-run update zentra-pagos --set-ingress-policies=FILE`.
    5. **Don't enforce** the perimeter. Tell Security what you found and what you prepared.
  objectives:
  - Read the dry-run violations
  - Separate legitimate from suspicious
  - Rule in the dry-run configuration
  - Report without enforcing
  hints:
  - 'Two flows: conciliacion-sa from zentra-batch and a Gmail account from 203.0.113.77.'
  - '`gcloud access-context-manager perimeters dry-run update zentra-pagos --set-ingress-policies=entrada.yaml`'
  ticket:
    summary: 'On Monday we enforce the zentra-pagos perimeter (now in dry-run). Review the dry-run logs, tell me which flows it would break and prepare the configuration for the legitimate ones. Don''t enforce it: we do that in Monday''s window.'
  text:
    Nadia Kowalski (Seguridad cloud): Nadia Kowalski (Cloud security)
    Ingeniera de seguridad cloud, dueña de perímetros, claves y políticas de denegación.: Cloud security engineer, owner of perimeters, keys and deny policies.
    'Los controles de seguridad no se quitan: se ajustan con el mínimo alcance. Dime identidad, origen y servicio.': 'Security controls aren''t removed: they''re adjusted with the minimum scope. Tell me identity, source and service.'
    ? 'La conciliación es legítima: conciliacion-sa del proyecto zentra-batch (731045226118) escribe las liquidaciones en Storage. Regla de entrada solo para eso.'
    : 'Reconciliation is legitimate: conciliacion-sa from project zentra-batch (731045226118) writes settlements to Storage. An ingress rule only for that.'
    ? '¿Una cuenta de Gmail leyendo liquidaciones desde internet? Eso no está autorizado: que siga bloqueado y lo investigamos nosotros. Bien visto.'
    : 'A Gmail account reading settlements from the internet? That isn''t authorised: keep it blocked and we''ll investigate. Well spotted.'
    Lo legítimo, preparado: Legitimate flow prepared
    La conciliación ya no daría infracción: Reconciliation would no longer violate
    Lo sospechoso, fuera y sin activar: Suspicious kept out, not enforced
    La cuenta de Gmail seguiría bloqueada: The Gmail account would stay blocked
    Configuración de prueba sin comodines: Dry-run configuration without wildcards
    Sin activar (lo activa Seguridad el lunes): Not enforced (Security does it on Monday)
    Revisión: Review
    Registros o configuración de prueba revisados: Dry-run logs or configuration reviewed
    Preguntado por cada flujo: Asked about each flow
    Informe a Seguridad: Report to Security
    Los dos flujos y que no está activado: Both flows and that it isn't enforced
    Modo prueba: Dry run
    Hay configuración de prueba (spec) pero ninguna activa (status).: There's a dry-run configuration (spec) but no enforced one (status).
    Lo que rompería: What it would break
    'Dos flujos: la conciliación desde zentra-batch y una cuenta de Gmail desde internet.': 'Two flows: reconciliation from zentra-batch and a Gmail account from the internet.'
    Preparar: Preparing
    La regla va en la configuración de prueba; el lunes se activa entera.: The rule goes into the dry-run configuration; on Monday it's enforced as a whole.

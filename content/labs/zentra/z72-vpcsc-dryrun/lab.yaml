title: 'CHG · Antes de activar un perímetro: el modo prueba'
summary: El lunes Seguridad activa el perímetro del proyecto de pagos. Hoy está en modo prueba y los registros dicen qué rompería. Separa lo legítimo de lo que debe seguir bloqueado y deja la configuración lista, sin activarla.

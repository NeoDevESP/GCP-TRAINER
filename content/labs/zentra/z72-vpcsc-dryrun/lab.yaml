story: |-
  **Proyecto `{{.project}}`** (*zentra-pagos-prod*).

  > **CHG-31072 · P3** · Seguridad: *«El lunes activamos el perímetro zentra-pagos. Revisa los registros del modo prueba y deja preparada la configuración para lo legítimo. No lo actives.»*

  Activar un perímetro a ciegas rompe producción. Por eso primero se pone en **modo prueba** (*dry-run*): no bloquea nada, pero **registra lo que bloquearía** (`metadata.dryRun="true"`). Durante unos días se revisan esos registros, se añaden reglas para los flujos **legítimos** y se dejan fuera los que **no deben** existir.

  1. Mira la configuración en prueba: `gcloud access-context-manager perimeters dry-run describe zentra-pagos`.
  2. Lee las infracciones de prueba: `gcloud logging read 'protoPayload.metadata.dryRun="true"' --limit=10`. Anota cada flujo: identidad, origen, servicio.
  3. Pregunta a Seguridad por cada flujo: ¿es legítimo?
  4. Para lo legítimo, una regla de entrada mínima en la configuración de prueba: `perimeters dry-run update zentra-pagos --set-ingress-policies=FICHERO`.
  5. **No actives** el perímetro. Informa a Seguridad de qué has encontrado y qué has preparado.
objectives:
- Lee las infracciones de prueba
- Separa legítimo de sospechoso
- Regla en la configuración de prueba
- Informa sin activar
hints:
- text: 'Dos flujos: conciliacion-sa desde zentra-batch y una cuenta de Gmail desde 203.0.113.77.'
- text: '`gcloud access-context-manager perimeters dry-run update zentra-pagos --set-ingress-policies=entrada.yaml`'
solution: |
  ticket
  gcloud access-context-manager perimeters dry-run describe zentra-pagos
  gcloud logging read 'protoPayload.metadata.dryRun="true"' --limit=10
  ask security "¿Es legítima la conciliación de conciliacion-sa desde zentra-batch?"
  ask security "Hay una cuenta pruebas.zentra@gmail.com leyendo desde 203.0.113.77, ¿la dejo fuera?"
  cat > entrada.yaml <<'YAML'
  - ingressFrom:
      identities:
      - serviceAccount:conciliacion-sa@zentra-batch.iam.gserviceaccount.com
      sources:
      - resource: projects/731045226118
    ingressTo:
      operations:
      - serviceName: storage.googleapis.com
        methodSelectors:
        - method: "*"
      resources:
      - "*"
  YAML
  gcloud access-context-manager perimeters dry-run update zentra-pagos --set-ingress-policies=entrada.yaml
  gcloud access-context-manager perimeters dry-run describe zentra-pagos
  ticket update "Nadia: en modo prueba salen dos flujos. 1) conciliacion-sa desde zentra-batch escribiendo liquidaciones en Storage: legítimo, he dejado preparada una regla de entrada solo para esa cuenta, ese proyecto y Storage. 2) pruebas.zentra@gmail.com leyendo desde 203.0.113.77: no autorizado, lo dejo fuera para que siga bloqueado y lo investiguéis. No he activado el perímetro: queda listo para el lunes."
shortcuts:
- name: enforce now with everything allowed
  run: |
    cat > todo.yaml <<'YAML'
    - ingressFrom:
        identityType: ANY_IDENTITY
        sources:
        - accessLevel: "*"
      ingressTo:
        operations:
        - serviceName: "*"
    YAML
    gcloud access-context-manager perimeters dry-run update zentra-pagos --set-ingress-policies=todo.yaml
    gcloud access-context-manager perimeters dry-run enforce zentra-pagos
    ticket update "Activado ya con todo permitido para que no se rompa nada el lunes."

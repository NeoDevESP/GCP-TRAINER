quiz:
- id: q1
  question: ¿Por qué no sirven las IPs automáticas de Cloud NAT para que un proveedor nos filtre?
  options:
  - Google puede cambiarlas
  - Son privadas
  - Son IPv6
  - No salen a internet
  answer:
  - 0
solution: |
  ticket
  gcloud compute routers nats describe zentra-nat --router=zentra-router --region={{.region}}
  ask network "¿Reservo una IP estática para zentra-nat para que Paymentia nos filtre?"
  ask change "Pasar zentra-nat a IP estática corta conexiones un momento, ¿cambio en ventana?"
  gcloud compute addresses create nat-proveedores --region={{.region}}
  gcloud compute addresses describe nat-proveedores --region={{.region}} --format='value(address)'
  gcloud compute routers nats update zentra-nat --router=zentra-router --region={{.region}} --nat-external-ip-pool=nat-proveedores
  gcloud compute routers nats describe zentra-nat --router=zentra-router --region={{.region}}
  gcloud compute ssh pagos-gateway --zone={{.zone}} --tunnel-through-iap --command='curl -s -m 5 https://example.com'
  ticket update "Hola Lucía: hecho con el cambio CHG-7820 en la ventana de esta noche. Desde ahora salimos siempre por la IP estática reservada nat-proveedores (la que ves en addresses describe): esa es la IP que hay que dar a Paymentia. Vuelta atrás si hiciera falta: devolver zentra-nat a IPs automáticas."
  ticket resolve "zentra-nat con IP estática nat-proveedores (CHG-7820); salida a internet comprobada; IP comunicada a Pagos."
shortcuts:
- name: give them the current automatic IP
  run: |
    ticket update "Dadles la IP que tenemos ahora en el NAT, que de momento no cambia."
    ticket resolve "IP actual del NAT comunicada a Pagos sin cambiar nada."

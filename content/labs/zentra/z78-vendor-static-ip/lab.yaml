en:
  title: REQ · The card provider asks for our fixed egress IP
  summary: An external provider will filter by IP. Today we go out through Cloud NAT with automatic IPs, which can change. Reserve static IPs, put them on the NAT with a planned change and communicate the IP.
  story: |-
    **Project `{{.project}}`** (*zentra-pagos-prod*).

    > **REQ-31078 · P3** · Payments: *"Paymentia will filter by source IP from Friday. Which fixed IP do we give them?"*

    Zentra's VMs **have no public IP**: they reach the internet through **Cloud NAT** (`zentra-nat` on `zentra-router`). With **automatic allocation**, Google chooses and **can change** the IPs: useless for a provider to filter on. You need to **reserve static IPs** and switch the NAT to **manual allocation**. It's a production change: changing the NAT IP briefly cuts open outbound connections.

    1. See how it goes out now: `gcloud compute routers nats describe zentra-nat --router=zentra-router --region={{.region}}`.
    2. Ask Network and request the change (standard, normal or emergency?).
    3. Reserve the IP: `gcloud compute addresses create nat-proveedores --region={{.region}}` and look it up (`addresses describe`).
    4. Put it on the NAT: `gcloud compute routers nats update zentra-nat --router=zentra-router --region={{.region}} --nat-external-ip-pool=nat-proveedores`.
    5. Check the internet is still reachable and communicate the IP with the change number.
  objectives:
  - See how it goes out now
  - Approved change
  - Static IP on the NAT
  - Verify and communicate the IP
  hints:
  - '`gcloud compute addresses describe nat-proveedores --region={{.region}} --format=''value(address)''`'
  ticket:
    summary: Paymentia (card processor) will filter by source IP from Friday. They ask for the fixed public IP we go out from. Which one do we give them?

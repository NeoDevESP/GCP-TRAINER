    ? 'Ahora mismo zentra-nat usa IPs automáticas: pueden cambiar sin avisar. Reserva una IP estática en la región, nómbrala nat-proveedores y pásala al NAT; al cambiar la IP del NAT se cortan las conexiones abiertas un momento, así que en ventana de cambio.'
    : 'Right now zentra-nat uses automatic IPs: they can change without notice. Reserve a static IP in the region, name it nat-proveedores and put it on the NAT; changing the NAT IP briefly cuts open connections, so do it in a change window.'
    Javier Luna (Gestión de cambios): Javier Luna (Change management)
    Gestor de cambios (CAB).: Change manager (CAB).

story: |-
  **Proyecto `{{.project}}`** (*zentra-pagos-prod*).

  > **REQ-31078 · P3** · Pagos: *«Paymentia va a filtrar por IP origen a partir del viernes. ¿Qué IP fija les damos?»*

  Las VMs de Zentra **no tienen IP pública**: salen a internet por **Cloud NAT** (`zentra-nat` en `zentra-router`). Con **asignación automática**, Google elige y **puede cambiar** las IPs: no valen para que un proveedor nos filtre. Hay que **reservar IPs estáticas** y pasarle el NAT a **asignación manual**. Es un cambio en producción: al cambiar la IP del NAT se cortan un momento las conexiones salientes abiertas.

  1. Mira cómo sale ahora: `gcloud compute routers nats describe zentra-nat --router=zentra-router --region={{.region}}`.
  2. Pregunta a Red y pide el cambio (¿estándar, normal o emergencia?).
  3. Reserva la IP: `gcloud compute addresses create nat-proveedores --region={{.region}}` y mira cuál es (`addresses describe`).
  4. Pásala al NAT: `gcloud compute routers nats update zentra-nat --router=zentra-router --region={{.region}} --nat-external-ip-pool=nat-proveedores`.
  5. Comprueba que se sigue saliendo a internet y comunica la IP con el número de cambio.
objectives:
- Mira cómo sale ahora
- Cambio aprobado
- IP estática en el NAT
- Comprueba y comunica la IP
hints:

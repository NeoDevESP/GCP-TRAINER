id: zentra-z18-bq-denied
title: INC P3 · El worker de analítica recibe los eventos pero BigQuery le dice que no
summary: El 403 viene de BigQuery, no de Pub/Sub. Da a la cuenta del worker permiso de escritura en ese dataset, no en todo BigQuery.
track: zentra
day: 18
level: intermediate
branch: data
type: incident
mode: production
skills:
- data.bigquery
- data.pubsub
- iam.leastprivilege
wellArchitected:
- reliability
- security
certs:
- ACE
- PCDE
difficulty: 3
minutes: 30
baseline:
- zentra-core
setup: |
  gcloud iam service-accounts create analitica-sa --display-name="worker de analitica"
  gcloud iam service-accounts create push-sa --display-name="push de Pub/Sub"
  gcloud projects add-iam-policy-binding {{.project}} --member=serviceAccount:pagos-sa@{{.project}}.iam.gserviceaccount.com --role=roles/cloudsql.client
  gcloud sql instances create ledger-db --database-version=POSTGRES_15 --tier=db-g1-small --region={{.region}} --no-assign-ip --network=zentra-vpc
  gcloud sql databases create ledger --instance=ledger-db
  gcloud sql users create pagos --instance=ledger-db --password=pw-ledger-1
  gcloud pubsub topics create transacciones
  bq mk --dataset --location=EU analitica
  bq mk --table analitica.transacciones id:STRING,importe:NUMERIC,fecha:TIMESTAMP
  gcloud pubsub topics add-iam-policy-binding transacciones --member=serviceAccount:pagos-sa@{{.project}}.iam.gserviceaccount.com --role=roles/pubsub.publisher
  gcloud run deploy pagos-api --image=europe-docker.pkg.dev/gcplab-public/apps/orders-api:1.0 --region={{.region}} --service-account=pagos-sa@{{.project}}.iam.gserviceaccount.com --add-cloudsql-instances={{.project}}:{{.region}}:ledger-db --set-env-vars=DB_HOST=/cloudsql/{{.project}}:{{.region}}:ledger-db,DB_USER=pagos,DB_PASSWORD=pw-ledger-1,DB_NAME=ledger,DB_POOL_SIZE=5,TOPIC=transacciones --max-instances=5 --network=zentra-vpc --subnet=apps --vpc-egress=private-ranges-only --no-allow-unauthenticated
  gcloud run services add-iam-policy-binding pagos-api --region={{.region}} --member=serviceAccount:app-gateway-sa@{{.project}}.iam.gserviceaccount.com --role=roles/run.invoker
  gcloud run deploy analitica-worker --image=europe-docker.pkg.dev/gcplab-public/apps/orders-worker:1.0 --region={{.region}} --service-account=analitica-sa@{{.project}}.iam.gserviceaccount.com --set-env-vars=BQ_TABLE=analitica.transacciones --max-instances=3 --no-allow-unauthenticated
  gcloud run services add-iam-policy-binding analitica-worker --region={{.region}} --member=serviceAccount:push-sa@{{.project}}.iam.gserviceaccount.com --role=roles/run.invoker
  gcloud pubsub subscriptions create transacciones-analitica --topic=transacciones --push-endpoint=$(gcloud run services describe analitica-worker --region={{.region}} --format='value(status.url)')/push --push-auth-service-account=push-sa@{{.project}}.iam.gserviceaccount.com
traffic:
- name: clientes
  target: run:pagos-api
  path: /orders
  rps: 20
  principal: serviceAccount:app-gateway-sa@{{.project}}.iam.gserviceaccount.com
ticket:
  id: INC-31018
  kind: INC
  priority: P3
  sla: 8h
  reporter: Sara Benítez (Datos)
  summary: Hemos movido la tabla de transacciones al dataset analitica (UE) y desde entonces no se escribe nada. Lo más rápido sería darle BigQuery Admin al worker.
actors:
- role: data
  name: Sara Benítez (Datos)
  persona: Ingeniera de datos.
  fallback: El dataset analitica es nuevo; antes estaba en otro.
  facts: []
- role: security
  name: Nadia Kowalski (Seguridad cloud)
  persona: Seguridad cloud.
  fallback: BigQuery Admin para un worker, ni hablar.
  facts: []
story: |-
  **Proyecto `{{.project}}`** (*zentra-datos-prod*).

  > **INC-31018 · P3** · *«Hemos movido la tabla de transacciones al dataset analitica (UE) y desde entonces no se escribe nada. Lo más rápido sería darle BigQuery Admin al worker.»*

  Flujo afectado: `pagos-api` (Cloud Run) guarda cada pago en `ledger-db` y publica un evento en el tema **transacciones**; la suscripción push **transacciones-analitica** (autenticada como `push-sa`) lo entrega a `analitica-worker`, que lo escribe en BigQuery `analitica.transacciones`.

  Los mensajes llegan al worker, pero él falla. Lee **sus** registros: el error dirá qué permiso de BigQuery le falta y sobre qué recurso. En BigQuery los permisos se pueden dar **por dataset** (`bq add-iam-policy-binding`).
objectives:
- Lee el error del worker
- Identifica cuenta, permiso y dataset
- Concede escritura solo en ese dataset
- Comprueba que fluyen los datos y documenta
hints:
- text: '`gcloud logging read ''resource.labels.service_name="analitica-worker"'' --limit=5`.'
- text: '`bq add-iam-policy-binding --member=serviceAccount:analitica-sa@… --role=roles/bigquery.dataEditor analitica`.'
solution: |
  ticket
  gcloud logging read 'resource.type=cloud_run_revision resource.labels.service_name="analitica-worker" severity>=ERROR' --limit=5
  gcloud run services describe analitica-worker --region={{.region}}
  bq show analitica
  ask security "¿puedo dar bigquery.dataEditor al worker solo sobre el dataset analitica?"
  bq add-iam-policy-binding --member=serviceAccount:analitica-sa@{{.project}}.iam.gserviceaccount.com --role=roles/bigquery.dataEditor analitica
  sleep 120
  gcloud pubsub subscriptions describe transacciones-analitica
  ticket comment "Causa: el dataset analitica es nuevo y analitica-sa no tenía permisos en él (Access Denied: bigquery.tables.updateData). Concedido roles/bigquery.dataEditor solo sobre el dataset analitica; no se da BigQuery Admin."
  ticket update "Hola Sara: los datos vuelven a entrar en analitica.transacciones. Le hemos dado al worker permiso de escritura solo sobre ese dataset; BigQuery Admin le permitiría borrar cualquier dataset del proyecto."
  ticket resolve "Concedido bigquery.dataEditor a analitica-sa sobre el dataset analitica; la cola se vacía."
shortcuts:
- name: bigquery admin on the project
  run: |
    gcloud projects add-iam-policy-binding {{.project}} --member=serviceAccount:analitica-sa@{{.project}}.iam.gserviceaccount.com --role=roles/bigquery.admin
    ticket resolve "Dado BigQuery Admin al worker de analítica."
rubric:
- name: Datos fluyendo
  validator: functional
  points: 40
  checks:
  - type: pubsub
    subscription: transacciones-analitica
    ackedMin: 10
    backlogMax: 50
    settle: 3
    desc: Eventos entregados y escritos
- name: Mínimo privilegio
  validator: security
  points: 35
  critical: true
  all: true
  checks:
  - type: iam
    principal: serviceAccount:analitica-sa@{{.project}}.iam.gserviceaccount.com
    permission: bigquery.datasets.delete
    resource: project
    expect: false
    desc: No puede borrar datasets
  - type: command
    regex: projects add-iam-policy-binding .*analitica-sa
    max: 0
    desc: Nada en todo el proyecto
- name: Documentado
  validator: evidence
  points: 25
  all: true
  checks:
  - type: ticket_update
    public: false
    keywords:
    - - dataeditor
      - escritura
      - write
    - - dataset
      - analitica
    desc: Nota con la causa
  - type: ticket_resolved
    desc: Ticket cerrado
tutor:
- match: service_name="analitica-worker"
  title: Los registros del worker
  why: 'Access Denied … bigquery.tables.updateData: el problema está en BigQuery, no en Pub/Sub.'
- match: bq add-iam-policy-binding
  title: ''
  why: 'Permiso a nivel de dataset: el worker escribe en analitica y en nada más.'
en:
  title: INC P3 · The analytics worker gets the events but BigQuery says no
  summary: The 403 comes from BigQuery, not Pub/Sub. Give the worker's account write access on that dataset, not all of BigQuery.
  story: |-
    **Project `{{.project}}`** (*zentra-datos-prod*).

    > **INC-31018 · P3** · *"We moved the transactions table to the analitica dataset (EU) and since then nothing is written. The fastest would be giving the worker BigQuery Admin."*

    Affected flow: `pagos-api` (Cloud Run) stores each payment in `ledger-db` and publishes an event to the **transacciones** topic; the **transacciones-analitica** push subscription (authenticated as `push-sa`) delivers it to `analitica-worker`, which writes it to BigQuery `analitica.transacciones`.

    Messages reach the worker, but it fails. Read **its** logs: the error tells you which BigQuery permission it lacks and on which resource. In BigQuery permissions can be granted **per dataset** (`bq add-iam-policy-binding`).
  objectives:
  - Read the worker's error
  - Identify account, permission and dataset
  - Grant write access only on that dataset
  - Check data flows and document
  hints:
  - '`gcloud logging read ''resource.labels.service_name="analitica-worker"'' --limit=5`.'
  - '`bq add-iam-policy-binding --member=serviceAccount:analitica-sa@… --role=roles/bigquery.dataEditor analitica`.'
  ticket:
    summary: We moved the transactions table to the analitica dataset (EU) and since then nothing is written. The fastest would be giving the worker BigQuery Admin.
  text:
    Sara Benítez (Datos): Sara Benítez (Data)
    Ingeniera de datos.: Data engineer.
    El dataset analitica es nuevo; antes estaba en otro.: The analitica dataset is new; it used to be elsewhere.
    Nadia Kowalski (Seguridad cloud): Nadia Kowalski (Cloud security)
    Seguridad cloud.: Cloud security.
    BigQuery Admin para un worker, ni hablar.: BigQuery Admin for a worker, no way.
    Datos fluyendo: Data flowing
    Eventos entregados y escritos: Events delivered and written
    Mínimo privilegio: Least privilege
    No puede borrar datasets: Can't delete datasets
    Nada en todo el proyecto: Nothing project-wide
    Documentado: Documented
    Nota con la causa: Note with the cause
    Ticket cerrado: Ticket closed
    Los registros del worker: The worker's logs
    'Access Denied … bigquery.tables.updateData: el problema está en BigQuery, no en Pub/Sub.': 'Access Denied … bigquery.tables.updateData: the problem is in BigQuery, not Pub/Sub.'
    'Permiso a nivel de dataset: el worker escribe en analitica y en nada más.': 'Dataset-level permission: the worker writes to analitica and nothing else.'

id: zentra-z16-publish-denied
title: INC P2 · Los pagos fallan al publicar en «transacciones»
summary: Lee el error de la aplicación, identifica la identidad y el permiso que faltan y concédelo sobre el tema, no sobre todo el proyecto.
track: zentra
day: 16
level: intermediate
branch: data
type: incident
mode: production
skills:
- data.pubsub
- iam.serviceaccounts
- observability.incident
wellArchitected:
- reliability
- security
certs:
- ACE
- PCDE
difficulty: 3
minutes: 30
baseline:
- zentra-core
setup: |
  gcloud iam service-accounts create analitica-sa --display-name="worker de analitica"
  gcloud iam service-accounts create push-sa --display-name="push de Pub/Sub"
  gcloud projects add-iam-policy-binding {{.project}} --member=serviceAccount:pagos-sa@{{.project}}.iam.gserviceaccount.com --role=roles/cloudsql.client
  gcloud sql instances create ledger-db --database-version=POSTGRES_15 --tier=db-g1-small --region={{.region}} --no-assign-ip --network=zentra-vpc
  gcloud sql databases create ledger --instance=ledger-db
  gcloud sql users create pagos --instance=ledger-db --password=pw-ledger-1
  gcloud pubsub topics create transacciones
  bq mk --dataset --location=EU analitica
  bq mk --table analitica.transacciones id:STRING,importe:NUMERIC,fecha:TIMESTAMP
  bq add-iam-policy-binding --member=serviceAccount:analitica-sa@{{.project}}.iam.gserviceaccount.com --role=roles/bigquery.dataEditor analitica
  gcloud run deploy pagos-api --image=europe-docker.pkg.dev/gcplab-public/apps/orders-api:1.0 --region={{.region}} --service-account=pagos-sa@{{.project}}.iam.gserviceaccount.com --add-cloudsql-instances={{.project}}:{{.region}}:ledger-db --set-env-vars=DB_HOST=/cloudsql/{{.project}}:{{.region}}:ledger-db,DB_USER=pagos,DB_PASSWORD=pw-ledger-1,DB_NAME=ledger,DB_POOL_SIZE=5,TOPIC=transacciones --max-instances=5 --network=zentra-vpc --subnet=apps --vpc-egress=private-ranges-only --no-allow-unauthenticated
  gcloud run services add-iam-policy-binding pagos-api --region={{.region}} --member=serviceAccount:app-gateway-sa@{{.project}}.iam.gserviceaccount.com --role=roles/run.invoker
  gcloud run deploy analitica-worker --image=europe-docker.pkg.dev/gcplab-public/apps/orders-worker:1.0 --region={{.region}} --service-account=analitica-sa@{{.project}}.iam.gserviceaccount.com --set-env-vars=BQ_TABLE=analitica.transacciones --max-instances=3 --no-allow-unauthenticated
  gcloud run services add-iam-policy-binding analitica-worker --region={{.region}} --member=serviceAccount:push-sa@{{.project}}.iam.gserviceaccount.com --role=roles/run.invoker
  gcloud pubsub subscriptions create transacciones-analitica --topic=transacciones --push-endpoint=$(gcloud run services describe analitica-worker --region={{.region}} --format='value(status.url)')/push --push-auth-service-account=push-sa@{{.project}}.iam.gserviceaccount.com
traffic:
- name: clientes
  target: run:pagos-api
  path: /orders
  rps: 20
  principal: serviceAccount:app-gateway-sa@{{.project}}.iam.gserviceaccount.com
ticket:
  id: INC-31016
  kind: INC
  priority: P2
  sla: 1h
  reporter: NOC 24x7
  summary: Desde la migración del tema «transacciones» que hizo Datos esta mañana, pagos-api devuelve errores en /orders. Los clientes no pueden enviar dinero.
actors:
- role: sre
  name: Diego Ferrer (SRE)
  persona: SRE de guardia.
  fallback: ¿Qué ha cambiado? Mira los registros y la auditoría.
  facts: []
- role: data
  name: Sara Benítez (Datos)
  persona: Ingeniera de datos.
  fallback: Recreamos el tema transacciones para cambiarle la retención.
  facts:
  - keywords:
    - - permiso
      - permission
      - publisher
      - iam
    answer: Ups, al recrearlo se perdieron sus permisos; no los volvimos a poner.
- role: product
  name: Carla Méndez (producto)
  persona: Product owner de la app.
  fallback: Los clientes se quejan en redes; necesito saber cuándo estará.
  facts: []
story: |-
  **Proyecto `{{.project}}`** (*zentra-pagos-prod*).

  > **INC-31016 · P2** · *«Desde la migración del tema «transacciones» que hizo Datos esta mañana, pagos-api devuelve errores en /orders. Los clientes no pueden enviar dinero.»*

  Flujo afectado: `pagos-api` (Cloud Run) guarda cada pago en `ledger-db` y publica un evento en el tema **transacciones**; la suscripción push **transacciones-analitica** (autenticada como `push-sa`) lo entrega a `analitica-worker`, que lo escribe en BigQuery `analitica.transacciones`.

  Empieza por el **error literal** (`gcloud logging read`): te dirá qué API, qué permiso y sobre qué recurso. Luego mira con qué identidad corre `pagos-api`.
objectives:
- Encuentra el error exacto en los registros
- Identifica la cuenta y el permiso que faltan
- Concede el permiso sobre el tema
- Comprueba, informa y documenta
hints:
- text: '`gcloud logging read ''resource.type=cloud_run_revision severity>=ERROR'' --limit=5`.'
- text: '`gcloud pubsub topics add-iam-policy-binding transacciones --member=serviceAccount:pagos-sa@… --role=roles/pubsub.publisher`.'
solution: |
  ticket
  gcloud logging read 'resource.type=cloud_run_revision severity>=ERROR' --limit=5
  gcloud run services describe pagos-api --region={{.region}}
  gcloud pubsub topics describe transacciones
  ask data "¿qué cambiasteis en el tema transacciones?"
  gcloud pubsub topics add-iam-policy-binding transacciones --member=serviceAccount:pagos-sa@{{.project}}.iam.gserviceaccount.com --role=roles/pubsub.publisher
  gcloud logging read 'resource.type=cloud_run_revision severity>=ERROR' --limit=3
  ticket comment "Causa: Datos recreó el tema transacciones y se perdió el permiso roles/pubsub.publisher de pagos-sa; pagos-api recibía PermissionDenied (pubsub.topics.publish). Concedido de nuevo solo sobre el tema. Propuesta: gestionar el tema y sus permisos en Terraform para que no se pierdan."
  ticket update "Resuelto: los pagos vuelven a funcionar. Al recrear el tema de eventos se perdió el permiso que usa pagos-api para publicar; está restaurado."
  ticket resolve "Restaurado pubsub.publisher de pagos-sa sobre el tema transacciones; /orders responde 200."
shortcuts:
- name: pubsub editor on the project
  run: |
    gcloud projects add-iam-policy-binding {{.project}} --member=serviceAccount:pagos-sa@{{.project}}.iam.gserviceaccount.com --role=roles/pubsub.editor
    ticket resolve "Dado pubsub.editor a pagos-sa en el proyecto."
rubric:
- name: Pagos funcionando
  validator: functional
  points: 35
  checks:
  - type: http
    target: run:pagos-api
    path: /orders
    principal: serviceAccount:app-gateway-sa@{{.project}}.iam.gserviceaccount.com
    status: 200
    desc: /orders responde 200
- name: Permiso sobre el tema
  validator: security
  points: 35
  critical: true
  all: true
  checks:
  - type: command
    regex: projects add-iam-policy-binding .*pagos-sa.*pubsub|projects add-iam-policy-binding .*pubsub.*pagos-sa
    max: 0
    desc: Nada de Pub/Sub en todo el proyecto
  - type: iam
    principal: serviceAccount:pagos-sa@{{.project}}.iam.gserviceaccount.com
    permission: pubsub.topics.delete
    resource: project
    expect: false
    desc: pagos-sa no puede borrar temas
- name: Diagnóstico
  validator: diagnosis
  points: 15
  checks:
  - type: command
    regex: logging read
    min: 1
    desc: Error leído en los registros
- name: Documentado
  validator: evidence
  points: 15
  all: true
  checks:
  - type: ticket_update
    public: false
    keywords:
    - - publisher
      - publicar
      - publish
    - - pagos-sa
    desc: Nota con la causa
  - type: ticket_resolved
    desc: Ticket cerrado
tutor:
- match: logging read
  title: El error literal
  why: 'PermissionDenied … pubsub.topics.publish on …/topics/transacciones: el error te da el permiso y el recurso.'
- match: topics add-iam-policy-binding transacciones
  title: ''
  why: 'Publicador sobre ese tema: pagos-sa no gana nada más.'
en:
  title: INC P2 · Payments fail publishing to "transacciones"
  summary: Read the app error, identify the missing identity and permission and grant it on the topic, not on the whole project.
  story: |-
    **Project `{{.project}}`** (*zentra-pagos-prod*).

    > **INC-31016 · P2** · *"Since Data migrated the "transacciones" topic this morning, pagos-api returns errors on /orders. Customers can't send money."*

    Affected flow: `pagos-api` (Cloud Run) stores each payment in `ledger-db` and publishes an event to the **transacciones** topic; the **transacciones-analitica** push subscription (authenticated as `push-sa`) delivers it to `analitica-worker`, which writes it to BigQuery `analitica.transacciones`.

    Start with the **literal error** (`gcloud logging read`): it tells you which API, which permission and on which resource. Then check which identity `pagos-api` runs as.
  objectives:
  - Find the exact error in the logs
  - Identify the missing account and permission
  - Grant the permission on the topic
  - Verify, inform and document
  hints:
  - '`gcloud logging read ''resource.type=cloud_run_revision severity>=ERROR'' --limit=5`.'
  - '`gcloud pubsub topics add-iam-policy-binding transacciones --member=serviceAccount:pagos-sa@… --role=roles/pubsub.publisher`.'
  ticket:
    summary: Since Data migrated the "transacciones" topic this morning, pagos-api returns errors on /orders. Customers can't send money.
  text:
    NOC 24x7: NOC 24x7
    Diego Ferrer (SRE): Diego Ferrer (SRE)
    SRE de guardia.: On-call SRE.
    ¿Qué ha cambiado? Mira los registros y la auditoría.: What changed? Check the logs and the audit trail.
    Sara Benítez (Datos): Sara Benítez (Data)
    Ingeniera de datos.: Data engineer.
    Recreamos el tema transacciones para cambiarle la retención.: We recreated the transacciones topic to change its retention.
    Ups, al recrearlo se perdieron sus permisos; no los volvimos a poner.: Oops, recreating it dropped its permissions; we didn't add them back.
    Carla Méndez (producto): Carla Méndez (product)
    Product owner de la app.: App product owner.
    Los clientes se quejan en redes; necesito saber cuándo estará.: Customers are complaining online; I need to know when it'll be fixed.
    Pagos funcionando: Payments working
    /orders responde 200: /orders returns 200
    Permiso sobre el tema: Permission on the topic
    Nada de Pub/Sub en todo el proyecto: No project-wide Pub/Sub role
    pagos-sa no puede borrar temas: pagos-sa can't delete topics
    Diagnóstico: Diagnosis
    Error leído en los registros: Error read from the logs
    Documentado: Documented
    Nota con la causa: Note with the cause
    Ticket cerrado: Ticket closed
    El error literal: The literal error
    'PermissionDenied … pubsub.topics.publish on …/topics/transacciones: el error te da el permiso y el recurso.': 'PermissionDenied … pubsub.topics.publish on …/topics/transacciones: the error gives you the permission and the resource.'
    'Publicador sobre ese tema: pagos-sa no gana nada más.': 'Publisher on that topic: pagos-sa gains nothing else.'

    backend "gcs" {
      bucket = "tfstate-red-{{.project}}"
      prefix = "red"
    }
  }
  provider "google" {
    project = "{{.project}}"
    region  = "{{.region}}"
  }
  resource "google_compute_firewall" "cpd_batch" {

en:
  title: CHG · The Terraform plan wants to undo last night's fix
  summary: During an incident a firewall port was opened by hand. Now the code doesn't know and the next apply would remove it, taking reconciliation down. Bring the change into the code, not the console.
  story: |-
    **Project `{{.project}}`** (*zentra-red-prod*).

    > **CHG-31079 · P3** · Pipeline: *"The Terraform plan wants to remove port 8444 from allow-cpd-batch. Pipeline paused awaiting review."*

    At a bank infrastructure lives in **code** (Terraform) and changes through pull requests and pipelines. But during an incident it's sometimes touched by hand with an emergency change. If it then **isn't brought into the code**, **drift** appears: the code says one thing, reality another, and the **next apply undoes the fix** without anyone noticing. Rule: the emergency fix is **consolidated into the code** as soon as the incident is over.

    1. Look at the drift: `terraform plan` (what does it want to change?) and the real rule (`gcloud compute firewall-rules describe allow-cpd-batch`).
    2. Find out who and why (audit log, on-call). Is it a legitimate change?
    3. **Don't apply** the plan as is: it would take reconciliation down.
    4. Bring the change into `main.tf` (add `"8444"` to the ports) and repeat `terraform plan` until it says **No changes**.
    5. Communicate in the ticket: what the drift was, that it's legitimate and that the code now includes it.
  objectives:
  - Look at the drift
  - Who and why
  - Bring the change into the code
  - Clean plan and communication
  hints:
  - Rewrite main.tf with `ports = ["8443", "8444"]` (with `cat > main.tf <<'HCL'` … `HCL`).
  ticket:
    summary: 'The nightly network Terraform plan flags pending changes on allow-cpd-batch: it wants to remove port 8444. The pipeline is paused awaiting review before applying.'
  text:
    Pipeline de red (Terraform): Network pipeline (Terraform)
    Diego Ferrer (SRE): Diego Ferrer (SRE)
    SRE de guardia.: On-call SRE.
    Anoche hubo lío con la conciliación.: There was trouble with reconciliation last night.
    ? 'Sí, fui yo con la cuenta de guardia: el core bancario empezó a llamar por el 8444 tras su actualización y abrí el puerto en el incidente de anoche (CHG-7790, emergencia). Es necesario: si lo quitáis, se cae la conciliación. No me dio tiempo a pasarlo al código.'
    : 'Yes, it was me with the on-call account: core banking started calling on 8444 after its upgrade and I opened the port in last night''s incident (CHG-7790, emergency). It''s needed: if you remove it, reconciliation goes down. I didn''t have time to put it in the code.'
    Javier Luna (Gestión de cambios): Javier Luna (Change management)
    Gestor de cambios (CAB).: Change manager (CAB).
    Ningún cambio en producción sin registro. Si hay clientes afectados, lo apruebo como emergencia.: No production change without a record. If customers are affected, I approve it as an emergency.
    Aprobado como cambio de emergencia (CHG-7795). Anótalo en el ticket con lo que cambias y cómo se vuelve atrás.: Approved as an emergency change (CHG-7795). Note it in the ticket with what you change and how to roll back.
    El plan de Terraform quiere deshacer un arreglo de emergencia legítimo. ¿Qué haces?: The Terraform plan wants to undo a legitimate emergency fix. What do you do?
    Llevar el cambio al código y comprobar que el plan queda sin cambios: Bring the change into the code and check the plan has no changes
    Aplicar el plan, el código manda: Apply the plan, the code rules
    Borrar el estado de Terraform: Delete the Terraform state
    Dejar de usar Terraform para esa regla: Stop using Terraform for that rule
    Conciliación a salvo: Reconciliation safe
    El 8444 sigue abierto: 8444 is still open
    En el código: In the code
    main.tf recoge el 8444: main.tf includes 8444
    Plan antes y después: Plan before and after
    Diagnóstico: Diagnosis
    Confirmado con quien lo cambió: Confirmed with whoever changed it
    Comunicación: Communication
    Qué era y que está en el código: What it was and that it's in the code
    Lo has entendido: You understood it
    Pregunta del caso: Case question
    La deriva: The drift
    'El plan quiere dejar solo el 8443: alguien añadió el 8444 fuera del código.': 'The plan wants to leave only 8443: someone added 8444 outside the code.'
    Quién: Who
    'sre-guardia, anoche: el arreglo de emergencia.': 'sre-guardia, last night: the emergency fix.'
    Al código: Into the code
    'Ahora código y realidad coinciden: plan sin cambios.': 'Now code and reality match: no changes in the plan.'

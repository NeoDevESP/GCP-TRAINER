id: zentra-z79-terraform-drift
title: CHG · El plan de Terraform quiere deshacer el arreglo de anoche
summary: Durante un incidente se abrió a mano un puerto en el cortafuegos. Ahora el código no lo sabe y el próximo apply lo quitaría, tirando la conciliación. Lleva el cambio al código, no a la consola.

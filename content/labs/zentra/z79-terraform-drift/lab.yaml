story: |-
  **Proyecto `{{.project}}`** (*zentra-red-prod*).

  > **CHG-31079 · P3** · Pipeline: *«El plan de Terraform quiere quitar el puerto 8444 de allow-cpd-batch. Pipeline parado esperando revisión.»*

  En un banco la infraestructura vive en **código** (Terraform) y se cambia por *pull request* y pipeline. Pero en un incidente a veces se toca a mano con un cambio de emergencia. Si después **no se lleva al código**, aparece la **deriva** (*drift*): el código dice una cosa, la realidad otra, y el **próximo apply deshace el arreglo** sin que nadie lo note. Regla: el arreglo de emergencia se **consolida en el código** en cuanto pasa el incidente.

  1. Mira la deriva: `terraform plan` (¿qué quiere cambiar?) y la regla real (`gcloud compute firewall-rules describe allow-cpd-batch`).
  2. Averigua quién y por qué (auditoría, la guardia). ¿Es un cambio legítimo?
  3. **No apliques** el plan tal cual: tiraría la conciliación.
  4. Lleva el cambio a `main.tf` (añade `"8444"` a los puertos) y repite `terraform plan` hasta que diga **No changes**.
  5. Comunica en el ticket: qué era la deriva, que es legítima y que el código ya la recoge.
objectives:
- Mira la deriva
- Quién y por qué
- Lleva el cambio al código
- Plan limpio y comunicación
hints:
- text: Reescribe main.tf con `ports = ["8443", "8444"]` (con `cat > main.tf <<'HCL'` … `HCL`).
quiz:
- id: q1
  question: El plan de Terraform quiere deshacer un arreglo de emergencia legítimo. ¿Qué haces?
  options:
  - Llevar el cambio al código y comprobar que el plan queda sin cambios
  - Aplicar el plan, el código manda
  - Borrar el estado de Terraform
  - Dejar de usar Terraform para esa regla
  answer:
  - 0
solution: |
  ticket
  terraform init
  terraform plan
  gcloud compute firewall-rules describe allow-cpd-batch
  gcloud logging read 'protoPayload.methodName:"firewalls"' --limit=5
  ask sre "¿Abriste a mano el 8444 en allow-cpd-batch? ¿Es necesario?"
  cat > main.tf <<'HCL'
  terraform {
    backend "gcs" {
      bucket = "tfstate-red-{{.project}}"
      prefix = "red"
    }
  }
  provider "google" {
    project = "{{.project}}"
    region  = "{{.region}}"
  }
  resource "google_compute_firewall" "cpd_batch" {
    name          = "allow-cpd-batch"
    network       = "zentra-vpc"
    source_ranges = ["192.168.20.0/24"]
    target_tags   = ["batch"]
    allow {
      protocol = "tcp"
      ports    = ["8443", "8444"]
    }
  }
  HCL
  terraform plan
  ticket update "Revisado: la deriva es el puerto 8444 que la guardia abrió anoche en allow-cpd-batch con el cambio de emergencia CHG-7790 (el core bancario llama ahora por ahí). Es necesario, así que no se aplica el plan tal cual: he llevado el 8444 al código (main.tf) y el plan ya sale sin cambios. El pipeline puede seguir."
  ticket resolve "Deriva de allow-cpd-batch consolidada en Terraform (puertos 8443 y 8444); plan sin cambios."
shortcuts:
- name: apply the plan as is
  run: |
    terraform init
    terraform apply -auto-approve
    ticket resolve "Aplicado el plan, el código manda."

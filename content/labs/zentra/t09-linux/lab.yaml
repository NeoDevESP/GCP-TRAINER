solution: |
  ticket
  gcloud compute ssh web-linux --zone={{.zone}} --tunnel-through-iap --command='sudo systemctl status nginx'
  gcloud compute ssh web-linux --zone={{.zone}} --tunnel-through-iap --command='df -h'
  gcloud compute ssh web-linux --zone={{.zone}} --tunnel-through-iap --command='ps aux'
  gcloud compute ssh web-linux --zone={{.zone}} --tunnel-through-iap --command='sudo ss -tlnp'
  echo "24%" > estado.txt
  ticket resolve "Taller 9 hecho: nginx en marcha, disco al 24 %, procesos normales y nginx escuchando en 0.0.0.0:80; entrada siempre por IAP."

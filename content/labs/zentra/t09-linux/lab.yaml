en:
  title: 'Workshop 9 · Linux for support: get in, look and understand a VM'
  summary: 'Get in through IAP and the five checks you''ll do a thousand times: service, disk, files, processes and ports.'
  story: |-
    > 🧰 **Workshop from zero.** You don't need to know anything beforehand. Read each block, copy the command into the terminal below and see what comes out. If you get lost, open the **Tutor** tab: it walks you through step by step.

    Zentra's virtual machines **have no public IP**. You get in with **IAP** (Identity-Aware Proxy): a Google tunnel that checks who you are before letting you through. With `--command='…'` you run one order inside the VM and come back.

    **The five usual checks:**

    1. **Is the service running?** `gcloud compute ssh web-linux --zone={{.zone}} --tunnel-through-iap --command='sudo systemctl status nginx'`
    2. **Is there disk?** `… --command='df -h'` → the `Use%` column is the percentage used. Above 90% you must act.
    3. **What takes the space?** `… --command='sudo du -sh /var/*'`
    4. **Which processes run?** `… --command='ps aux'`
    5. **Which ports does it listen on?** `… --command='sudo ss -tlnp'` → `0.0.0.0:80` means "port 80, for everyone".

    `sudo` before an order runs it as administrator (*root*): use it only when needed.

    **Task:** write the `df -h` percentage in `estado.txt` (e.g. `echo "24%" > estado.txt`) and close.
  objectives:
  - Get in through IAP and check the service
  - Check the disk
  - Check processes and ports
  - Note the disk and close
  hints:
  - '`gcloud compute ssh web-linux --zone={{.zone}} --tunnel-through-iap --command=''df -h''`'
  ticket:
    summary: 'Ninth workshop: get into web-linux and check its health as Support would. Write in estado.txt the disk % used you see with df -h.'

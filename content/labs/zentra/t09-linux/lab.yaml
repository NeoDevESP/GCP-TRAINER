story: |-
  > 🧰 **Taller desde cero.** No necesitas saber nada antes. Lee cada bloque, copia el comando en el terminal de abajo y mira qué sale. Si te pierdes, abre la pestaña **Profesor**: te acompaña paso a paso.

  Las máquinas virtuales de Zentra **no tienen IP pública**. Se entra con **IAP** (Identity-Aware Proxy): un túnel de Google que comprueba quién eres antes de dejarte pasar. Con `--command='…'` ejecutas una orden dentro de la VM y vuelves.

  **Las cinco comprobaciones de siempre:**

  1. **¿Está el servicio en marcha?** `gcloud compute ssh web-linux --zone={{.zone}} --tunnel-through-iap --command='sudo systemctl status nginx'`
  2. **¿Hay disco?** `… --command='df -h'` → la columna `Use%` es el porcentaje usado. Por encima del 90 % hay que actuar.
  3. **¿Qué ocupa?** `… --command='sudo du -sh /var/*'`
  4. **¿Qué procesos corren?** `… --command='ps aux'`
  5. **¿En qué puertos escucha?** `… --command='sudo ss -tlnp'` → `0.0.0.0:80` significa «el puerto 80, para todo el mundo».

  `sudo` delante de una orden la ejecuta como administrador (*root*): úsalo solo cuando haga falta.

  **Tarea:** apunta en `estado.txt` el porcentaje de `df -h` (por ejemplo `echo "24%" > estado.txt`) y cierra.
objectives:
- Entra por IAP y mira el servicio

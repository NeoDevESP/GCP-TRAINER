en:
  title: 'Craft 7 · Change management: plan, approval and rollback'
  summary: Payments asks for more capacity for Friday's campaign. At a bank no change goes into production without a plan, risk, verification, rollback and approval. Write it, get sign-off and do it.
  story: |-
    > 🎧 **Craft workshop.** You won't learn a new product here: you'll learn to **work a ticket** the way a good L2 Support engineer at a bank does. Read the explanation, follow the steps in the terminal and, if you get lost, open the **Tutor** tab.

    > **CHG-40107 · P3** · Payments: *"On Friday we launch Black Friday. Raise pagos-api max-instances to 20 and keep 2 minimum instances warm."*

    At a regulated bank (DORA, audit), **no change goes into production without a record**. There are three types:
    - **Standard**: repetitive and low-risk, pre-approved (e.g. an access request from the catalogue).
    - **Normal**: planned, risk-assessed and approved by the CAB (change advisory board) for a **window**.
    - **Emergency**: to fix an incident with customers affected; approved fast and documented all the same.

    **A change plan** answers six things: **what** changes, **why**, **risk** and impact, **steps**, **how it's verified** and **how it's rolled back** (with the exact previous value).

    **Steps:**
    1. **Look at the current state** and note it: `gcloud run services describe pagos-api --region={{.region}}` (how many max instances does it have now?).
    2. Clarify what's missing with the requester (`ask payments "…"`: until when? cost approved?).
    3. **Write the plan** in `cambio.md` with the sections *Qué (what), Por qué (why), Riesgo (risk), Pasos (steps), Verificación (verification), Vuelta atrás (rollback)*. Under rollback put the command with the previous value (`--max-instances=…`).
    4. **Ask for approval** (`ask change "…"`).
    5. **Make the change**: `gcloud run services update pagos-api --region={{.region}} --max-instances=20 --min-instances=2`.
    6. **Verify** (`describe` again) and **communicate** with the change number and how to roll back: `ticket update "…"`. Close.
  objectives:
  - Note the current state
  - Write the plan in cambio.md
  - Ask for approval
  - Change, verify and communicate
  hints:
  - 'It now has `Max instances: 5`: the rollback is `--max-instances=5 --min-instances=0`.'
  - '`cat > cambio.md` and type the six sections, one per line.'
  ticket:
    summary: On Friday we launch the Black Friday campaign and expect 4 times more payments. Raise pagos-api max-instances to 20 and keep 2 minimum instances always warm.

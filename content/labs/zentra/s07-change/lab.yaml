story: |-
  > 🎧 **Taller del oficio.** Aquí no aprendes un producto nuevo: aprendes a **trabajar un ticket** como lo hace un buen técnico de Soporte N2 en un banco. Lee la explicación, sigue los pasos en el terminal y, si te pierdes, abre la pestaña **Profesor**.

  > **CHG-40107 · P3** · Pagos: *«El viernes lanzamos Black Friday. Subid max-instances de pagos-api a 20 y dejad 2 instancias mínimas calientes.»*

  En un banco regulado (DORA, auditoría), **ningún cambio entra en producción sin registro**. Hay tres tipos:
  - **Estándar**: repetitivo y de bajo riesgo, preaprobado (por ejemplo, un alta de acceso del catálogo).
  - **Normal**: se planifica, se evalúa el riesgo y lo aprueba el CAB (comité de cambios) para una **ventana**.
  - **Emergencia**: para arreglar un incidente con clientes afectados; se aprueba rápido y se documenta igual.

  **Un plan de cambio** responde a seis cosas: **qué** se cambia, **por qué**, **riesgo** e impacto, **pasos**, **cómo se verifica** y **cómo se vuelve atrás** (con el valor exacto de antes).

  **Pasos:**
  1. **Mira el estado actual** y apúntalo: `gcloud run services describe pagos-api --region={{.region}}` (¿cuántas instancias máximas tiene ahora?).
  2. Aclara con quien pide lo que falta (`ask payments "…"`: ¿hasta cuándo?, ¿coste aprobado?).
  3. **Escribe el plan** en `cambio.md` con los apartados *Qué, Por qué, Riesgo, Pasos, Verificación, Vuelta atrás*. En *Vuelta atrás* pon el comando con el valor de antes (`--max-instances=…`).
  4. **Pide aprobación** (`ask change "…"`).
  5. **Haz el cambio**: `gcloud run services update pagos-api --region={{.region}} --max-instances=20 --min-instances=2`.
  6. **Verifica** (`describe` otra vez) y **comunica** con el número de cambio y cómo se vuelve atrás: `ticket update "…"`. Cierra.
objectives:
- Apunta el estado actual
- Escribe el plan en cambio.md
- Pide aprobación
- Cambia, verifica y comunica
hints:
- text: 'Ahora tiene `Max instances: 5`: la vuelta atrás es `--max-instances=5 --min-instances=0`.'
- text: '`cat > cambio.md` y escribe los seis apartados, uno por línea.'
quiz:
- id: q1
  question: Un rollback durante un incidente con clientes afectados es un cambio…
  options:
  - De emergencia
  - Estándar
  - Normal
  - No es un cambio
  answer:
  - 0
- id: q2
  question: ¿Qué apartado del plan salva la noche si algo sale mal?
  options:
  - La vuelta atrás con el valor exacto de antes
  - El por qué
  - La firma
  - El título
  answer:
  - 0
- id: q3
  question: min-instances=2 significa…
  options:
  - Dos instancias siempre encendidas (sin arranque en frío, con coste fijo)
  - Máximo dos instancias
  - Dos regiones
  - Dos revisiones
  answer:
  - 0
solution: |
  ticket
  gcloud run services describe pagos-api --region={{.region}}
  ask payments "¿Hasta cuándo dejamos las 2 instancias mínimas y está aprobado el coste?"
  cat > cambio.md <<'EOF'
  # CHG-40107 · Capacidad de pagos-api para Black Friday
  Qué: pagos-api max-instances 5 -> 20 y min-instances 0 -> 2.
  Por qué: campaña Black Friday, 4 veces más pagos esperados; coste aprobado por FinOps hasta el lunes.
  Riesgo: bajo; más instancias suben el coste y las conexiones al proveedor de pagos. Sin corte de servicio.
  Pasos: gcloud run services update pagos-api --region={{.region}} --max-instances=20 --min-instances=2
  Verificación: describe muestra max 20 y min 2; /pay sigue respondiendo 200.
  Vuelta atrás: gcloud run services update pagos-api --region={{.region}} --max-instances=5 --min-instances=0
  EOF
  ask change "Te paso el plan cambio.md para subir la capacidad de pagos-api, ¿lo apruebas?"
  gcloud run services update pagos-api --region={{.region}} --max-instances=20 --min-instances=2
  gcloud run services describe pagos-api --region={{.region}}
  ticket update "Hola Lucía: hecho con el cambio CHG-7801. pagos-api tiene ahora hasta 20 instancias y 2 siempre calientes, y los pagos siguen respondiendo bien. Vuelta atrás si hiciera falta: volver a 5 máximas y 0 mínimas; el lunes lo hacemos como acordamos."
  ticket resolve "CHG-7801 aplicado: pagos-api max 20 y min 2 para Black Friday, verificado; vuelta atrás a max 5 y min 0 el lunes."
shortcuts:
- name: change straight away, no plan
  run: |
    gcloud run services update pagos-api --region={{.region}} --max-instances=20 --min-instances=2
    ticket resolve "Cambiado lo que pedían, sin más."

    Preguntas del taller: Workshop questions
    Antes de tocar: Before touching
    'Max instances: 5. Ese valor va en la vuelta atrás.': 'Max instances: 5. That value goes in the rollback.'
    El plan: The plan
    Qué, por qué, riesgo, pasos, verificación y vuelta atrás.: What, why, risk, steps, verification and rollback.
    Aprobación: Approval
    'Cambio normal: el CAB lo aprueba para una ventana.': 'Normal change: the CAB approves it for a window.'

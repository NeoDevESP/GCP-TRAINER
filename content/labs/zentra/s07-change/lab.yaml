    Tech lead de Pagos.: Payments tech lead.
    Necesitamos que aguante el pico del viernes.: We need it to handle Friday's peak.
    Las 2 mínimas solo hasta el lunes; el coste está aprobado por FinOps para la campaña. El lunes volvemos a 5 y sin mínimas.: The 2 minimum only until Monday; FinOps approved the cost for the campaign. On Monday we go back to 5 and no minimum.
    Un rollback durante un incidente con clientes afectados es un cambio…: A rollback during an incident with customers affected is a … change
    De emergencia: Emergency
    Estándar: Standard
    Normal: Normal
    No es un cambio: Not a change

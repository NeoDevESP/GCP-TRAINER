id: zentra-s07-change
title: 'Oficio 7 · Gestión de cambios: plan, aprobación y vuelta atrás'
summary: Pagos pide más capacidad para la campaña del viernes. En un banco ningún cambio entra en producción sin plan, riesgo, verificación, vuelta atrás y aprobación. Escríbelo, pide el visto bueno y hazlo.

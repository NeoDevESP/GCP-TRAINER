en:
  title: REQ P3 · A read replica for month-end reports
  summary: 'The improvement left pending after month-end: reports read from a replica and the app''s database stays free.'
  story: |-
    **Project `{{.project}}`** (*zentra-cuentas-prod*).

    > **REQ-21066 · P3** · *"After the month-end incident (INC-31035), we agreed reports won't read from cuentas-db. Can you create a read replica and tell us how to connect?"*

    A **read replica** is a copy Cloud SQL keeps up to date asynchronously: it accepts queries, not writes, and its connections don't count against the primary. Create it in the same region, with a private IP like the primary, and tell Data it may lag a few seconds behind.
  objectives:
  - Confirm name and region
  - Create the replica with a change
  - Check it replicates and is private
  - Explain how to use it
  hints:
  - '`gcloud sql instances create cuentas-db-informes --master-instance-name=cuentas-db --region={{.region}}`'
  ticket:
    summary: After the month-end incident (INC-31035), we agreed reports won't read from cuentas-db. Can you create a read replica and tell us how to connect?
  text:

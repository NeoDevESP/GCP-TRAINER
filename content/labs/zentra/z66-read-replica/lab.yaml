story: |-
  **Proyecto `{{.project}}`** (*zentra-cuentas-prod*).

  > **REQ-21066 · P3** · *«Tras la incidencia del cierre (INC-31035), acordamos que los informes no lean de cuentas-db. ¿Nos creáis una réplica de lectura y nos decís cómo conectar?»*

  Una **réplica de lectura** es una copia que Cloud SQL mantiene al día de forma asíncrona: acepta consultas, no escrituras, y sus conexiones no cuentan contra la instancia principal. Créala en la misma región, con IP privada como la principal, y explica a Datos que puede ir unos segundos por detrás.
objectives:
- Confirma nombre y región
- Crea la réplica con un cambio
- Comprueba que replica y es privada
- Explica cómo usarla
hints:
- text: '`gcloud sql instances create cuentas-db-informes --master-instance-name=cuentas-db --region={{.region}}`'
solution: |
  ticket
  ask data "¿cómo quieres llamar la réplica?"
  ask data "¿en qué región la necesitáis?"
  ask change "¿apruebas crear una réplica de lectura de cuentas-db?"
  gcloud sql instances create cuentas-db-informes --master-instance-name=cuentas-db --region={{.region}}
  gcloud sql instances describe cuentas-db-informes
  ticket update "Hola Sara: ya tenéis cuentas-db-informes, réplica de lectura de cuentas-db en {{.region}} con IP privada. Usad su IP para los informes del cierre: acepta consultas pero no escrituras, y puede ir unos segundos por detrás de la principal. Vuestras conexiones ya no afectan a la app."
  ticket resolve "Creada la réplica de lectura cuentas-db-informes para los informes de Datos (CHG-7830)."
shortcuts:
- name: bigger primary
  run: |
    gcloud sql instances patch cuentas-db --tier=db-custom-4-15360 --quiet
    ticket resolve "Ampliada cuentas-db para que aguante también los informes."

    'Crear un recurso nuevo en PRO es un cambio estándar: te doy número.': 'Creating a new resource in PRO is a standard change: I''ll give you a number.'
    'Crear un bucket nuevo en PRO con el estándar es un cambio estándar preaprobado: usa CHG-8110 y anótalo en el ticket.': 'Creating a new bucket in PRO with the standard is a pre-approved standard change: use CHG-8110 and note it on the ticket.'
    Ingeniera de datos del equipo de cartera.: Data engineer of the cartera team.
    Los nombres y los proyectos van en el ticket.: The names and projects are in the ticket.
    'Lo de siempre: el estándar del banco. En la región de Bélgica, con la clave de cada proyecto.': 'The usual: the bank standard. In the Belgium region, with each project''s key.'
    ¿Por qué cada bucket usa la clave KMS de su propio proyecto y no una común?: Why does each bucket use its own project's KMS key and not a shared one?
    Cada entorno queda aislado y PRO no depende de DEV: Each environment stays isolated and PRO does not depend on DEV
    Porque es más barato: Because it is cheaper
    Porque Cloud Storage no deja usar claves de otro proyecto: Because Cloud Storage does not allow keys from another project
    Da igual, es por costumbre: It doesn't matter, it's habit

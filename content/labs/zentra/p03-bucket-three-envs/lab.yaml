ticket:
  id: REQ-41233
  kind: REQ
  priority: P3
  sla: 5d
  reporter: Sara Benítez (Datos · Cartera)
  summary: 'Para la iniciativa «Intercambio con gestoras» solicitamos la creación de un bucket en los tres entornos, DEV, AU y PRO. DEV: gcs-intercambio-dev-418526730194. AU: gcs-intercambio-au-725361948027. PRO: gcs-intercambio-pro-903174625518. Nombre: gcs-intercambio-<env>-<project-number>.'
actors:
- role: change
  name: Javier Luna (Gestión de cambios)
  persona: Gestor de cambios (CAB).
  fallback: 'Crear un recurso nuevo en PRO es un cambio estándar: te doy número.'
  facts:
  - keywords:
    - - pro
      - produccion
      - producción
      - cambio
      - change
      - bucket
    answer: 'Crear un bucket nuevo en PRO con el estándar es un cambio estándar preaprobado: usa CHG-8110 y anótalo en el ticket.'
- role: requester
  name: Sara Benítez (Datos · Cartera)
  persona: Ingeniera de datos del equipo de cartera.
  fallback: Los nombres y los proyectos van en el ticket.
  facts:
  - keywords:
    - - region
      - región
      - ubicacion
      - ubicación
      - location
      - cifrado
      - cmek
      - estandar
      - estándar
    answer: 'Lo de siempre: el estándar del banco. En la región de Bélgica, con la clave de cada proyecto.'
story: |-
  **Proyectos de cartera**: `dev-zentra-cartera` (DEV), `au-zentra-cartera` (AU) y `zentra-cartera` (PRO).

  > **REQ-41233 · P3** · Cartera: *«Solicitamos la creación de un bucket en los tres entornos. DEV: `gcs-intercambio-dev-418526730194` · AU: `gcs-intercambio-au-725361948027` · PRO: `gcs-intercambio-pro-903174625518`»*

  **Estándar de buckets de Zentra** (lo que el banco exige siempre, aunque el ticket no lo diga):

  | Campo | Valor |
  |---|---|
  | Ubicación | Región `europe-west1` (datos en la UE) |
  | Control de acceso | **Uniforme** |
  | Acceso público | **Prevención aplicada** |
  | Cifrado | **Clave del cliente** del propio proyecto: `projects/<proyecto>/locations/europe-west1/keyRings/zentra-almacen/cryptoKeys/gcs` |
  | Etiquetas | `app=cartera` y `env=dev` / `au` / `pro` |

  **En la consola**, para **cada entorno**:
  1. **Selector de proyectos** › el proyecto del entorno. Comprueba en el **Panel** que el **número** coincide con el del nombre del bucket.
  2. **Menú › Cloud Storage › Buckets › Crear bucket** y rellena con el estándar (el cifrado y las etiquetas están al final del formulario).
  3. Crear y revisar el bucket.

  **PRO** no se toca sin cambio: pregunta a Gestión de cambios y anota el número en el ticket. Al terminar, responde con los tres nombres y resuelve.
objectives:
- Comprueba el número de cada proyecto
- Bucket en DEV con el estándar
- Bucket en AU con el estándar
- Cambio para PRO
- Bucket en PRO con el estándar
- Responde y resuelve el ticket
hints:
- text: 'Cada bucket va en su proyecto: cambia el proyecto en el selector antes de pulsar «Crear bucket». La clave CMEK es la del mismo proyecto.'
quiz:
- id: q1
  question: ¿Por qué cada bucket usa la clave KMS de su propio proyecto y no una común?
  options:
  - Cada entorno queda aislado y PRO no depende de DEV
  - Porque es más barato
  - Porque Cloud Storage no deja usar claves de otro proyecto
  - Da igual, es por costumbre
  answer:
  - 0
- id: q2
  question: Vas a crear el bucket de AU y el selector dice dev-zentra-cartera. ¿Qué haces?
  options:
  - Cambio al proyecto de AU y compruebo su número antes de crear nada
  - Lo creo y luego lo muevo
  - Lo creo igual, el nombre ya dice que es de AU
  - Pongo --project en el nombre
  answer:
  - 0
solution: |
  ticket
  gcloud config set project dev-zentra-cartera
  gcloud projects describe dev-zentra-cartera --format='value(projectNumber)'
  gcloud storage buckets create gs://gcs-intercambio-dev-418526730194 --location=europe-west1 --uniform-bucket-level-access --public-access-prevention --default-encryption-key=projects/dev-zentra-cartera/locations/europe-west1/keyRings/zentra-almacen/cryptoKeys/gcs --labels=app=cartera,env=dev
  gcloud config set project au-zentra-cartera
  gcloud projects describe au-zentra-cartera --format='value(projectNumber)'
  gcloud storage buckets create gs://gcs-intercambio-au-725361948027 --location=europe-west1 --uniform-bucket-level-access --public-access-prevention --default-encryption-key=projects/au-zentra-cartera/locations/europe-west1/keyRings/zentra-almacen/cryptoKeys/gcs --labels=app=cartera,env=au
  ask change "¿Qué cambio uso para crear un bucket nuevo en PRO de cartera?"
  gcloud config set project zentra-cartera
  gcloud projects describe zentra-cartera --format='value(projectNumber)'
  gcloud storage buckets create gs://gcs-intercambio-pro-903174625518 --location=europe-west1 --uniform-bucket-level-access --public-access-prevention --default-encryption-key=projects/zentra-cartera/locations/europe-west1/keyRings/zentra-almacen/cryptoKeys/gcs --labels=app=cartera,env=pro
  gcloud storage buckets describe gs://gcs-intercambio-pro-903174625518
  ticket update "Hola Sara: creados los tres buckets con el estándar del banco (europe-west1, acceso uniforme, prevención de acceso público, CMEK con la clave gcs de cada proyecto y etiquetas app/env). DEV: gcs-intercambio-dev-418526730194 en dev-zentra-cartera. AU: gcs-intercambio-au-725361948027 en au-zentra-cartera. PRO: gcs-intercambio-pro-903174625518 en zentra-cartera, con el cambio estándar CHG-8110."
  ticket resolve "Buckets gcs-intercambio creados en DEV, AU y PRO con el estándar; PRO con CHG-8110."
shortcuts:
- name: all three in the DEV project
  run: |
    gcloud config set project dev-zentra-cartera
    gcloud storage buckets create gs://gcs-intercambio-dev-418526730194 --location=europe-west1 --uniform-bucket-level-access --public-access-prevention --default-encryption-key=projects/dev-zentra-cartera/locations/europe-west1/keyRings/zentra-almacen/cryptoKeys/gcs --labels=app=cartera,env=dev
    gcloud storage buckets create gs://gcs-intercambio-au-725361948027 --location=europe-west1 --uniform-bucket-level-access --public-access-prevention --default-encryption-key=projects/dev-zentra-cartera/locations/europe-west1/keyRings/zentra-almacen/cryptoKeys/gcs --labels=app=cartera,env=au
    gcloud storage buckets create gs://gcs-intercambio-pro-903174625518 --location=europe-west1 --uniform-bucket-level-access --public-access-prevention --default-encryption-key=projects/dev-zentra-cartera/locations/europe-west1/keyRings/zentra-almacen/cryptoKeys/gcs --labels=app=cartera,env=pro
    ticket update "Hola Sara: creados los tres buckets gcs-intercambio de DEV, AU y PRO."
    ticket resolve "Buckets gcs-intercambio creados en los tres entornos pedidos."
- name: buckets without the standard
  run: |
    gcloud storage buckets create gs://gcs-intercambio-dev-418526730194 --project=dev-zentra-cartera --location=europe-west1
    gcloud storage buckets create gs://gcs-intercambio-au-725361948027 --project=au-zentra-cartera --location=europe-west1
    gcloud storage buckets create gs://gcs-intercambio-pro-903174625518 --project=zentra-cartera --location=europe-west1
    ticket update "Hola Sara: creados los tres buckets gcs-intercambio en DEV, AU y PRO con CHG-8110."
    ticket resolve "Buckets gcs-intercambio creados en los tres entornos pedidos."

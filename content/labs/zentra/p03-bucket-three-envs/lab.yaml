id: zentra-p03-bucket-three-envs
title: REQ · Un bucket en DEV, AU y PRO con el estándar del banco
summary: 'Cartera pide el mismo bucket en los tres entornos, con el nombre gcs-intercambio-<entorno>-<número de proyecto>. Comprueba cada número, aplica el estándar (UE, acceso uniforme, sin acceso público, CMEK, etiquetas) y PRO con su cambio.'

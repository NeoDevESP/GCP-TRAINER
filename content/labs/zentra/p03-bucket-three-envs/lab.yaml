en:
  title: REQ · A bucket in DEV, AU and PRO with the bank's standard
  summary: 'Cartera asks for the same bucket in the three environments, named gcs-intercambio-<environment>-<project number>. Check each number, apply the standard (EU, uniform access, no public access, CMEK, labels) and PRO with its change.'
  story: |-
    **Cartera projects**: `dev-zentra-cartera` (DEV), `au-zentra-cartera` (AU) and `zentra-cartera` (PRO).

    > **REQ-41233 · P3** · Cartera: *"We request a bucket in the three environments. DEV: `gcs-intercambio-dev-418526730194` · AU: `gcs-intercambio-au-725361948027` · PRO: `gcs-intercambio-pro-903174625518`"*

    **Zentra bucket standard** (what the bank always requires, even if the ticket doesn't say):

    | Field | Value |
    |---|---|
    | Location | Region `europe-west1` (data in the EU) |
    | Access control | **Uniform** |
    | Public access | **Prevention enforced** |
    | Encryption | **Customer-managed key** of the project itself: `projects/<project>/locations/europe-west1/keyRings/zentra-almacen/cryptoKeys/gcs` |
    | Labels | `app=cartera` and `env=dev` / `au` / `pro` |

    **In the console**, for **each environment**:
    1. **Project picker** › the environment's project. Check on the **Dashboard** that the **number** matches the one in the bucket name.
    2. **Menu › Cloud Storage › Buckets › Create bucket** and fill it in with the standard (encryption and labels are at the end of the form).
    3. Create and review the bucket.

    **PRO** is not touched without a change: ask Change management and note the number on the ticket. When done, reply with the three names and resolve.
  objectives:
  - Check each project's number
  - DEV bucket with the standard
  - AU bucket with the standard
  - Change for PRO
  - PRO bucket with the standard
  - Reply and resolve the ticket
  hints:
  - 'Each bucket goes in its project: switch the project in the picker before pressing "Create bucket". The CMEK key is the one of the same project.'
  ticket:
    summary: 'For the "Exchange with asset managers" initiative we request a bucket in the three environments, DEV, AU and PRO. DEV: gcs-intercambio-dev-418526730194. AU: gcs-intercambio-au-725361948027. PRO: gcs-intercambio-pro-903174625518. Name: gcs-intercambio-<env>-<project-number>.'
  text:
    Sara Benítez (Datos · Cartera): Sara Benítez (Data · Cartera)
    Javier Luna (Gestión de cambios): Javier Luna (Change management)

    Cambio al proyecto de AU y compruebo su número antes de crear nada: I switch to the AU project and check its number before creating anything
    Lo creo y luego lo muevo: I create it and move it later
    Lo creo igual, el nombre ya dice que es de AU: I create it anyway, the name already says it is AU
    Pongo --project en el nombre: I put --project in the name
    Cada bucket en su proyecto: Each bucket in its project
    Bucket de DEV en dev-zentra-cartera: DEV bucket in dev-zentra-cartera
    Bucket de AU en au-zentra-cartera: AU bucket in au-zentra-cartera
    Bucket de PRO en zentra-cartera: PRO bucket in zentra-cartera

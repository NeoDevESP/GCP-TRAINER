story: |-
  > 🎧 **Taller del oficio.** Aquí no aprendes un producto nuevo: aprendes a **trabajar un ticket** como lo hace un buen técnico de Soporte N2 en un banco. Lee la explicación, sigue los pasos en el terminal y, si te pierdes, abre la pestaña **Profesor**.

  > **REQ-40108 · P3** · Hugo (Tarjetas): *«Necesito Owner en producción para depurar lo de los límites. Con lo que tengo no veo nada. Es urgente, me lo ha dicho mi jefa.»*

  En soporte de banca dirás **que no** a menudo: Owner o Editor en producción, una IP pública, un bucket público, una clave de cuenta de servicio… Hay normas (mínimo privilegio, DORA, auditoría) que **no dependen de la prisa ni del cargo** de quien lo pide. Pero un «no» seco genera escalados y enfado. **Un buen «no» tiene tres partes**:

  1. **Qué necesitas de verdad.** La gente pide la solución que imagina («Owner») en vez del problema («no veo los registros»). Pregunta: `ask dev "¿Qué necesitas hacer exactamente?"` y `ask dev "¿Qué ves cuando lo intentas?"`.
  2. **Comprueba qué tiene ya.** Muchas veces ya puede: `gcloud projects get-iam-policy {{.project}}` y `gam print group-members gcp-producto@zentra.dev` (los grupos pueden contener grupos).
  3. **No + motivo + alternativa.** Explica en una frase por qué no (norma, no opinión), y da el camino que **sí** funciona. Si de verdad faltara un permiso, sería el rol concreto, por su grupo, y con ticket.

  Ante la presión («me lo ha dicho mi jefa»), confirma la norma con tu responsable (`ask manager "…"`): no tienes que defenderla tú solo.

  **No concedas nada** que no haga falta. Responde con `ticket update "…"` y cierra.
objectives:
- Averigua qué necesita de verdad
- Comprueba lo que ya tiene
- No + motivo + alternativa
- Sin conceder de más
hints:
- text: Hugo está en gcp-tarjetas-dev, que está dentro de gcp-producto, que tiene logging.viewer y run.viewer en este proyecto.
- text: 'Su problema real: mira el proyecto equivocado (zentra-tarjetas-dev).'

solution: |
  ticket
  ask dev "¿Qué necesitas hacer exactamente?"
  ask dev "¿Qué ves cuando lo intentas? ¿En qué proyecto estás mirando?"
  gcloud projects get-iam-policy {{.project}}
  gam print group-members gcp-producto@zentra.dev
  gam print group-members gcp-tarjetas-dev@zentra.dev
  ask manager "Hugo pide Owner en producción y dice que lo ha pedido su jefa, ¿confirmas que no se da?"
  ticket update "Hola Hugo: Owner en producción no podemos darlo: va contra la norma de mínimo privilegio del banco, para todos. Pero no lo necesitas: ya puedes ver los registros y la configuración de tarjetas-api por tu grupo (gcp-tarjetas-dev, dentro de gcp-producto). Lo que pasa es que estabas en el proyecto zentra-tarjetas-dev: cambia arriba al proyecto {{.project}} y filtra por resource.type=cloud_run_revision. Si después te falta algo concreto, dime qué y lo pedimos para tu grupo."
  ticket resolve "Owner denegado por norma; Hugo ya tenía lectura de registros y Cloud Run por su grupo, miraba el proyecto equivocado."

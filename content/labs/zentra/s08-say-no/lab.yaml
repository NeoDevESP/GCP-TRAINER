en:
  title: Craft 8 · Saying no (and offering an alternative)
  summary: '"Give me Owner in production, it''s urgent, my manager said so." At a bank the answer is no. But a good "no" finds out what they really need and solves it.'
  story: |-
    > 🎧 **Craft workshop.** You won't learn a new product here: you'll learn to **work a ticket** the way a good L2 Support engineer at a bank does. Read the explanation, follow the steps in the terminal and, if you get lost, open the **Tutor** tab.

    > **REQ-40108 · P3** · Hugo (Cards): *"I need Owner in production to debug the limits issue. With what I have I can't see anything. It's urgent, my manager said so."*

    In banking support you'll say **no** often: Owner or Editor in production, a public IP, a public bucket, a service account key… There are rules (least privilege, DORA, audit) that **don't depend on the hurry or the rank** of whoever asks. But a blunt "no" creates escalations and anger. **A good "no" has three parts**:

    1. **What they really need.** People ask for the solution they imagine ("Owner") instead of the problem ("I can't see the logs"). Ask: `ask dev "What exactly do you need to do?"` and `ask dev "What do you see when you try?"`.
    2. **Check what they already have.** Often they already can: `gcloud projects get-iam-policy {{.project}}` and `gam print group-members gcp-producto@zentra.dev` (groups can contain groups).
    3. **No + reason + alternative.** Explain in one sentence why not (a rule, not an opinion), and give the path that **does** work. If a permission were really missing, it'd be the specific role, through their group, with a ticket.

    Under pressure ("my manager said so"), confirm the rule with your manager (`ask manager "…"`): you don't have to defend it alone.

    **Don't grant anything** that isn't needed. Reply with `ticket update "…"` and close.
  objectives:
  - Find out what he really needs
  - Check what he already has
  - No + reason + alternative
  - Without over-granting
  hints:
  - Hugo is in gcp-tarjetas-dev, which is inside gcp-producto, which has logging.viewer and run.viewer on this project.
  - 'His real problem: he''s looking at the wrong project (zentra-tarjetas-dev).'

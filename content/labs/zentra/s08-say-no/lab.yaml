    En el explorador de registros me sale todo vacío… Ahora que lo dices, arriba pone zentra-tarjetas-dev.: In the log explorer everything is empty… Now that you mention it, it says zentra-tarjetas-dev at the top.
    Marta Ibáñez (responsable de Plataforma): Marta Ibáñez (Platform lead)
    Tu responsable en Zentra.: Your manager at Zentra.
    'Esta semana es para aprender el oficio: pregunta todo lo que necesites.': 'This week is for learning the craft: ask anything you need.'
    ? 'No se da Owner a nadie en producción: ni a Hugo ni a nadie. Si necesita algo concreto, el rol concreto y por su grupo. Y su jefa lo sabe.'
    : 'Nobody gets Owner in production: not Hugo, not anyone. If he needs something specific, the specific role and through his group. His manager knows that.'
    Nadia Kowalski (Seguridad cloud): Nadia Kowalski (Cloud security)

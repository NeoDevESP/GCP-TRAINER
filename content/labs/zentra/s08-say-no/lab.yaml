    Solo «no»: Just "no"
    Un «sí» temporal para que no se enfade: A temporary "yes" so they don't get upset
    Un escalado a su jefa: An escalation to their manager
    Alguien pide Owner «porque no ve nada». Lo primero es…: Someone asks for Owner "because they can't see anything". The first thing is…
    Preguntar qué necesita y qué ve: Ask what they need and what they see
    Dárselo una hora: Give it for an hour
    Dárselo si lo aprueba su jefa: Give it if their manager approves
    Cerrar el ticket: Close the ticket
    Si de verdad faltara un permiso, ¿cómo se da?: If a permission were really missing, how is it granted?
    El rol concreto, a su grupo, con ticket: The specific role, to their group, with a ticket
    Editor a la persona: Editor to the person
    Owner temporal: Temporary Owner
    Una clave de cuenta de servicio: A service account key
    Nada concedido de más: Nothing over-granted
    Sin roles básicos (Owner/Editor/Viewer) en el proyecto: No basic roles (Owner/Editor/Viewer) on the project
    Nada dado a Hugo a título personal: Nothing granted to Hugo personally
    Y sí puede ver los registros (ya podía): And he can see the logs (he already could)
    Qué necesitaba y qué tenía: What he needed and what he had
    Preguntado qué necesita y qué ve: Asked what he needs and what he sees
    Comprobado lo que ya tiene: Checked what he already has
    No + motivo + alternativa: No + reason + alternative
    Dice que no, por qué y cómo ver los registros: Says no, why and how to see the logs
    Lo has entendido: You understood it
    Preguntas del taller: Workshop questions
    El problema real: The real problem
    'Ver registros y configuración: para eso no hace falta Owner.': 'Seeing logs and configuration: that doesn''t need Owner.'
    La pista: The clue
    'zentra-tarjetas-dev: está mirando otro proyecto.': 'zentra-tarjetas-dev: he''s looking at another project.'
    Lo que ya tiene: What he already has
    gcp-producto tiene logging.viewer y run.viewer, y Hugo está dentro por gcp-tarjetas-dev.: gcp-producto has logging.viewer and run.viewer, and Hugo is in it through gcp-tarjetas-dev.
    El buen no: The good no
    No, la norma, y el camino que sí funciona.: No, the rule, and the path that does work.

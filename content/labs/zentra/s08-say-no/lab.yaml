id: zentra-s08-say-no
title: Oficio 8 · Decir que no (y dar una alternativa)
summary: «Dame Owner en producción, es urgente, me lo ha dicho mi jefa.» En un banco la respuesta es no. Pero un buen «no» descubre qué necesita de verdad y se lo resuelve.

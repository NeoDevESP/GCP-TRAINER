    desc: La regla de Seguridad sigue existiendo
  - type: tcp
    from: vm:ops-consola
    to: vm:pagos-core
    port: 8080
    expect: false
    desc: Otros orígenes siguen bloqueados
- name: Diagnóstico
  validator: diagnosis
  points: 15
  all: true
  checks:
  - type: command
    regex: firewall-rules (list|describe)|logging read
    min: 2
    desc: Reglas y auditoría revisadas
  - type: asked
    actor: security
    min: 1
    desc: Consultado con Seguridad
- name: Documentado
  validator: evidence
  points: 20
  all: true
  checks:
  - type: ticket_update
    public: false
    keywords:
    - - prioridad
      - priority
    - - '900'
      - '65000'
    desc: Nota con la causa
  - type: ticket_resolved
    desc: Ticket cerrado
tutor:
- match: firewall-rules list
  title: Todas las reglas
  why: 'allow 1000 frente a deny 900: gana el número más bajo, la denegación.'
- match: firewalls.patch
  title: Quién lo cambió
  why: La auditoría muestra la cuenta del script de endurecimiento.
- match: --priority=65000
  title: ''
  why: La denegación vuelve a ser la red de seguridad, por debajo de las allow.
en:
  title: 'INC P1 · Cards won''t authorize: "connection timed out" to payments'
  summary: A Security deny rule changed priority and now beats the rule that allows the traffic. It's fixed with the right priority, not by deleting the rule.
  story: |-
    **Project `{{.project}}`** (*zentra-pagos-prod*).

    > **INC-31038 · P1** · *"For 20 minutes card purchases have been declined: the authorizer can't reach pagos-core (connection timed out on 8080). We haven't deployed anything."*

    In a VPC, when several firewall rules match, **the one with the lowest priority number wins** (0 is the strongest, 65535 the weakest). Payments has a rule allowing cards (`allow-tarjetas-a-pagos`) and a Security "safety net" denying everyone else (`seg-deny-resto-a-pagos`). Check which rule is winning, find who changed it and fix it **without deleting** Security's rules.
  objectives:
  - Compare the rules and their priorities
  - Find the change in the audit log
  - Restore the priority with Security's OK
  - Check everyone else is still blocked
  hints:
  - '`gcloud compute firewall-rules list --filter=''network:zentra-vpc'' --format=''table(name,priority,direction,sourceTags.list(),targetTags.list(),allowed[].map().firewall_rule().list(),denied[].map().firewall_rule().list())''`'
  - '`gcloud compute firewall-rules update seg-deny-resto-a-pagos --priority=65000`'
  ticket:
    summary: 'For 20 minutes card purchases have been declined: the authorizer can''t reach pagos-core (connection timed out on 8080). We haven''t deployed anything.'
  text:
    Equipo de Tarjetas: Cards team
    Nadia Kowalski (Seguridad cloud): Nadia Kowalski (Cloud security)
    Ingeniera de seguridad cloud.: Cloud security engineer.
    'Las reglas seg-* son nuestras: no se borran. Si algo bloquea de más, dímelo y lo vemos.': 'The seg-* rules are ours: they don''t get deleted. If something blocks too much, tell me and we''ll look at it.'
    ? ¡Uy! El script de endurecimiento le puso prioridad 900. Esa regla es la red de seguridad y debe ir en 65000, por debajo de las allow. Devuélvela a 65000, no la borres.
    : Oops! The hardening script set it to priority 900. That rule is the safety net and must be at 65000, below the allow rules. Put it back to 65000, don't delete it.
    Diego Ferrer (SRE): Diego Ferrer (SRE)
    SRE de guardia.: On-call SRE.
    ¿Qué ha cambiado? Mira los registros y la auditoría.: What changed? Check the logs and the audit trail.
    Tarjetas autoriza: Cards authorize
    El autorizador llega a pagos: The authorizer reaches payments
    Red de seguridad intacta: Safety net intact
    La regla de Seguridad sigue existiendo: The Security rule still exists
    Otros orígenes siguen bloqueados: Other sources still blocked
    Diagnóstico: Diagnosis
    Reglas y auditoría revisadas: Rules and audit checked
    Consultado con Seguridad: Checked with Security
    Documentado: Documented
    Nota con la causa: Note with the cause
    Ticket cerrado: Ticket closed
    Todas las reglas: All the rules
    'allow 1000 frente a deny 900: gana el número más bajo, la denegación.': 'allow 1000 vs deny 900: the lowest number wins, the deny.'
    Quién lo cambió: Who changed it
    La auditoría muestra la cuenta del script de endurecimiento.: The audit log shows the hardening script's account.
    La denegación vuelve a ser la red de seguridad, por debajo de las allow.: The deny is the safety net again, below the allow rules.

    Qué está abierto, en qué estado, qué falta y qué vigilar: What's open, its state, what's left and what to watch
    Solo «todo bien»: Just "all good"
    Las contraseñas del turno: The shift's passwords
    'Nada: el siguiente lo leerá todo': 'Nothing: the next one will read everything'
    Pagos restaurados: Payments restored
    Los pagos funcionan (/pay responde 200): Payments work (/pay returns 200)

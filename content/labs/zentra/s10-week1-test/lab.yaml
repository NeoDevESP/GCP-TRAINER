    Repriorizado a P1 y anotado: Reprioritised to P1 and noted
    Acuse con la próxima actualización: Acknowledgement with the next update
    Qué cambió y cambio de emergencia: What changed and emergency change
    Registros, auditoría o política revisados: Logs, audit log or policy checked
    Cambio de emergencia aprobado: Emergency change approved
    Comunicación: Communication
    Nota interna con la causa: Internal note with the cause
    Negocio informado de que funciona: Business told it works
    Sin jerga ni nombres al negocio: No jargon or names to the business
    Traspaso: Handover
    Con el ticket: With the ticket

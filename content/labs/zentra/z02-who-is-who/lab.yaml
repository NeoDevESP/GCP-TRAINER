story: |-
  > 📘 **Tutorial guiado.** Sigue los pasos en orden; cada comando trae su explicación. Si te pierdes, pulsa **Tutor** y te acompaña paso a paso.

  En Zentra **los permisos de Google Cloud nunca se dan a personas, sino a grupos de Google**. Vamos a verlo con datos reales.

  **Paso 1 · Mira a un compañero.** `gam info user pablo.costa@zentra.dev` muestra su ficha de Workspace: unidad organizativa, cargo y **grupos** a los que pertenece.

  **Paso 2 · Mira qué da cada grupo en GCP.** `gcloud projects get-iam-policy {{.project}}` lista los permisos del proyecto. Busca `group:gcp-soporte@zentra.dev`: ese rol es lo que ve Pablo.

  **Paso 3 · Grupos dentro de grupos.** `gcloud identity groups memberships list --group-email=gcp-producto@zentra.dev`: verás que contiene *otros grupos*. Quien esté en `gcp-pagos-dev` hereda lo de `gcp-producto`.

  **Paso 4 · Da el acceso a Rocío** metiéndola en el grupo correcto:
  `gcloud identity groups memberships add --group-email=gcp-soporte@zentra.dev --member-email=rocio.perez@zentra.dev`
  y compruébalo con `gcloud identity groups memberships check-transitive-membership --group-email=gcp-soporte@zentra.dev --member-email=rocio.perez@zentra.dev`.

  **Paso 5 · Responde** las preguntas y cierra el ticket.
objectives:
- Averigua de qué grupos es Pablo y qué le dan en GCP
- Entiende los grupos anidados
- Da acceso a Rocío por grupo, sin permisos directos
- Responde y cierra

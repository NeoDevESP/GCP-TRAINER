    roles/browser: roles/browser
    roles/owner: roles/owner
    roles/editor: roles/editor
    roles/run.admin: roles/run.admin
    Acceso por grupo: Access through the group
    Rocío está en gcp-soporte: Rocío is in gcp-soporte

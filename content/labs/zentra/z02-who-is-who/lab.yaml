en:
  title: 'Tutorial 2 · Who''s who: Workspace, groups and permissions'
  summary: Discover how GCP permissions reach each person through Google groups and grant your first access the Zentra way.
  story: |-
    > 📘 **Guided tutorial.** Follow the steps in order; every command comes with its explanation. If you get lost, press **Tutor** and it walks you through.

    At Zentra **Google Cloud permissions are never granted to people, but to Google groups**. Let's see it with real data.

    **Step 1 · Look at a colleague.** `gam info user pablo.costa@zentra.dev` shows his Workspace record: organizational unit, title and the **groups** he belongs to.

    **Step 2 · See what each group grants in GCP.** `gcloud projects get-iam-policy {{.project}}` lists the project's permissions. Look for `group:gcp-soporte@zentra.dev`: that role is what Pablo sees.

    **Step 3 · Groups inside groups.** `gcloud identity groups memberships list --group-email=gcp-producto@zentra.dev`: you'll see it contains *other groups*. Whoever is in `gcp-pagos-dev` inherits what `gcp-producto` has.

    **Step 4 · Give Rocío access** by adding her to the right group:
    `gcloud identity groups memberships add --group-email=gcp-soporte@zentra.dev --member-email=rocio.perez@zentra.dev`
    and check it with `gcloud identity groups memberships check-transitive-membership --group-email=gcp-soporte@zentra.dev --member-email=rocio.perez@zentra.dev`.

    **Step 5 · Answer** the questions and close the ticket.
  objectives:
  - Find out Pablo's groups and what they grant in GCP
  - Understand nested groups
  - Grant Rocío access through the group, no direct permissions
  - Answer and close
  hints:
  - '`gam info user pablo.costa@zentra.dev`.'
  - The support group is `gcp-soporte@zentra.dev`.

    Pablo Costa (Service Desk): Pablo Costa (Service Desk)
    Compañero de Rocío en el Service Desk.: Rocío's teammate at the Service Desk.
    Yo veo los proyectos y poco más; nunca me han dado permisos sueltos.: I can see the projects and not much else; I've never been given loose permissions.
    Creo que estoy en un grupo de soporte, gcp-algo.: I think I'm in a support group, gcp-something.
    ¿Por qué Lucía (de Pagos) puede ver los servicios de Cloud Run?: Why can Lucía (Payments) see the Cloud Run services?
    Está en gcp-pagos-dev, que es miembro de gcp-producto, que tiene run.viewer: She's in gcp-pagos-dev, which is a member of gcp-producto, which has run.viewer
    Tiene un rol directo en el proyecto: She has a direct role on the project
    Es Owner de la organización: She's organization Owner
    Cloud Run es público: Cloud Run is public

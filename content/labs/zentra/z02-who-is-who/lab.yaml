  kind: REQ
  priority: P4
  sla: 3d
  reporter: Marta Ibáñez (responsable de Plataforma)
  summary: Rocío Pérez entra hoy en el Service Desk. Necesita ver los proyectos de GCP igual que el resto del equipo de Pablo. Ya tiene cuenta en Workspace.

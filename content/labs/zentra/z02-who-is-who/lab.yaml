id: zentra-z02-who-is-who
title: 'Tutorial 2 · Quién es quién: Workspace, grupos y permisos'
summary: Descubre cómo llegan los permisos de GCP a cada persona a través de los grupos de Google y da tu primer acceso como se hace en Zentra.

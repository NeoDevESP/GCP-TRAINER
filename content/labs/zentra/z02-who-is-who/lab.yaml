solution: |
  ticket
  gam info user pablo.costa@zentra.dev
  gcloud projects get-iam-policy {{.project}}
  gcloud identity groups memberships list --group-email=gcp-producto@zentra.dev
  gcloud identity groups memberships add --group-email=gcp-soporte@zentra.dev --member-email=rocio.perez@zentra.dev
  gcloud identity groups memberships check-transitive-membership --group-email=gcp-soporte@zentra.dev --member-email=rocio.perez@zentra.dev
  ticket update "Hola Marta: Rocío ya está en el grupo gcp-soporte, el mismo que Pablo, así que ve los proyectos igual que el resto del Service Desk. Sin permisos directos."
  ticket resolve "Añadida rocio.perez al grupo gcp-soporte; hereda roles/browser del grupo, sin permisos directos."

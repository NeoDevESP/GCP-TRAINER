id: zentra-z71-vpcsc-ingress
title: 'INC · «Request is prohibited by organization''s policy»: el panel de riesgos no lee BigQuery'
summary: 'Seguridad metió anoche el proyecto de datos en un perímetro de VPC Service Controls y el panel de riesgos, que vive en otro proyecto, se quedó fuera. Ni quitar el perímetro ni abrirlo a todos: una regla de entrada exacta.'

setup: |
  bq mk --dataset --location=EU riesgo
  bq mk --table --sim_rows=500000 riesgo.exposiciones cliente:STRING:16,importe:NUMERIC:16,fecha:DATE:4
  gcloud access-context-manager perimeters create zentra-datos --title="Datos de producción" --resources=projects/$(gcloud projects describe {{.project}} --format='value(projectNumber)') --restricted-services=bigquery.googleapis.com,storage.googleapis.com

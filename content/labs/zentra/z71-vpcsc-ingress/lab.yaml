  sla: 1h
  reporter: Riesgos · Analítica
  summary: 'Desde esta mañana el panel de riesgos (Looker, proyecto zentra-bi) no carga ningún informe. Error: «Request is prohibited by organization''s policy. vpcServiceControlsUniqueIdentifier: …». El comité de riesgos es a las 12:00.'

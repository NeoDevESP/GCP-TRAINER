    answer: 'Sí: anoche metimos el proyecto de datos en el perímetro zentra-datos (BigQuery y Storage restringidos). El perímetro no se quita ni se abre a todo zentra-bi: haz una regla de entrada solo para looker-sa, desde el proyecto zentra-bi (número 418230557192) y solo para BigQuery.'
- role: risk
  name: Riesgos · Analítica
  persona: Equipo de analítica de riesgos.
  fallback: Solo leemos BigQuery desde el panel; Storage no lo usamos.
  facts:
  - keywords:
    - - cuenta
      - account
      - identidad
      - identity
      - service account
      - proyecto
      - project
      - numero
      - número
    answer: El panel usa la cuenta looker-sa@zentra-bi.iam.gserviceaccount.com, en el proyecto zentra-bi (número 418230557192). Solo consulta BigQuery.
story: |-
  **Proyecto `{{.project}}`** (*zentra-datos-prod*).

  > **INC-31071 · P2** · *«El panel de riesgos (Looker, proyecto zentra-bi) no carga: Request is prohibited by organization's policy. vpcServiceControlsUniqueIdentifier: …»*

  **VPC Service Controls** pone un **perímetro** alrededor de proyectos: las APIs restringidas (BigQuery, Storage…) de los proyectos de dentro **solo aceptan llamadas desde dentro**, aunque quien llama tenga permisos IAM. Es la defensa del banco contra la exfiltración de datos. Ese mensaje de error **siempre** es un perímetro, nunca un permiso.

  1. Busca la infracción en los registros de auditoría de política: `gcloud logging read 'protoPayload.metadata.violationReason="RESOURCES_NOT_IN_SAME_SERVICE_PERIMETER"' --limit=3` (identidad, origen, servicio y perímetro).
  2. Mira el perímetro: `gcloud access-context-manager perimeters list` y `describe zentra-datos`.
  3. Habla con Seguridad, dueña del perímetro, y confirma con Riesgos qué cuenta y qué servicio usan.
  4. Crea una **regla de entrada** (ingress) con el mínimo alcance (esa identidad, ese proyecto de origen, ese servicio) en un fichero YAML y aplícala con `perimeters update zentra-datos --set-ingress-policies=FICHERO`.
  5. Responde y deja la explicación técnica en una nota interna.
objectives:
- Encuentra la infracción del perímetro
- Confirma identidad, origen y servicio
- Regla de entrada mínima
- Responde
hints:
- text: |-
    Formato del fichero:
    ```yaml
    - ingressFrom:
        identities:
        - serviceAccount:looker-sa@zentra-bi.iam.gserviceaccount.com
        sources:
        - resource: projects/418230557192
      ingressTo:
        operations:
        - serviceName: bigquery.googleapis.com
          methodSelectors:
          - method: "*"
        resources:
        - "*"
    ```
- text: '`gcloud access-context-manager perimeters update zentra-datos --set-ingress-policies=entrada.yaml`'
solution: |
  ticket
  gcloud logging read 'protoPayload.metadata.violationReason="RESOURCES_NOT_IN_SAME_SERVICE_PERIMETER"' --limit=3
  gcloud access-context-manager perimeters list
  gcloud access-context-manager perimeters describe zentra-datos
  ask risk "¿Qué cuenta usa el panel y desde qué proyecto? ¿Solo BigQuery?"
  ask security "¿Metisteis anoche el proyecto en el perímetro? ¿Hago una regla de entrada para looker-sa?"
  cat > entrada.yaml <<'YAML'
  - ingressFrom:
      identities:
      - serviceAccount:looker-sa@zentra-bi.iam.gserviceaccount.com
      sources:
      - resource: projects/418230557192
    ingressTo:
      operations:
      - serviceName: bigquery.googleapis.com
        methodSelectors:
        - method: "*"
      resources:
      - "*"
  YAML
  gcloud access-context-manager perimeters update zentra-datos --set-ingress-policies=entrada.yaml
  gcloud access-context-manager perimeters describe zentra-datos
  ticket comment "Causa: anoche Seguridad metió el proyecto en el perímetro zentra-datos (BigQuery y Storage restringidos) y looker-sa (proyecto zentra-bi, 418230557192) quedó fuera: RESOURCES_NOT_IN_SAME_SERVICE_PERIMETER. Añadida regla de entrada solo para esa identidad, ese origen y BigQuery, con visto bueno de Nadia."
  ticket update "Hola: el panel de riesgos vuelve a cargar. Anoche se reforzó la protección de los datos de producción y el panel quedó fuera; hemos autorizado solo al panel y solo para las consultas que hace. El perímetro sigue activo."
  ticket resolve "Regla de entrada en zentra-datos para looker-sa desde zentra-bi solo a BigQuery; perímetro intacto."
shortcuts:
- name: take the project out of the perimeter
  run: |
    gcloud access-context-manager perimeters update zentra-datos --remove-resources=projects/$(gcloud projects describe {{.project}} --format='value(projectNumber)')
    ticket resolve "Quitado el proyecto del perímetro para que funcione el panel."
- name: ingress for any identity
  run: |
    cat > todo.yaml <<'YAML'
    - ingressFrom:
        identityType: ANY_IDENTITY
        sources:
        - accessLevel: "*"
      ingressTo:
        operations:
        - serviceName: "*"
        resources:
        - "*"
    YAML
    gcloud access-context-manager perimeters update zentra-datos --set-ingress-policies=todo.yaml
    ticket resolve "Abierta la entrada al perímetro para que no vuelva a fallar."

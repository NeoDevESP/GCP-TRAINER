en:
  title: 'INC · "Request is prohibited by organization''s policy": the risk dashboard can''t read BigQuery'
  summary: 'Last night Security put the data project inside a VPC Service Controls perimeter and the risk dashboard, which lives in another project, was left outside. Neither remove the perimeter nor open it to everyone: one exact ingress rule.'
  story: |-
    **Project `{{.project}}`** (*zentra-datos-prod*).

    > **INC-31071 · P2** · *"The risk dashboard (Looker, project zentra-bi) won't load: Request is prohibited by organization's policy. vpcServiceControlsUniqueIdentifier: …"*

    **VPC Service Controls** puts a **perimeter** around projects: the restricted APIs (BigQuery, Storage…) of the projects inside **only accept calls from inside**, even if the caller has IAM permissions. It's the bank's defence against data exfiltration. That error message is **always** a perimeter, never a permission.

    1. Find the violation in the policy audit logs: `gcloud logging read 'protoPayload.metadata.violationReason="RESOURCES_NOT_IN_SAME_SERVICE_PERIMETER"' --limit=3` (identity, source, service and perimeter).
    2. Look at the perimeter: `gcloud access-context-manager perimeters list` and `describe zentra-datos`.
    3. Talk to Security, the perimeter owner, and confirm with Risk which account and service they use.
    4. Create an **ingress rule** with the minimum scope (that identity, that source project, that service) in a YAML file and apply it with `perimeters update zentra-datos --set-ingress-policies=FILE`.
    5. Reply and leave the technical explanation in an internal note.
  objectives:
  - Find the perimeter violation
  - Confirm identity, source and service
  - Minimal ingress rule
  - Reply
  hints:
  - |-
    File format:
    ```yaml
    - ingressFrom:
        identities:
        - serviceAccount:looker-sa@zentra-bi.iam.gserviceaccount.com
        sources:
        - resource: projects/418230557192
      ingressTo:
        operations:
        - serviceName: bigquery.googleapis.com
          methodSelectors:
          - method: "*"
        resources:
        - "*"
    ```
  - '`gcloud access-context-manager perimeters update zentra-datos --set-ingress-policies=entrada.yaml`'
  ticket:
    summary: 'Since this morning the risk dashboard (Looker, project zentra-bi) loads no reports. Error: "Request is prohibited by organization''s policy. vpcServiceControlsUniqueIdentifier: …". The risk committee is at 12:00.'

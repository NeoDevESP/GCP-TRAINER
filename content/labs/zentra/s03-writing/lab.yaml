en:
  title: 'Craft 3 · Writing: customer update and internal note'
  summary: 'Purchase notifications arrived late. On-call already fixed it: you write two very different messages, a technical one for the team and a clear, jargon-free one for the business.'
  story: |-
    > 🎧 **Craft workshop.** You won't learn a new product here: you'll learn to **work a ticket** the way a good L2 Support engineer at a bank does. Read the explanation, follow the steps in the terminal and, if you get lost, open the **Tutor** tab.

    > **INC-40103 · P2** · Customer service: *"Many customers are complaining that notifications for their purchases arrive 10-15 minutes late. What do we tell them?"*

    On-call (Diego) **has already fixed it**. Your job now is to **communicate**, and support writes two different messages:

    | | **Internal note** (`ticket comment`) | **Customer update** (`ticket update`) |
    |---|---|---|
    | For whom | Technical colleagues, whoever inherits the ticket, audit | Whoever opened the ticket (here, the business) |
    | What goes in | Technical cause, resources, times, what changed, who did it | **What happened** in their words, **impact**, **what was done**, **what they need to do**, **next update** if still open |
    | What stays out | Opinions or blame | Jargon (revisions, instances, IAM, HTTP codes), colleagues' names, blame |

    **Steps:**
    1. **Get the facts** before writing: `ask sre "…"` (what happened, times, whether anything was lost) and `ask cs "…"` (how many customers, what worries them).
    2. **Check** what you're told: `gcloud run services describe notificaciones-api --region={{.region}}` and `gcloud run revisions list --service=notificaciones-api --region={{.region}}`.
    3. A technical **internal note** with the cause, times and change: `ticket comment "…"`.
    4. A clear **customer update**, no jargon or names: what customers noticed, that it's back to normal, that **no notification was lost** and that **their card is not at risk**. `ticket update "…"`.
    5. Answer the questions and close.
  objectives:
  - Find out what happened
  - Check the service
  - Technical internal note
  - Clear update to the business
  hints:
  - 'Internal: "max-instances=1 after yesterday''s deployment; 10:05 raised to 10; queue empty 10:20".'
  - 'To the customer: "Between 09:10 and 10:20 notifications arrived late. They''re working normally now and none were lost…"'
  ticket:
    summary: Many customers are complaining on social media that notifications for their card purchases arrive 10-15 minutes late. What do we tell them?
  text:
    Raquel Soto (Atención al cliente): Raquel Soto (Customer service)
    Diego Ferrer (SRE de guardia): Diego Ferrer (on-call SRE)
    SRE de guardia.: On-call SRE.
    'Dame hechos: qué servicio, desde cuándo, qué error y a cuántos afecta.': 'Give me facts: which service, since when, what error and how many are affected.'
    ? 'notificaciones-api se quedó con max-instances=1 tras el despliegue de ayer; con el pico de las 09:10 se encolaron los avisos. A las 10:05 lo subí a 10 y la cola se vació a las 10:20. Todos los avisos atrasados se han entregado: no se ha perdido ninguno. Revisaremos el valor en la plantilla de despliegue.'
    : 'notificaciones-api was left with max-instances=1 after yesterday''s deployment; with the 09:10 peak the notifications queued up. At 10:05 I raised it to 10 and the queue drained by 10:20. Every late notification has been delivered: none were lost. We''ll review the value in the deployment template.'
    Coordinadora de Atención al cliente.: Customer service coordinator.
    Necesito algo que pueda contar a los clientes, sin tecnicismos.: I need something I can tell customers, without technical terms.
    Desde las 09:15, unas 300 quejas. Los clientes temen que alguien esté usando su tarjeta.: Since 09:15, about 300 complaints. Customers fear someone is using their card.
    ¿Qué NO va en una actualización al cliente?: What does NOT go in a customer update?
    «Subimos max-instances de la revisión 3 a 10»: '"We raised revision 3''s max-instances to 10"'
    Qué notaron los clientes: What customers noticed
    Que ya funciona: That it works now
    Qué tienen que hacer ellos: What they need to do
    La nota interna sirve sobre todo para…: The internal note is mostly for…
    Que cualquier compañero o auditor entienda qué pasó y qué se cambió: Any colleague or auditor to understand what happened and what changed
    Echar la culpa a quien desplegó: Blaming whoever deployed
    Sustituir la respuesta al cliente: Replacing the customer reply
    'Nada: es opcional': 'Nothing: it''s optional'
    Los clientes temen que usen su tarjeta. ¿Qué incluyes?: Customers fear their card is being used. What do you include?
    Que fue un retraso de avisos y la tarjeta no está en riesgo: That it was a notification delay and the card is not at risk
    'Nada: no es tu tema': 'Nothing: not your topic'
    Que bloqueen la tarjeta por si acaso: That they block their card just in case
    El nombre del técnico que lo arregló: The name of the engineer who fixed it
    Te has informado: You got the facts
    Preguntado a la guardia qué pasó: Asked on-call what happened
    Comprobado el servicio: Checked the service
    Nota interna técnica: Technical internal note
    Nota interna con la causa: Internal note with the cause
    Con las horas: With the times
    Actualización para el negocio: Update for the business
    Qué pasó, que ya está normal y que no se perdió nada: What happened, that it's normal now and nothing was lost
    Sin jerga ni nombres de compañeros: No jargon or colleagues' names
    Lo has entendido: You understood it
    Preguntas del taller: Workshop questions
    Cierre: Close
    Ticket cerrado con una nota: Ticket closed with a note
    Los hechos: The facts
    'Causa, horas y si se perdió algo: es lo que vas a necesitar en los dos mensajes.': 'Cause, times and whether anything was lost: you''ll need it for both messages.'
    Comprobar: Checking
    'Dos revisiones: la de max 1 y la nueva con max 10 sirviendo el tráfico.': 'Two revisions: the max-1 one and the new max-10 one serving traffic.'
    Interna: Internal
    'Técnica y precisa: recurso, valor, horas y lo pendiente.': 'Technical and precise: resource, value, times and what''s pending.'
    Al negocio: To the business
    Lo que vieron los clientes, que ya está bien, que no se perdió nada y que no tienen que hacer nada.: What customers saw, that it's fine now, that nothing was lost and that they don't need to do anything.

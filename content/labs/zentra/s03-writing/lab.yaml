story: |-
  > 🎧 **Taller del oficio.** Aquí no aprendes un producto nuevo: aprendes a **trabajar un ticket** como lo hace un buen técnico de Soporte N2 en un banco. Lee la explicación, sigue los pasos en el terminal y, si te pierdes, abre la pestaña **Profesor**.

  > **INC-40103 · P2** · Atención al cliente: *«Muchos clientes se quejan de que las notificaciones de sus compras llegan con 10-15 minutos de retraso. ¿Qué les decimos?»*

  La guardia (Diego) **ya lo ha arreglado**. Tu trabajo ahora es **comunicar**, y en soporte se escriben dos mensajes distintos:

  | | **Nota interna** (`ticket comment`) | **Actualización al cliente** (`ticket update`) |
  |---|---|---|
  | Para quién | Compañeros técnicos, quien herede el ticket, la auditoría | Quien abrió el ticket (aquí, el negocio) |
  | Qué lleva | Causa técnica, recursos, horas, qué cambió, quién lo hizo | **Qué pasó** en sus palabras, **impacto**, **qué se ha hecho**, **qué tienen que hacer** ellos, **próxima noticia** si sigue abierto |
  | Qué no lleva | Opiniones o culpas | Jerga (revisiones, instancias, IAM, códigos HTTP), nombres de compañeros, culpas |

  **Pasos:**
  1. **Entérate bien** antes de escribir: `ask sre "…"` (qué pasó, horas, si se perdió algo) y `ask cs "…"` (cuántos clientes, qué les preocupa).
  2. **Comprueba** lo que te cuentan: `gcloud run services describe notificaciones-api --region={{.region}}` y `gcloud run revisions list --service=notificaciones-api --region={{.region}}`.
  3. **Nota interna** técnica con la causa, las horas y el cambio: `ticket comment "…"`.
  4. **Actualización al cliente** clara, sin jerga ni nombres: qué notaron los clientes, que ya está normal, que **no se ha perdido ninguna notificación** y que **su tarjeta no está en riesgo**. `ticket update "…"`.
  5. Responde las preguntas y cierra.
objectives:
- Entérate de qué pasó
- Comprueba el servicio
- Nota interna técnica
- Actualización clara al negocio
hints:
- text: 'Interna: «max-instances=1 tras el despliegue de ayer; 10:05 subido a 10; cola vacía 10:20».'
- text: 'Al cliente: «Entre las 09:10 y las 10:20 las notificaciones llegaron con retraso. Ya funcionan con normalidad y no se ha perdido ninguna…»'
quiz:
- id: q1
  question: ¿Qué NO va en una actualización al cliente?
  options:
  - «Subimos max-instances de la revisión 3 a 10»
  - Qué notaron los clientes
  - Que ya funciona
  - Qué tienen que hacer ellos
  answer:
  - 0
- id: q2
  question: La nota interna sirve sobre todo para…
  options:
  - Que cualquier compañero o auditor entienda qué pasó y qué se cambió
  - Echar la culpa a quien desplegó
  - Sustituir la respuesta al cliente
  - 'Nada: es opcional'
  answer:
  - 0
- id: q3
  question: Los clientes temen que usen su tarjeta. ¿Qué incluyes?
  options:
  - Que fue un retraso de avisos y la tarjeta no está en riesgo
  - 'Nada: no es tu tema'
  - Que bloqueen la tarjeta por si acaso
  - El nombre del técnico que lo arregló
  answer:
  - 0
solution: |
  ticket
  ask sre "¿Qué pasó con las notificaciones, a qué hora se arregló y se perdió alguna?"
  ask cs "¿Cuántos clientes se han quejado y desde cuándo?"
  gcloud run services describe notificaciones-api --region={{.region}}
  gcloud run revisions list --service=notificaciones-api --region={{.region}}
  ticket comment "Causa: notificaciones-api quedó con max-instances=1 tras el despliegue de ayer; con el pico de las 09:10 se encolaron los avisos. 10:05 Diego lo sube a 10 (nueva revisión); 10:20 cola vacía. Sin pérdida de mensajes. Pendiente: corregir el valor en la plantilla de despliegue."
  ticket update "Hola Raquel: entre las 09:10 y las 10:20 las notificaciones de compra llegaron con retraso por un problema de capacidad de nuestro sistema de avisos. Desde las 10:20 funcionan con normalidad y no se ha perdido ninguna: todas se han entregado. Las tarjetas no han estado en riesgo y los clientes no tienen que hacer nada."
  ticket resolve "Retraso de notificaciones de 09:10 a 10:20 por capacidad insuficiente; corregido por la guardia y comunicado al negocio sin pérdida de avisos."

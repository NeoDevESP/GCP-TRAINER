id: zentra-s03-writing
title: 'Oficio 3 · Escribir: actualización al cliente y nota interna'
summary: 'Las notificaciones de compra llegaron tarde. La guardia ya lo arregló: tú escribes dos mensajes muy distintos, uno técnico para el equipo y otro claro y sin jerga para el negocio.'

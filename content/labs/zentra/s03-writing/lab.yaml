    answer: 'notificaciones-api se quedó con max-instances=1 tras el despliegue de ayer; con el pico de las 09:10 se encolaron los avisos. A las 10:05 lo subí a 10 y la cola se vació a las 10:20. Todos los avisos atrasados se han entregado: no se ha perdido ninguno. Revisaremos el valor en la plantilla de despliegue.'

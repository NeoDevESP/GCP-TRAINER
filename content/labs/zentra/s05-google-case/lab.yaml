id: zentra-s05-google-case
title: Oficio 5 · Abrir un caso a Google (y mitigar mientras)
summary: 'No se pueden crear VMs en una zona. No es tuyo ni de ningún equipo: es Google. Confírmalo, mitiga en otra zona y abre el caso con lo que Google necesita para no perder horas.'

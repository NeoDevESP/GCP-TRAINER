solution: |
  ticket
  gcloud compute instances list
  gcloud logging read 'logName:cloud-status' --limit=3
  ask sre "El panel de estado confirma problemas en {{.zone}}; ¿abro caso a Google y muevo extractos a otra zona?"
  gcloud compute instances create extractos-batch-c --zone={{.region}}-c --machine-type=e2-standard-2 --subnet=datos --no-address --labels=equipo=operaciones,uso=extractos
  gcloud compute instances list
  ticket escalate google "Proyecto {{.project}}. Compute Engine en la zona {{.zone}}: no responde extractos-batch y crear instancias falla con «The zone is currently unavailable (zonal outage)». Desde las 08:40 UTC. Impacto: retrasa los extractos mensuales de los clientes, que deben salir hoy. Probado: crear una VM nueva en la misma zona (mismo error). Mitigación: levantada extractos-batch-c en {{.region}}-c. Pedimos confirmación y hora estimada de recuperación."
  ticket update "Hola NOC: es una incidencia de Google en la zona {{.zone}}, confirmada en su panel de estado. Hemos levantado los extractos en otra zona ({{.region}}-c) y siguen su curso. Caso abierto con Google; os doy la siguiente actualización en 1 hora o antes si hay novedades."

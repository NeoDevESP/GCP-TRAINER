en:
  title: Craft 5 · Opening a case with Google (and mitigating meanwhile)
  summary: 'VMs can''t be created in one zone. It''s not yours or any team''s: it''s Google. Confirm it, mitigate in another zone and open the case with what Google needs to not lose hours.'
  story: |-
    > 🎧 **Craft workshop.** You won't learn a new product here: you'll learn to **work a ticket** the way a good L2 Support engineer at a bank does. Read the explanation, follow the steps in the terminal and, if you get lost, open the **Tutor** tab.

    > **INC-40105 · P2** · NOC: *"extractos-batch isn't responding and creating another VM in {{.zone}} fails. The statements must go out today."*

    Some problems are **Google's**: a zone down, a managed service failure, an internal API error. Then you open a **support case with Google** (in the console: *Support → Cases → Create case*). Google responds according to the **priority** you choose (P1 = critical production impact) and the **quality of the case**: a case with data gets solved in hours; one without, in days of back-and-forth.

    **1 · Reproduce and copy the verbatim error.** Try to create the VM: `gcloud compute instances create extractos-batch-2 --zone={{.zone}} --machine-type=e2-standard-2 --subnet=datos --no-address`.

    **2 · Confirm it's Google's.** Status dashboard: `gcloud logging read 'logName:cloud-status' --limit=3`. If Google confirms the incident, **don't try to fix the zone**.

    **3 · Mitigate while Google works.** The VM is stateless: create it in **another zone** of the region, e.g. `{{.region}}-c`, and check with `gcloud compute instances list`.

    **4 · Open the case** (here, `ticket escalate google "…"`). What Google needs: **project ID** (`{{.project}}`), **product and zone**, **verbatim error**, **since when** (time with time zone, ideally UTC), **business impact**, **what you tried** and **the mitigation** applied.

    **5 · Tell the NOC** it's Google's, what you did and when the next update is: `ticket update "…"`.
  objectives:
  - Reproduce the error
  - Confirm it's Google's
  - Mitigate in another zone
  - Open the case with all the details
  hints:
  - '`gcloud compute instances create extractos-batch-c --zone={{.region}}-c --machine-type=e2-standard-2 --subnet=datos --no-address --labels=equipo=operaciones,uso=extractos`'
  - 'Case: project, Compute Engine in {{.zone}}, "currently unavailable (zonal outage)", since 08:40 UTC, monthly statements delayed, mitigated in {{.region}}-c.'
  ticket:
    summary: extractos-batch (generates customers' monthly statements) isn't responding. Trying to create another VM in {{.zone}} fails. The statements must go out today.
  text:
    NOC 24x7: NOC 24x7
    Diego Ferrer (SRE de guardia): Diego Ferrer (on-call SRE)
    SRE de guardia.: On-call SRE.
    'Dame hechos: qué servicio, desde cuándo, qué error y a cuántos afecta.': 'Give me facts: which service, since when, what error and how many are affected.'
    ? 'Si el panel de estado de Google confirma la zona, no es nuestro: abre caso a Google con todos los datos y levanta extractos en otra zona de {{.region}}. Es sin estado: se puede crear de cero.'
    : 'If Google''s status dashboard confirms the zone, it''s not ours: open a case with Google with all the details and bring up extractos in another zone of {{.region}}. It''s stateless: it can be created from scratch.'
    Marta Ibáñez (responsable de Plataforma): Marta Ibáñez (Platform lead)
    Tu responsable en Zentra.: Your manager at Zentra.
    'Esta semana es para aprender el oficio: pregunta todo lo que necesites.': 'This week is for learning the craft: ask anything you need.'
    ¿Qué hace que Google resuelva antes un caso?: What makes Google solve a case faster?
    Proyecto, zona, error literal, hora, impacto y lo probado: Project, zone, verbatim error, time, impact and what you tried
    Escribir en mayúsculas: Writing in capitals
    Abrir tres casos iguales: Opening three identical cases
    Poner siempre P1: Always choosing P1
    Google confirma una caída zonal. Mientras tanto…: Google confirms a zonal outage. Meanwhile…
    Mueves la carga a otra zona de la región: You move the workload to another zone in the region
    Esperas sin hacer nada: You wait doing nothing
    Reinicias la VM en la misma zona hasta que vaya: You restart the VM in the same zone until it works
    Mueves todo a EE. UU.: You move everything to the US
    ¿Qué hora pones en el caso?: Which time do you put in the case?
    Con zona horaria, idealmente UTC: With a time zone, ideally UTC
    «Esta mañana»: '"This morning"'
    Ninguna: None
    La hora a la que abres el caso: The time you open the case
    Confirmado que es de Google: Confirmed it's Google's
    Panel de estado consultado: Status dashboard checked
    Mitigado en otra zona: Mitigated in another zone
    Extractos en marcha en otra zona: Statements running in another zone
    Un caso que Google puede trabajar: A case Google can work on
    Proyecto, zona, error, hora, impacto y mitigación: Project, zone, error, time, impact and mitigation
    NOC informado: NOC informed
    Lo has entendido: You understood it
    Preguntas del taller: Workshop questions
    Lo que hay: What's there
    ? 'extractos-batch figura en {{.zone}}, pero la zona no responde. Si intentas crear otra VM allí verás el error literal: cópialo tal cual para el caso.'
    : 'extractos-batch shows in {{.zone}}, but the zone doesn''t respond. If you try to create another VM there you''ll see the verbatim error: copy it as is for the case.'
    ¿Es Google?: Is it Google?
    'El panel de estado confirma la zona: no se arregla, se sale de ella.': 'The status dashboard confirms the zone: you don''t fix it, you move out of it.'
    Mitigar: Mitigating
    'Sin estado: se crea de cero en una zona sana.': 'Stateless: created from scratch in a healthy zone.'
    El caso: The case
    Proyecto, zona, error, hora UTC, impacto, lo probado y la mitigación.: Project, zone, error, UTC time, impact, what you tried and the mitigation.

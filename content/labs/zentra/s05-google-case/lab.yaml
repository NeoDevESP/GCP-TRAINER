story: |-
  > 🎧 **Taller del oficio.** Aquí no aprendes un producto nuevo: aprendes a **trabajar un ticket** como lo hace un buen técnico de Soporte N2 en un banco. Lee la explicación, sigue los pasos en el terminal y, si te pierdes, abre la pestaña **Profesor**.

  > **INC-40105 · P2** · NOC: *«extractos-batch no responde y al crear otra VM en {{.zone}} da error. Los extractos tienen que salir hoy.»*

  Algunos problemas son **de Google**: una zona caída, un fallo de un servicio gestionado, un error interno de la API. Entonces se abre un **caso de soporte a Google** (en la consola: *Soporte → Casos → Crear caso*). Google responde según la **prioridad** que elijas (P1 = impacto crítico en producción) y según la **calidad del caso**: un caso con datos se resuelve en horas; uno sin datos, en días de idas y venidas.

  **1 · Reproduce y copia el error literal.** Intenta crear la VM: `gcloud compute instances create extractos-batch-2 --zone={{.zone}} --machine-type=e2-standard-2 --subnet=datos --no-address`.

  **2 · Confirma que es de Google.** Panel de estado: `gcloud logging read 'logName:cloud-status' --limit=3`. Si Google confirma la incidencia, **no intentes arreglar la zona**.

  **3 · Mitiga mientras Google trabaja.** La VM es sin estado: créala en **otra zona** de la región, por ejemplo `{{.region}}-c`, y comprueba con `gcloud compute instances list`.

  **4 · Abre el caso** (aquí, `ticket escalate google "…"`). Lo que Google necesita: **ID del proyecto** (`{{.project}}`), **producto y zona**, **error literal**, **desde cuándo** (hora con zona horaria, idealmente UTC), **impacto** en el negocio, **qué has probado** y **la mitigación** aplicada.

  **5 · Informa al NOC** de que es de Google, qué has hecho y cuál es la siguiente noticia: `ticket update "…"`.
objectives:
- Reproduce el error
- Confirma que es de Google
- Mitiga en otra zona
- Abre el caso con todos los datos

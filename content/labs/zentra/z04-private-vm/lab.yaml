en:
  title: Tutorial 4 · Your first private VM, with labels and IAP access
  summary: 'Create a VM the bank way: no public IP, in the right subnet, with cost labels and secure boot, and get in through IAP.'
  story: |-
    > 📘 **Guided tutorial.** Follow the steps in order; every command comes with its explanation. If you get lost, press **Tutor** and it walks you through.

    **Step 1 · Create the VM.** Notice each option:
    ```
    gcloud compute instances create ops-consola --zone={{.zone}} \
      --machine-type=e2-small --subnet=apps --no-address \
      --shielded-secure-boot --labels=equipo=sre,entorno=prod
    ```
    - `--subnet=apps`: zentra-vpc's application subnet.
    - `--no-address`: no public IP (the organization policy wouldn't let you anyway).
    - `--shielded-secure-boot`: verified boot.
    - `--labels`: so FinOps knows whose spend it is.

    **Step 2 · Check it.** `gcloud compute instances describe ops-consola --zone={{.zone}}`: look for `networkIP` (private) and no `natIP`.

    **Step 3 · Get in through IAP.** `gcloud compute ssh ops-consola --zone={{.zone}} --tunnel-through-iap --command='hostname'`. IAP authenticates you with your account and takes you in privately, opening nothing to the internet.

    **Step 4 · Reply to Diego** with the name and private IP and close.
  objectives:
  - Create the private VM in the apps subnet
  - With secure boot and labels
  - Get in through IAP
  - Reply and close
  hints:
  - Copy the step 1 command as is.
  - '`--tunnel-through-iap` on SSH.'
  ticket:
    summary: 'We need a small VM, ops-consola, in the apps subnet to run maintenance scripts. Labels: equipo=sre, entorno=prod. Check you can get in through IAP.'

  run: |
    gcloud compute instances create ops-consola --zone={{.zone}} --machine-type=e2-standard-8 --subnet=apps --no-address
    ticket resolve "VM creada para el equipo de SRE."
rubric:
- name: VM bien creada
  validator: state
  points: 50
  critical: true
  all: true
  checks:
  - type: exists
    path: instances["ops-consola"]
    expect:
      labels:
        regex: equipo.{0,4}sre
      subnetwork:
        regex: apps
    desc: En la subred apps y con etiqueta de equipo
  - type: absent
    path: instances["ops-consola"].natIP
    desc: Sin IP pública
  - type: exists
    path: instances["ops-consola"]
    expect:
      machineType:
        regex: e2-(micro|small|medium)
    desc: Tamaño ajustado
- name: Acceso por IAP
  validator: functional
  points: 30
  checks:
  - type: command
    regex: compute ssh ops-consola .*tunnel-through-iap
    min: 1
    desc: Entrada por IAP probada
- name: Respuesta
  validator: evidence
  points: 20
  all: true
  checks:
  - type: ticket_update
    keywords:
    - - ops-consola
    - - iap
    desc: Respuesta con cómo entrar
  - type: ticket_resolved
    desc: Ticket cerrado

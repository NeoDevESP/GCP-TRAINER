id: zentra-z04-private-vm
title: Tutorial 4 · Tu primera VM privada, con etiquetas y entrada por IAP
summary: 'Crea una VM como se hace en un banco: sin IP pública, en la subred correcta, con etiquetas de coste y arranque seguro, y entra por IAP.'
track: zentra
day: 4
level: basic
branch: compute
type: guided
mode: production
skills:
- compute.vm
- networking.firewall
- finops.visibility
wellArchitected:
- security
- operations
certs:
- ACE
difficulty: 1
minutes: 20
baseline:
- zentra-core
ticket:
  id: REQ-20004
  kind: REQ
  priority: P4
  sla: 3d
  reporter: Diego Ferrer (SRE)
  summary: 'Necesitamos una VM pequeña, ops-consola, en la subred apps para lanzar scripts de mantenimiento. Etiquetas: equipo=sre, entorno=prod. Comprueba que se entra por IAP.'
actors:
- role: sre
  name: Diego Ferrer (SRE)
  persona: SRE de guardia.
  fallback: 'Lo más pequeño que valga: e2-small sobra.'
  facts: []
story: |-
  > 📘 **Tutorial guiado.** Sigue los pasos en orden; cada comando trae su explicación. Si te pierdes, pulsa **Tutor** y te acompaña paso a paso.

  **Paso 1 · Crea la VM.** Fíjate en cada opción:
  ```
  gcloud compute instances create ops-consola --zone={{.zone}} \
    --machine-type=e2-small --subnet=apps --no-address \
    --shielded-secure-boot --labels=equipo=sre,entorno=prod
  ```
  - `--subnet=apps`: la subred de aplicaciones de zentra-vpc.
  - `--no-address`: sin IP pública (la política de la organización no te dejaría otra cosa).
  - `--shielded-secure-boot`: arranque verificado.
  - `--labels`: así FinOps sabe de quién es el gasto.

  **Paso 2 · Compruébala.** `gcloud compute instances describe ops-consola --zone={{.zone}}`: busca `networkIP` (privada) y que no haya `natIP`.

  **Paso 3 · Entra por IAP.** `gcloud compute ssh ops-consola --zone={{.zone}} --tunnel-through-iap --command='hostname'`. IAP te autentica con tu cuenta y te lleva por dentro, sin abrir nada a internet.

  **Paso 4 · Responde a Diego** con el nombre y la IP privada y cierra.
objectives:
- Crea la VM privada en la subred apps
- Con arranque seguro y etiquetas
- Entra por IAP
- Responde y cierra
hints:
- text: Copia el comando del paso 1 tal cual.
- text: '`--tunnel-through-iap` en el SSH.'
solution: |
  ticket
  gcloud compute instances create ops-consola --zone={{.zone}} --machine-type=e2-small --subnet=apps --no-address --shielded-secure-boot --labels=equipo=sre,entorno=prod
  gcloud compute instances describe ops-consola --zone={{.zone}}
  gcloud compute ssh ops-consola --zone={{.zone}} --tunnel-through-iap --command='hostname'
  ticket update "Hola Diego: ops-consola está creada en la subred apps, sin IP pública, con arranque seguro y etiquetas equipo=sre y entorno=prod. Se entra con gcloud compute ssh ops-consola --zone={{.zone}} --tunnel-through-iap."
  ticket resolve "Creada ops-consola privada en apps con arranque seguro y etiquetas; acceso por IAP comprobado."
shortcuts:

    desc: Ticket cerrado
tutor:
- match: sql instances describe
  title: Los parámetros
  why: max_connections=20 en una instancia que admite 200.
- match: --clear-database-flags
  title: ''
  why: Vuelve a los valores por defecto del tier.
en:
  title: INC P2 · A database parameter takes Accounts down
  summary: 'Someone lowered max_connections to 20 "to save memory". The instance is big enough: the problem is the parameter.'
  story: |-
    **Project `{{.project}}`** (*zentra-cuentas-prod*).

    > **INC-31060 · P2** · *"cuentas-api with intermittent 503s since last night's maintenance window. cuentas-db CPU is low."*

    Low CPU and connection errors: the machine isn't short. Cloud SQL **parameters** (*database flags*) change how the engine behaves; `max_connections` limits how many clients fit. Compare the connections the service needs (instances × pool) with the configured limit. Changing flags can restart the instance: request the change.
  objectives:
  - Read the database error
  - Check the instance's flags
  - Fix the flag with an approved change
  - Validate and document
  hints:
  - '`gcloud sql instances describe cuentas-db --format=''value(settings.databaseFlags)''`'
  - '`gcloud sql instances patch cuentas-db --clear-database-flags` (back to the default)'
  ticket:
    summary: cuentas-api with intermittent 503s since last night's maintenance window. cuentas-db CPU is low.
  text:
    NOC 24x7: NOC 24x7
    Equipo de bases de datos: Database team
    DBA de Zentra.: Zentra's DBAs.
    Anoche ajustamos parámetros en varias instancias.: Last night we tuned parameters on several instances.
    ? ¡Ups! El valor de 20 era para una instancia de pruebas. cuentas-db (db-custom-2-7680) va bien con su valor por defecto, 200.
    : Oops! The value 20 was meant for a test instance. cuentas-db (db-custom-2-7680) is fine with its default, 200.
    Javier Luna (Gestión de cambios): Javier Luna (Change management)
    Gestor de cambios.: Change manager.
    Un cambio en producción necesita registro; si es urgente, lo apruebo como emergencia.: A production change needs a record; if urgent, I approve it as an emergency.
    Aprobado como cambio de emergencia (CHG-7790). Déjalo anotado en el ticket.: Approved as an emergency change (CHG-7790). Note it in the ticket.
    Servicio recuperado: Service back
    Conexiones por debajo del límite: Connections under the limit
    cuentas-api responde: cuentas-api responds
    Arreglo en la causa: Fix at the cause
    Sin ampliar la máquina: Without upsizing
    Diagnóstico: Diagnosis
    Parámetros revisados: Flags checked
    Cambio aprobado: Change approved
    Documentado: Documented
    Nota con la causa: Note with the cause
    Ticket cerrado: Ticket closed
    Los parámetros: The flags
    max_connections=20 en una instancia que admite 200.: max_connections=20 on an instance that allows 200.
    Vuelve a los valores por defecto del tier.: Back to the tier's defaults.

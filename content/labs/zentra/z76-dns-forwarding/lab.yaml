tutor:
- match: dig mq.zentra.corp
  title: ¿Nombre?
  why: 'NXDOMAIN o SERVFAIL: Google no sabe nada de zentra.corp todavía.'
- match: curl -s -m 5 https://192.168.20.20
  title: ¿Red?
  why: 'Por IP llega: la VPN y BGP están bien. Es DNS.'
- match: --forwarding-targets=192.168.10.53
  title: Reenvío
  why: Las consultas de zentra.corp van a los DNS del CPD.
- match: 35.199.192.0/19
  title: La ruta de vuelta
  why: 'Las consultas salen de ese rango: el CPD necesita poder contestar. Y all_subnets para no cortar lo demás.'
en:
  title: 'REQ · "Could not resolve host: mq.zentra.corp"'
  summary: A new service must talk to the data centre's messaging by name. By IP it works; by name it doesn't. Create DNS forwarding to the data centre and discover why it still doesn't answer at first.
  story: |-
    **Project `{{.project}}`** (*zentra-tarjetas-prod*).

    > **REQ-31076 · P3** · *"tarjetas-sync fails with Could not resolve host: mq.zentra.corp. From the office it resolves."*

    **The data-centre link.** Zentra has its **own data centre** in Madrid (core banking, MQ messaging, batch) joined to Google Cloud by **Cloud VPN**: an encrypted tunnel (`tunel-cpd-0`) and, on top, a **BGP** session on Cloud Router `cpd-router` that exchanges routes. Traffic needs three things: the **tunnel** up, the **BGP session** established (both sides agreeing on the autonomous system numbers, ASN) and **routes both ways** (Google learns `192.168.0.0/16` from the data centre and the data centre learns what the Cloud Router advertises).

    The `*.zentra.corp` names live in the **data centre's DNS**, not in Google. For VPC VMs to resolve them you create a private **forwarding zone** in Cloud DNS that sends those queries to the data centre's DNS. Careful: those queries leave Google from the **35.199.192.0/19** range, and the data centre can only answer if it has a **route back** to that range.

    1. Split the problem: `gcloud compute ssh tarjetas-sync --zone={{.zone}} --tunnel-through-iap --command='dig mq.zentra.corp'` and `--command='curl -s -m 5 https://192.168.20.20'` (is it the name or the network?).
    2. Ask Network which DNS the data centre uses.
    3. Create the forwarding zone: `gcloud dns managed-zones create cpd-zentra-corp --dns-name=zentra.corp. --visibility=private --networks=zentra-vpc --forwarding-targets=… --description="Forwarding to the data centre"`.
    4. Try `dig` again. If it doesn't answer, check what the Cloud Router advertises (`routers get-status`) and add 35.199.192.0/19 **while still advertising the subnets**.
    5. Check name and connection, and reply.
  objectives:
  - Name or network?
  - Forwarding zone to the data centre
  - Route back for 35.199.192.0/19
  - Verify and reply
  hints:
  - '`gcloud compute routers update cpd-router --region={{.region}} --advertisement-mode=custom --set-advertisement-groups=all_subnets --set-advertisement-ranges=35.199.192.0/19`'
  ticket:
    summary: 'tarjetas-sync must publish to the data centre queue (mq.zentra.corp, port 1414) but fails with "Could not resolve host: mq.zentra.corp". From the office it resolves.'
  text:
    Hugo Martín (Tarjetas): Hugo Martín (Cards)
    Tomás Vidal (Arquitecto de red): Tomás Vidal (Network architect)
    Dueño de la VPC, la VPN y el Interconnect con el CPD.: Owner of the VPC, the VPN and the Interconnect with the data centre.
    'Primero mira el túnel y luego la sesión BGP: que el túnel esté arriba no significa que haya rutas.': 'Check the tunnel first, then the BGP session: a tunnel being up doesn''t mean there are routes.'
    ? 'Los DNS del CPD son 192.168.10.53 y llevan la zona zentra.corp. Para que respondan a Cloud DNS hace falta que el CPD tenga ruta a 35.199.192.0/19, que es de donde salen las consultas reenviadas: eso se anuncia desde el Cloud Router, y en modo personalizado no te olvides de seguir anunciando todas las subredes.'
    : 'The data centre DNS servers are 192.168.10.53 and hold the zentra.corp zone. For them to answer Cloud DNS, the data centre needs a route to 35.199.192.0/19, which is where forwarded queries come from: that''s advertised from the Cloud Router, and in custom mode don''t forget to keep advertising all subnets.'
    Javier Luna (Gestión de cambios): Javier Luna (Change management)
    Gestor de cambios (CAB).: Change manager (CAB).
    Ningún cambio en producción sin registro. Si hay clientes afectados, lo apruebo como emergencia.: No production change without a record. If customers are affected, I approve it as an emergency.
    Aprobado como cambio de emergencia (CHG-7795). Anótalo en el ticket con lo que cambias y cómo se vuelve atrás.: Approved as an emergency change (CHG-7795). Note it in the ticket with what you change and how to roll back.
    ¿Por qué una zona de reenvío al CPD puede no responder aunque el túnel y BGP estén bien?: Why might a forwarding zone to the data centre not answer even with the tunnel and BGP fine?
    El CPD no tiene ruta de vuelta a 35.199.192.0/19: The data centre has no route back to 35.199.192.0/19
    Cloud DNS no admite reenvío: Cloud DNS doesn't support forwarding
    Falta abrir el puerto 53 a internet: Port 53 must be opened to the internet
    Hay que reiniciar la VM: The VM must be restarted
    Resuelve y conecta: Resolves and connects
    mq.zentra.corp resuelve a 192.168.20.20: mq.zentra.corp resolves to 192.168.20.20
    Y la red al CPD sigue funcionando (subredes anunciadas): And the network to the data centre still works (subnets advertised)
    Reenvío, no copias: Forwarding, not copies
    Zona de reenvío a los DNS del CPD: Forwarding zone to the data-centre DNS
    Sin copiar registros del CPD a mano: No hand-copied data-centre records
    Diagnóstico: Diagnosis
    Probado el nombre: Name tested
    Separado nombre de red: Name separated from network
    Respuesta: Reply
    Respuesta clara al solicitante: Clear reply to the requester
    Lo has entendido: You understood it
    Pregunta del caso: Case question
    ¿Nombre?: Name?
    'NXDOMAIN o SERVFAIL: Google no sabe nada de zentra.corp todavía.': 'NXDOMAIN or SERVFAIL: Google knows nothing about zentra.corp yet.'
    ¿Red?: Network?
    'Por IP llega: la VPN y BGP están bien. Es DNS.': 'By IP it works: VPN and BGP are fine. It''s DNS.'
    Reenvío: Forwarding
    Las consultas de zentra.corp van a los DNS del CPD.: zentra.corp queries go to the data centre's DNS.
    La ruta de vuelta: The route back
    'Las consultas salen de ese rango: el CPD necesita poder contestar. Y all_subnets para no cortar lo demás.': 'Queries leave from that range: the data centre must be able to answer. And all_subnets so nothing else breaks.'

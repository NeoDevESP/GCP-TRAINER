story: |-
  **Proyecto `{{.project}}`** (*zentra-tarjetas-prod*).

  > **REQ-31076 · P3** · *«tarjetas-sync falla con Could not resolve host: mq.zentra.corp. Desde la oficina sí resuelve.»*

  **La conexión con el CPD.** Zentra tiene su **centro de datos propio** en Madrid (el core bancario, la mensajería MQ, los batch) unido a Google Cloud por **Cloud VPN**: un túnel cifrado (`tunel-cpd-0`) y, por encima, una sesión **BGP** en el Cloud Router `cpd-router` que intercambia rutas. Para que haya tráfico hacen falta tres cosas: el **túnel** arriba, la **sesión BGP** establecida (los dos lados de acuerdo en los números de sistema autónomo, ASN) y **rutas en los dos sentidos** (Google aprende `192.168.0.0/16` del CPD y el CPD aprende lo que el Cloud Router anuncia).

  Los nombres `*.zentra.corp` viven en los **DNS del CPD**, no en Google. Para que las VMs de la VPC los resuelvan se crea una **zona de reenvío** privada en Cloud DNS que manda esas consultas a los DNS del CPD. Ojo: esas consultas salen de Google desde el rango **35.199.192.0/19**, y el CPD solo puede contestar si tiene **ruta de vuelta** a ese rango.

  1. Separa el problema: `gcloud compute ssh tarjetas-sync --zone={{.zone}} --tunnel-through-iap --command='dig mq.zentra.corp'` y `--command='curl -s -m 5 https://192.168.20.20'` (¿falla el nombre o la red?).
  2. Pregunta a Red qué DNS tiene el CPD.
  3. Crea la zona de reenvío: `gcloud dns managed-zones create cpd-zentra-corp --dns-name=zentra.corp. --visibility=private --networks=zentra-vpc --forwarding-targets=… --description="Reenvío al CPD"`.
  4. Vuelve a probar `dig`. Si no responde, mira qué anuncia el Cloud Router (`routers get-status`) y añade 35.199.192.0/19 **sin dejar de anunciar las subredes**.
  5. Comprueba nombre y conexión, y responde.
objectives:
- ¿Nombre o red?
- Zona de reenvío al CPD
- Ruta de vuelta para 35.199.192.0/19
- Comprueba y responde
hints:
- text: '`gcloud compute routers update cpd-router --region={{.region}} --advertisement-mode=custom --set-advertisement-groups=all_subnets --set-advertisement-ranges=35.199.192.0/19`'
quiz:
- id: q1
  question: ¿Por qué una zona de reenvío al CPD puede no responder aunque el túnel y BGP estén bien?
  options:
  - El CPD no tiene ruta de vuelta a 35.199.192.0/19
  - Cloud DNS no admite reenvío
  - Falta abrir el puerto 53 a internet
  - Hay que reiniciar la VM
  answer:
  - 0
solution: |
  ticket
  gcloud compute ssh tarjetas-sync --zone={{.zone}} --tunnel-through-iap --command='dig mq.zentra.corp'
  gcloud compute ssh tarjetas-sync --zone={{.zone}} --tunnel-through-iap --command='curl -s -m 5 https://192.168.20.20'
  ask network "¿Qué servidores DNS tiene el CPD para zentra.corp?"
  gcloud dns managed-zones create cpd-zentra-corp --dns-name=zentra.corp. --visibility=private --networks=zentra-vpc --forwarding-targets=192.168.10.53 --description="Reenvio al CPD"
  gcloud compute ssh tarjetas-sync --zone={{.zone}} --tunnel-through-iap --command='dig mq.zentra.corp'
  gcloud compute routers get-status cpd-router --region={{.region}}
  ask change "Necesito anunciar 35.199.192.0/19 desde cpd-router para el reenvío de DNS"
  gcloud compute routers update cpd-router --region={{.region}} --advertisement-mode=custom --set-advertisement-groups=all_subnets --set-advertisement-ranges=35.199.192.0/19
  gcloud compute ssh tarjetas-sync --zone={{.zone}} --tunnel-through-iap --command='dig mq.zentra.corp'
  gcloud compute ssh tarjetas-sync --zone={{.zone}} --tunnel-through-iap --command='curl -s -m 5 https://mq.zentra.corp'
  ticket update "Hola Hugo: ya resuelve mq.zentra.corp desde tarjetas-sync. Hemos creado el reenvío de DNS de zentra.corp hacia los DNS del CPD y anunciado la ruta de vuelta que necesitan para contestar. Pruébalo y dinos."
  ticket resolve "Zona de reenvío zentra.corp a 192.168.10.53 y anuncio de 35.199.192.0/19 en cpd-router manteniendo todas las subredes."
shortcuts:
- name: hard-code the IP in a private zone
  run: |
    gcloud dns managed-zones create corp --dns-name=zentra.corp. --visibility=private --networks=zentra-vpc --description=copia
    gcloud dns record-sets create mq.zentra.corp. --zone=corp --type=A --ttl=300 --rrdatas=192.168.20.20
    ticket resolve "Copiado el registro del CPD en una zona privada nuestra."
- name: advertise only the DNS range
  run: |
    gcloud dns managed-zones create cpd-zentra-corp --dns-name=zentra.corp. --visibility=private --networks=zentra-vpc --forwarding-targets=192.168.10.53 --description=cpd
    gcloud compute routers update cpd-router --region={{.region}} --advertisement-mode=custom --set-advertisement-ranges=35.199.192.0/19
    ticket resolve "Anunciado el rango de DNS de Google al CPD."

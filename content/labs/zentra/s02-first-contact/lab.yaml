en:
  title: 'Craft 2 · First contact: acknowledgement, questions and scope'
  summary: '"BigQuery doesn''t work for me. It''s urgent." Reply fast, ask what''s missing (exact error, since when, how many are affected) and fix it for the group, not for one person.'
  story: |-
    > 🎧 **Craft workshop.** You won't learn a new product here: you'll learn to **work a ticket** the way a good L2 Support engineer at a bank does. Read the explanation, follow the steps in the terminal and, if you get lost, open the **Tutor** tab.

    > **INC-40102 · P3** · Omar Haddad (Data): *"BigQuery doesn't work for me. It's urgent."*

    Many tickets arrive like this: with no data. **First contact** has three parts:

    **1 · Acknowledgement (fast).** Before investigating, reply: you got it, what you'll look at and **when you'll next update**. Never leave a ticket unanswered while you investigate.
    `ticket update "Hi Omar, received. I'm looking into it and will update you within 30 minutes. Can you send me the exact error message?"`

    **2 · The missing questions.** The usual five: **the exact error** (verbatim), **since when** and what changed, **where** (project, resource), **how many are affected** (just you?) and **what you were doing**. Ask with `ask data "…"`. *How many are affected?* changes the fix the most: if it's a whole team, the fix is for the group.

    **3 · Verify yourself.** Don't settle for what you're told: check the project policy (`gcloud projects get-iam-policy {{.project}}`) and the groups (`gam print group-members gcp-datos@zentra.dev`).

    **4 · Fix with least privilege and by the rules.** Running queries needs `bigquery.jobs.create` (role `roles/bigquery.jobUser` on the project). Ask your manager whether the team should have it (`ask manager "…"`) and grant it **to the group**.

    **5 · Reply** in plain words with what was wrong and what you did, and **close**.
  objectives:
  - Acknowledge with the next update time
  - Ask the error, since when and how many
  - Verify and fix for the group
  - Reply and close
  hints:
  - '`ask data "Can you send me the exact error message?"`, `ask data "Is anyone else on the team affected?"`'
  - '`gcloud projects add-iam-policy-binding {{.project}} --member=group:gcp-datos@zentra.dev --role=roles/bigquery.jobUser`'

story: |-
  > 🎧 **Taller del oficio.** Aquí no aprendes un producto nuevo: aprendes a **trabajar un ticket** como lo hace un buen técnico de Soporte N2 en un banco. Lee la explicación, sigue los pasos en el terminal y, si te pierdes, abre la pestaña **Profesor**.

  > **INC-40102 · P3** · Omar Haddad (Datos): *«No me funciona BigQuery. Es urgente.»*

  Así llegan muchos tickets: sin datos. El **primer contacto** tiene tres partes:

  **1 · Acuse de recibo (rápido).** Antes de investigar, contesta: que lo has recibido, qué vas a mirar y **cuándo darás la siguiente noticia**. Nunca dejes un ticket sin respuesta mientras investigas.
  `ticket update "Hola Omar, recibido. Lo estoy revisando y te digo algo en 30 minutos. ¿Me pasas el mensaje de error exacto?"`

  **2 · Preguntas que faltan.** Las cinco de siempre: **qué error exacto** (literal), **desde cuándo** y qué cambió, **dónde** (proyecto, recurso), **a cuántos afecta** (¿solo a ti?) y **qué estabas haciendo**. Pregunta con `ask data "…"`. *¿A cuántos afecta?* es la que más cambia la solución: si es todo un equipo, el arreglo es para el grupo.

  **3 · Verifica tú.** No te quedes con lo que te cuentan: mira la política del proyecto (`gcloud projects get-iam-policy {{.project}}`) y los grupos (`gam print group-members gcp-datos@zentra.dev`).

  **4 · Arregla con mínimo privilegio y dentro de la norma.** Lanzar consultas pide `bigquery.jobs.create` (rol `roles/bigquery.jobUser` en el proyecto). Pregunta a tu responsable si el equipo debe tenerlo (`ask manager "…"`) y dalo **al grupo**.

  **5 · Responde** en palabras claras qué pasaba y qué has hecho, y **cierra**.
objectives:
- Acuse de recibo con la próxima noticia
- Pregunta error, cuándo y a cuántos afecta
- Verifica y arregla para el grupo
- Responde y cierra

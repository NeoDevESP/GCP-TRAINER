id: zentra-z07-noc-alert
title: Tutorial 7 · Que el NOC se entere antes que los clientes
summary: Crea una métrica a partir de los registros de errores de pagos-api y una alerta que avise al NOC por correo.
track: zentra
day: 7
level: basic
branch: observability
type: guided
mode: production
skills:
- observability.monitoring
- observability.logging
- observability.incident
wellArchitected:
- reliability
- operations
certs:
- ACE
difficulty: 2
minutes: 25
baseline:
- zentra-core
setup: |
  gcloud run deploy pagos-api --image=europe-docker.pkg.dev/gcplab-public/apps/hello:1.0 --region={{.region}} --service-account=pagos-sa@{{.project}}.iam.gserviceaccount.com --no-allow-unauthenticated
ticket:
  id: REQ-20007
  kind: REQ
  priority: P3
  sla: 1d
  reporter: Diego Ferrer (SRE)
  summary: Ayer pagos-api dio errores 5xx durante 20 minutos y nos enteramos por Twitter. Quiero una alerta al NOC (noc@zentra.dev) cuando haya más de 5 errores 5xx en un minuto.
actors:
- role: sre
  name: Diego Ferrer (SRE)
  persona: SRE de guardia.
  fallback: Que la alerta llegue al NOC, que está 24x7.
  facts: []
story: |-
  > 📘 **Tutorial guiado.** Sigue los pasos en orden; cada comando trae su explicación. Si te pierdes, pulsa **Tutor** y te acompaña paso a paso.

  Una alerta útil tiene tres piezas: **qué medir**, **cuándo avisar** y **a quién**.

  **Paso 1 · Qué medir: una métrica basada en registros.**
  ```
  gcloud logging metrics create pagos_5xx --description="5xx de pagos-api" \
    --log-filter='resource.type="cloud_run_revision" resource.labels.service_name="pagos-api" httpRequest.status>=500'
  ```

  **Paso 2 · A quién: un canal de notificación.**
  `gcloud beta monitoring channels create --display-name="NOC" --type=email --channel-labels=email_address=noc@zentra.dev`
  Apunta el nombre que devuelve (`projects/…/notificationChannels/NÚMERO`) o búscalo con `gcloud beta monitoring channels list`.

  **Paso 3 · Cuándo: la política de alerta.**
  ```
  gcloud alpha monitoring policies create --display-name="pagos-api 5xx" \
    --condition-display-name="más de 5 errores 5xx" \
    --condition-filter='metric.type="logging.googleapis.com/user/pagos_5xx"' --if='> 5' --duration=60s \
    --notification-channels=CANAL
  ```

  **Paso 4 · Responde a Diego** y cierra.
objectives:
- Crea la métrica de 5xx de pagos-api
- Crea el canal de correo del NOC
- Crea la alerta con umbral y canal
- Responde y cierra
hints:
- text: 'El canal: `gcloud beta monitoring channels list --format=''value(name)''`.'
- text: El filtro de la alerta apunta a `logging.googleapis.com/user/pagos_5xx`.
solution: |
  ticket
  gcloud logging metrics create pagos_5xx --description="5xx de pagos-api" --log-filter='resource.type="cloud_run_revision" resource.labels.service_name="pagos-api" httpRequest.status>=500'
  gcloud beta monitoring channels create --display-name="NOC" --type=email --channel-labels=email_address=noc@zentra.dev
  gcloud alpha monitoring policies create --display-name="pagos-api 5xx" --condition-display-name="mas de 5 errores 5xx" --condition-filter='metric.type="logging.googleapis.com/user/pagos_5xx"' --if='> 5' --duration=60s --notification-channels=$(gcloud beta monitoring channels list --format='value(name)')
  ticket update "Hola Diego: hay una métrica pagos_5xx con los errores 5xx de pagos-api y una alerta que avisa a noc@zentra.dev cuando hay más de 5 en un minuto."
  ticket resolve "Creada métrica basada en registros pagos_5xx y alerta con canal de correo del NOC."
shortcuts:
- name: alert without channel on cpu
  run: |
    gcloud alpha monitoring policies create --display-name="cpu" --condition-display-name=cpu --condition-filter='metric.type="run.googleapis.com/container/cpu/utilizations"' --if='> 0.9' --duration=60s
    ticket resolve "Creada una alerta de CPU para pagos."

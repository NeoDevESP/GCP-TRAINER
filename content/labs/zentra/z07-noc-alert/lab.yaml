tutor:
- match: logging metrics create
  title: Qué medir
  why: 'Una métrica basada en registros cuenta cuántas líneas cumplen el filtro: aquí, respuestas 5xx de pagos-api.'
- match: channels create
  title: A quién avisar
  why: Sin canal, la alerta salta pero nadie se entera.
- match: policies create
  title: ''
  why: 'Umbral y duración evitan falsas alarmas: más de 5 errores durante un minuto.'
en:
  title: Tutorial 7 · Let the NOC know before customers do
  summary: Create a metric from pagos-api's error logs and an alert that emails the NOC.
  story: |-
    > 📘 **Guided tutorial.** Follow the steps in order; every command comes with its explanation. If you get lost, press **Tutor** and it walks you through.

    A useful alert has three parts: **what to measure**, **when to alert** and **who to tell**.

    **Step 1 · What: a log-based metric.**
    ```
    gcloud logging metrics create pagos_5xx --description="pagos-api 5xx" \
      --log-filter='resource.type="cloud_run_revision" resource.labels.service_name="pagos-api" httpRequest.status>=500'
    ```

    **Step 2 · Who: a notification channel.**
    `gcloud beta monitoring channels create --display-name="NOC" --type=email --channel-labels=email_address=noc@zentra.dev`
    Note the name it returns (`projects/…/notificationChannels/NUMBER`) or find it with `gcloud beta monitoring channels list`.

    **Step 3 · When: the alert policy.**
    ```
    gcloud alpha monitoring policies create --display-name="pagos-api 5xx" \
      --condition-display-name="more than 5 5xx errors" \
      --condition-filter='metric.type="logging.googleapis.com/user/pagos_5xx"' --if='> 5' --duration=60s \
      --notification-channels=CHANNEL
    ```

    **Step 4 · Reply to Diego** and close.
  objectives:
  - Create the pagos-api 5xx metric
  - Create the NOC email channel
  - Create the alert with threshold and channel
  - Reply and close
  hints:
  - 'The channel: `gcloud beta monitoring channels list --format=''value(name)''`.'
  - The alert filter points to `logging.googleapis.com/user/pagos_5xx`.
  ticket:
    summary: Yesterday pagos-api returned 5xx errors for 20 minutes and we found out on Twitter. I want an alert to the NOC (noc@zentra.dev) when there are more than 5 5xx errors in a minute.
  text:
    Diego Ferrer (SRE): Diego Ferrer (SRE)
    SRE de guardia.: On-call SRE.
    Que la alerta llegue al NOC, que está 24x7.: The alert must reach the NOC, which is 24x7.
    Métrica de errores: Error metric
    Métrica de 5xx de pagos-api: pagos-api 5xx metric
    Alerta al NOC: Alert to the NOC
    Alerta sobre pagos_5xx con canal de notificación: Alert on pagos_5xx with a notification channel
    Respuesta: Reply
    Respuesta con lo creado: Reply with what was created
    Ticket cerrado: Ticket closed
    Qué medir: What to measure
    'Una métrica basada en registros cuenta cuántas líneas cumplen el filtro: aquí, respuestas 5xx de pagos-api.': 'A log-based metric counts how many lines match the filter: here, pagos-api 5xx responses.'
    A quién avisar: Who to notify
    Sin canal, la alerta salta pero nadie se entera.: Without a channel the alert fires but nobody finds out.
    'Umbral y duración evitan falsas alarmas: más de 5 errores durante un minuto.': 'Threshold and duration avoid false alarms: more than 5 errors for a minute.'

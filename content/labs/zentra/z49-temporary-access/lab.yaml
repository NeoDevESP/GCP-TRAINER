    Puede administrar Cloud SQL durante la ventana: Can administer Cloud SQL during the window
    Acceso que caduca: Expiring access
    El rol lleva condición de caducidad: The role carries an expiry condition
    Sin roles básicos: No basic roles
    Ligado al cambio: Tied to the change
    Cambio comprobado: Change checked
    Respuesta con la fecha de fin: Reply with the end date

id: zentra-p02-recaptcha-domain
title: REQ · Añadir un dominio a la clave de reCAPTCHA de previos
summary: 'El equipo de altas migra a GitHub y sirve unos ficheros desde un dominio nuevo. Hay que añadirlo a la clave de reCAPTCHA de DEV, sin quitar los que ya tiene y sin tocar PRO.'

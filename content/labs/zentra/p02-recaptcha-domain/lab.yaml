en:
  title: REQ · Add a domain to the pre-production reCAPTCHA key
  summary: 'The sign-up team moves to GitHub and serves files from a new domain. Add it to the DEV reCAPTCHA key, without removing the ones it has and without touching PRO.'
  story: |-
    **Sign-up projects**: `dev-zentra-altas` (DEV), `au-zentra-altas` (AU) and `zentra-altas` (PRO). You work from your team's project (`{{.project}}`): the application ones open with the **project picker** in the top bar.

    > **REQ-41207 · P4** · Sign-up: *"We need to configure the pre-production reCAPTCHA key. Key: `6LdZtR8qAAAAAJx3wPm7vK2nYq5cT9bH4sLfE1uA`. New domain to add: `https://dev-zentra-docs.s3.amazonaws.com`"*

    Even if they say "API key", an ID starting with **6L** is a **reCAPTCHA site key**. A web key only works on the **domains in its list** (and their subdomains). Three traps:

    - The domain goes **without `https://`** or a path: `dev-zentra-docs.s3.amazonaws.com`.
    - The list already has domains that **must stay**. In the console, "Add a domain" keeps them; in the terminal, `--domains` **replaces** the whole list.
    - It is **DEV only**: the PRO key is a different one and is not touched.

    **In the console**
    1. Read the ticket (**Ticket** tab).
    2. **Project picker** › `dev-zentra-altas`. Always check the project before changing anything.
    3. **Menu › Security › reCAPTCHA** and open the key whose ID matches the ticket.
    4. **Add a domain** › `dev-zentra-docs.s3.amazonaws.com` › Save.
    5. Check in **Details** that the three domains are there.
    6. Reply on the ticket (domain added, on which key and environment) and resolve it.

    Below, in Cloud Shell, you'll see the equivalent command of each button.
  objectives:
  - Open the sign-up DEV project
  - Find the ticket's key
  - Add the domain without removing the others
  - PRO and AU untouched
  - Reply and resolve the ticket
  hints:
  - 'In the console: Security › reCAPTCHA › the key › "Add a domain". Just the name: dev-zentra-docs.s3.amazonaws.com.'
  ticket:
    summary: 'We need to configure the pre-production (DEV) reCAPTCHA key of the sign-up project. Key: 6LdZtR8qAAAAAJx3wPm7vK2nYq5cT9bH4sLfE1uA. New domain to add: https://dev-zentra-docs.s3.amazonaws.com. It comes from the migration from Bitbucket to GitHub and switching Jenkins off.'

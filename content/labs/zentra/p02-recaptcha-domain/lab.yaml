ticket:
  id: REQ-41207
  kind: REQ
  priority: P4
  sla: 3d
  reporter: Carla Méndez (Producto · Altas)
  summary: 'Necesitamos configurar la clave de reCAPTCHA de entornos previos (DEV) del proyecto de altas. Clave: 6LdZtR8qAAAAAJx3wPm7vK2nYq5cT9bH4sLfE1uA. Nuevo dominio a incorporar: https://dev-zentra-docs.s3.amazonaws.com. Viene por la migración de Bitbucket a GitHub y el apagado de Jenkins.'
actors:
- role: requester
  name: Carla Méndez (Producto · Altas)
  persona: Product owner del formulario de alta de clientes.
  fallback: 'Es solo para DEV: AU y PRO se piden cuando toque, con su cambio.'
  facts:
  - keywords:
    - - pro
      - au
      - entorno
      - environment
      - produccion
      - producción
    answer: 'Solo DEV. En AU y PRO no hace falta todavía: cuando lleguemos, abriremos otra petición.'
  - keywords:
    - - https
      - dominio
      - domain
      - ruta
      - path
    answer: 'Es el bucket de ficheros que ahora sirve la página de pruebas: dev-zentra-docs.s3.amazonaws.com. Lo de https:// es como lo copié del navegador.'
story: |-
  **Proyectos de altas**: `dev-zentra-altas` (DEV), `au-zentra-altas` (AU) y `zentra-altas` (PRO). Trabajas desde el proyecto de tu equipo (`{{.project}}`): los de la aplicación se abren con el **selector de proyectos** de la barra de arriba.

  > **REQ-41207 · P4** · Altas: *«Necesitamos configurar la clave de reCAPTCHA de previos. Clave: `6LdZtR8qAAAAAJx3wPm7vK2nYq5cT9bH4sLfE1uA`. Nuevo dominio a incorporar: `https://dev-zentra-docs.s3.amazonaws.com`»*

  Aunque digan «API key», un ID que empieza por **6L** es una **clave de sitio de reCAPTCHA**. Una clave web solo funciona en los **dominios de su lista** (y sus subdominios). Tres trampas:

  - El dominio va **sin `https://`** ni ruta: `dev-zentra-docs.s3.amazonaws.com`.
  - La lista ya tiene dominios que **hay que conservar**. En la consola, «Añadir un dominio» los mantiene; en la terminal, `--domains` **sustituye** la lista entera.
  - Es **solo DEV**: la clave de PRO es otra y no se toca.

  **En la consola**
  1. Lee el ticket (pestaña **Ticket**).
  2. **Selector de proyectos** › `dev-zentra-altas`. Mira siempre el proyecto antes de cambiar nada.
  3. **Menú › Seguridad › reCAPTCHA** y abre la clave cuyo ID coincide con el del ticket.
  4. **Añadir un dominio** › `dev-zentra-docs.s3.amazonaws.com` › Guardar.
  5. Comprueba en **Detalles** que están los tres dominios.
  6. Responde al ticket (dominio añadido, en qué clave y entorno) y resuélvelo.

  Abajo, en Cloud Shell, verás el comando equivalente de cada botón.
objectives:
- Abre el proyecto DEV de altas
- Encuentra la clave del ticket
- Añade el dominio sin quitar los demás
- PRO y AU sin tocar
- Responde y resuelve el ticket
hints:
- text: 'En la consola: Seguridad › reCAPTCHA › la clave › «Añadir un dominio». Solo el nombre: dev-zentra-docs.s3.amazonaws.com.'
quiz:
- id: q1
  question: El ticket pide añadir https://dev-zentra-docs.s3.amazonaws.com. ¿Qué escribes en la lista de dominios?
  options:
  - dev-zentra-docs.s3.amazonaws.com
  - https://dev-zentra-docs.s3.amazonaws.com
  - https://dev-zentra-docs.s3.amazonaws.com/
  - '*.amazonaws.com'
  answer:
  - 0
- id: q2
  question: En la terminal, ¿qué hace «gcloud recaptcha keys update CLAVE --web --domains=nuevo.example.com»?
  options:
  - Deja la clave solo con nuevo.example.com
  - Añade nuevo.example.com a los que ya tenía
  - Crea una clave nueva
  - Nada sin --add
  answer:
  - 0
solution: |
  ticket
  gcloud config set project dev-zentra-altas
  gcloud recaptcha keys list
  gcloud recaptcha keys describe 6LdZtR8qAAAAAJx3wPm7vK2nYq5cT9bH4sLfE1uA
  gcloud recaptcha keys update 6LdZtR8qAAAAAJx3wPm7vK2nYq5cT9bH4sLfE1uA --web --display-name=altas-web-dev --domains=altas.dev.zentra.dev,localhost,dev-zentra-docs.s3.amazonaws.com
  gcloud recaptcha keys describe 6LdZtR8qAAAAAJx3wPm7vK2nYq5cT9bH4sLfE1uA
  ticket update "Hola Carla: añadido el dominio dev-zentra-docs.s3.amazonaws.com (sin https://, la lista solo admite el nombre) a la clave de reCAPTCHA altas-web-dev (6LdZtR8q…) del proyecto DEV dev-zentra-altas. Se mantienen altas.dev.zentra.dev y localhost. AU y PRO no se han tocado: cuando los necesitéis, abrid otra petición."
  ticket resolve "Dominio dev-zentra-docs.s3.amazonaws.com añadido a la clave de reCAPTCHA de DEV; dominios anteriores conservados; PRO sin cambios."
shortcuts:
- name: replace the domain list with the new one
  run: |
    gcloud recaptcha keys update 6LdZtR8qAAAAAJx3wPm7vK2nYq5cT9bH4sLfE1uA --project=dev-zentra-altas --web --domains=dev-zentra-docs.s3.amazonaws.com
    ticket update "Hola Carla: añadido el dominio dev-zentra-docs.s3.amazonaws.com a la clave de DEV."
    ticket resolve "Dominio nuevo añadido a la clave de DEV."
- name: add it to the PRO key too
  run: |
    gcloud recaptcha keys update 6LdZtR8qAAAAAJx3wPm7vK2nYq5cT9bH4sLfE1uA --project=dev-zentra-altas --web --domains=altas.dev.zentra.dev,localhost,dev-zentra-docs.s3.amazonaws.com
    gcloud recaptcha keys update 6LfB7yKsAAAAAN5mQw2rT8vXc3hZp6jL1dEu9SgR --project=zentra-altas --web --domains=altas.zentra.dev,www.zentra.dev,dev-zentra-docs.s3.amazonaws.com
    ticket update "Hola Carla: añadido el dominio dev-zentra-docs.s3.amazonaws.com en DEV y, ya puestos, en PRO."
    ticket resolve "Dominio nuevo añadido en las claves de DEV y PRO."

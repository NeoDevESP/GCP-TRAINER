    summary: 'Lucía (gcp-pagos-dev@zentra.dev) starts on Monday. She needs: 1) a bucket gs://zentra-lucia-{{.project}} to the bank''s standards where her group can read; 2) her workstation (tag puesto-producto) to see the training panel (panel-formacion, port 80).'

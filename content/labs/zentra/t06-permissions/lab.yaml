ticket:
  id: FOR-0006
  kind: REQ
  priority: P4
  sla: 5d
  reporter: Formación Zentra
  summary: 'Sexto taller: el equipo de Soporte (gcp-soporte@zentra.dev) necesita leer los manuales de gs://zentra-manuales-…, solo leer.'
actors:
- role: manager
  name: Marta Ibáñez (responsable de Plataforma)
  persona: Tu responsable en Zentra.
  fallback: 'Sin prisa: esta semana es para aprender lo básico. Pregunta todo lo que necesites.'
  facts: []
story: |-
  > 🧰 **Taller desde cero.** No necesitas saber nada antes. Lee cada bloque, copia el comando en el terminal de abajo y mira qué sale. Si te pierdes, abre la pestaña **Profesor**: te acompaña paso a paso.

  Un permiso en Google Cloud (IAM) siempre responde a **tres preguntas**:

  1. **¿Quién?** El *principal*: una persona (`user:`), un **grupo** (`group:`) o una cuenta de servicio de una aplicación (`serviceAccount:`).
  2. **¿Qué puede hacer?** Un **rol**: un paquete de permisos. `roles/storage.objectViewer` = leer objetos; `roles/storage.admin` = hacer de todo.
  3. **¿Sobre qué?** El **recurso**: todo el proyecto, o solo un bucket, un secreto…

  **Normas de Zentra:** permisos **a grupos** (no a personas), con el **rol más pequeño** que sirva y sobre el **recurso concreto**.

  **1 · Mira quién tiene acceso** al proyecto: `gcloud projects get-iam-policy {{.project}}`.
  **2 · Y al bucket:** `gcloud storage buckets get-iam-policy gs://zentra-manuales-{{.project}}`.
  **3 · Da el permiso:** `gcloud storage buckets add-iam-policy-binding gs://zentra-manuales-{{.project}} --member=group:gcp-soporte@zentra.dev --role=roles/storage.objectViewer`.
  **4 · Comprueba** que Pablo (de Soporte) puede leer: `gcloud policy-intelligence troubleshoot-policy iam //storage.googleapis.com/projects/_/buckets/zentra-manuales-{{.project}} --principal-email=pablo.costa@zentra.dev --permission=storage.objects.get`.
objectives:
- Mira la política del proyecto y del bucket
- Da lectura al grupo sobre el bucket
- Comprueba con el solucionador de IAM

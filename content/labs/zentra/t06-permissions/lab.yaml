en:
  title: 'Workshop 6 · Permissions from zero: who, which role, on what'
  summary: A Google Cloud permission has three parts. Give the Support team read access to one bucket, and nothing more.
  story: |-
    > 🧰 **Workshop from zero.** You don't need to know anything beforehand. Read each block, copy the command into the terminal below and see what comes out. If you get lost, open the **Tutor** tab: it walks you through step by step.

    A Google Cloud permission (IAM) always answers **three questions**:

    1. **Who?** The *principal*: a person (`user:`), a **group** (`group:`) or an application's service account (`serviceAccount:`).
    2. **What can they do?** A **role**: a bundle of permissions. `roles/storage.objectViewer` = read objects; `roles/storage.admin` = do everything.
    3. **On what?** The **resource**: the whole project, or just a bucket, a secret…

    **Zentra rules:** permissions **to groups** (not people), with the **smallest role** that works and on the **specific resource**.

    **1 · See who has access** to the project: `gcloud projects get-iam-policy {{.project}}`.
    **2 · And to the bucket:** `gcloud storage buckets get-iam-policy gs://zentra-manuales-{{.project}}`.
    **3 · Grant it:** `gcloud storage buckets add-iam-policy-binding gs://zentra-manuales-{{.project}} --member=group:gcp-soporte@zentra.dev --role=roles/storage.objectViewer`.
    **4 · Check** that Pablo (Support) can read: `gcloud policy-intelligence troubleshoot-policy iam //storage.googleapis.com/projects/_/buckets/zentra-manuales-{{.project}} --principal-email=pablo.costa@zentra.dev --permission=storage.objects.get`.
  objectives:
  - Look at the project and bucket policies
  - Give the group read access on the bucket
  - Check with the IAM troubleshooter
  - Answer and close
  hints:
  - '`--member=group:gcp-soporte@zentra.dev --role=roles/storage.objectViewer` on the bucket, not the project.'
  ticket:
    summary: 'Sixth workshop: the Support team (gcp-soporte@zentra.dev) needs to read the manuals in gs://zentra-manuales-…, read only.'

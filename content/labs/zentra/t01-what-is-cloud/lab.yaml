story: |-
  > 🧰 **Taller desde cero.** No necesitas saber nada antes. Lee cada bloque, copia el comando en el terminal de abajo y mira qué sale. Si te pierdes, abre la pestaña **Profesor**: te acompaña paso a paso.

  **¿Qué es «la nube»?** Ordenadores de Google, en centros de datos repartidos por el mundo, que alquilas por minutos. No compras servidores: los pides con un comando o un clic y pagas por lo que usas.

  **1 · El proyecto.** Todo lo que creas vive dentro de un **proyecto**: es la «carpeta» que agrupa recursos, permisos y factura. Tiene un **nombre** (para personas), un **ID** (único en todo Google, el que usan los comandos) y un **número**.
  `gcloud config list` → con qué cuenta y en qué proyecto trabaja tu terminal.
  `gcloud projects describe {{.project}}` → nombre, ID y número del proyecto.

  **2 · Regiones y zonas.** Una **región** es una ciudad o zona geográfica (por ejemplo `europe-west1`, Bélgica). Cada región tiene varias **zonas** (`europe-west1-b`, `-c`, `-d`): edificios separados para que, si uno falla, los demás sigan.
  `gcloud compute regions list` → todas las regiones.
  `gcloud compute zones list --filter="region:europe-west1"` → las zonas de una región.

  **3 · Servicios y APIs.** Cada producto (máquinas virtuales, bases de datos, almacenamiento…) se usa a través de su **API**, que se activa por proyecto.
  `gcloud services list --enabled` → qué servicios están activos aquí.

  **4 · Contesta** las preguntas y cierra con `ticket resolve "…"` contando lo que has aprendido.

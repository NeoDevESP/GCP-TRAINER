en:
  title: Workshop 1 · What is the cloud? Projects, regions and services
  summary: 'The minimum to start: what a project is, where the machines physically are and what an API is.'
  story: |-
    > 🧰 **Workshop from zero.** You don't need to know anything beforehand. Read each block, copy the command into the terminal below and see what comes out. If you get lost, open the **Tutor** tab: it walks you through step by step.

    **What is "the cloud"?** Google's computers, in data centres around the world, rented by the minute. You don't buy servers: you ask for them with a command or a click and pay for what you use.

    **1 · The project.** Everything you create lives inside a **project**: the "folder" that groups resources, permissions and billing. It has a **name** (for people), an **ID** (unique across Google, the one commands use) and a **number**.
    `gcloud config list` → which account and project your terminal uses.
    `gcloud projects describe {{.project}}` → the project's name, ID and number.

    **2 · Regions and zones.** A **region** is a city or geographic area (e.g. `europe-west1`, Belgium). Each region has several **zones** (`europe-west1-b`, `-c`, `-d`): separate buildings so that if one fails, the others keep going.
    `gcloud compute regions list` → every region.
    `gcloud compute zones list --filter="region:europe-west1"` → a region's zones.

    **3 · Services and APIs.** Each product (virtual machines, databases, storage…) is used through its **API**, enabled per project.
    `gcloud services list --enabled` → which services are enabled here.

    **4 · Answer** the questions and close with `ticket resolve "…"` telling what you learned.
  objectives:
  - See which project you're in
  - Tell region from zone
  - See which services are enabled
  - Answer and close
  hints:
  - '`gcloud config list`'
  - '`gcloud compute zones list --filter="region:europe-west1"`'
  ticket:
    summary: 'First training workshop: understand what Google Cloud is and how it''s organised before touching anything.'

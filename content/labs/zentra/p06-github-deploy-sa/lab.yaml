ticket:
  id: REQ-41281
  kind: REQ
  priority: P3
  sla: 5d
  reporter: Hugo Martín (Asesores)
  summary: 'Apagamos Jenkins: el backend de asesores (repo zentra/asesores-backend) desplegará en Cloud Run de DEV desde GitHub Actions. Necesitamos una cuenta de servicio gh-deploy en dev-zentra-asesores-sp y su clave JSON para meterla como secreto en GitHub.'
actors:
- role: security
  name: Nadia Kowalski (Seguridad cloud)
  persona: Seguridad cloud. Dueña de la federación de identidades con GitHub.
  fallback: Nada de claves JSON. GitHub entra por federación de identidades.
  facts:
  - keywords:
    - - clave
      - key
      - json
      - github
      - federacion
      - federación
      - wif
      - workload
      - identidad
    answer: 'Claves JSON, no: la política del banco lo impide. Ya tenemos el pool de GitHub. Da a la cuenta de servicio el rol Workload Identity User para este principal: principalSet://iam.googleapis.com/projects/287419653021/locations/global/workloadIdentityPools/github/attribute.repository/zentra/asesores-backend. Así solo ese repositorio puede usarla.'
story: |-
  **Backend de asesores en DEV**: `dev-zentra-asesores-sp` (número `287419653021`).

  > **REQ-41281 · P3** · Asesores: *«Apagamos Jenkins: desplegaremos Cloud Run de DEV desde GitHub Actions. Necesitamos una cuenta de servicio `gh-deploy` y **su clave JSON** para meterla como secreto en GitHub.»*

  Lo de la cuenta de servicio, sí. Lo de la **clave JSON, no**: una clave que vive en GitHub es una contraseña que no caduca, y la política del banco **impide crearlas**. La forma buena es la **federación de identidades** (Workload Identity Federation): GitHub presenta su propio token y Google le deja actuar como la cuenta de servicio **solo si viene de ese repositorio**.

  **En la consola** (proyecto `dev-zentra-asesores-sp`):
  1. Pregunta a Seguridad cuál es el principal de GitHub.
  2. **IAM y administración › Cuentas de servicio › Crear cuenta de servicio**: `gh-deploy`.
  3. **IAM y administración › IAM › Conceder acceso**: a `serviceAccount:gh-deploy@dev-zentra-asesores-sp.iam.gserviceaccount.com` el rol **`roles/run.developer`** (desplegar en Cloud Run, nada más).
  4. En la cuenta de servicio › **Quién puede usar esta cuenta de servicio › Conceder acceso**: el principal de GitHub con **`roles/iam.workloadIdentityUser`**.
  5. No crees claves. Responde explicando cómo se configura en GitHub (sin secreto) y resuelve.
objectives:
- Pregunta a Seguridad
- Crea gh-deploy en DEV del backend
- Solo el rol de despliegue
- GitHub puede usarla por federación
- Sin claves JSON
- Responde y resuelve
hints:
- text: 'Cuentas de servicio › gh-deploy › «Quién puede usar esta cuenta de servicio» › Conceder acceso › el principalSet de GitHub › roles/iam.workloadIdentityUser.'
quiz:
- id: q1
  question: ¿Por qué no se da una clave JSON para GitHub?
  options:
  - Es una credencial que no caduca y puede filtrarse; la federación da tokens cortos solo a ese repositorio
  - Porque GitHub no admite secretos
  - Porque las claves JSON cuestan dinero
  - Se puede dar si se rota cada año
  answer:
  - 0
solution: |
  ticket
  ask security "Piden una clave JSON de gh-deploy para GitHub. ¿Cuál es el principal de la federación de GitHub?"
  gcloud config set project dev-zentra-asesores-sp
  gcloud iam service-accounts create gh-deploy --display-name="Despliegue desde GitHub (asesores-backend)"
  gcloud projects add-iam-policy-binding dev-zentra-asesores-sp --member=serviceAccount:gh-deploy@dev-zentra-asesores-sp.iam.gserviceaccount.com --role=roles/run.developer
  gcloud iam service-accounts add-iam-policy-binding gh-deploy@dev-zentra-asesores-sp.iam.gserviceaccount.com --role=roles/iam.workloadIdentityUser --member=principalSet://iam.googleapis.com/projects/287419653021/locations/global/workloadIdentityPools/github/attribute.repository/zentra/asesores-backend
  ticket update "Hola Hugo: creada la cuenta de servicio gh-deploy en dev-zentra-asesores-sp con el rol run.developer (desplegar en Cloud Run de DEV). No damos clave JSON (la política del banco no lo permite y sería una contraseña que no caduca): GitHub entra por federación de identidades. Solo el repositorio zentra/asesores-backend puede usarla (workloadIdentityUser). En el workflow usad google-github-actions/auth con workload_identity_provider (el pool github) y service_account gh-deploy@dev-zentra-asesores-sp.iam.gserviceaccount.com; no hace falta ningún secreto."
  ticket resolve "gh-deploy creada con run.developer y federación para zentra/asesores-backend; sin claves."
shortcuts:
- name: owner and try to create a key
  run: |
    gcloud iam service-accounts create gh-deploy --project=dev-zentra-asesores-sp
    gcloud projects add-iam-policy-binding dev-zentra-asesores-sp --member=serviceAccount:gh-deploy@dev-zentra-asesores-sp.iam.gserviceaccount.com --role=roles/owner
    ticket update "Hola Hugo: creada gh-deploy como owner. La clave JSON la tiene que crear Seguridad."
    ticket resolve "Cuenta de servicio creada con permisos de owner para el pipeline."

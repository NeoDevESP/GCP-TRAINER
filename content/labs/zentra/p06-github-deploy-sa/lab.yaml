id: zentra-p06-github-deploy-sa
title: REQ · Cuenta de servicio para desplegar desde GitHub (adiós a Jenkins)
summary: 'Con la migración de Bitbucket y Jenkins a GitHub, el backend de asesores necesita desplegar en DEV desde GitHub Actions. Crea la cuenta de servicio, dale solo lo necesario y deja que GitHub la use por federación de identidades, sin claves.'

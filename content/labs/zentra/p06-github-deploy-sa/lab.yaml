tutor:
- match: service-accounts create gh-deploy
  title: Una identidad para el pipeline
  why: Una cuenta de servicio por uso; así sus permisos se pueden acotar y revocar.
- match: run.developer
  title: Solo desplegar
  why: run.developer despliega servicios de Cloud Run; no da permisos sobre IAM ni sobre otros servicios.
- match: workloadIdentityUser
  title: GitHub sin claves
  why: El principalSet limita el uso de la cuenta a un repositorio concreto; GitHub obtiene tokens de corta duración.
en:
  title: REQ · Service account to deploy from GitHub (goodbye Jenkins)
  summary: 'With the migration from Bitbucket and Jenkins to GitHub, the asesores backend needs to deploy to DEV from GitHub Actions. Create the service account, give it only what is needed and let GitHub use it through identity federation, without keys.'
  story: |-
    **Asesores backend in DEV**: `dev-zentra-asesores-sp` (number `287419653021`).

    > **REQ-41281 · P3** · Asesores: *"We are switching Jenkins off: we will deploy Cloud Run in DEV from GitHub Actions. We need a `gh-deploy` service account and **its JSON key** to store it as a secret in GitHub."*

    The service account, yes. The **JSON key, no**: a key living in GitHub is a password that never expires, and the bank's policy **blocks creating them**. The right way is **identity federation** (Workload Identity Federation): GitHub presents its own token and Google lets it act as the service account **only if it comes from that repository**.

    **In the console** (project `dev-zentra-asesores-sp`):
    1. Ask Security what the GitHub principal is.
    2. **IAM & Admin › Service accounts › Create service account**: `gh-deploy`.
    3. **IAM & Admin › IAM › Grant access**: give `serviceAccount:gh-deploy@dev-zentra-asesores-sp.iam.gserviceaccount.com` the **`roles/run.developer`** role (deploy to Cloud Run, nothing else).
    4. On the service account › **Who can use this service account › Grant access**: the GitHub principal with **`roles/iam.workloadIdentityUser`**.
    5. Don't create keys. Reply explaining how to configure it in GitHub (no secret) and resolve.
  objectives:
  - Ask Security
  - Create gh-deploy in the backend DEV project
  - Only the deploy role
  - GitHub can use it through federation
  - No JSON keys
  - Reply and resolve
  hints:
  - 'Service accounts › gh-deploy › "Who can use this service account" › Grant access › the GitHub principalSet › roles/iam.workloadIdentityUser.'
  ticket:
    summary: 'We are switching Jenkins off: the asesores backend (repo zentra/asesores-backend) will deploy to Cloud Run in DEV from GitHub Actions. We need a gh-deploy service account in dev-zentra-asesores-sp and its JSON key to store it as a secret in GitHub.'
  text:
    Hugo Martín (Asesores): Hugo Martín (Asesores)
    Nadia Kowalski (Seguridad cloud): Nadia Kowalski (Cloud security)
    Seguridad cloud. Dueña de la federación de identidades con GitHub.: Cloud security. Owner of the identity federation with GitHub.
    Nada de claves JSON. GitHub entra por federación de identidades.: No JSON keys. GitHub comes in through identity federation.
    'Claves JSON, no: la política del banco lo impide. Ya tenemos el pool de GitHub. Da a la cuenta de servicio el rol Workload Identity User para este principal: principalSet://iam.googleapis.com/projects/287419653021/locations/global/workloadIdentityPools/github/attribute.repository/zentra/asesores-backend. Así solo ese repositorio puede usarla.': 'JSON keys, no: the bank''s policy blocks them. We already have the GitHub pool. Give the service account the Workload Identity User role for this principal: principalSet://iam.googleapis.com/projects/287419653021/locations/global/workloadIdentityPools/github/attribute.repository/zentra/asesores-backend. That way only that repository can use it.'
    ¿Por qué no se da una clave JSON para GitHub?: Why is no JSON key given to GitHub?
    Es una credencial que no caduca y puede filtrarse; la federación da tokens cortos solo a ese repositorio: It is a credential that never expires and can leak; federation gives short-lived tokens only to that repository
    Porque GitHub no admite secretos: Because GitHub doesn't support secrets
    Porque las claves JSON cuestan dinero: Because JSON keys cost money
    Se puede dar si se rota cada año: It can be given if rotated every year
    Cuenta de servicio de despliegue: Deploy service account
    gh-deploy existe en DEV del backend: gh-deploy exists in the backend DEV project
    Puede desplegar en Cloud Run: It can deploy to Cloud Run
    Federación sin claves: Federation without keys
    Solo el repositorio de GitHub puede usarla: Only the GitHub repository can use it
    Con el rol Workload Identity User: With the Workload Identity User role
    No puede cambiar permisos del proyecto: It cannot change project permissions
    Con Seguridad: With Security
    Principal de GitHub confirmado con Seguridad: GitHub principal confirmed with Security
    Respuesta: Reply
    Explica la federación en vez de la clave: Explains federation instead of the key
    Ticket resuelto: Ticket resolved
    Lo has entendido: You understood it
    Pregunta del caso: Case question
    Una identidad para el pipeline: An identity for the pipeline
    Una cuenta de servicio por uso; así sus permisos se pueden acotar y revocar.: One service account per use; that way its permissions can be scoped and revoked.
    Solo desplegar: Deploy only
    run.developer despliega servicios de Cloud Run; no da permisos sobre IAM ni sobre otros servicios.: run.developer deploys Cloud Run services; it gives no permissions on IAM or other services.
    GitHub sin claves: GitHub without keys
    El principalSet limita el uso de la cuenta a un repositorio concreto; GitHub obtiene tokens de corta duración.: The principalSet limits the account's use to one repository; GitHub gets short-lived tokens.

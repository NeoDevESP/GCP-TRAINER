story: |-
  > 🧰 **Taller desde cero.** No necesitas saber nada antes. Lee cada bloque, copia el comando en el terminal de abajo y mira qué sale. Si te pierdes, abre la pestaña **Profesor**: te acompaña paso a paso.

  **El cortafuegos** decide qué tráfico puede llegar a cada máquina. En una VPC de Google, por defecto **no entra nada** y **sale todo**. Para dejar pasar algo creas una **regla** con:

  - **Dirección**: entrante (*ingress*) casi siempre.
  - **Origen**: de dónde viene (un rango de IPs o máquinas con una **etiqueta de red**).
  - **Destino**: a qué máquinas se aplica (por su etiqueta).
  - **Protocolo y puerto**: por ejemplo `tcp:80`.

  Las **etiquetas de red** (`--tags`) son como pegatinas en las máquinas: la regla dice «de las que llevan la pegatina A a las que llevan la pegatina B».

  **1 · Compruébalo:** `gcloud compute ssh cliente-formacion --zone={{.zone}} --tunnel-through-iap --command='curl -s -m 3 http://web-formacion'` → no responde: falta la regla.
  **2 · Mira las reglas:** `gcloud compute firewall-rules list --filter="network:zentra-vpc"`.
  **3 · Crea la regla mínima:** `gcloud compute firewall-rules create allow-cliente-a-web-formacion --network=zentra-vpc --allow=tcp:80 --source-tags=cliente-formacion --target-tags=web-formacion`.
  **4 · Vuelve a probar** el `curl` y cierra.

  ⚠️ Nunca `--source-ranges=0.0.0.0/0`: eso es «todo internet».
objectives:
- Comprueba que no hay acceso
- Mira las reglas existentes
- Crea la regla mínima por etiquetas

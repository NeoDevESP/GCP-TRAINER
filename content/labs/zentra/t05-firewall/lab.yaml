en:
  title: 'Workshop 5 · The firewall from zero: who may talk to whom'
  summary: 'By default nothing gets in. Open only what''s needed: from one specific machine to another, on one specific port.'
  story: |-
    > 🧰 **Workshop from zero.** You don't need to know anything beforehand. Read each block, copy the command into the terminal below and see what comes out. If you get lost, open the **Tutor** tab: it walks you through step by step.

    **The firewall** decides which traffic can reach each machine. In a Google VPC, by default **nothing gets in** and **everything goes out**. To let something through you create a **rule** with:

    - **Direction**: ingress, almost always.
    - **Source**: where it comes from (an IP range or machines with a **network tag**).
    - **Target**: which machines it applies to (by their tag).
    - **Protocol and port**: e.g. `tcp:80`.

    **Network tags** (`--tags`) are like stickers on machines: the rule says "from those with sticker A to those with sticker B".

    **1 · Check it:** `gcloud compute ssh cliente-formacion --zone={{.zone}} --tunnel-through-iap --command='curl -s -m 3 http://web-formacion'` → no answer: the rule is missing.
    **2 · Look at the rules:** `gcloud compute firewall-rules list --filter="network:zentra-vpc"`.
    **3 · Create the minimal rule:** `gcloud compute firewall-rules create allow-cliente-a-web-formacion --network=zentra-vpc --allow=tcp:80 --source-tags=cliente-formacion --target-tags=web-formacion`.
    **4 · Try the `curl` again** and close.

    ⚠️ Never `--source-ranges=0.0.0.0/0`: that means "the whole internet".
  objectives:
  - Check there's no access
  - Look at the existing rules
  - Create the minimal rule by tags
  - Validate and close
  hints:
  - Source `--source-tags=cliente-formacion`, target `--target-tags=web-formacion`, `--allow=tcp:80`.
  ticket:
    summary: 'Fifth workshop: let cliente-formacion see web-formacion''s website (port 80) without opening it to anyone else.'

    > **REQ-41297 · P4** · Asesores: *"When deploying to DEV we get `API [secretmanager.googleapis.com] not enabled on project [287419653021]`. Can you enable Secret Manager in the backend, in DEV and AU?"*

    The error carries the project **number**, not its ID: `287419653021`. Look it up in the project picker to know which one it is (the backend is the `-sp` one, not the frontend).

    **In the console**, in DEV and then in AU:
    1. **Project picker** › the project (check the number).
    2. **Menu › APIs & Services** › search **Secret Manager API** › **Enable**.

    PRO is not requested: don't touch it. Reply and resolve.

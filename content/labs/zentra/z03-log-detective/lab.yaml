en:
  title: 'Tutorial 3 · Log detective: who broke SSH?'
  summary: Use audit logs to find who changed what and when, and restore access without opening it to the internet.
  story: |-
    > 📘 **Guided tutorial.** Follow the steps in order; every command comes with its explanation. If you get lost, press **Tutor** and it walks you through.

    IAP error **4003** means IAP can't reach the VM's port 22: almost always the firewall.

    **Step 1 · Reproduce.** `gcloud compute ssh ops-herramientas --zone={{.zone}} --tunnel-through-iap` and read the full error.

    **Step 2 · Look at the rules.** `gcloud compute firewall-rules list`: is there one letting 35.235.240.0/20 (IAP) in on tcp:22?

    **Step 3 · Find who and when.** Audit logs keep every change. Try:
    `gcloud logging read 'protoPayload.methodName:"firewalls.delete"' --limit=5`
    Look at `authenticationInfo.principalEmail` (who) and `timestamp` (when).

    **Step 4 · Talk to that person** (`ask network "…"`) before undoing anything: there may be a reason.

    **Step 5 · Restore** the rule as it was (tcp:22 only from 35.235.240.0/20, never 0.0.0.0/0) and test SSH again.

    **Step 6 · Leave an internal note** with who, when and what (`ticket comment "…"`), reply to Diego and close.
  objectives:
  - Reproduce the error
  - Find in the audit logs who deleted what
  - Restore the rule without opening to the internet
  - Document and close
  hints:
  - '`gcloud logging read ''protoPayload.methodName:"firewalls.delete"'' --limit=5`.'
  - '`gcloud compute firewall-rules create allow-iap-ssh --network=zentra-vpc --allow=tcp:22 --source-ranges=35.235.240.0/20`.'
  ticket:
    summary: 'Since this morning nobody can SSH into ops-herramientas: "Error while connecting [4003: failed to connect to backend]". It worked yesterday.'
  text:
    Diego Ferrer (SRE): Diego Ferrer (SRE)
    Tomás Vidal (Red): Tomás Vidal (Network)
    Arquitecto de red, dueño de los cortafuegos.: Network architect, owns the firewall rules.
    Esta mañana he hecho limpieza de reglas antiguas…: This morning I cleaned up some old rules…
    '¡Uy! Borré allow-iap-ssh pensando que era de una prueba. Restaúrala igual: tcp:22 solo desde 35.235.240.0/20.': 'Oops! I deleted allow-iap-ssh thinking it was from a test. Restore it the same: tcp:22 only from 35.235.240.0/20.'
    SSH restaurado de forma segura: SSH safely restored
    Regla de IAP a tcp:22: IAP rule to tcp:22
    El 22 no está abierto a internet: Port 22 isn't open to the internet
    Investigación en auditoría: Audit investigation
    Registros de auditoría consultados: Audit logs queried
    Hablado con quien hizo el cambio: Talked to whoever made the change
    Nota y cierre: Note and closure
    Nota interna con quién y qué: Internal note with who and what
    Ticket cerrado: Ticket closed
    Reproduce el fallo: Reproduce the failure
    4003 = IAP no alcanza el puerto 22. Lo primero, el cortafuegos.: '4003 = IAP can''t reach port 22. First suspect: the firewall.'
    Pregunta a la auditoría: Ask the audit log
    Cada cambio en GCP deja quién, qué y cuándo. Es tu máquina del tiempo.: Every GCP change records who, what and when. It's your time machine.
    'Antes de deshacer el cambio de otro, pregúntale: puede haber una razón que no ves.': 'Before undoing someone else''s change, ask them: there may be a reason you can''t see.'
    'Solo 35.235.240.0/20: es el rango de IAP. Abrir a 0.0.0.0/0 «para que funcione» es un incidente de seguridad.': 'Only 35.235.240.0/20: it''s IAP''s range. Opening 0.0.0.0/0 "to make it work" is a security incident.'

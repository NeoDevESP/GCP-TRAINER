- type: firewall_delete
  rule: allow-iap-ssh
  actor: tomas.vidal@zentra.dev
ticket:
  id: INC-30311
  kind: INC
  priority: P3
  sla: 8h
  reporter: Diego Ferrer (SRE)
  summary: 'Desde esta mañana nadie puede entrar por SSH a ops-herramientas: «Error while connecting [4003: failed to connect to backend]». Ayer funcionaba.'
actors:
- role: network
  name: Tomás Vidal (Red)
  persona: Arquitecto de red, dueño de los cortafuegos.
  fallback: Esta mañana he hecho limpieza de reglas antiguas…
  facts:
  - keywords:
    - - borr
      - delete
      - allow-iap
      - regla
      - rule
    answer: '¡Uy! Borré allow-iap-ssh pensando que era de una prueba. Restaúrala igual: tcp:22 solo desde 35.235.240.0/20.'
story: |-
  > 📘 **Tutorial guiado.** Sigue los pasos en orden; cada comando trae su explicación. Si te pierdes, pulsa **Tutor** y te acompaña paso a paso.

  El error **4003** de IAP significa que IAP no consigue llegar al puerto 22 de la VM: casi siempre es el cortafuegos.

  **Paso 1 · Reproduce.** `gcloud compute ssh ops-herramientas --zone={{.zone}} --tunnel-through-iap` y lee el error completo.

  **Paso 2 · Mira las reglas.** `gcloud compute firewall-rules list`: ¿hay alguna que deje entrar a 35.235.240.0/20 (IAP) por tcp:22?

  **Paso 3 · Busca quién y cuándo.** Los registros de auditoría guardan cada cambio. Prueba:
  `gcloud logging read 'protoPayload.methodName:"firewalls.delete"' --limit=5`
  Fíjate en `authenticationInfo.principalEmail` (quién) y `timestamp` (cuándo).

  **Paso 4 · Habla con esa persona** (`ask network "…"`) antes de deshacer nada: puede haber un motivo.

  **Paso 5 · Restaura** la regla tal como era (tcp:22 solo desde 35.235.240.0/20, nunca 0.0.0.0/0) y vuelve a probar el SSH.

  **Paso 6 · Deja una nota interna** con quién, cuándo y qué (`ticket comment "…"`), responde a Diego y cierra.
objectives:
- Reproduce el error
- Encuentra en auditoría quién borró qué
- Restaura la regla sin abrir a internet
- Documenta y cierra
hints:
- text: '`gcloud logging read ''protoPayload.methodName:"firewalls.delete"'' --limit=5`.'
- text: '`gcloud compute firewall-rules create allow-iap-ssh --network=zentra-vpc --allow=tcp:22 --source-ranges=35.235.240.0/20`.'
solution: |
  ticket
  gcloud compute firewall-rules list
  gcloud logging read 'protoPayload.methodName:"firewalls.delete"' --limit=5
  ask network "¿borraste tú la regla allow-iap-ssh esta mañana?"
  gcloud compute firewall-rules create allow-iap-ssh --network=zentra-vpc --allow=tcp:22 --source-ranges=35.235.240.0/20
  gcloud compute ssh ops-herramientas --zone={{.zone}} --tunnel-through-iap --command='hostname'
  ticket comment "Causa: tomas.vidal@zentra.dev borró la regla allow-iap-ssh en una limpieza (registro de auditoría firewalls.delete). Restaurada igual: tcp:22 solo desde 35.235.240.0/20."
  ticket update "Hola Diego: ya se puede entrar por SSH a ops-herramientas. Se había borrado por error la regla que deja pasar a IAP; está restaurada."
  ticket resolve "Restaurada allow-iap-ssh (tcp:22 desde 35.235.240.0/20) tras localizar el borrado en auditoría; SSH por IAP comprobado."
shortcuts:

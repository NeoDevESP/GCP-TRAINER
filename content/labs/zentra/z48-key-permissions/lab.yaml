tutor:
- match: systemctl status nginx
  title: Por qué no arranca
  why: «permission denied (running as www-data)» al abrir la clave.
- match: chmod 640
  title: Mínimo necesario
  why: rw para root, r para el grupo www-data, nada para el resto.
en:
  title: INC P2 · The business portal won't start after hardening
  summary: A hardening script left the TLS key for root only, and nginx, running as www-data, can no longer read it. Fix it without making it world-readable.
  story: |-
    **Project `{{.project}}`** (*zentra-empresas-prod*).

    > **INC-31048 · P2** · *"The business portal hasn't loaded since this morning's restart. Security ran its hardening script on every VM last night."*

    SSH in through IAP and see why nginx won't start (`systemctl status nginx`, `journalctl`). In Linux, who can read a file depends on the **owner**, the **group** and the **permissions** (`ls -l`). A private key must never be world-readable: the right thing is that **only** the service's user reads it.
  objectives:
  - See why nginx won't start
  - Check the key's owner and permissions
  - Give read access only to the service's group
  - Start and validate
  hints:
  - '`sudo systemctl status nginx` and `ls -l /etc/nginx/tls/`'
  - '`sudo chgrp www-data /etc/nginx/tls/empresas.key && sudo chmod 640 /etc/nginx/tls/empresas.key`'
  ticket:
    summary: The business portal hasn't loaded since this morning's restart. Security ran its hardening script on every VM last night.
  text:
    Banca de empresas: Business banking
    Nadia Kowalski (Seguridad cloud): Nadia Kowalski (Cloud security)
    Ingeniera de seguridad cloud.: Cloud security engineer.
    'Si hay datos de clientes expuestos, es un incidente de seguridad: contén primero y avísanos.': 'If customer data is exposed, it''s a security incident: contain first and tell us.'
    ? 'El script pone las claves en 600 root:root. Para nginx lo correcto es 640 root:www-data: la lee el servicio y nadie más. Nunca 644.'
    : 'The script sets keys to 600 root:root. For nginx the right thing is 640 root:www-data: the service reads it and nobody else. Never 644.'
    Diego Ferrer (SRE): Diego Ferrer (SRE)
    SRE de guardia.: On-call SRE.
    ¿Qué ha cambiado? Mira los registros y la auditoría.: What changed? Check the logs and the audit trail.
    Portal en marcha: Portal running
    El portal responde: The portal responds
    Clave protegida: Key protected
    La lee www-data y no el resto: www-data reads it, nobody else does
    Diagnóstico: Diagnosis
    Servicio y permisos revisados: Service and permissions checked
    Documentado: Documented
    Nota con la causa: Note with the cause
    Ticket cerrado: Ticket closed
    Por qué no arranca: Why it won't start
    «permission denied (running as www-data)» al abrir la clave.: '"permission denied (running as www-data)" opening the key.'
    Mínimo necesario: Least needed
    rw para root, r para el grupo www-data, nada para el resto.: rw for root, r for the www-data group, nothing for others.

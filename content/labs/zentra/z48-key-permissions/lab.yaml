id: zentra-z48-key-permissions
title: INC P2 · El portal de empresas no arranca tras el endurecimiento
summary: Un script de endurecimiento dejó la clave TLS solo para root y nginx, que corre como www-data, ya no puede leerla. Arréglalo sin dejarla legible para todos.
track: zentra
day: 48
level: professional
branch: compute
type: incident
mode: production
skills:
- linux.permissions
- compute.troubleshooting
- security.secrets
wellArchitected:
- security
- reliability
certs:
- ACE
- PCA
difficulty: 3
minutes: 30
baseline:
- zentra-core
setup: |
  gcloud compute instances create portal-empresas --zone={{.zone}} --machine-type=e2-small --subnet=apps --no-address --tags=portal --metadata=sim-preinstalled=nginx,startup-script='apt-get install -y nginx'
  gcloud compute instances create ops-consola --zone={{.zone}} --machine-type=e2-small --subnet=apps --no-address --tags=ops
  gcloud compute firewall-rules create allow-ops-to-portal --network=zentra-vpc --allow=tcp:80 --source-tags=ops --target-tags=portal
faults:
- type: os_user
  vm: portal-empresas
  user: www-data
  groups:
  - www-data
- type: os_file
  vm: portal-empresas
  path: /etc/nginx/tls/empresas.key
  content: '-----BEGIN PRIVATE KEY-----'
  owner: root
  group: root
  mode: '600'
- type: os_service
  vm: portal-empresas
  service: nginx
  user: www-data
  config: /etc/nginx/tls/empresas.key
ticket:
  id: INC-31048
  kind: INC
  priority: P2
  sla: 1h
  reporter: Banca de empresas
  summary: El portal de empresas no carga desde el reinicio de esta mañana. Seguridad pasó anoche su script de endurecimiento por todas las VMs.
actors:
- role: security
  name: Nadia Kowalski (Seguridad cloud)
  persona: Ingeniera de seguridad cloud.
  fallback: 'Si hay datos de clientes expuestos, es un incidente de seguridad: contén primero y avísanos.'
  facts:
  - keywords:
    - - clave
      - key
      - tls
      - permiso
      - permission
      - '600'
      - '640'
      - chmod
    answer: 'El script pone las claves en 600 root:root. Para nginx lo correcto es 640 root:www-data: la lee el servicio y nadie más. Nunca 644.'
- role: sre
  name: Diego Ferrer (SRE)
  persona: SRE de guardia.
  fallback: ¿Qué ha cambiado? Mira los registros y la auditoría.
  facts: []
story: |-
  **Proyecto `{{.project}}`** (*zentra-empresas-prod*).

  > **INC-31048 · P2** · *«El portal de empresas no carga desde el reinicio de esta mañana. Seguridad pasó anoche su script de endurecimiento por todas las VMs.»*

  Entra por IAP y mira por qué no arranca nginx (`systemctl status nginx`, `journalctl`). En Linux, quién puede leer un fichero depende del **dueño**, el **grupo** y los **permisos** (`ls -l`). Una clave privada nunca debe ser legible por todos: lo correcto es que la lea **solo** el usuario del servicio.
objectives:
- Mira por qué no arranca nginx
- Revisa dueño y permisos de la clave
- Dale lectura solo al grupo del servicio
- Arranca y valida
hints:
- text: '`sudo systemctl status nginx` y `ls -l /etc/nginx/tls/`'
- text: '`sudo chgrp www-data /etc/nginx/tls/empresas.key && sudo chmod 640 /etc/nginx/tls/empresas.key`'
solution: |
  ticket
  gcloud compute ssh portal-empresas --zone={{.zone}} --tunnel-through-iap --command='sudo systemctl status nginx'
  gcloud compute ssh portal-empresas --zone={{.zone}} --tunnel-through-iap --command='ls -l /etc/nginx/tls/'
  ask security "¿qué permisos debe tener la clave TLS de nginx según la norma?"
  gcloud compute ssh portal-empresas --zone={{.zone}} --tunnel-through-iap --command='sudo chgrp www-data /etc/nginx/tls/empresas.key'
  gcloud compute ssh portal-empresas --zone={{.zone}} --tunnel-through-iap --command='sudo chmod 640 /etc/nginx/tls/empresas.key'
  gcloud compute ssh portal-empresas --zone={{.zone}} --tunnel-through-iap --command='sudo systemctl restart nginx'
  gcloud compute ssh portal-empresas --zone={{.zone}} --tunnel-through-iap --command='sudo systemctl status nginx'
  ticket comment "Causa: el script de endurecimiento dejó /etc/nginx/tls/empresas.key en 600 root:root y nginx corre como www-data (permission denied al arrancar). Puesto 640 root:www-data con el OK de Seguridad; la clave no es legible por otros usuarios. Pedido a Seguridad que el script respete el grupo del servicio."
  ticket update "Resuelto: el portal de empresas vuelve a funcionar. Un ajuste de seguridad impedía al servidor web leer su certificado; lo hemos corregido manteniendo la clave protegida."
  ticket resolve "Clave TLS en 640 root:www-data; nginx arranca y el portal responde."
shortcuts:
- name: make the key world-readable
  run: |
    gcloud compute ssh portal-empresas --zone={{.zone}} --tunnel-through-iap --command='sudo chmod 644 /etc/nginx/tls/empresas.key'
    gcloud compute ssh portal-empresas --zone={{.zone}} --tunnel-through-iap --command='sudo systemctl restart nginx'
    ticket resolve "Dado permiso de lectura a la clave TLS para que nginx arranque."

id: zentra-t08-logs
title: 'Taller 8 · Registros desde cero: qué pasó y quién lo hizo'
summary: Cloud Logging guarda lo que ocurre. Aprende a filtrar por gravedad, por recurso y a encontrar quién creó una máquina.
track: zentra
day: 8
level: basic
branch: observability
type: guided
mode: production
skills:
- observability.logging
- security.audit
wellArchitected:
- operations
- security
certs:

en:
  title: 'Workshop 8 · Logs from zero: what happened and who did it'
  summary: Cloud Logging keeps what happens. Learn to filter by severity and resource, and to find who created a machine.
  story: |-
    > 🧰 **Workshop from zero.** You don't need to know anything beforehand. Read each block, copy the command into the terminal below and see what comes out. If you get lost, open the **Tutor** tab: it walks you through step by step.

    **Cloud Logging** keeps **logs**: dated lines telling what happened. There are two kinds you'll use every day:

    - **Application logs**: what programs write ("error connecting…").
    - **Audit logs**: **who** made **which** change and **when** (create, delete, change permissions). In support they're gold: nearly every incident starts with "what changed?".

    Each entry has a **severity** (INFO, WARNING, ERROR…), a **resource** (`resource.type`: a VM, a Cloud Run service…) and, in audit entries, the **method** (`protoPayload.methodName`) and **who** (`authenticationInfo.principalEmail`).

    **1 · The latest:** `gcloud logging read --limit=5`.
    **2 · Errors only:** `gcloud logging read 'severity>=ERROR' --limit=5`.
    **3 · Who created VMs:** `gcloud logging read 'protoPayload.methodName:"instances.insert"' --limit=5`. Find the `vm-misteriosa` line and its `principalEmail`.
    **4 · Note it:** `echo "the-email-you-see" > quien.txt` and close.
  objectives:
  - Read the latest logs
  - Filter by severity
  - Find who created the VM
  - Note it and close
  hints:
  - '`gcloud logging read ''protoPayload.methodName:"instances.insert"'' --limit=5`'
  ticket:
    summary: 'Eighth workshop: a VM called vm-misteriosa appeared. Find out in the logs who created it and write it in quien.txt.'
  text:

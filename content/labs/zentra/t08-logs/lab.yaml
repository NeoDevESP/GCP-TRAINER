solution: |
  ticket
  gcloud logging read --limit=5
  gcloud logging read 'severity>=ERROR' --limit=5
  gcloud logging read 'protoPayload.methodName:"instances.insert"' --limit=5
  echo "script-pruebas@{{.project}}.iam.gserviceaccount.com" > quien.txt
  ticket resolve "Taller 8 hecho: según la auditoría, vm-misteriosa la creó script-pruebas; los registros de auditoría dicen quién, qué y cuándo."

difficulty: 1
minutes: 25
baseline:
- zentra-core
faults:
- type: command
  actor: script-pruebas@{{.project}}.iam.gserviceaccount.com
  run: gcloud compute instances create vm-misteriosa --zone={{.zone}} --machine-type=e2-micro --subnet=apps --no-address
ticket:
  id: FOR-0008
  kind: REQ
  priority: P4
  sla: 5d
  reporter: Formación Zentra
  summary: 'Octavo taller: ha aparecido una VM llamada vm-misteriosa. Averigua en los registros quién la creó y apúntalo en quien.txt.'
actors:
- role: manager
  name: Marta Ibáñez (responsable de Plataforma)
  persona: Tu responsable en Zentra.
  fallback: 'Sin prisa: esta semana es para aprender lo básico. Pregunta todo lo que necesites.'
  facts: []
story: |-
  > 🧰 **Taller desde cero.** No necesitas saber nada antes. Lee cada bloque, copia el comando en el terminal de abajo y mira qué sale. Si te pierdes, abre la pestaña **Profesor**: te acompaña paso a paso.

  **Cloud Logging** guarda los **registros** (*logs*): líneas con fecha que cuentan qué ha pasado. Hay dos tipos que usarás a diario:

  - **Registros de aplicación**: lo que escriben los programas («error al conectar…»).
  - **Registros de auditoría**: **quién** hizo **qué** cambio y **cuándo** (crear, borrar, cambiar permisos). En soporte son oro: casi todo incidente empieza por «¿qué ha cambiado?».

  Cada entrada tiene una **gravedad** (`severity`: INFO, WARNING, ERROR…), un **recurso** (`resource.type`: una VM, un servicio de Cloud Run…) y, en las de auditoría, el **método** (`protoPayload.methodName`) y **quién** (`authenticationInfo.principalEmail`).

  **1 · Lo último:** `gcloud logging read --limit=5`.
  **2 · Solo errores:** `gcloud logging read 'severity>=ERROR' --limit=5`.
  **3 · Quién creó VMs:** `gcloud logging read 'protoPayload.methodName:"instances.insert"' --limit=5`. Busca la línea de `vm-misteriosa` y su `principalEmail`.
  **4 · Apúntalo:** `echo "el-correo-que-veas" > quien.txt` y cierra.
objectives:
- Lee los últimos registros
- Filtra por gravedad
- Encuentra quién creó la VM
- Apúntalo y cierra
hints:
- text: '`gcloud logging read ''protoPayload.methodName:"instances.insert"'' --limit=5`'
quiz:

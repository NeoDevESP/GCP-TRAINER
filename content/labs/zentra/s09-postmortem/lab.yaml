en:
  title: Craft 9 · The blameless postmortem
  summary: The payments P1 is over. Rebuild the timeline from the audit log, find the root cause (not the person) and propose actions with an owner and a date so it doesn't happen again.
  story: |-
    > 🎧 **Craft workshop.** You won't learn a new product here: you'll learn to **work a ticket** the way a good L2 Support engineer at a bank does. Read the explanation, follow the steps in the terminal and, if you get lost, open the **Tutor** tab.

    > **PRB-40109** · Marta: *"Postmortem of the payments P1 (INC-40106). Blameless. Deliver it in postmortem.md."*

    Yesterday at 07:50 a new version of `pagos-api` left every customer unable to pay; at 08:12 it was rolled back to the stable version. The pipeline deployed it after Hugo approved the *merge*. Today it's **postmortem** time.

    **Blameless** doesn't mean "no one is accountable": it means **the cause is never a person**. If one person could break production with a click, the cause is **the system that allowed it** (a missing test, canary, alert). That's why the document **contains no names of whoever made the mistake**: it has processes and systems.

    **Structure** of `postmortem.md`:
    1. **Summary** (2-3 lines).
    2. **Impact**: who, how much and for how long (`ask manager "…"`).
    3. **Timeline** with times: take it from the **audit log** (`gcloud logging read 'protoPayload.serviceName="run.googleapis.com"' --limit=10`) and the revisions (`gcloud run revisions list --service=pagos-api --region={{.region}}`).
    4. **Root cause**: ask "why?" until you reach the system (`ask payments "…"`).
    5. **What worked and what didn't**.
    6. **Actions**: each with an **owner** (a team) and a **date**. They should prevent a repeat or detect it sooner.

    Write it with `cat > postmortem.md`, review it with `cat postmortem.md` and close.
  objectives:
  - Rebuild the timeline
  - Find the cause in the system
  - Actions with owner and date
  - Blameless
  hints:
  - 'Root cause: a variable was missing (PSP_REGION) and the pipeline has no start-up test or canary.'
  - 'Typical action: "Add a start-up test and canary deployment to the payments pipeline · Owner: Payments · Date: 15/11".'
  ticket:
    summary: 'Postmortem of the payments P1 (INC-40106). Blameless: summary, impact, timeline, root cause, what worked and what didn''t, and actions with an owner and a date. Deliver it in postmortem.md.'
  text:
    Marta Ibáñez (Plataforma): Marta Ibáñez (Platform)
    Lucía Navarro (Pagos): Lucía Navarro (Payments)
    Tech lead de Pagos.: Payments tech lead.
    Queremos que no vuelva a pasar, no buscar culpables.: We want it not to happen again, not to find someone to blame.
    ? La 3.0 necesitaba una variable nueva (PSP_REGION) que no se añadió al servicio, así que no arrancaba. El pipeline no tiene prueba de arranque y publica directamente al 100 %, sin canario. El merge lo aprobaron en la revisión de código, pero nadie podía verlo sin esa prueba.
    : 3.0 needed a new variable (PSP_REGION) that wasn't added to the service, so it didn't start. The pipeline has no start-up test and publishes straight to 100%, with no canary. The merge was approved in code review, but nobody could have seen it without that test.
    Marta Ibáñez (responsable de Plataforma): Marta Ibáñez (Platform lead)
    Tu responsable en Zentra.: Your manager at Zentra.
    'Esta semana es para aprender el oficio: pregunta todo lo que necesites.': 'This week is for learning the craft: ask anything you need.'

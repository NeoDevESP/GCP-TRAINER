story: |-
  > 🎧 **Taller del oficio.** Aquí no aprendes un producto nuevo: aprendes a **trabajar un ticket** como lo hace un buen técnico de Soporte N2 en un banco. Lee la explicación, sigue los pasos en el terminal y, si te pierdes, abre la pestaña **Profesor**.

  > **PRB-40109** · Marta: *«Postmortem del P1 de pagos (INC-40106). Sin culpables. Entrégalo en postmortem.md.»*

  Ayer, a las 07:50, una versión nueva de `pagos-api` dejó a todos los clientes sin poder pagar; a las 08:12 se volvió a la versión estable. El cambio lo desplegó el pipeline después de que Hugo aprobara el *merge*. Hoy toca el **postmortem**.

  **Sin culpables (*blameless*)** no significa «sin responsables»: significa que **la causa nunca es una persona**. Si una persona pudo romper producción con un clic, la causa es **el sistema que lo permitió** (falta una prueba, un canario, una alarma). Por eso en el documento **no aparecen nombres de quien se equivocó**: aparecen procesos y sistemas.

  **Estructura** de `postmortem.md`:
  1. **Resumen** (2-3 líneas).
  2. **Impacto**: a quién, cuánto y cuánto tiempo (`ask manager "…"`).
  3. **Cronología** con horas: sácala de la **auditoría** (`gcloud logging read 'protoPayload.serviceName="run.googleapis.com"' --limit=10`) y de las revisiones (`gcloud run revisions list --service=pagos-api --region={{.region}}`).
  4. **Causa raíz**: pregunta «¿por qué?» hasta llegar al sistema (`ask payments "…"`).
  5. **Qué funcionó y qué no**.
  6. **Acciones**: cada una con **responsable** (un equipo) y **fecha**. Que eviten que vuelva a pasar o que lo detecten antes.

  Escríbelo con `cat > postmortem.md`, revísalo con `cat postmortem.md` y cierra.

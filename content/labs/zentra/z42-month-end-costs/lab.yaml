ticket:
  id: REQ-21042
  kind: REQ
  priority: P3
  sla: 1d
  reporter: Elena Ríos (FinOps)
  summary: La previsión de este mes va un 70 % por encima del anterior. Necesito saber qué ha subido y de quién es, y que apaguéis lo que sobre sin romper producción. Y que nos avise un presupuesto antes la próxima vez.
actors:
- role: finops
  name: Elena Ríos (FinOps)
  persona: FinOps.
  fallback: Necesito saber qué ha subido, de quién es y qué se puede apagar.
  facts: []
- role: data
  name: Omar Haddad (Datos)
  persona: Científico de datos.
  fallback: Entrenamos modelos de fraude de vez en cuando.
  facts:
  - keywords:
    - - gpu
      - ia-fraude
      - entreno
      - training
      - borrar
      - delete

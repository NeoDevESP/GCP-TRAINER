    answer: 'Ni idea de quién es vm-temporal-7. Nuestra norma: lo que no tiene dueño se para (no se borra) y se avisa en el canal.'
story: |-
  **Proyecto `{{.project}}`** (*zentra-analitica-prod*).

  > **REQ-21042 · P3** · *«La previsión de este mes va un 70 % por encima del anterior. Necesito saber qué ha subido y de quién es, y que apaguéis lo que sobre sin romper producción. Y que nos avise un presupuesto antes la próxima vez.»*

  Mira el informe de costes por recurso y las **recomendaciones** de Google (recursos ociosos). Las **etiquetas** (`equipo`, `uso`) dicen de quién es cada cosa: pregunta a su dueño **antes** de borrar. Lo que no tiene dueño **se para, no se borra**. Los discos se borran después de guardar una **instantánea**. Termina con un presupuesto mensual de 500 EUR con avisos al 50, 90 y 100 %.
objectives:
- Encuentra qué ha subido y de quién es
- Confirma con cada dueño
- Ahorra sin perder nada
- Crea el presupuesto con avisos
hints:
- text: '`gcloud billing report --group-by=resource` y `gcloud compute instances list --format=''table(name,machineType,labels)''`'
- text: '`gcloud billing budgets create --billing-account=0X0X0X-0X0X0X-0X0X0X --display-name=mensual --budget-amount=500EUR --threshold-rule=percent=0.5 --threshold-rule=percent=0.9 --threshold-rule=percent=1.0`'
solution: |
  ticket
  gcloud billing report --group-by=resource
  gcloud compute instances list --format='table(name,machineType,labels)'
  gcloud compute disks list
  gcloud recommender recommendations list --recommender=google.compute.instance.IdleResourceRecommender --location={{.zone}}
  ask data "¿se puede borrar ia-fraude-entreno?"
  ask platform "¿qué hacemos con los discos copia-migracion y con vm-temporal-7?"
  gcloud compute instances delete ia-fraude-entreno --zone={{.zone}} --quiet
  gcloud compute disks snapshot copia-migracion-1 --zone={{.zone}} --snapshot-names=copia-migracion-1-auditoria
  gcloud compute disks snapshot copia-migracion-2 --zone={{.zone}} --snapshot-names=copia-migracion-2-auditoria
  gcloud compute disks delete copia-migracion-1 copia-migracion-2 --zone={{.zone}} --quiet
  gcloud compute instances stop vm-temporal-7 --zone={{.zone}}
  gcloud billing budgets create --billing-account=0X0X0X-0X0X0X-0X0X0X --display-name=mensual --budget-amount=500EUR --threshold-rule=percent=0.5 --threshold-rule=percent=0.9 --threshold-rule=percent=1.0
  gcloud billing report
  ticket update "Hola Elena: la subida venía de una VM con GPU de un experimento de Datos ya terminado (borrada con el OK de Omar), de dos discos SSD de 1 TB de la migración (borrados tras guardar una instantánea para Auditoría) y de vm-temporal-7, sin etiquetas ni dueño (parada, no borrada; avisado en el canal). Creado un presupuesto mensual de 500 EUR con avisos al 50, 90 y 100 %."
  ticket resolve "Borrada la GPU ociosa, discos de migración borrados con instantánea, VM sin dueño parada y presupuesto con avisos creado."
shortcuts:
- name: delete everything that looks idle
  run: |
    gcloud compute instances delete ia-fraude-entreno vm-temporal-7 --zone={{.zone}} --quiet
    gcloud compute disks delete copia-migracion-1 copia-migracion-2 --zone={{.zone}} --quiet
    ticket resolve "Borrado todo lo que estaba ocioso."

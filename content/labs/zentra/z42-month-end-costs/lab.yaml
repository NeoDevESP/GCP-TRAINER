en:
  title: 'REQ P3 · FinOps: this month''s bill is 70% above'
  summary: A forgotten GPU VM, orphan disks and an unlabelled machine. Confirm with each owner, save without breaking anything and leave a budget with alerts.
  story: |-
    **Project `{{.project}}`** (*zentra-analitica-prod*).

    > **REQ-21042 · P3** · *"This month's forecast is 70% above last month. I need to know what went up and whose it is, and you to switch off what's left over without breaking production. And a budget that warns us earlier next time."*

    Check the cost report by resource and Google's **recommendations** (idle resources). **Labels** (`equipo`, `uso`) say whose each thing is: ask its owner **before** deleting. Anything without an owner **is stopped, not deleted**. Disks are deleted after taking a **snapshot**. Finish with a 500 EUR monthly budget with alerts at 50, 90 and 100%.
  objectives:
  - Find what went up and whose it is
  - Confirm with each owner
  - Save without losing anything
  - Create the budget with alerts
  hints:
  - '`gcloud billing report --group-by=resource` and `gcloud compute instances list --format=''table(name,machineType,labels)''`'
  - '`gcloud billing budgets create --billing-account=0X0X0X-0X0X0X-0X0X0X --display-name=mensual --budget-amount=500EUR --threshold-rule=percent=0.5 --threshold-rule=percent=0.9 --threshold-rule=percent=1.0`'
  ticket:
    summary: This month's forecast is 70% above last month. I need to know what went up and whose it is, and you to switch off what's left over without breaking production. And a budget that warns us earlier next time.
  text:
    Elena Ríos (FinOps): Elena Ríos (FinOps)
    FinOps.: FinOps.
    Necesito saber qué ha subido, de quién es y qué se puede apagar.: I need to know what went up, whose it is and what can be switched off.
    Omar Haddad (Datos): Omar Haddad (Data)
    Científico de datos.: Data scientist.
    Entrenamos modelos de fraude de vez en cuando.: We train fraud models now and then.
    ¡Uy, ia-fraude-entreno! El experimento terminó hace dos semanas y el modelo está guardado. Bórrala.: Oops, ia-fraude-entreno! The experiment ended two weeks ago and the model is saved. Delete it.
    Marta Ibáñez (Plataforma): Marta Ibáñez (Platform)
    Responsable de Plataforma Cloud.: Cloud Platform lead.
    Las copias de la migración eran temporales.: The migration copies were temporary.
    Las copia-migracion ya no hacen falta, pero Auditoría quiere una instantánea antes de borrar nada.: The copia-migracion disks aren't needed, but Audit wants a snapshot before deleting anything.
    'Ni idea de quién es vm-temporal-7. Nuestra norma: lo que no tiene dueño se para (no se borra) y se avisa en el canal.': 'No idea whose vm-temporal-7 is. Our rule: anything without an owner is stopped (not deleted) and announced in the channel.'
    Ahorro: Savings
    GPU ociosa borrada: Idle GPU deleted
    Discos huérfanos borrados: Orphan disks deleted
    VM sin dueño parada: Ownerless VM stopped
    Sin perder nada: Nothing lost
    Instantáneas de los discos para Auditoría: Disk snapshots for Audit
    La VM sin dueño no se ha borrado: The ownerless VM wasn't deleted
    Preguntar antes de borrar: Ask before deleting
    Costes y recomendaciones revisados: Costs and recommendations checked
    Confirmado con los dueños: Confirmed with the owners
    Presupuesto y respuesta: Budget and reply
    Presupuesto de 500 EUR con 3 avisos: 500 EUR budget with 3 alerts
    Respuesta a FinOps: Reply to FinOps
    Qué ha subido: What went up
    La GPU y los dos SSD de 1 TB se llevan casi toda la subida.: The GPU and the two 1 TB SSDs account for nearly all of the increase.
    'Sin dueño: parar': 'No owner: stop'
    Parada deja de cobrar CPU y se puede volver a arrancar si alguien la reclama.: Stopped, it stops billing CPU and can be restarted if someone claims it.
    'Avisos al 50, 90 y 100 %: la próxima subida se ve a mitad de mes.': 'Alerts at 50, 90 and 100%: the next increase shows mid-month.'

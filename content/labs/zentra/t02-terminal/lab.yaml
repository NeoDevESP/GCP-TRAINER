en:
  title: Workshop 2 · The terminal from zero (Cloud Shell)
  summary: 'Typing commands without fear: where you are, seeing files, saving text, searching and repeating commands.'
  story: |-
    > 🧰 **Workshop from zero.** You don't need to know anything beforehand. Read each block, copy the command into the terminal below and see what comes out. If you get lost, open the **Tutor** tab: it walks you through step by step.

    **What is the terminal?** A window where you type orders instead of clicking. **Cloud Shell** is Google's terminal in the browser, with `gcloud` and the tools already installed. Each line is `program options arguments`, then you press Enter.

    **1 · Where you are and what's there.** `pwd` (where am I) and `ls` (which files are there).

    **2 · Writing to a file.** `echo "text"` prints text; with `>` you save it to a file (replacing it), with `>>` you append it:
    `echo "My first day at Zentra" > notas.txt`
    `echo "Project: {{.project}}" >> notas.txt`

    **3 · Reading and searching.** `cat notas.txt` shows the file; `grep Proyecto notas.txt` shows only lines containing "Proyecto"; `wc -l notas.txt` counts lines.

    **4 · Combining with `|`.** The "pipe" sends one command's output to the next: `gcloud compute regions list | grep europe` shows only European regions.

    **5 · Repeating.** `history` lists what you typed; the ↑ arrow brings back the last command.

    Close with `ticket resolve "…"`.
  objectives:
  - See where you are and what's there
  - Create notas.txt with two lines
  - Search inside and combine with |
  - Close
  hints:
  - '`echo "Proyecto: {{.project}}" >> notas.txt` appends a line.'
  ticket:
    summary: 'Second workshop: practise the terminal. In support you''ll live in it.'

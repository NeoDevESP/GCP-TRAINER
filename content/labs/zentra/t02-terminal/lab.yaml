story: |-
  > 🧰 **Taller desde cero.** No necesitas saber nada antes. Lee cada bloque, copia el comando en el terminal de abajo y mira qué sale. Si te pierdes, abre la pestaña **Profesor**: te acompaña paso a paso.

  **¿Qué es la terminal?** Una ventana donde escribes órdenes en vez de hacer clic. **Cloud Shell** es una terminal de Google en el navegador que ya trae `gcloud` y las herramientas. Cada línea es: `programa opciones argumentos`, y pulsas Intro.

  **1 · Dónde estás y qué hay.** `pwd` (dónde estoy) y `ls` (qué ficheros hay).

  **2 · Escribir en un fichero.** `echo "texto"` imprime texto; con `>` lo guardas en un fichero (y lo sustituye), con `>>` lo añades al final:
  `echo "Mi primer día en Zentra" > notas.txt`
  `echo "Proyecto: {{.project}}" >> notas.txt`

  **3 · Leer y buscar.** `cat notas.txt` muestra el fichero; `grep Proyecto notas.txt` muestra solo las líneas que contienen «Proyecto»; `wc -l notas.txt` cuenta líneas.

  **4 · Combinar con `|`.** La «tubería» pasa la salida de un comando al siguiente: `gcloud compute regions list | grep europe` muestra solo las regiones europeas.

  **5 · Repetir.** `history` lista lo que has escrito; con la flecha ↑ recuperas el último comando.

  Cierra con `ticket resolve "…"`.
objectives:

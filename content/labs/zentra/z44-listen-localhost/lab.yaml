    status: 200
    desc: app-gateway llega a extractos-api
- name: Sin abrir de más
  validator: security
  points: 20
  checks:
  - type: count
    collection: firewalls
    where:
      sourceRanges:
        contains: 0.0.0.0/0
    max: 0
    desc: Ninguna regla abierta a internet
- name: Diagnóstico
  validator: diagnosis
  points: 20
  checks:
  - type: command
    regex: ss -tlnp|netstat
    min: 1
    desc: Puertos de escucha revisados
- name: Documentado
  validator: evidence
  points: 20
  all: true
  checks:
  - type: ticket_update
    public: false
    keywords:
    - - 127.0.0.1
      - localhost
      - escucha
      - listen
    - - refused
      - rechaz
    desc: Nota con la causa
  - type: ticket_resolved
    desc: Ticket cerrado
tutor:
- match: ss -tlnp
  title: Dónde escucha
  why: '127.0.0.1:8080: solo conexiones de la propia VM.'
- match: add-metadata
  title: ''
  why: '0.0.0.0: escucha en todas las interfaces; el cortafuegos sigue decidiendo quién entra.'
en:
  title: 'INC P2 · Statements: "connection refused" from the app, but it works on the VM'
  summary: 'The service is up and the firewall is fine: the app only listens on 127.0.0.1 after a configuration change.'
  story: |-
    **Project `{{.project}}`** (*zentra-cuentas-prod*).

    > **INC-31044 · P2** · *"Since last night's configuration deployment, app-gateway gets "connection refused" requesting statements from extractos-api:8080. If we log into the VM and curl localhost:8080, it answers fine."*

    Tell the two errors apart: **timeout** is usually firewall or routing (the packet gets lost); **connection refused** means the packet arrives but **nobody listens** on that IP and port. Check on the VM which address the process listens on (`ss -tlnp`): `127.0.0.1` only accepts connections from the machine itself; `0.0.0.0`, from any interface.
  objectives:
  - Tell refused from timeout
  - See where the process listens
  - Fix the listen address
  - Validate from app-gateway
  hints:
  - '`gcloud compute ssh extractos-api --zone={{.zone}} --tunnel-through-iap --command=''sudo ss -tlnp''`'
  - '`gcloud compute instances add-metadata extractos-api --zone={{.zone}} --metadata=listen-address-hello=0.0.0.0`'
  ticket:
    summary: Since last night's configuration deployment, app-gateway gets "connection refused" requesting statements from extractos-api:8080. If we log into the VM and curl localhost:8080, it answers fine.
  text:
    Equipo de Cuentas: Accounts team
    Mantienen extractos-api.: They maintain extractos-api.
    La app lee su dirección de escucha del metadato listen-address-hello de la VM.: The app reads its listen address from the VM's listen-address-hello metadata.
    ¡Ups! En el despliegue de anoche pusimos listen-address-hello=127.0.0.1 para una prueba local. Debe ser 0.0.0.0.: Oops! In last night's deployment we set listen-address-hello=127.0.0.1 for a local test. It should be 0.0.0.0.
    Diego Ferrer (SRE): Diego Ferrer (SRE)
    SRE de guardia.: On-call SRE.
    ¿Qué ha cambiado? Mira los registros y la auditoría.: What changed? Check the logs and the audit trail.
    Extractos disponibles: Statements available
    app-gateway llega a extractos-api: app-gateway reaches extractos-api
    Sin abrir de más: Nothing opened too wide
    Ninguna regla abierta a internet: No rule open to the internet
    Diagnóstico: Diagnosis
    Puertos de escucha revisados: Listening ports checked
    Documentado: Documented
    Nota con la causa: Note with the cause
    Ticket cerrado: Ticket closed
    Dónde escucha: Where it listens
    '127.0.0.1:8080: solo conexiones de la propia VM.': '127.0.0.1:8080: only connections from the VM itself.'
    '0.0.0.0: escucha en todas las interfaces; el cortafuegos sigue decidiendo quién entra.': '0.0.0.0: listens on every interface; the firewall still decides who gets in.'

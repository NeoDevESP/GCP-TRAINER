id: zentra-s06-p1-incident
title: 'Oficio 6 · Un P1: roles, mitigar primero y comunicar con cadencia'
summary: Nadie puede pagar. Declara el P1, mitiga antes de buscar la causa (volver a la revisión estable), con cambio de emergencia, y mantén informado al negocio cada poco tiempo.

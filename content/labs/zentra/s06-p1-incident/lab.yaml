    - - p1
      - incidente
      - incident
      - declar
      - comandante
      - commander
      - pagos
      - ic
      - responsable
    answer: 'Declarado P1. Yo hago de responsable del incidente (IC): coordino y decido. Tú mitigas y comunicas. Primera actualización ya y luego cada 30 minutos aunque no haya novedades. Mitiga primero: la causa la buscamos después, en el postmortem.'
- role: change
  name: Javier Luna (Gestión de cambios)
  persona: Gestor de cambios (CAB).
  fallback: Ningún cambio en producción sin registro. Si es urgente y hay clientes afectados, lo apruebo como emergencia.
  facts:
  - keywords:
    - - cambio
      - change
      - rollback
      - emergencia
      - emergency
      - aprob
      - approv
      - revert
      - permiso
      - binding
      - vuelta
    answer: Aprobado como cambio de emergencia (CHG-7790). Anótalo en el ticket y hazlo con el mínimo alcance.
- role: sre
  name: Diego Ferrer (SRE de guardia)
  persona: SRE de guardia.
  fallback: 'Dame hechos: qué servicio, desde cuándo, qué error y a cuántos afecta.'
  facts: []
story: |-
  > 🎧 **Taller del oficio.** Aquí no aprendes un producto nuevo: aprendes a **trabajar un ticket** como lo hace un buen técnico de Soporte N2 en un banco. Lee la explicación, sigue los pasos en el terminal y, si te pierdes, abre la pestaña **Profesor**.

  > **INC-40106 · P1** · NOC: *«Tasa de error del 100 % en pagos-api desde las 07:50. Nadie puede pagar con tarjeta.»*

  Un **P1** se trabaja de otra manera:

  **Roles.** Hay un **responsable del incidente** (IC, *incident commander*) que coordina y decide; alguien que **opera** (mitiga) y alguien que **comunica**. Hoy Marta es la IC; tú operas y comunicas.

  **Mitigar antes que arreglar.** El objetivo es que los clientes vuelvan a pagar **cuanto antes**, no entender la causa. Si algo se rompió tras un despliegue, la mitigación casi siempre es **volver a la versión anterior**. La causa se estudia después, en el **postmortem**.

  **Comunicar con cadencia.** Primera actualización en los **primeros 15 minutos** (aunque solo digas «lo estamos investigando») y luego **cada 30 minutos**, siempre con **la hora de la próxima actualización**. El silencio en un P1 genera más tickets y más presión.

  **Pasos:**
  1. `ask manager "…"`: declara el P1 y confirma los roles.
  2. **Primera actualización** al negocio: qué está pasando, que estáis en ello y la **próxima actualización**. `ticket update "…"`.
  3. Diagnóstico rápido: `gcloud run revisions list --service=pagos-api --region={{.region}}` (¿qué se desplegó?) y `gcloud logging read 'resource.type=cloud_run_revision severity>=ERROR' --limit=3`.
  4. `ask change "…"`: el rollback en producción es un **cambio de emergencia**.
  5. **Mitiga**: devuelve el tráfico a la revisión etiquetada `estable`: `gcloud run services update-traffic pagos-api --region={{.region}} --to-tags=estable=100`.
  6. Comprueba (`gcloud run services describe pagos-api --region={{.region}}`), deja una **nota interna** con la cronología y da la actualización de **mitigado**.
  7. Cierra con una nota que diga que habrá **postmortem**.
objectives:
- Declara el P1 y los roles
- Primera actualización con la próxima hora
- Mitiga con cambio de emergencia
- Actualiza, documenta y cierra
hints:

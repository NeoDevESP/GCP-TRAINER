en:
  title: 'Craft 6 · A P1: roles, mitigate first and communicate on a cadence'
  summary: Nobody can pay. Declare the P1, mitigate before looking for the cause (back to the stable revision), with an emergency change, and keep the business informed at short intervals.
  story: |-
    > 🎧 **Craft workshop.** You won't learn a new product here: you'll learn to **work a ticket** the way a good L2 Support engineer at a bank does. Read the explanation, follow the steps in the terminal and, if you get lost, open the **Tutor** tab.

    > **INC-40106 · P1** · NOC: *"100% error rate on pagos-api since 07:50. Nobody can pay by card."*

    A **P1** is worked differently:

    **Roles.** There's an **incident commander** (IC) who coordinates and decides; someone who **operates** (mitigates) and someone who **communicates**. Today Marta is the IC; you operate and communicate.

    **Mitigate before fixing.** The goal is for customers to pay again **as soon as possible**, not to understand the cause. If something broke after a deployment, the mitigation is almost always **going back to the previous version**. The cause is studied later, in the **postmortem**.

    **Communicate on a cadence.** First update within the **first 15 minutes** (even if you only say "we're investigating") and then **every 30 minutes**, always with **the time of the next update**. Silence in a P1 creates more tickets and more pressure.

    **Steps:**
    1. `ask manager "…"`: declare the P1 and confirm the roles.
    2. **First update** to the business: what's happening, that you're on it and the **next update**. `ticket update "…"`.
    3. Quick diagnosis: `gcloud run revisions list --service=pagos-api --region={{.region}}` (what was deployed?) and `gcloud logging read 'resource.type=cloud_run_revision severity>=ERROR' --limit=3`.
    4. `ask change "…"`: a production rollback is an **emergency change**.
    5. **Mitigate**: send traffic back to the revision tagged `estable`: `gcloud run services update-traffic pagos-api --region={{.region}} --to-tags=estable=100`.
    6. Check (`gcloud run services describe pagos-api --region={{.region}}`), leave an **internal note** with the timeline and give the **mitigated** update.
    7. Close with a note saying there will be a **postmortem**.
  objectives:
  - Declare the P1 and the roles
  - First update with the next time
  - Mitigate with an emergency change
  - Update, document and close
  hints:
  - '`ticket update "We''re investigating a failure that prevents card payments. Next update at 08:30."`'
  - '`gcloud run services update-traffic pagos-api --region={{.region}} --to-tags=estable=100`'

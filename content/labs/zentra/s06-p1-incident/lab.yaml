  kind: INC
  priority: P1
  sla: 15m
  reporter: NOC 24x7
  summary: 'ALERTA: tasa de error del 100 % en pagos-api desde las 07:50. Atención al cliente confirma que nadie puede pagar con tarjeta.'
actors:
- role: manager
  name: Marta Ibáñez (responsable de Plataforma)
  persona: Tu responsable en Zentra.
  fallback: 'Esta semana es para aprender el oficio: pregunta todo lo que necesites.'
  facts:

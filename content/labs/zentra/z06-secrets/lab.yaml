id: zentra-z06-secrets
title: Tutorial 6 · La clave del proveedor de tarjetas, bien guardada
summary: Guarda una clave en Secret Manager, da acceso solo a la cuenta del servicio y móntala en Cloud Run sin que aparezca en ninguna variable en claro.
track: zentra
day: 6
level: basic
branch: security
type: guided
mode: production
skills:
- security.secrets
- compute.serverless
- iam.leastprivilege
wellArchitected:
- security
certs:
- ACE
difficulty: 2
minutes: 25
baseline:
- zentra-core
ticket:
  id: REQ-20006
  kind: REQ
  priority: P3
  sla: 1d
  reporter: Lucía Navarro (Pagos)
  summary: 'pagos-api (imagen payments-api:1.0) necesita la clave del proveedor de pagos: psp_live_zentra_7Q2. Ponedla como os parezca, pero que funcione hoy.'
actors:
- role: dev
  name: Lucía Navarro (Pagos)
  persona: Tech lead de Pagos.
  fallback: La app lee la clave de la variable API_KEY.
  facts: []
story: |-
  > 📘 **Tutorial guiado.** Sigue los pasos en orden; cada comando trae su explicación. Si te pierdes, pulsa **Tutor** y te acompaña paso a paso.

  Una clave en una variable de entorno en claro la ve cualquiera que pueda describir el servicio. Se guarda en **Secret Manager** y se *monta* en el servicio.

  **Paso 1 · Crea el secreto.** `echo -n "psp_live_zentra_7Q2" | gcloud secrets create proveedor-psp --data-file=-`

  **Paso 2 · Permiso solo a quien lo usa.**
  `gcloud secrets add-iam-policy-binding proveedor-psp --member=serviceAccount:pagos-sa@{{.project}}.iam.gserviceaccount.com --role=roles/secretmanager.secretAccessor`
  (sobre el **secreto**, no sobre el proyecto: el proyecto tiene secretos de otros).

  **Paso 3 · Despliega montándolo.**
  ```
  gcloud run deploy pagos-api --image=europe-docker.pkg.dev/gcplab-public/apps/payments-api:1.0 \
    --region={{.region}} --service-account=pagos-sa@{{.project}}.iam.gserviceaccount.com \
    --set-secrets=API_KEY=proveedor-psp:latest --no-allow-unauthenticated
  ```

  **Paso 4 · Deja que app-gateway lo llame** (`roles/run.invoker` para app-gateway-sa) y responde a Lucía. **No pegues la clave en el ticket.**
objectives:
- Guarda la clave en Secret Manager
- Acceso solo para pagos-sa sobre ese secreto
- Despliega pagos-api montando el secreto
- Responde sin revelar la clave
hints:
- text: '`--set-secrets=API_KEY=proveedor-psp:latest`.'
- text: El permiso va con `gcloud secrets add-iam-policy-binding`.
solution: |
  ticket
  echo -n "psp_live_zentra_7Q2" | gcloud secrets create proveedor-psp --data-file=-
  gcloud secrets add-iam-policy-binding proveedor-psp --member=serviceAccount:pagos-sa@{{.project}}.iam.gserviceaccount.com --role=roles/secretmanager.secretAccessor
  gcloud run deploy pagos-api --image=europe-docker.pkg.dev/gcplab-public/apps/payments-api:1.0 --region={{.region}} --service-account=pagos-sa@{{.project}}.iam.gserviceaccount.com --set-secrets=API_KEY=proveedor-psp:latest --no-allow-unauthenticated
  gcloud run services add-iam-policy-binding pagos-api --region={{.region}} --member=serviceAccount:app-gateway-sa@{{.project}}.iam.gserviceaccount.com --role=roles/run.invoker
  ticket update "Hola Lucía: pagos-api ya funciona. La clave está en Secret Manager (proveedor-psp), montada como API_KEY; solo pagos-sa puede leerla y solo app-gateway puede invocar el servicio."
  ticket resolve "Clave en Secret Manager con acceso solo para pagos-sa; pagos-api desplegado montando el secreto."
shortcuts:
- name: plain env var
  run: |
    gcloud run deploy pagos-api --image=europe-docker.pkg.dev/gcplab-public/apps/payments-api:1.0 --region={{.region}} --service-account=pagos-sa@{{.project}}.iam.gserviceaccount.com --set-env-vars=API_KEY=psp_live_zentra_7Q2 --no-allow-unauthenticated
    gcloud run services add-iam-policy-binding pagos-api --region={{.region}} --member=serviceAccount:app-gateway-sa@{{.project}}.iam.gserviceaccount.com --role=roles/run.invoker
    ticket resolve "Desplegado pagos-api con la clave."
rubric:
- name: Pagos funciona
  validator: functional
  points: 30
  checks:

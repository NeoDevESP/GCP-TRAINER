    desc: Explica dónde está la clave
  - type: ticket_resolved
    desc: Ticket cerrado
tutor:
- match: secrets create proveedor-psp
  title: Guarda la clave
  why: Secret Manager cifra, versiona y audita cada lectura.
- match: secrets add-iam-policy-binding
  title: ''
  why: 'Sobre el secreto concreto: pagos-sa no podrá leer los secretos de otros equipos.'
- match: set-secrets=API_KEY
  title: ''
  why: La app sigue leyendo API_KEY, pero el valor viene de Secret Manager y no se ve al describir el servicio.
en:
  title: Tutorial 6 · The card provider's key, properly stored
  summary: Store a key in Secret Manager, grant access only to the service's account and mount it in Cloud Run without it appearing in any plain variable.
  story: |-
    > 📘 **Guided tutorial.** Follow the steps in order; every command comes with its explanation. If you get lost, press **Tutor** and it walks you through.

    A key in a plain environment variable is visible to anyone who can describe the service. It goes in **Secret Manager** and is *mounted* into the service.

    **Step 1 · Create the secret.** `echo -n "psp_live_zentra_7Q2" | gcloud secrets create proveedor-psp --data-file=-`

    **Step 2 · Permission only for who uses it.**
    `gcloud secrets add-iam-policy-binding proveedor-psp --member=serviceAccount:pagos-sa@{{.project}}.iam.gserviceaccount.com --role=roles/secretmanager.secretAccessor`
    (on the **secret**, not the project: the project holds others' secrets).

    **Step 3 · Deploy mounting it.**
    ```
    gcloud run deploy pagos-api --image=europe-docker.pkg.dev/gcplab-public/apps/payments-api:1.0 \
      --region={{.region}} --service-account=pagos-sa@{{.project}}.iam.gserviceaccount.com \
      --set-secrets=API_KEY=proveedor-psp:latest --no-allow-unauthenticated
    ```

    **Step 4 · Let app-gateway call it** (`roles/run.invoker` for app-gateway-sa) and reply to Lucía. **Don't paste the key in the ticket.**
  objectives:
  - Store the key in Secret Manager
  - Access only for pagos-sa on that secret
  - Deploy pagos-api mounting the secret
  - Reply without revealing the key
  hints:
  - '`--set-secrets=API_KEY=proveedor-psp:latest`.'
  - The permission goes with `gcloud secrets add-iam-policy-binding`.
  ticket:
    summary: 'pagos-api (image payments-api:1.0) needs the payment provider key: psp_live_zentra_7Q2. Set it however you like, but it has to work today.'
  text:
    Lucía Navarro (Pagos): Lucía Navarro (Payments)
    Tech lead de Pagos.: Payments tech lead.
    La app lee la clave de la variable API_KEY.: The app reads the key from the API_KEY variable.
    Pagos funciona: Payments works
    pagos-api responde a app-gateway: pagos-api answers app-gateway
    Clave protegida: Key protected
    Ningún secreto en variables en claro: No secret in plain variables
    pagos-sa puede leer el secreto: pagos-sa can read the secret
    Pero no todos los secretos del proyecto: But not every secret in the project
    Respuesta: Reply
    Explica dónde está la clave: Explains where the key is
    Ticket cerrado: Ticket closed
    Guarda la clave: Store the key
    Secret Manager cifra, versiona y audita cada lectura.: Secret Manager encrypts, versions and audits every read.
    'Sobre el secreto concreto: pagos-sa no podrá leer los secretos de otros equipos.': 'On the specific secret: pagos-sa won''t be able to read other teams'' secrets.'
    La app sigue leyendo API_KEY, pero el valor viene de Secret Manager y no se ve al describir el servicio.: The app still reads API_KEY, but the value comes from Secret Manager and isn't visible when describing the service.

story: |-
  > 📘 **Tutorial guiado.** Sigue los pasos en orden; cada comando trae su explicación. Si te pierdes, pulsa **Tutor** y te acompaña paso a paso.

  **Proyecto: `{{.project}}`** (en Zentra lo llamamos *zentra-pagos-prod*).

  **Paso 1 · ¿Dónde estoy?** `gcloud config list` te dice con qué cuenta y en qué proyecto trabaja tu terminal. `gcloud projects describe {{.project}}` muestra el nombre, el ID y el número del proyecto.

  **Paso 2 · Las reglas que no se pueden saltar.** `gcloud resource-manager org-policies list --project={{.project}}` lista las políticas de organización. Mira cuáles hay: son las «normas de la casa» convertidas en código.

  **Paso 3 · La red.** `gcloud compute networks list` y `gcloud compute networks subnets list` muestran la VPC del banco y sus subredes. `gcloud compute routers nats list --router=zentra-router --region={{.region}}` te enseña por dónde salen a internet las máquinas privadas.

  **Paso 4 · Responde** a las preguntas de orientación y cierra el ticket con `ticket resolve "…"` contando lo que has visto.
objectives:
- Identifica cuenta, proyecto e ID
- Lista las políticas de organización
- Explora la red y la salida a internet

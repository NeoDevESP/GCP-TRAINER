en:
  title: 'Tutorial 1 · Your first day at Zentra: where everything is'
  summary: Get to know the project, its organization policies and the bank's private network before touching anything.
  story: |-
    > 📘 **Guided tutorial.** Follow the steps in order; every command comes with its explanation. If you get lost, press **Tutor** and it walks you through.

    **Project: `{{.project}}`** (at Zentra we call it *zentra-pagos-prod*).

    **Step 1 · Where am I?** `gcloud config list` tells you which account and project your terminal uses. `gcloud projects describe {{.project}}` shows the project's name, ID and number.

    **Step 2 · The rules you can't bend.** `gcloud resource-manager org-policies list --project={{.project}}` lists the organization policies. See which ones exist: they're the "house rules" turned into code.

    **Step 3 · The network.** `gcloud compute networks list` and `gcloud compute networks subnets list` show the bank's VPC and its subnets. `gcloud compute routers nats list --router=zentra-router --region={{.region}}` shows how private machines reach the internet.

    **Step 4 · Answer** the orientation questions and close the ticket with `ticket resolve "…"` describing what you saw.
  objectives:
  - Identify account, project and ID
  - List the organization policies
  - Explore the network and internet egress
  - Answer the questions and close
  hints:
  - Start with `gcloud config list`.
  - 'Policies: `gcloud resource-manager org-policies list --project={{.project}}`.'
  ticket:
    summary: Welcome to GCP Support! Before your first real ticket, take the tour of the payments project and answer the orientation questions.
  text:
    Marta Ibáñez (responsable de Plataforma): Marta Ibáñez (Head of Platform)
    Tu responsable en Zentra.: Your manager at Zentra.
    'Tómatelo con calma: hoy toca aprender dónde está cada cosa. Pregunta lo que necesites.': 'Take it easy: today is about learning where everything is. Ask whatever you need.'
    ¿Cómo se llama la red VPC de Zentra en este proyecto?: What's the name of Zentra's VPC network in this project?
    zentra-vpc: zentra-vpc
    default: default
    apps: apps
    zentra-router: zentra-router
    ¿Qué política impide crear una VM con IP pública?: Which policy prevents creating a VM with a public IP?
    compute.vmExternalIpAccess: compute.vmExternalIpAccess
    gcp.resourceLocations: gcp.resourceLocations
    storage.publicAccessPrevention: storage.publicAccessPrevention
    iam.allowedPolicyMemberDomains: iam.allowedPolicyMemberDomains
    ¿Por dónde sale a internet una VM sin IP pública?: How does a VM without a public IP reach the internet?
    Por Cloud NAT (zentra-nat): Through Cloud NAT (zentra-nat)
    Por IAP: Through IAP
    Por el balanceador de carga: Through the load balancer
    No puede salir nunca: It can never get out
    ¿En qué regiones se pueden crear recursos?: In which regions can resources be created?
    Solo en la Unión Europea: Only in the European Union
    En cualquier región: In any region
    Solo en EE. UU.: Only in the US
    Solo en europe-west1: Only in europe-west1
    Orientación: Orientation
    Sabe dónde está trabajando: Knows where they're working
    Políticas de organización revisadas: Organization policies reviewed
    Red y salida a internet exploradas: Network and egress explored
    Preguntas de orientación: Orientation questions
    Todas correctas: All correct
    Ticket: Ticket
    Ticket cerrado con lo visto: Ticket closed with what you saw
    Tu punto de partida: Your starting point
    'Antes de cualquier comando, confirma cuenta y proyecto: es la causa n.º 1 de «no encuentro el recurso».': 'Before any command, confirm account and project: it''s the no. 1 cause of "I can''t find the resource".'
    'Cada política es una norma de la casa aplicada por Google: aunque tengas Owner, no podrás saltártela.': 'Each policy is a house rule enforced by Google: even with Owner you can''t bypass it.'
    zentra-nat da salida a internet a todo lo privado; sus IP están en la lista blanca del proveedor de divisas.: zentra-nat gives internet egress to everything private; its IPs are on the FX provider's allow-list.

- match: projects update
  title: Etiquetas del proyecto
  why: '--update-labels añade o cambia solo esas claves; las demás se quedan. En la consola: IAM y administración › Etiquetas.'
en:
  title: REQ · Application identifier on the frontend and backend projects
  summary: 'The application inventory needs the six asesores projects (frontend and backend, in DEV, AU and PRO) to carry the application identifier and their layer. Label them without losing the labels they already have.'
  story: |-
    > **REQ-41310 · P4** · Compliance: *"Label the asesores projects with their application identifier ASES-0420 and say whether each is frontend or backend."*

    | Layer | DEV | AU | PRO |
    |---|---|---|---|
    | Frontend | `dev-zentra-asesores` | `au-zentra-asesores` | `zentra-asesores` |
    | Backend | `dev-zentra-asesores-sp` | `au-zentra-asesores-sp` | `zentra-asesores-sp` |

    A project's **labels** are `key=value` pairs read by billing and inventories. Rules: **lowercase**, digits, `_` and `-` (so `ASES-0420` is written `ases-0420`). Ask which keys the inventory uses.

    Each project already has `app` and `env`: **don't remove them**.

    **In the console**, in each of the six projects:
    1. **Project picker** › the project.
    2. **Menu › IAM & Admin › Labels › Add label**: the identifier one and the layer one.

    Reply with what you did and resolve.
  objectives:
  - Ask which keys the inventory uses
  - The three frontend projects labelled
  - The three backend projects labelled
  - Without losing app and env
  - Reply and resolve
  hints:
  - 'Keys app-id and capa, lowercase: app-id=ases-0420; capa=frontend on the three without -sp and capa=backend on the three -sp.'
  ticket:
    summary: 'For the application inventory, label the asesores projects with their application identifier ASES-0420. Frontend: dev-zentra-asesores, au-zentra-asesores, zentra-asesores. Backend: dev-zentra-asesores-sp, au-zentra-asesores-sp, zentra-asesores-sp. Also say whether it is frontend or backend.'

id: zentra-p08-app-id-labels
title: REQ · Identificador de aplicación en los proyectos de frontend y backend
summary: 'El inventario de aplicaciones necesita que los seis proyectos de asesores (frontend y backend, en DEV, AU y PRO) lleven el identificador de aplicación y su capa. Etiquétalos sin perder las etiquetas que ya tienen.'
track: zentra
day: 98
level: professional
branch: foundations
type: challenge
mode: production
skills:
- foundations.hierarchy
- architecture.governance
wellArchitected:
- operations
certs:
- ACE
difficulty: 2
minutes: 25
baseline:
- zentra-core
- zentra-entornos
- zentra-entornos-recursos
ticket:
  id: REQ-41310
  kind: REQ
  priority: P4
  sla: 5d
  reporter: Irene Soler (Cumplimiento)
  summary: 'Para el inventario de aplicaciones, etiquetad los proyectos de asesores con su identificador de aplicación ASES-0420. Frontend: dev-zentra-asesores, au-zentra-asesores, zentra-asesores. Backend: dev-zentra-asesores-sp, au-zentra-asesores-sp, zentra-asesores-sp. Indicad también si es frontend o backend.'
actors:
- role: requester
  name: Irene Soler (Cumplimiento)
  persona: Cumplimiento. Lleva el inventario de aplicaciones.
  fallback: 'Las claves que usa el inventario son app-id y capa.'
  facts:
  - keywords:
    - - clave
      - key
      - etiqueta
      - label
      - mayuscula
      - mayúscula
      - formato
      - capa
    answer: 'El inventario lee las etiquetas app-id y capa. Valores en minúsculas, que las etiquetas no admiten mayúsculas: app-id=ases-0420 y capa=frontend o capa=backend.'
story: |-
  > **REQ-41310 · P4** · Cumplimiento: *«Etiquetad los proyectos de asesores con su identificador de aplicación ASES-0420 e indicad si es frontend o backend.»*

  | Capa | DEV | AU | PRO |
  |---|---|---|---|
  | Frontend | `dev-zentra-asesores` | `au-zentra-asesores` | `zentra-asesores` |
  | Backend | `dev-zentra-asesores-sp` | `au-zentra-asesores-sp` | `zentra-asesores-sp` |

  Las **etiquetas** de un proyecto son pares `clave=valor` que leen la facturación y los inventarios. Reglas: **minúsculas**, números, `_` y `-` (así que `ASES-0420` se escribe `ases-0420`). Pregunta qué claves usa el inventario.

  Cada proyecto ya tiene `app` y `env`: **no las borres**.

  **En la consola**, en cada uno de los seis proyectos:
  1. **Selector de proyectos** › el proyecto.
  2. **Menú › IAM y administración › Etiquetas › Añadir etiqueta**: la del identificador y la de la capa.

  Responde con lo hecho y resuelve.
objectives:
- Pregunta qué claves usa el inventario
- Los tres proyectos de frontend etiquetados
- Los tres proyectos de backend etiquetados
- Sin perder app y env
- Responde y resuelve
hints:
- text: 'Claves app-id y capa, en minúsculas: app-id=ases-0420; capa=frontend en los tres sin -sp y capa=backend en los tres -sp.'
quiz:
- id: q1
  question: El ticket dice ASES-0420. ¿Qué valor pones en la etiqueta?
  options:
  - ases-0420
  - ASES-0420
  - Ases_0420
  - '"ASES-0420"'
  answer:
  - 0
solution: |
  ticket
  ask requester "¿Qué claves de etiqueta usa el inventario para el identificador y la capa?"
  for p in dev-zentra-asesores au-zentra-asesores zentra-asesores; do gcloud projects update $p --update-labels=app-id=ases-0420,capa=frontend; done
  for p in dev-zentra-asesores-sp au-zentra-asesores-sp zentra-asesores-sp; do gcloud projects update $p --update-labels=app-id=ases-0420,capa=backend; done
  gcloud projects describe zentra-asesores-sp --format='value(labels)'
  ticket update "Hola Irene: etiquetados los seis proyectos de asesores con app-id=ases-0420 (en minúsculas: las etiquetas no admiten mayúsculas) y capa=frontend (dev-zentra-asesores, au-zentra-asesores, zentra-asesores) o capa=backend (los tres -sp). Se mantienen las etiquetas app y env."
  ticket resolve "Etiquetas app-id y capa añadidas a los seis proyectos de asesores."
shortcuts:
- name: only the frontend projects
  run: |
    for p in dev-zentra-asesores au-zentra-asesores zentra-asesores; do gcloud projects update $p --update-labels=app-id=ases-0420,capa=frontend; done
    ticket update "Hola Irene: etiquetados los proyectos de asesores con app-id=ases-0420."
    ticket resolve "Etiquetas app-id añadidas a los proyectos de asesores."
- name: replace all the labels
  run: |
    for p in dev-zentra-asesores au-zentra-asesores zentra-asesores; do gcloud projects update $p --clear-labels --update-labels=app-id=ases-0420,capa=frontend; done
    for p in dev-zentra-asesores-sp au-zentra-asesores-sp zentra-asesores-sp; do gcloud projects update $p --clear-labels --update-labels=app-id=ases-0420,capa=backend; done
    ticket update "Hola Irene: etiquetados los seis proyectos con app-id=ases-0420 y capa."
    ticket resolve "Etiquetas app-id y capa en los seis proyectos de asesores."

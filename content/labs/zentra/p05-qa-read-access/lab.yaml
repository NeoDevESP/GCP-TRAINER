id: zentra-p05-qa-read-access
title: REQ · Acceso de lectura para QA a un bucket de previos
summary: 'QA necesita leer los ficheros del bucket de intercambio en DEV y AU. Dale al grupo solo lectura, solo en esos buckets y nunca en PRO.'
track: zentra
day: 95
level: professional
branch: iam
type: challenge
mode: production
skills:
- iam.leastprivilege
- storage.access
wellArchitected:
- security
certs:
- ACE
- PCSE
difficulty: 2
minutes: 20
baseline:
- zentra-core
- zentra-entornos
- zentra-entornos-recursos
setup: |
  gcloud storage buckets create gs://gcs-intercambio-dev-418526730194 --project=dev-zentra-cartera --location={{.region}} --uniform-bucket-level-access --public-access-prevention --labels=app=cartera,env=dev
  gcloud storage buckets create gs://gcs-intercambio-au-725361948027 --project=au-zentra-cartera --location={{.region}} --uniform-bucket-level-access --public-access-prevention --labels=app=cartera,env=au
  gcloud storage buckets create gs://gcs-intercambio-pro-903174625518 --project=zentra-cartera --location={{.region}} --uniform-bucket-level-access --public-access-prevention --labels=app=cartera,env=pro
ticket:
  id: REQ-41266
  kind: REQ
  priority: P4
  sla: 3d
  reporter: Pablo Costa (QA · Cartera)
  summary: 'Desde QA necesitamos acceso a los buckets de intercambio de entornos previos para validar los ficheros. Grupo: gcp-cartera-qa@zentra.dev. Si nos dais editor en el proyecto, mejor, así no volvemos a pedir.'
story: |-
  > **REQ-41266 · P4** · QA: *«Necesitamos acceso a los buckets de intercambio de previos para validar los ficheros. Grupo `gcp-cartera-qa@zentra.dev`. Si nos dais editor en el proyecto, mejor.»*

  QA solo necesita **leer** ficheros, en **DEV y AU** («previos»). Mínimo privilegio:
  - **Rol**: `Storage Object Viewer` (`roles/storage.objectViewer`): lee y lista objetos; no borra ni sube.
  - **Dónde**: en **cada bucket**, no en el proyecto entero (editor en el proyecto les dejaría tocar todo).
  - **A quién**: al **grupo** (`group:gcp-cartera-qa@zentra.dev`), nunca persona a persona.
  - **PRO**: no se pide y no se da.

  **En la consola**, en DEV y luego en AU:
  1. **Selector de proyectos** › el proyecto del entorno.
  2. **Cloud Storage › Buckets** › el bucket `gcs-intercambio-…` › pestaña **Permisos** › **Conceder acceso**.
  3. Principal `group:gcp-cartera-qa@zentra.dev`, rol `roles/storage.objectViewer`.

  Responde explicando qué se ha dado (y por qué no editor) y resuelve.
objectives:
- Lectura en el bucket de DEV
- Lectura en el bucket de AU
- Nada en PRO
- Sin roles de proyecto
- Responde y resuelve
hints:
- text: 'Bucket › Permisos › Conceder acceso › group:gcp-cartera-qa@zentra.dev › roles/storage.objectViewer. En los dos entornos.'
quiz:
- id: q1
  question: Piden «editor en el proyecto» para leer ficheros. ¿Qué das?
  options:
  - Storage Object Viewer en los buckets que necesitan
  - Editor en el proyecto, lo piden ellos
  - Storage Admin en el proyecto
  - Owner en el bucket
  answer:
  - 0
solution: |
  ticket
  gcloud config set project dev-zentra-cartera
  gcloud storage buckets add-iam-policy-binding gs://gcs-intercambio-dev-418526730194 --member=group:gcp-cartera-qa@zentra.dev --role=roles/storage.objectViewer
  gcloud config set project au-zentra-cartera
  gcloud storage buckets add-iam-policy-binding gs://gcs-intercambio-au-725361948027 --member=group:gcp-cartera-qa@zentra.dev --role=roles/storage.objectViewer
  ticket update "Hola Pablo: el grupo gcp-cartera-qa ya puede leer y listar ficheros (Storage Object Viewer) en gcs-intercambio-dev-418526730194 (DEV) y gcs-intercambio-au-725361948027 (AU). No damos editor en el proyecto: con eso podríais cambiar o borrar cualquier recurso, y para validar ficheros basta con lectura. PRO no se ha tocado."
  ticket resolve "Lectura de objetos para gcp-cartera-qa en los buckets de intercambio de DEV y AU; sin roles de proyecto ni acceso en PRO."
shortcuts:
- name: editor on the projects, as asked
  run: |
    gcloud projects add-iam-policy-binding dev-zentra-cartera --member=group:gcp-cartera-qa@zentra.dev --role=roles/editor
    gcloud projects add-iam-policy-binding au-zentra-cartera --member=group:gcp-cartera-qa@zentra.dev --role=roles/editor
    ticket update "Hola Pablo: dado editor al grupo gcp-cartera-qa en DEV y AU."
    ticket resolve "Acceso de editor dado al grupo de QA en previos."
- name: read access in PRO as well
  run: |
    gcloud storage buckets add-iam-policy-binding gs://gcs-intercambio-dev-418526730194 --member=group:gcp-cartera-qa@zentra.dev --role=roles/storage.objectViewer
    gcloud storage buckets add-iam-policy-binding gs://gcs-intercambio-au-725361948027 --member=group:gcp-cartera-qa@zentra.dev --role=roles/storage.objectViewer
    gcloud storage buckets add-iam-policy-binding gs://gcs-intercambio-pro-903174625518 --member=group:gcp-cartera-qa@zentra.dev --role=roles/storage.objectViewer
    ticket update "Hola Pablo: lectura para gcp-cartera-qa en DEV, AU y, ya puestos, PRO."
    ticket resolve "Lectura dada al grupo de QA en los tres entornos."

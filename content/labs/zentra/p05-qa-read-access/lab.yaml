en:
  title: REQ · Read access for QA to a pre-production bucket
  summary: 'QA needs to read the files of the exchange bucket in DEV and AU. Give the group read only, only on those buckets and never in PRO.'
  story: |-
    > **REQ-41266 · P4** · QA: *"We need access to the pre-production exchange buckets to validate the files. Group `gcp-cartera-qa@zentra.dev`. If you give us editor on the project, even better."*

    QA only needs to **read** files, in **DEV and AU** ("pre-production"). Least privilege:
    - **Role**: `Storage Object Viewer` (`roles/storage.objectViewer`): reads and lists objects; doesn't delete or upload.
    - **Where**: on **each bucket**, not on the whole project (editor on the project would let them touch everything).
    - **To whom**: to the **group** (`group:gcp-cartera-qa@zentra.dev`), never person by person.
    - **PRO**: not requested and not given.

    **In the console**, in DEV and then in AU:
    1. **Project picker** › the environment's project.
    2. **Cloud Storage › Buckets** › the `gcs-intercambio-…` bucket › **Permissions** tab › **Grant access**.
    3. Principal `group:gcp-cartera-qa@zentra.dev`, role `roles/storage.objectViewer`.

    Reply explaining what was given (and why not editor) and resolve.
  objectives:
  - Read on the DEV bucket
  - Read on the AU bucket
  - Nothing in PRO
  - No project roles
  - Reply and resolve
  hints:
  - 'Bucket › Permissions › Grant access › group:gcp-cartera-qa@zentra.dev › roles/storage.objectViewer. In both environments.'
  ticket:
    summary: 'QA needs access to the pre-production exchange buckets to validate the files. Group: gcp-cartera-qa@zentra.dev. If you give us editor on the project, even better, so we don''t have to ask again.'
  text:
    Pablo Costa (QA · Cartera): Pablo Costa (QA · Cartera)
    Piden «editor en el proyecto» para leer ficheros. ¿Qué das?: They ask for "editor on the project" to read files. What do you give?
    Storage Object Viewer en los buckets que necesitan: Storage Object Viewer on the buckets they need
    Editor en el proyecto, lo piden ellos: Editor on the project, they asked for it
    Storage Admin en el proyecto: Storage Admin on the project
    Owner en el bucket: Owner on the bucket
    QA lee en previos: QA reads in pre-production
    QA lee en el bucket de DEV: QA reads on the DEV bucket
    QA lee en el bucket de AU: QA reads on the AU bucket
    Mínimo privilegio: Least privilege
    QA no puede borrar ficheros: QA cannot delete files
    Nada en PRO: Nothing in PRO
    Sin roles básicos en el proyecto de DEV: No basic roles on the DEV project
    Sin roles básicos en el proyecto de AU: No basic roles on the AU project
    Respuesta: Reply
    Qué se ha dado y por qué no editor: What was given and why not editor
    Ticket resuelto: Ticket resolved
    Lo has entendido: You understood it
    Pregunta del caso: Case question
    En el bucket, no en el proyecto: On the bucket, not on the project
    'El permiso más pequeño que sirve: leer objetos de ese bucket.': 'The smallest permission that works: reading objects of that bucket.'

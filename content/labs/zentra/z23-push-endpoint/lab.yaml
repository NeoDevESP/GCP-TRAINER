en:
  title: INC P2 · Analytics notifications vanish after a URL "fix"
  summary: The subscription pushes to an address that no longer exists. Find who changed it, set it right and check the backlog drains.
  story: |-
    **Project `{{.project}}`** (*zentra-datos-prod*).

    > **INC-31023 · P2** · *"The transactions dashboard froze at 07:40. Payments are fine. Pub/Sub says messages are piling up."*

    Affected flow: `pagos-api` (Cloud Run) stores each payment in `ledger-db` and publishes an event to the **transacciones** topic; the **transacciones-analitica** push subscription (authenticated as `push-sa`) delivers it to `analitica-worker`, which writes it to BigQuery `analitica.transacciones`.

    Compare **where** the subscription pushes with **where** the worker really is (`gcloud run services describe`). The audit log tells you who changed it.
  objectives:
  - Confirm the message backlog
  - Compare the subscription URL with the worker's
  - Fix the endpoint keeping the authentication
  - Check delivery and document
  hints:
  - '`gcloud pubsub subscriptions describe transacciones-analitica` and `gcloud run services describe analitica-worker --region={{.region}} --format=''value(status.url)''`.'
  - '`gcloud pubsub subscriptions modify-push-config transacciones-analitica --push-endpoint=URL/push --push-auth-service-account=push-sa@…`.'
  ticket:
    summary: The transactions dashboard froze at 07:40. Payments are fine. Pub/Sub says messages are piling up.
  text:
    Riesgos · Analítica: Risk · Analytics
    Diego Ferrer (SRE): Diego Ferrer (SRE)
    SRE de guardia.: On-call SRE.
    ¿Qué ha cambiado? Mira los registros y la auditoría.: What changed? Check the logs and the audit trail.
    Sara Benítez (Datos): Sara Benítez (Data)
    Ingeniera de datos.: Data engineer.
    Hoy no hemos desplegado nada en analítica.: We haven't deployed anything to analytics today.
    ? ¿analitica-worker-v1-legacy? Ese servicio lo borramos hace un mes; alguien habrá copiado una URL vieja de la documentación.
    : analitica-worker-v1-legacy? We deleted that service a month ago; someone must have copied an old URL from the docs.
    Entrega restablecida: Delivery restored
    Mensajes entregados y confirmados: Messages delivered and acked
    Diagnóstico: Diagnosis
    Configuración de la suscripción revisada: Subscription config reviewed
    Consultado con Datos: Checked with Data
    Documentado: Documented
    Nota con la causa y la prevención: Note with cause and prevention
    Ticket cerrado: Ticket closed
    Mira el destino: Check the endpoint
    'pushEndpoint apunta a …v1-legacy…: un servicio que ya no existe.': 'pushEndpoint points at …v1-legacy…: a service that no longer exists.'
    'Cambia la URL sin perder la autenticación: sin --push-auth-service-account el worker privado rechazaría las entregas.': 'Change the URL without losing authentication: without --push-auth-service-account the private worker would reject deliveries.'

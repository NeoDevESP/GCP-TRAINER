id: zentra-z23-push-endpoint
title: INC P2 · Las notificaciones de analítica se pierden tras un «arreglo» de la URL
summary: La suscripción empuja a una dirección que ya no existe. Encuentra quién la cambió, ponla bien y comprueba que se vacía la cola.
track: zentra
day: 23
level: intermediate
branch: data
type: incident
mode: production
skills:
- data.pubsub

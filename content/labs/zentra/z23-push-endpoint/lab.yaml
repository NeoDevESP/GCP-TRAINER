ticket:
  id: INC-31023
  kind: INC
  priority: P2
  sla: 4h
  reporter: Riesgos · Analítica
  summary: El panel de operaciones se ha quedado congelado a las 07:40. Los pagos van bien. En Pub/Sub dicen que los mensajes se acumulan.
actors:
- role: sre
  name: Diego Ferrer (SRE)
  persona: SRE de guardia.
  fallback: ¿Qué ha cambiado? Mira los registros y la auditoría.
  facts: []
- role: data
  name: Sara Benítez (Datos)
  persona: Ingeniera de datos.
  fallback: Hoy no hemos desplegado nada en analítica.
  facts:
  - keywords:
    - - url
      - endpoint
      - push
      - legacy
      - v1
    answer: ¿analitica-worker-v1-legacy? Ese servicio lo borramos hace un mes; alguien habrá copiado una URL vieja de la documentación.
story: |-
  **Proyecto `{{.project}}`** (*zentra-datos-prod*).

  > **INC-31023 · P2** · *«El panel de operaciones se ha quedado congelado a las 07:40. Los pagos van bien. En Pub/Sub dicen que los mensajes se acumulan.»*

  Flujo afectado: `pagos-api` (Cloud Run) guarda cada pago en `ledger-db` y publica un evento en el tema **transacciones**; la suscripción push **transacciones-analitica** (autenticada como `push-sa`) lo entrega a `analitica-worker`, que lo escribe en BigQuery `analitica.transacciones`.

  Compara **a dónde empuja** la suscripción con **dónde está** de verdad el worker (`gcloud run services describe`). La auditoría te dirá quién la cambió.
objectives:
- Confirma la acumulación de mensajes
- Compara la URL de la suscripción con la del worker
- Corrige el destino conservando la autenticación
- Comprueba la entrega y documenta
hints:
- text: '`gcloud pubsub subscriptions describe transacciones-analitica` y `gcloud run services describe analitica-worker --region={{.region}} --format=''value(status.url)''`.'
- text: '`gcloud pubsub subscriptions modify-push-config transacciones-analitica --push-endpoint=URL/push --push-auth-service-account=push-sa@…`.'
solution: |
  ticket
  gcloud pubsub subscriptions describe transacciones-analitica
  gcloud run services describe analitica-worker --region={{.region}} --format='value(status.url)'
  ask data "¿qué es analitica-worker-v1-legacy?"
  gcloud pubsub subscriptions modify-push-config transacciones-analitica --push-endpoint=$(gcloud run services describe analitica-worker --region={{.region}} --format='value(status.url)')/push --push-auth-service-account=push-sa@{{.project}}.iam.gserviceaccount.com
  sleep 120
  gcloud pubsub subscriptions describe transacciones-analitica
  ticket comment "Causa: la suscripción transacciones-analitica empujaba a analitica-worker-v1-legacy, un servicio borrado hace un mes (URL antigua copiada de la documentación). Restaurado el destino al analitica-worker actual, manteniendo la autenticación con push-sa. Propuesta: actualizar la documentación y gestionar la suscripción en Terraform."
  ticket update "Resuelto: el panel vuelve a actualizarse y está recuperando los eventos acumulados desde las 07:40."
  ticket resolve "Corregido el push endpoint de transacciones-analitica al worker actual con push-sa; la cola se vacía."
shortcuts:
- name: push without authentication
  run: |
    gcloud pubsub subscriptions modify-push-config transacciones-analitica --push-endpoint=$(gcloud run services describe analitica-worker --region={{.region}} --format='value(status.url)')/push
    ticket resolve "Corregida la URL de la suscripción de analítica."

en:
  title: 'Craft 1 · Reading the queue: ticket types, priority and SLA'
  summary: 'Five tickets first thing in the morning: rank them by impact and urgency, confirm the P1 with data and page on-call. Triage isn''t fixing.'
  story: |-
    > 🎧 **Craft workshop.** You won't learn a new product here: you'll learn to **work a ticket** the way a good L2 Support engineer at a bank does. Read the explanation, follow the steps in the terminal and, if you get lost, open the **Tutor** tab.

    **What a ticket is.** Every request or problem comes in as a ticket with a **type**:
    - **INC** (incident): something that worked has stopped working.
    - **REQ** (request): something new someone needs (access, a bucket…).
    - **CHG** (change): a planned modification in production.
    - **SEC** (security): a security risk. **PRB** (problem): the underlying cause of repeated incidents.

    **Priority = impact × urgency.** At Zentra:

    | Priority | When | First response |
    |---|---|---|
    | **P1** | A critical service down for every customer, or an active security risk (exposed credential or data) | 15 min, updates every 30 min |
    | **P2** | A critical service degraded (slow, or failing for some customers) | 1 h |
    | **P3** | Affects one person or a non-production environment; there's a workaround | 8 business hours |
    | **P4** | Planned request or question | 3 days |

    The **SLA** is the committed deadline: the **response** one (when you first reply) is not the **resolution** one (when it's fixed).

    **The 08:00 queue:**
    - **A** · INC · Customer service: *"No customer can pay by card in the app since 07:50."*
    - **B** · INC · Transfers: *"Some SEPA transfers take 20-30 seconds; they complete fine."*
    - **C** · INC · Hugo (Cards): *"I can't see the logs of my test service tarjetas-dev."*
    - **D** · REQ · HR: *"GCP onboarding for an analyst who starts on Monday."*
    - **E** · SEC · Security: *"GitHub warns us about a service account key published in a public repository."*

    **Steps:**
    1. **Confirm the impact** of ticket A with data before declaring anything: `gcloud run services describe pagos-api --region={{.region}}` and `gcloud logging read 'resource.type=cloud_run_revision severity>=ERROR' --limit=3`.
    2. **Page on-call**: `ask sre "…"` with the service, since when, the error and who is affected. **Triage isn't fixing**: whoever triages hands out the work, and on-call takes the P1.
    3. **Write your triage** in `triage.md`, one line per ticket with the format `A: P1 - reason`. For example `cat > triage.md` and type the lines (or several `echo "…" >> triage.md`).
    4. Answer the questions and close with `ticket resolve "…"`.
  objectives:
  - Confirm ticket A's impact
  - Page on-call with facts
  - Prioritise A-E in triage.md
  - Answer and close
  hints:
  - 'A credential published on the internet is an active risk: check the table.'
  - '`echo "A: P1 - nobody can pay" > triage.md` then `>>` for the rest.'
  ticket:
    summary: It's 08:00 and it's your turn to review the GCP Support queue. Prioritise the five tickets (A-E) in triage.md, confirm the most serious one with data and page whoever needs to know.

- name: pagos
  target: run:pagos-api
  path: /pay
  rps: 20
  principal: serviceAccount:app-gateway-sa@{{.project}}.iam.gserviceaccount.com
ticket:
  id: FOR-0101
  kind: REQ
  priority: P4
  sla: 1d
  reporter: Formación Zentra
  summary: Son las 08:00 y te toca revisar la cola de Soporte GCP. Prioriza los cinco tickets (A-E) en triage.md, confirma el más grave con datos y avisa a quien corresponda.
actors:
- role: sre
  name: Diego Ferrer (SRE de guardia)
  persona: SRE de guardia.
  fallback: 'Dame hechos: qué servicio, desde cuándo, qué error y a cuántos afecta.'
  facts:
  - keywords:
    - - p1
      - pagos
      - pago
      - payment
      - '503'
      - caido
      - caído
      - down
      - error
      - cae
    answer: 'Recibido, lo cojo yo como P1. Tú sigue con la cola: el resto también tiene su SLA.'
- role: manager
  name: Marta Ibáñez (responsable de Plataforma)
  persona: Tu responsable en Zentra.
  fallback: 'Esta semana es para aprender el oficio: pregunta todo lo que necesites.'
  facts: []
story: |-
  > 🎧 **Taller del oficio.** Aquí no aprendes un producto nuevo: aprendes a **trabajar un ticket** como lo hace un buen técnico de Soporte N2 en un banco. Lee la explicación, sigue los pasos en el terminal y, si te pierdes, abre la pestaña **Profesor**.

  **Qué es un ticket.** Cada petición o problema entra como un ticket con un **tipo**:
  - **INC** (incidente): algo que funcionaba ha dejado de funcionar.
  - **REQ** (petición): algo nuevo que alguien necesita (un acceso, un bucket…).
  - **CHG** (cambio): una modificación planificada en producción.
  - **SEC** (seguridad): un riesgo de seguridad. **PRB** (problema): la causa de fondo de incidentes repetidos.

  **La prioridad = impacto × urgencia.** En Zentra:

  | Prioridad | Cuándo | Primera respuesta |
  |---|---|---|
  | **P1** | Un servicio crítico caído para todos los clientes, o un riesgo de seguridad activo (credencial o datos expuestos) | 15 min, actualizaciones cada 30 min |
  | **P2** | Un servicio crítico degradado (lento, o falla para parte de los clientes) | 1 h |
  | **P3** | Afecta a una persona o a un entorno que no es producción; hay alternativa | 8 h laborables |
  | **P4** | Petición planificada o consulta | 3 días |

  El **SLA** es el plazo comprometido: el de **respuesta** (cuándo contestas por primera vez) no es el de **resolución** (cuándo queda arreglado).

  **La cola de las 08:00:**
  - **A** · INC · Atención al cliente: *«Ningún cliente puede pagar con tarjeta en la app desde las 07:50.»*
  - **B** · INC · Transferencias: *«Algunas transferencias SEPA tardan 20-30 segundos; acaban bien.»*
  - **C** · INC · Hugo (Tarjetas): *«No veo los registros de mi servicio de pruebas tarjetas-dev.»*
  - **D** · REQ · RR. HH.: *«Alta en GCP para una analista que empieza el lunes.»*
  - **E** · SEC · Seguridad: *«GitHub nos avisa de una clave de cuenta de servicio publicada en un repositorio público.»*

  **Pasos:**
  1. **Confirma el impacto** del ticket A con datos antes de declarar nada: `gcloud run services describe pagos-api --region={{.region}}` y `gcloud logging read 'resource.type=cloud_run_revision severity>=ERROR' --limit=3`.
  2. **Avisa a la guardia**: `ask sre "…"` con servicio, desde cuándo, error y a quién afecta. **Triar no es arreglar**: quien tria reparte, y el P1 lo coge la guardia.
  3. **Escribe tu triaje** en `triage.md`, una línea por ticket con el formato `A: P1 - motivo`. Por ejemplo: `cat > triage.md` y escribes las líneas (o varios `echo "…" >> triage.md`).
  4. Responde las preguntas y cierra con `ticket resolve "…"`.
objectives:
- Confirma el impacto del ticket A
- Avisa a la guardia con datos
- Prioriza A-E en triage.md
- Responde y cierra
hints:
- text: 'Una credencial publicada en internet es un riesgo activo: mira la tabla.'
- text: '`echo "A: P1 - nadie puede pagar" > triage.md` y luego `>>` para las demás.'
quiz:
- id: q1
  question: La prioridad de un ticket se decide por…
  options:
  - Impacto × urgencia
  - Quién lo abre
  - Lo enfadado que está el cliente
  - El orden de llegada
  answer:
  - 0
- id: q2
  question: El SLA de respuesta de un P1 en Zentra es…
  options:
  - 15 minutos
  - 1 hora
  - 8 horas laborables
  - 5 días
  answer:
  - 0
- id: q3
  question: 'Llega un SEC: una clave de cuenta de servicio está en un repositorio público. ¿Prioridad?'
  options:
  - 'P1: riesgo de seguridad activo'
  - 'P3: no hay clientes quejándose'
  - 'P4: es una consulta'
  - Depende de quién la publicó
  answer:
  - 0
solution: |
  ticket
  gcloud run services describe pagos-api --region={{.region}}
  gcloud logging read 'resource.type=cloud_run_revision severity>=ERROR' --limit=3
  ask sre "Diego, P1 en pagos-api: devuelve 503 a todos los pagos desde las 07:50 (la revisión nueva no arranca). ¿Lo coges tú?"
  cat > triage.md <<'EOF'
  A: P1 - nadie puede pagar; confirmado en los registros (503, la revisión nueva no arranca). Avisado Diego (guardia).
  B: P2 - servicio crítico degradado para parte de los clientes; acaba bien.
  C: P3 - una persona y entorno de pruebas; hay alternativa.
  D: P4 - petición planificada para el lunes.
  E: P1 - credencial expuesta en internet: riesgo de seguridad activo.
  EOF
  cat triage.md
  ticket resolve "Cola triada: A y E son P1 (A confirmado en registros y pasado a la guardia), B P2, C P3 y D P4."
shortcuts:
- name: everything is P1
  run: |
    cat > triage.md <<'EOF'
    A: P1
    B: P1
    C: P1
    D: P1
    E: P1
    EOF
    ticket resolve "Todo urgente, todo P1 para que nadie se queje."

id: zentra-s01-triage
title: 'Oficio 1 · Leer la cola: tipos de ticket, prioridad y SLA'
summary: 'Cinco tickets a primera hora: clasifícalos por impacto y urgencia, confirma el P1 con datos y avisa a la guardia. Triar no es arreglar.'
track: zentra
day: 71
level: basic
branch: observability
type: guided
mode: production
skills:
- observability.incident
- observability.logging
- compute.serverless
wellArchitected:
- operations
- reliability
certs:
- ACE
difficulty: 1
minutes: 25
baseline:
- zentra-core
setup: |
  echo -n "psp_live_zentra_7Q2" | gcloud secrets create proveedor-psp --data-file=-
  gcloud secrets add-iam-policy-binding proveedor-psp --member=serviceAccount:pagos-sa@{{.project}}.iam.gserviceaccount.com --role=roles/secretmanager.secretAccessor
  gcloud run deploy pagos-api --image=europe-docker.pkg.dev/gcplab-public/apps/payments-api:1.0 --region={{.region}} --service-account=pagos-sa@{{.project}}.iam.gserviceaccount.com --set-secrets=API_KEY=proveedor-psp:latest --max-instances=5 --tag=estable --no-allow-unauthenticated
  gcloud run services add-iam-policy-binding pagos-api --region={{.region}} --member=serviceAccount:app-gateway-sa@{{.project}}.iam.gserviceaccount.com --role=roles/run.invoker
faults:
- type: run_image
  service: pagos-api
  image: europe-docker.pkg.dev/gcplab-public/apps/payments-api:3.0-bad
  actor: deploy-sa@{{.project}}.iam.gserviceaccount.com

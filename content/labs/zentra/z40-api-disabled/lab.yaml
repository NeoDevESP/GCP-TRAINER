difficulty: 2
minutes: 25
baseline:
- zentra-core
setup: |
  gcloud services enable bigquery.googleapis.com
  bq mk --location=EU zentra_riesgo
  gcloud projects add-iam-policy-binding {{.project}} --member=group:gcp-datos@zentra.dev --role=roles/bigquery.user
  gcloud projects add-iam-policy-binding {{.project}} --member=group:gcp-datos@zentra.dev --role=roles/bigquery.dataViewer

  sla: 1h
  reporter: Sara Benítez (Datos)
  summary: 'Las consultas del informe de riesgo fallan: «BigQuery API has not been used in project … before or it is disabled». ¿Habéis tocado algo? Los datos siguen ahí, ¿no?'
actors:
- role: data
  name: Sara Benítez (Datos)
  persona: Ingeniera de datos.
  fallback: Nosotros no hemos tocado nada esta semana.
  facts: []
- role: finops
  name: Elena Ríos (FinOps)
  persona: FinOps.
  fallback: Necesito saber qué ha subido, de quién es y qué se puede apagar.
  facts:
  - keywords:
    - - script
      - limpieza
      - clean
      - api
      - desactiv
      - disable
      - bigquery
    answer: Sí, el script finops-limpieza desactiva APIs sin llamadas en 30 días. BigQuery solo se usa a fin de mes… Añadimos una lista de excepciones; actívala.
story: |-
  **Proyecto `{{.project}}`** (*zentra-datos-prod*).

  > **INC-31040 · P2** · *«Las consultas del informe de riesgo fallan: «BigQuery API has not been used in project … before or it is disabled». ¿Habéis tocado algo? Los datos siguen ahí, ¿no?»*

  En Google Cloud cada servicio se usa a través de su **API**, que se activa o desactiva por proyecto. Desactivar una API **no borra los datos**, pero todo lo que la usa deja de funcionar. Quién la desactivó queda en los **registros de auditoría** (`DisableService`). Actívala, encuentra el origen y que no se repita.
objectives:
- Comprueba qué APIs están activas
- Encuentra quién la desactivó
- Vuelve a activar BigQuery
- Pide la excepción y tranquiliza a Datos
hints:
- text: '`gcloud services list --enabled` y `gcloud logging read ''protoPayload.methodName:DisableService'' --limit=3`'
- text: '`gcloud services enable bigquery.googleapis.com`'
solution: |
  ticket
  gcloud services list --enabled
  gcloud logging read 'protoPayload.methodName:DisableService' --limit=3
  ask finops "¿el script de limpieza ha desactivado la API de BigQuery?"
  gcloud services enable bigquery.googleapis.com
  bq ls
  ticket comment "Causa: el script finops-limpieza desactivó bigquery.googleapis.com por no tener llamadas en 30 días (BigQuery solo se usa a fin de mes). Reactivada. FinOps añade una lista de excepciones para las APIs de cierre de mes. Los datasets no se han perdido."
  ticket update "Hola Sara: ya podéis lanzar las consultas. Un proceso automático de ahorro desactivó la API de BigQuery; la hemos vuelto a activar y vuestros datos están intactos (desactivar una API no borra datos)."
  ticket resolve "Reactivada la API de BigQuery desactivada por finops-limpieza; datasets intactos y excepción pedida."
shortcuts:
- name: make Sara admin
  run: |
    gcloud projects add-iam-policy-binding {{.project}} --member=user:sara.benitez@zentra.dev --role=roles/bigquery.admin

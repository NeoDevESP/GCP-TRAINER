en:
  title: INC P2 · BigQuery says "API has not been used… or it is disabled"
  summary: A FinOps clean-up script disabled the BigQuery API "because it wasn't used". Find it in the audit log, turn it back on and stop it from happening again.
  story: |-
    **Project `{{.project}}`** (*zentra-datos-prod*).

    > **INC-31040 · P2** · *"The risk report queries fail: "BigQuery API has not been used in project … before or it is disabled". Did you change something? The data is still there, right?"*

    In Google Cloud each service is used through its **API**, enabled or disabled per project. Disabling an API **doesn't delete the data**, but everything that uses it stops working. Who disabled it is in the **audit logs** (`DisableService`). Turn it on, find the source and stop it from happening again.
  objectives:
  - Check which APIs are enabled
  - Find who disabled it
  - Turn BigQuery back on
  - Request the exception and reassure Data
  hints:
  - '`gcloud services list --enabled` and `gcloud logging read ''protoPayload.methodName:DisableService'' --limit=3`'
  - '`gcloud services enable bigquery.googleapis.com`'
  ticket:
    summary: 'The risk report queries fail: "BigQuery API has not been used in project … before or it is disabled". Did you change something? The data is still there, right?'
  text:
    Sara Benítez (Datos): Sara Benítez (Data)
    Ingeniera de datos.: Data engineer.
    Nosotros no hemos tocado nada esta semana.: We haven't touched anything this week.
    Elena Ríos (FinOps): Elena Ríos (FinOps)
    FinOps.: FinOps.
    Necesito saber qué ha subido, de quién es y qué se puede apagar.: I need to know what went up, whose it is and what can be switched off.
    ? Sí, el script finops-limpieza desactiva APIs sin llamadas en 30 días. BigQuery solo se usa a fin de mes… Añadimos una lista de excepciones; actívala.
    : Yes, the finops-limpieza script disables APIs with no calls in 30 days. BigQuery is only used at month end… We'll add an exception list; turn it on.
    BigQuery disponible: BigQuery available
    bigquery.googleapis.com activa: bigquery.googleapis.com enabled
    Sara puede lanzar consultas (por su grupo): Sara can run queries (through her group)
    Sin permisos de más: No extra permissions
    Sara no es administradora: Sara isn't an admin
    Origen encontrado: Source found
    Auditoría o APIs revisadas: Audit or APIs checked
    Hablado con FinOps: Talked to FinOps
    Documentado: Documented
    Nota con la causa y la prevención: Note with the cause and the prevention
    Ticket cerrado: Ticket closed
    La auditoría: The audit log
    finops-limpieza llamó a DisableService sobre bigquery.googleapis.com.: finops-limpieza called DisableService on bigquery.googleapis.com.
    La API vuelve; los datasets nunca se fueron.: The API is back; the datasets never left.

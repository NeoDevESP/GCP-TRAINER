id: linux-l01-disk-full
title: "Linux: el servidor web ha muerto — no queda espacio en el disco"
summary: Averigua desde la shell qué llenó el disco, libera espacio sin destruir datos, recupera el servicio y evita que se repita.
track: linux
day: 1
level: basic
branch: linux
type: incident
mode: lab
skills: [linux.disks, linux.processes, linux.troubleshooting, linux.shell]
wellArchitected: [operations, reliability]
certs: [ACE]
difficulty: 2
minutes: 30
baseline: [default-network]
setup: |
  gcloud compute firewall-rules create allow-web --network=default --allow=tcp:80 --source-ranges=0.0.0.0/0 --target-tags=web
  gcloud compute instances create web-1 --zone={{.zone}} --machine-type=e2-small --tags=web --metadata=startup-script='apt-get install -y nginx'
faults:
  - {type: os_user, vm: web-1, user: www-data, groups: [www-data, adm]}
  - {type: os_disk, vm: web-1, sizeGB: 20, baseUsedGB: "3.2"}
  - {type: os_service, vm: web-1, service: nginx, user: www-data, writes: /var/log/nginx}
  - {type: os_file, vm: web-1, path: /var/log/nginx/access.log, sizeMB: "900", owner: www-data, group: adm, mode: "640"}
  - {type: os_file, vm: web-1, path: /var/log/nginx/debug.log, sizeMB: "16300", owner: www-data, group: adm, mode: "640"}
  - {type: os_file, vm: web-1, path: /var/lib/app/orders.db, sizeMB: "1200", owner: www-data, group: www-data, mode: "600"}
  - {type: os_file, vm: web-1, path: /etc/logrotate.d/nginx, content: "/var/log/nginx/*.log { daily rotate 7 compress }", owner: root, group: root, mode: "644"}
traffic:
  - {name: web, target: "vm:web-1:80", rps: 10}
ticket:
  id: INC-310
  kind: INC
  priority: P2
  summary: "La web de web-1 está caída desde esta mañana. Nadie ha desplegado nada."
  reporter: Atención al cliente
actors:
  - role: developer
    name: Leo (equipo web)
    facts:
      - {keywords: [[debug, log, logging, verbose, registro]], answer: "Vaya: el viernes activé el registro de depuración para perseguir un error y se me olvidó desactivarlo. Puedes tirar debug.log."}
      - {keywords: [[orders, db, database, data, app, pedidos, base de datos, datos]], answer: "¡No borres nunca /var/lib/app/orders.db: es la cola local de pedidos!"}
story: |
  `web-1` ha dejado de servir. Conéctate con `gcloud compute ssh web-1 --zone={{.zone}} --tunnel-through-iap --command='...'`
  y usa las herramientas de siempre (`systemctl status`, `journalctl`, `df -h`, `du -sh /var/*`, `find / -size +500M`,
  `ls -l`). Libera espacio **sin perder datos**, reinicia el servicio y asegúrate de que los registros rotan.
objectives:
  - Lee el error del servicio
  - Averigua qué está usando el disco
  - Libera espacio de forma segura y reinicia el servicio
  - Evita que se repita
hints:
  - text: "`journalctl` muestra por qué termina nginx; `df -h` lo confirma."
  - text: "`du -sh /var/log/nginx/*`, y pregunta al desarrollador antes de borrar nada."
evidence:
  fields: [rootCause]
  sample:
    rootCause: El registro de depuración que se quedó activado escribió un debug.log de 16 GB en /var/log/nginx y llenó el disco de 20 GB; nginx no podía escribir sus registros y terminaba. Vacié debug.log tras confirmarlo con el desarrollador, conservé orders.db, reinicié nginx y forcé un logrotate.
solution: |
  gcloud compute ssh web-1 --zone={{.zone}} --tunnel-through-iap --command='sudo systemctl status nginx'
  gcloud compute ssh web-1 --zone={{.zone}} --tunnel-through-iap --command='sudo journalctl -u nginx'
  gcloud compute ssh web-1 --zone={{.zone}} --tunnel-through-iap --command='df -h'
  gcloud compute ssh web-1 --zone={{.zone}} --tunnel-through-iap --command='sudo du -sh /var/*'
  gcloud compute ssh web-1 --zone={{.zone}} --tunnel-through-iap --command='sudo find / -size +500M'
  ask developer "what is debug.log and can I delete it?"
  gcloud compute ssh web-1 --zone={{.zone}} --tunnel-through-iap --command='sudo truncate -s 0 /var/log/nginx/debug.log'
  gcloud compute ssh web-1 --zone={{.zone}} --tunnel-through-iap --command='sudo logrotate -f /etc/logrotate.d/nginx'
  gcloud compute ssh web-1 --zone={{.zone}} --tunnel-through-iap --command='sudo systemctl restart nginx'
  curl -s http://$(gcloud compute instances describe web-1 --zone={{.zone}} --format='value(networkInterfaces[0].accessConfigs[0].natIP)')/
rubric:
  - name: Servicio recuperado
    validator: functional
    points: 30
    checks:
      - {type: http, target: "vm:web-1:80", path: /, status: 200, desc: "web-1 vuelve a servir"}
  - name: Espacio liberado de forma segura
    validator: state
    points: 30
    critical: true
    all: true
    checks:
      - {type: vm_disk, vm: web-1, maxPct: 80, desc: "Disco por debajo del 80 %"}
      - {type: vm_file, vm: web-1, path: /var/lib/app/orders.db, desc: "orders.db conservado"}
  - name: Diagnóstico
    validator: diagnosis
    points: 20
    checks:
      - {type: command, regex: "df -h|du -sh|find / -size", min: 2, desc: "Medido antes de borrar"}
  - name: Causa raíz y prevención
    validator: evidence
    points: 20
    checks:
      - {type: evidence, fields: [rootCause], keywords: [[debug], [disk, disco, space, espacio], [logrotate, rotat, rota]], desc: "Causa y prevención"}
en:
  title: 'Linux: the web server died — no space left on device'
  summary: Find what filled the disk from the shell, free space without destroying data, bring the service back and prevent recurrence.
  story: |
    `web-1` stopped serving. Connect with `gcloud compute ssh web-1 --zone={{.zone}} --tunnel-through-iap --command='...'`
    and use the usual tools (`systemctl status`, `journalctl`, `df -h`, `du -sh /var/*`, `find / -size +500M`,
    `ls -l`). Free space **without losing data**, restart the service and make sure logs are rotated.
  objectives:
    - Read the service error
    - Find what is using the disk
    - Free space safely and restart the service
    - Prevent recurrence
  hints:
    - '`journalctl` shows why nginx exits; `df -h` confirms it.'
    - '`du -sh /var/log/nginx/*` — and ask the developer before deleting anything.'
  ticket:
    summary: The website on web-1 is down since this morning. Nobody deployed anything.
  text:
    Servicio recuperado: Service back
    web-1 vuelve a servir: web-1 serves again
    Espacio liberado de forma segura: Space freed safely
    Disco por debajo del 80 %: Disk below 80%
    orders.db conservado: orders.db kept
    Diagnóstico: Diagnosis
    Medido antes de borrar: Measured before deleting
    Causa raíz y prevención: Root cause & prevention
    Causa y prevención: Cause and prevention
    Atención al cliente: Customer Support
    Leo (equipo web): Leo (web team)
    ? 'Vaya: el viernes activé el registro de depuración para perseguir un error y se me olvidó desactivarlo. Puedes tirar debug.log.'
    : Oops — I enabled debug logging on Friday to chase a bug and forgot to turn it off. You can throw away debug.log.
    '¡No borres nunca /var/lib/app/orders.db: es la cola local de pedidos!': Never delete /var/lib/app/orders.db — that's the local order queue!

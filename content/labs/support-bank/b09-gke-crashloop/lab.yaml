id: bank-b09-gke-crashloop
title: INC P2 · Las ofertas de tarjetas no cargan tras el despliegue de las 11:00
summary: Pods en CrashLoopBackOff justo después de un despliegue. Lee los registros del contenedor que se cae, vuelve a la versión anterior y deja al equipo lo que necesita para arreglar la nueva.
track: support-bank
day: 9
level: intermediate
branch: gke
type: incident
mode: production
skills:
- gke.troubleshooting
- gke.workloads
- observability.incident
wellArchitected:
- reliability
- operations
certs:
- ACE
- PCDE
difficulty: 3
minutes: 35
baseline:
- bank-atlas
setup: |
  gcloud container clusters create tarjetas-gke --zone={{.zone}} --num-nodes=2 --machine-type=e2-standard-2 --network=atlas-vpc --subnetwork=app-subnet --enable-private-nodes
  gcloud container clusters get-credentials tarjetas-gke --zone={{.zone}}
  cat > ofertas.yaml <<'YAML'
  apiVersion: apps/v1
  kind: Deployment
  metadata: {name: ofertas-api}
  spec:
    replicas: 3
    selector: {matchLabels: {app: ofertas-api}}
    template:
      metadata: {labels: {app: ofertas-api}}
      spec:
        containers:
        - name: ofertas-api
          image: europe-docker.pkg.dev/gcplab-public/apps/catalog-api:2.3
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
  ---
  apiVersion: v1
  kind: Service
  metadata: {name: ofertas-api}
  spec:
    selector: {app: ofertas-api}
    ports: [{port: 80, targetPort: 8080}]
  YAML
  kubectl apply -f ofertas.yaml
faults:
- type: k8s_image
  cluster: tarjetas-gke
  deployment: ofertas-api
  image: europe-docker.pkg.dev/gcplab-public/apps/catalog-api:2.4
  actor: deploy-pipeline@{{.project}}.iam.gserviceaccount.com
ticket:
  id: INC-22710
  kind: INC
  priority: P2
  sla: 4h
  reporter: Canal digital · Tarjetas
  summary: Desde las 11:00 la sección de ofertas de tarjetas de la app no carga. Coincide con el despliegue de la versión 2.4 de ofertas-api en el clúster tarjetas-gke.
actors:
- role: dev
  name: Álvaro Prieto (Desarrollo · Tarjetas)
  persona: Desarrollador de ofertas-api.
  fallback: La 2.4 añade la configuración de ofertas personalizadas. En preproducción funcionaba.
  facts:
  - keywords:
    - - flag
      - variable
      - feature
      - config
      - falta
      - missing
    answer: ¡Vaya! La 2.4 necesita la variable FEATURE_FLAGS_URL y en producción no la hemos definido. Volved a la 2.3 y lo arreglamos en el siguiente despliegue.
  - keywords:
    - - volver
      - rollback
      - anterior
      - deshacer
      - undo
      - revert
    answer: 'Sí, volved a la versión anterior sin problema: la 2.3 es estable.'
- role: manager
  name: Lucía Ferrer (responsable de guardia)
  persona: Coordina los incidentes de producción.
  fallback: En un P2 primero recuperamos el servicio; el arreglo de fondo, después y por cambio.
  facts: []
story: |
  **Soporte de plataforma GCP · Banco Atlas** (proyecto `{{.project}}`). **P2: plazo de 4 horas.**

  > **INC-22710** · *«Desde las 11:00 la sección de ofertas de tarjetas de la app no carga. Coincide con el despliegue de la
  > versión 2.4 de ofertas-api en el clúster tarjetas-gke.»*

  Conecta `kubectl` al clúster con `gcloud container clusters get-credentials tarjetas-gke --zone={{.zone}}`. Un pod en **CrashLoopBackOff** arranca, se cae y Kubernetes lo reinicia una y otra vez: la causa
  está en **los registros del contenedor**, no en el clúster. Reiniciar o añadir réplicas no sirve de nada.
objectives:
- Publica una primera actualización y mira el estado de los pods
- Encuentra en los registros del contenedor por qué se cae
- Vuelve a la versión anterior y comprueba que los pods están listos
- Deja la causa en una nota interna para Desarrollo y cierra
hints:
- text: '`kubectl get pods` y `kubectl logs deployment/ofertas-api` muestran el estado y el error del contenedor.'
- text: '`kubectl rollout history deployment/ofertas-api` y `kubectl rollout undo deployment/ofertas-api` vuelven a la versión anterior.'
solution: |
  ticket
  ticket update "Estamos revisando el fallo de la sección de ofertas tras el despliegue de las 11:00. Próxima actualización en 30 minutos."
  gcloud container clusters get-credentials tarjetas-gke --zone={{.zone}}
  kubectl get pods
  kubectl describe deployment ofertas-api
  kubectl logs deployment/ofertas-api
  ask dev "¿qué cambia la 2.4 y falta alguna configuración?"
  kubectl rollout history deployment/ofertas-api
  kubectl rollout undo deployment/ofertas-api
  kubectl rollout status deployment/ofertas-api
  kubectl get pods
  ticket comment "Causa: la versión 2.4 (catalog-api:2.4) se cae al arrancar porque falta la variable FEATURE_FLAGS_URL en producción. Hecho rollout undo a la 2.3. Desarrollo debe añadir la variable antes de volver a desplegar la 2.4."
  ticket update "Resuelto: hemos vuelto a la versión anterior de ofertas-api y la sección de ofertas funciona. La versión 2.4 se volverá a desplegar cuando Desarrollo corrija su configuración."
  ticket resolve "Rollout undo de ofertas-api a la versión 2.3; la 2.4 fallaba al arrancar por falta de configuración. Pods listos comprobados."
shortcuts:
- name: restart pods and add replicas
  run: |
    gcloud container clusters get-credentials tarjetas-gke --zone={{.zone}}
    kubectl delete pods -l app=ofertas-api
    kubectl scale deployment ofertas-api --replicas=6
    ticket update "Hemos reiniciado los pods y añadido réplicas."
    ticket resolve "Reiniciados los pods y escalado ofertas-api a 6 réplicas."

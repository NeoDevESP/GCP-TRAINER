  - type: ticket_update
    public: false
    keywords:
    - - feature_flags_url
      - variable
      - configuracion
      - config
    - - '2.4'
    desc: Nota interna con la causa para Desarrollo
  - type: ticket_resolved
    keywords:
    - - undo
      - anterior
      - rollback
      - '2.3'
      - previous
    desc: Cerrado con la vuelta atrás
tutor:
- match: get-credentials
  title: Conecta kubectl al clúster
  why: get-credentials guarda en tu kubeconfig cómo llegar al clúster; sin eso kubectl no sabe a qué clúster hablar.
- match: '@intro'
  title: ''
  why: CrashLoopBackOff significa que el contenedor arranca y se muere. Los registros del contenedor dicen por qué; reiniciarlo solo repite el fallo.
- match: kubectl logs
  title: Lee el error del contenedor
  why: 'El último mensaje antes de morir suele ser la causa: aquí, una variable de configuración que falta.'
- match: rollout undo
  title: ''
  why: Volver a la versión anterior recupera el servicio en segundos. El arreglo de la 2.4 lo hace Desarrollo y entra por un despliegue nuevo.
en:
  title: INC P2 · Card offers won't load after the 11:00 deployment
  summary: Pods in CrashLoopBackOff right after a deployment. Read the logs of the crashing container, roll back to the previous version and give the team what it needs to fix the new one.
  story: |
    **GCP platform support · Banco Atlas** (project `{{.project}}`). **P2: 4-hour target.**

    > **INC-22710** · *"Since 11:00 the card offers section of the app won't load. It matches the deployment of version 2.4 of
    > ofertas-api on the tarjetas-gke cluster."*

    Connect `kubectl` to the cluster with `gcloud container clusters get-credentials tarjetas-gke --zone={{.zone}}`. A pod in **CrashLoopBackOff** starts, crashes and Kubernetes restarts it again and again:
    the cause is in **the container's logs**, not in the cluster. Restarting or adding replicas won't help.
  objectives:
  - Post a first update and check the pods' status
  - Find in the container logs why it crashes
  - Roll back to the previous version and check the pods are ready
  - Leave the cause in an internal note for Development and close
  hints:
  - '`kubectl get pods` and `kubectl logs deployment/ofertas-api` show the status and the container''s error.'
  - '`kubectl rollout history deployment/ofertas-api` and `kubectl rollout undo deployment/ofertas-api` go back to the previous version.'
  ticket:
    summary: Since 11:00 the card offers section of the app won't load. It matches the deployment of version 2.4 of ofertas-api on the tarjetas-gke cluster.
  text:
    Canal digital · Tarjetas: Digital channel · Cards
    Álvaro Prieto (Desarrollo · Tarjetas): Álvaro Prieto (Development · Cards)
    Desarrollador de ofertas-api.: Developer of ofertas-api.
    La 2.4 añade la configuración de ofertas personalizadas. En preproducción funcionaba.: 2.4 adds the personalised offers configuration. It worked in pre-production.
    ? ¡Vaya! La 2.4 necesita la variable FEATURE_FLAGS_URL y en producción no la hemos definido. Volved a la 2.3 y lo arreglamos en el siguiente despliegue.
    : Oops! 2.4 needs the FEATURE_FLAGS_URL variable and we haven't set it in production. Go back to 2.3 and we'll fix it in the next deployment.
    'Sí, volved a la versión anterior sin problema: la 2.3 es estable.': 'Yes, go back to the previous version, no problem: 2.3 is stable.'
    Lucía Ferrer (responsable de guardia): Lucía Ferrer (on-call lead)
    Coordina los incidentes de producción.: Coordinates production incidents.
    En un P2 primero recuperamos el servicio; el arreglo de fondo, después y por cambio.: In a P2 we restore the service first; the real fix comes later, through a change.
    Servicio recuperado: Service restored
    3 pods de ofertas-api listos: 3 ofertas-api pods ready
    Diagnóstico: Diagnosis
    Registros del contenedor revisados: Container logs checked
    Vuelta atrás con rollout undo: Rolled back with rollout undo
    Gestión del incidente: Incident handling
    Actualización inicial y otra al resolver: An initial update and another on resolution
    Nota interna con la causa para Desarrollo: Internal note with the cause for Development
    Cerrado con la vuelta atrás: Closed with the rollback
    Conecta kubectl al clúster: Connect kubectl to the cluster
    get-credentials guarda en tu kubeconfig cómo llegar al clúster; sin eso kubectl no sabe a qué clúster hablar.: get-credentials stores in your kubeconfig how to reach the cluster; without it kubectl doesn't know which cluster to talk to.
    ? CrashLoopBackOff significa que el contenedor arranca y se muere. Los registros del contenedor dicen por qué; reiniciarlo solo repite el fallo.
    : CrashLoopBackOff means the container starts and dies. Its logs say why; restarting it just repeats the failure.
    Lee el error del contenedor: Read the container's error
    'El último mensaje antes de morir suele ser la causa: aquí, una variable de configuración que falta.': 'The last message before dying is usually the cause: here, a missing configuration variable.'
    ? Volver a la versión anterior recupera el servicio en segundos. El arreglo de la 2.4 lo hace Desarrollo y entra por un despliegue nuevo.
    : Rolling back restores the service in seconds. Development fixes 2.4 and it comes in through a new deployment.

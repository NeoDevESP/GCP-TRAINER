id: bank-b16-region-policy
title: 'INC · «No puedo desplegar en us-central1: Location violates constraint»'
summary: La política de ubicaciones mantiene los datos de clientes en la UE. Despliega el servicio en la región europea, privado, y explica por qué la política no se cambia.
track: support-bank
day: 16
level: basic
branch: iam
type: incident
mode: production
skills:
- iam.orgpolicy
- compute.serverless
- architecture.governance
wellArchitected:
- security
certs:
- ACE
- PCSE
difficulty: 2
minutes: 25
baseline:
- bank-atlas
ticket:
  id: INC-23015
  kind: INC
  priority: P4
  sla: 3d
  reporter: Irene Molina (Desarrollo · Hipotecas)
  summary: 'Al desplegar el simulador de hipotecas en Cloud Run (us-central1) me sale «FAILED_PRECONDITION: Location us-central1 violates constraint constraints/gcp.resourceLocations». ¿Podéis permitir esa región?'
actors:
- role: requester
  name: Irene Molina (Desarrollo · Hipotecas)
  persona: Desarrolladora del simulador de hipotecas.
  fallback: 'Es el simulador de hipotecas para la web: imagen europe-docker.pkg.dev/gcplab-public/apps/hello:1.0, servicio simulador-hipotecas.'
  facts:
  - keywords:
    - - por que
      - us-central1
      - region
      - motivo
      - why
    answer: Lo pone así el tutorial que seguí. Los usuarios son de España, no tengo ningún motivo para usar Estados Unidos.
  - keywords:
    - - publico
      - internet
      - quien
      - acceso
      - public
    answer: Lo llamará el backend de la web, no hace falta que sea público.
- role: security
  name: Elena Castro (Seguridad)
  persona: Arquitecta de seguridad de la plataforma.
  fallback: 'Los datos de clientes no salen de la UE: es un requisito regulatorio. La política de ubicaciones no se toca.'
  facts: []
story: |
  **Soporte de plataforma GCP · Banco Atlas** (proyecto `{{.project}}`).

  > **INC-23015** · *«Al desplegar el simulador de hipotecas en Cloud Run (us-central1) me sale «FAILED_PRECONDITION: Location
  > us-central1 violates constraint constraints/gcp.resourceLocations». ¿Podéis permitir esa región?»*

  Muchos tutoriales usan `us-central1` por defecto. En el banco, la política `gcp.resourceLocations` solo permite ubicaciones de
  la **UE** por residencia de datos. Ayuda a que el servicio quede desplegado donde debe.
objectives:
- Confirma qué ubicaciones permite la política
- Averigua si hay algún motivo real para usar Estados Unidos
- Despliega simulador-hipotecas en {{.region}}, sin acceso público
- Explica la política y cierra
hints:
- text: '`gcloud resource-manager org-policies describe gcp.resourceLocations --project={{.project}} --effective`.'
- text: '`gcloud run deploy simulador-hipotecas --image=... --region={{.region}} --no-allow-unauthenticated`.'
solution: |
  ticket
  gcloud resource-manager org-policies describe gcp.resourceLocations --project={{.project}} --effective
  ask requester "¿por qué us-central1 y quién llamará al servicio?"
  ask security "¿se puede permitir us-central1?"
  gcloud run deploy simulador-hipotecas --image=europe-docker.pkg.dev/gcplab-public/apps/hello:1.0 --region={{.region}} --no-allow-unauthenticated
  ticket update "Hola Irene: la política gcp.resourceLocations del banco solo permite regiones de la UE para que los datos de clientes no salgan de Europa, y no se va a cambiar. Te he desplegado simulador-hipotecas en {{.region}} (Bélgica), privado. Para tus próximos despliegues usa --region={{.region}} aunque el tutorial diga us-central1; para tus usuarios en España además irá más rápido."
  ticket resolve "Desplegado simulador-hipotecas en {{.region}} sin acceso público; política de ubicaciones UE sin cambios."
shortcuts:
- name: allow US locations
  run: |
    gcloud resource-manager org-policies allow gcp.resourceLocations in:eu-locations in:us-locations --project={{.project}}
    gcloud run deploy simulador-hipotecas --image=europe-docker.pkg.dev/gcplab-public/apps/hello:1.0 --region=us-central1 --no-allow-unauthenticated
    ticket resolve "Permitidas las regiones de EE. UU. y desplegado en us-central1."
rubric:

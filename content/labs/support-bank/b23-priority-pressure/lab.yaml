setup: |
  gcloud storage buckets create gs://informes-mensuales-{{.project}} --location=EU --uniform-bucket-level-access
  gcloud storage buckets add-iam-policy-binding gs://informes-mensuales-{{.project}} --member=group:finanzas@gcplab.dev --role=roles/storage.objectViewer
ticket:
  id: REQ-11251
  kind: REQ
  priority: P4
  sla: 3d
  reporter: Alberto Vidal (director de Finanzas)
  summary: 'En la consola, la lista de objetos del bucket informes-mensuales sale ordenada por nombre y no por fecha. Esto es inaceptable: abrid un P1 con Google y escaladlo a su dirección hoy mismo.'
actors:
- role: requester
  name: Alberto Vidal (director de Finanzas)
  persona: Director de Finanzas, con prisa.
  fallback: Lo que quiero es encontrar rápido el informe más reciente.
  facts:
  - keywords:
    - - impacto
      - afecta

tutor:
- match: '@intro'
  title: ''
  why: La prioridad la marca el impacto en el negocio. Un cargo alto no convierte una molestia en un P1, pero sí merece una respuesta rápida y respetuosa.
- match: ^ask requester
  title: ''
  why: 'Pregunta siempre: ¿qué no puedes hacer?, ¿a cuántos afecta?, ¿hay alternativa? Con eso la prioridad sale sola.'
- match: ^ticket update
  title: ''
  why: Decir que no a un P1 funciona mejor con una solución inmediata y un camino formal (feature request).
en:
  title: REQ · "Escalate it to Google as P1 right now"
  summary: Priority is set by business impact, not by who shouts loudest. Clarify the impact, provide the fix and explain why it isn't a P1 and doesn't need escalating.
  story: |
    **GCP platform support · Banco Atlas** (project `{{.project}}`).

    > **REQ-11251** · *"In the console, the object list of the informes-mensuales bucket is sorted by name, not by date. This is
    > unacceptable: open a P1 with Google and escalate it to their management today."*

    In Google Cloud support, **P1 = critical impact**: production unusable with no workaround. Escalating a case doesn't solve it
    sooner: it signals that **the impact has grown** or that **the support process has failed**. Using it without reason takes
    resources from those who really need them and costs the bank credibility with Google.
  objectives:
  - 'Ask about the real impact: what can''t be done and how many are affected'
  - Give a way to find the latest report
  - Don't escalate or open a P1 without reason
  - Explain the priority respectfully and close
  hints:
  - '`gcloud storage ls gs://informes-mensuales-{{.project}} --long` lists the objects with their date.'
  - If a console change is really wanted, it's requested from Google as a *feature request* (P4), not a P1.
  ticket:
    summary: 'In the console, the object list of the informes-mensuales bucket is sorted by name, not by date. This is unacceptable: open a P1 with Google and escalate it to their management today.'
  text:
    Alberto Vidal (director de Finanzas): Alberto Vidal (Finance director)
    Director de Finanzas, con prisa.: Finance director, in a hurry.
    Lo que quiero es encontrar rápido el informe más reciente.: What I want is to find the latest report quickly.
    Bueno, los informes se pueden descargar sin problema; es que me cuesta encontrar el último entre tantos.: Well, the reports download fine; it's just hard to find the latest among so many.
    Lo uso yo y mi asistente.: My assistant and I use it.
    Sin escalado injustificado: No unjustified escalation
    No se ha escalado: Not escalated
    Impacto aclarado: Impact clarified
    Preguntado qué no puede hacer y a cuántos afecta: Asked what can't be done and how many are affected
    Solución práctica: Practical fix
    Comprobada la forma de ver las fechas: Checked how to see the dates
    Explicación: Explanation
    Explica la prioridad y cómo encontrar el último informe: Explains the priority and how to find the latest report
    Ticket cerrado: Ticket closed
    ? La prioridad la marca el impacto en el negocio. Un cargo alto no convierte una molestia en un P1, pero sí merece una respuesta rápida y respetuosa.
    : Business impact sets priority. A senior title doesn't turn an annoyance into a P1, but it does deserve a fast, respectful reply.
    'Pregunta siempre: ¿qué no puedes hacer?, ¿a cuántos afecta?, ¿hay alternativa? Con eso la prioridad sale sola.': 'Always ask: what can''t you do? how many are affected? is there a workaround? Priority follows from that.'
    Decir que no a un P1 funciona mejor con una solución inmediata y un camino formal (feature request).: Saying no to a P1 works better with an immediate fix and a formal path (feature request).

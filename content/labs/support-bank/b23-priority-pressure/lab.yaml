story: |
  **Soporte de plataforma GCP · Banco Atlas** (proyecto `{{.project}}`).

  > **REQ-11251** · *«En la consola, la lista de objetos del bucket informes-mensuales sale ordenada por nombre y no por fecha. Esto es
  > inaceptable: abrid un P1 con Google y escaladlo a su dirección hoy mismo.»*

  En soporte de Google Cloud, **P1 = impacto crítico**: producción inutilizable y sin alternativa. Escalar un caso no lo resuelve
  antes: sirve para avisar de que **el impacto ha crecido** o de que **el proceso de soporte ha fallado**. Usarlo sin motivo quita
  recursos a quien de verdad los necesita y resta credibilidad al banco ante Google.
objectives:
- 'Pregunta por el impacto real: qué no puede hacer y a cuántos afecta'
- Dale una forma de encontrar el informe más reciente
- No escales ni abras un P1 sin motivo
- Explica con respeto la prioridad y cierra
hints:
- text: '`gcloud storage ls gs://informes-mensuales-{{.project}} --long` lista los objetos con su fecha.'
- text: Si de verdad se quiere un cambio en la consola, se pide a Google como *feature request* (P4), no como P1.
solution: |
  ticket
  ask requester "¿puedes descargar los informes? ¿qué es lo que no puedes hacer y a cuántas personas afecta?"
  gcloud storage ls gs://informes-mensuales-{{.project}} --long
  ticket update "Hola Alberto: los informes funcionan y se descargan bien, así que no es un P1 (en Google, P1 es producción caída sin alternativa) y escalarlo no lo aceleraría. Para encontrar el último: en la consola puedes ordenar por la columna «Creado», o con gcloud storage ls gs://informes-mensuales-{{.project}} --long ves la fecha de cada uno. Si quieres que Google cambie el orden por defecto, lo pedimos como sugerencia de producto (P4)."
  ticket resolve "Explicada la forma de ordenar por fecha; impacto bajo (P4), sin escalado a Google."
shortcuts:
- name: escalate to google
  run: |
    ticket escalate google "P1 urgente: la consola ordena los objetos por nombre y Finanzas exige escalarlo a dirección."

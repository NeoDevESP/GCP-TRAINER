id: bank-b23-priority-pressure
title: REQ · «Escaladlo a Google como P1 ya»
summary: La prioridad se decide por impacto en el negocio, no por quién grita más. Aclara el impacto, da la solución y explica por qué no es un P1 ni hace falta escalar.

en:
  title: INC P1 · Cloud Run, BigQuery and Pub/Sub fail at once across regions
  summary: 'A simultaneous failure across many products and regions points to the provider, but you prove it: check your changes, check Google''s status, open a single case and communicate.'
  story: |
    **GCP platform support · Banco Atlas** (project `{{.project}}`).

    > **INC-23500 · P1** · *"Since 18:51 CEST, 503 error alerts are firing on Cloud Run APIs, BigQuery loads and Pub/Sub publishing,
    > in europe-west1 and europe-west4. Mobile banking and closing processes are affected."*

    Many products and regions at once is almost never your change… but you have to **prove it**. It really happened on 12 June 2025:
    a policy change in Google's Service Control triggered a code bug and APIs of many products failed. The right move: rule out your
    own changes, confirm with Google's status, **a single** well-documented P1 case (`ticket escalate google "…"`) and business
    communication. No blind restarts or changes.
  objectives:
  - Rule out recent changes of your own
  - Confirm with Google's status whether there's an active incident
  - Open a single P1 case with time, products, regions, errors and impact
  - Communicate to the business without touching production
  hints:
  - '`ask changes "..."` and `gcloud logging read` over admin activity to see recent changes.'
  - '`ask psh "..."` queries Personalized Service Health.'
  ticket:
    summary: Since 18:51 CEST, 503 error alerts are firing on Cloud Run APIs, BigQuery loads and Pub/Sub publishing, in europe-west1 and europe-west4. Mobile banking and closing processes are affected.
  text:
    Monitorización 24x7: 24x7 Monitoring
    Gestión de cambios: Change management
    Calendario de cambios de producción.: Production change calendar.
    Consulta por la franja horaria.: Ask about the time window.
    No hay ningún cambio en producción desde las 14:00; el último fue una regla de firewall en otro proyecto.: No production change since 14:00; the last one was a firewall rule in another project.
    Personalized Service Health: Personalized Service Health
    Avisos de Google para los proyectos del banco.: Google notices for the bank's projects.
    Consulta por producto o región.: Ask by product or region.
    ? 'Incidente de Google confirmado desde las 18:49 CEST: errores 503 en varias APIs de Google Cloud en múltiples regiones por un fallo de Service Control. Google trabaja en la mitigación; próxima actualización en 30 min.'
    : 'Google incident confirmed since 18:49 CEST: 503 errors on several Google Cloud APIs in multiple regions due to a Service Control failure. Google is working on mitigation; next update in 30 min.'
    Sin cambios a ciegas: No blind changes
    Nada tocado en producción: Nothing touched in production
    Diagnóstico: Diagnosis
    Descartados cambios propios: Own changes ruled out
    Consultado el estado de Google: Google's status checked
    Caso a Google: Case with Google
    Caso con hora, error, productos e impacto: Case with time, error, products and impact
    Comunicación: Communication
    Aviso a negocio con la causa y la próxima actualización: Business notice with the cause and next update
    ? 'Un fallo en varios productos y regiones a la vez apunta al proveedor, pero primero descartas tus cambios: así no culpas a Google de algo tuyo.'
    : 'A failure across several products and regions points to the provider, but you rule out your own changes first: that way you don''t blame Google for something of yours.'
    Confirma con Google: Confirm with Google
    El incidente confirmado en PSH es la evidencia para tu caso y para negocio.: The confirmed incident in PSH is the evidence for your case and for the business.
    'Un único caso con todos los datos: abrir uno por servicio solo duplica el trabajo de ambos lados.': 'A single case with all the data: one per service only duplicates work on both sides.'

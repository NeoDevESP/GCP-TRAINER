ticket:
  id: INC-23500
  kind: INC
  priority: P1
  sla: 15m
  reporter: Monitorización 24x7
  summary: Desde las 18:51 CEST saltan alertas de error 503 en APIs de Cloud Run, cargas de BigQuery y publicaciones en Pub/Sub, en europe-west1 y europe-west4. Afecta a banca móvil y a los procesos de cierre.
actors:
- role: changes
  name: Gestión de cambios
  persona: Calendario de cambios de producción.
  fallback: Consulta por la franja horaria.
  facts:
  - keywords:
    - - cambio
      - change
      - despliegue
      - deploy
      - hoy
      - today
      - ultim
    answer: No hay ningún cambio en producción desde las 14:00; el último fue una regla de firewall en otro proyecto.
- role: psh
  name: Personalized Service Health
  persona: Avisos de Google para los proyectos del banco.
  fallback: Consulta por producto o región.
  facts:
  - keywords:
    - - incid
      - estado
      - status
      - google
      - activo
      - active
      - aviso
    answer: 'Incidente de Google confirmado desde las 18:49 CEST: errores 503 en varias APIs de Google Cloud en múltiples regiones por un fallo de Service Control. Google trabaja en la mitigación; próxima actualización en 30 min.'
story: |
  **Soporte de plataforma GCP · Banco Atlas** (proyecto `{{.project}}`).

  > **INC-23500 · P1** · *«Desde las 18:51 CEST saltan alertas de error 503 en APIs de Cloud Run, cargas de BigQuery y publicaciones en
  > Pub/Sub, en europe-west1 y europe-west4. Afecta a banca móvil y a los procesos de cierre.»*

  Muchos productos y regiones a la vez casi nunca es un cambio tuyo… pero hay que **demostrarlo**. Ocurrió de verdad el 12 de junio de
  2025: un cambio de política en Service Control de Google activó un error de código y fallaron APIs de muchos productos. Lo correcto:
  descartar cambios propios, confirmar con el estado de Google, **un solo caso** P1 bien documentado (`ticket escalate google "…"`)
  y comunicación a negocio. Nada de reinicios ni cambios a ciegas.
objectives:
- Descarta cambios propios recientes
- Confirma con el estado de Google si hay un incidente activo
- Abre un único caso P1 con hora, productos, regiones, errores e impacto
- Comunica a negocio sin tocar nada en producción
hints:
- text: '`ask changes "..."` y `gcloud logging read` sobre actividad de administración para ver cambios recientes.'
- text: '`ask psh "..."` consulta Personalized Service Health.'
solution: |
  ticket
  ask changes "¿ha habido cambios en producción esta tarde?"
  gcloud logging read 'logName:"cloudaudit.googleapis.com%2Factivity"' --limit=10
  ask psh "¿hay algún incidente activo de Google en europe-west1 o europe-west4?"
  ticket escalate google "P1 Banco Atlas: desde las 18:51 CEST errores 503 en Cloud Run, cargas de BigQuery y publicaciones de Pub/Sub en europe-west1 y europe-west4. Coincide con el incidente confirmado de Service Control (18:49 CEST). Sin cambios propios desde las 14:00. Impacto: banca móvil y procesos de cierre. Contacto de guardia disponible 24/7."
  ticket update "Aviso a negocio: los errores de banca móvil y de los procesos de cierre se deben a un incidente de Google Cloud que afecta a varios servicios en Europa. No es un cambio nuestro. Tenemos un caso P1 abierto con Google y daremos novedades cada 30 minutos. Os recomendamos no reintentar los cierres en bucle hasta nuevo aviso."
shortcuts:
- name: restart services
  run: |
    gcloud compute instances reset movimientos-api --zone={{.zone}}
    ticket update "Hemos reiniciado los servidores por si acaso."
    ticket resolve "Reiniciados los servidores por si acaso era nuestro."

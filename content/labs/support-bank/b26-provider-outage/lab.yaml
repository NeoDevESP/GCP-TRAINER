id: bank-b26-provider-outage
title: INC P1 · Fallan a la vez Cloud Run, BigQuery y Pub/Sub en varias regiones
summary: 'Un fallo simultáneo en muchos productos y regiones apunta al proveedor, pero se demuestra: revisa tus cambios, consulta el estado de Google, abre un único caso y comunica.'

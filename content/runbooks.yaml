  - zentra-z29-zone-stockout
- id: quota-exceeded
  area: compute
  symptom:
  - «Quota 'CPUS' exceeded»
  - '"Quota ''CPUS'' exceeded"'
  errors:
  - 'Quota ''CPUS'' exceeded. Limit: 24.0 in region'
  - QUOTA_EXCEEDED
  means:
  - 'Has llegado al límite del proyecto en esa región. Un aumento lo revisa Google y tarda: antes mira qué está gastando la cuota.'
  - 'You''ve hit the project''s limit in that region. Google reviews an increase and it takes time: first see what''s using the quota.'
  steps:
  - text:
    - Uso y límite
    - Usage and limit
    cmd: gcloud compute regions describe REGION
  - text:
    - Qué está encendido
    - What's running
    cmd: gcloud compute instances list --format='table(name,machineType,labels)'
  causes:
  - - Máquinas olvidadas de pruebas
    - Forgotten test machines
  - - Crecimiento real que necesita más cuota

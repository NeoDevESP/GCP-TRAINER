  causes:
  - - Demanda alta de esa familia (GPU, n2…) en esa zona
    - High demand for that family (GPU, n2…) in that zone
  fix:
  - Otra zona de la misma región (mismos datos, misma latencia) u otra familia de máquina.
  - Another zone in the same region (same data, same latency) or another machine family.

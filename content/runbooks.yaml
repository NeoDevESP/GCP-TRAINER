- id: worm-retention
  area: security
  symptom:
  - 'Petición: datos que no se puedan borrar en X años (WORM)'
  - 'Request: data that can''t be deleted for X years (WORM)'
  errors: []
  means:
  - Una **política de retención** impide borrar o sobrescribir objetos antes de su edad mínima; **bloqueada**, ni un administrador puede quitarla. Bloquear es irreversible.
  - A **retention policy** prevents deleting or overwriting objects before their minimum age; **locked**, not even an administrator can remove it. Locking is irreversible.
  steps:
  - text:
    - Aplica la retención
    - Apply retention
    cmd: gcloud storage buckets update gs://BUCKET --retention-period=10y
  - text:
    - Bloquéala (tras confirmarlo)
    - Lock it (after confirming)
    cmd: gcloud storage buckets update gs://BUCKET --lock-retention-period
  causes:
  - - Requisito de auditoría o regulador
    - Audit or regulator requirement
  fix:
  - Confirma el periodo con Cumplimiento, aplica y bloquea, y explica en el ticket que es irreversible.
  - Confirm the period with Compliance, apply and lock, and explain in the ticket that it's irreversible.
  avoid:
  - Bloquear sin confirmar el periodo.
  - Locking without confirming the period.
  labs:
  - zentra-z50-retention-lock

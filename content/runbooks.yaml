# Quick diagnosis guide by symptom. Generated; every text is [es, en].
runbooks:
- id: permission-denied
  area: access
  symptom:
  - Un usuario o servicio recibe 403 / PERMISSION_DENIED
  - A user or service gets 403 / PERMISSION_DENIED
  errors:
  - 'PERMISSION_DENIED: Permission ''storage.objects.get'' denied on resource'
  - 403 Forbidden
  - does not have storage.objects.create access
  means:
  - La identidad que hace la llamada no tiene el permiso concreto sobre ese recurso. Lo primero es saber **quién** llama de verdad (usuario, cuenta de servicio de la VM, del pod, de Cloud Run…) y **qué permiso** falta.
  - The calling identity lacks that specific permission on that resource. First find out **who** is really calling (user, the VM's, pod's or Cloud Run's service account…) and **which permission** is missing.
  steps:
  - text:
    - 'Lee el error completo: suele nombrar el permiso y el recurso'
    - 'Read the full error: it usually names the permission and the resource'
    cmd: ''
  - text:
    - Pregunta a IAM por qué sí o por qué no
    - Ask IAM why or why not
    cmd: gcloud policy-intelligence troubleshoot-policy iam //cloudresourcemanager.googleapis.com/projects/PROYECTO --principal-email=EMAIL --permission=PERMISO
  - text:
    - Mira qué roles tiene esa identidad en el proyecto
    - See which roles that identity has in the project
    cmd: gcloud projects get-iam-policy PROYECTO --flatten='bindings[].members' --filter='bindings.members:EMAIL' --format='table(bindings.role)'
  - text:
    - Busca el rechazo en los registros
    - Find the denial in the logs
    cmd: gcloud logging read 'protoPayload.status.code=7' --limit=5
  causes:
  - - La llamada la hace otra identidad (la cuenta de servicio, no la persona)
    - Another identity makes the call (the service account, not the person)
  - - El permiso está en otro recurso (bucket, tema, secreto) y no en el proyecto, o al revés
    - The permission is on another resource (bucket, topic, secret) and not the project, or the other way round
  - - Le quitaron a la persona de un grupo, o la cuenta está suspendida
    - The person was removed from a group, or the account is suspended
  fix:
  - Da el rol predefinido **más pequeño** que contenga ese permiso, al **grupo** adecuado y sobre el **recurso** concreto.
  - Grant the **smallest** predefined role containing that permission, to the right **group** and on the specific **resource**.
  avoid:
  - Dar Editor u Owner «para que funcione». En un banco es un hallazgo de auditoría.
  - Granting Editor or Owner "to make it work". In a bank that's an audit finding.
  labs:
  - zentra-z16-publish-denied
  - zentra-z18-bq-denied
  - bank-b25-wrong-identity
  - ace-d11-app-403
- id: run-403
  area: access
  symptom:
  - Cloud Run responde 403 Forbidden al invocarlo
  - Cloud Run answers 403 Forbidden when invoked
  errors:
  - 'Error: Forbidden. Your client does not have permission to get URL'
  - 403 Forbidden
  means:
  - El servicio exige autenticación y quien llama no tiene `roles/run.invoker`, no envía un token de identidad o el *ingress* no deja pasar ese origen.
  - The service requires authentication and the caller lacks `roles/run.invoker`, sends no identity token, or ingress doesn't allow that source.
  steps:
  - text:
    - Mira quién puede invocarlo
    - See who can invoke it
    cmd: gcloud run services get-iam-policy SERVICIO --region=REGION
  - text:
    - Mira el ingress y la cuenta de servicio
    - Check ingress and the service account
    cmd: gcloud run services describe SERVICIO --region=REGION
  - text:
    - Prueba con token de identidad
    - Test with an identity token
    cmd: 'curl -H "Authorization: Bearer $(gcloud auth print-identity-token)" URL'
  causes:
  - - Falta `run.invoker` para la cuenta que llama
    - '`run.invoker` is missing for the calling account'
  - - El cliente llama sin token de identidad (o con uno de acceso)
    - The client calls without an identity token (or with an access token)
  - - Ingress `internal` y la llamada viene de fuera de la VPC
    - Ingress `internal` and the call comes from outside the VPC
  fix:
  - Da `roles/run.invoker` **en el servicio** a la cuenta concreta que llama.
  - Grant `roles/run.invoker` **on the service** to the specific calling account.
  avoid:
  - Abrirlo a `allUsers`. Un microservicio bancario nunca es público.
  - Opening it to `allUsers`. A banking microservice is never public.
  labs:
  - zentra-z05-private-run
  - bank-b05-run-403
- id: api-disabled
  area: access
  symptom:
  - «API has not been used in project … or it is disabled»
  - '"API has not been used in project … or it is disabled"'
  errors:
  - BigQuery API has not been used in project 123456789 before or it is disabled
  - SERVICE_DISABLED
  means:
  - El servicio no está activado en ese proyecto. Desactivar una API **no borra datos**, pero todo lo que la usa falla.
  - The service isn't enabled in that project. Disabling an API **deletes no data**, but everything that uses it fails.
  steps:
  - text:
    - Mira qué APIs están activas
    - See which APIs are enabled
    cmd: gcloud services list --enabled
  - text:
    - Busca quién la desactivó
    - Find who disabled it
    cmd: gcloud logging read 'protoPayload.methodName:DisableService' --limit=3
  causes:
  - - Proyecto nuevo sin la API activada
    - New project without the API enabled
  - - Un script de limpieza o un Terraform la desactivó
    - A clean-up script or Terraform disabled it
  fix:
  - '`gcloud services enable SERVICIO.googleapis.com` y, si la desactivó un proceso, que lo corrijan para que no se repita.'
  - '`gcloud services enable SERVICE.googleapis.com` and, if a process disabled it, have it fixed so it doesn''t happen again.'
  avoid:
  - ''
  - ''
  labs:
  - zentra-z13-enable-api
  - zentra-z40-api-disabled
- id: org-policy
  area: access
  symptom:
  - '«Constraint … violated»: una política de organización lo prohíbe'
  - '"Constraint … violated": an organization policy forbids it'
  errors:
  - Constraint constraints/compute.vmExternalIpAccess violated for project
  - Constraint constraints/gcp.resourceLocations violated
  - One or more users named in the policy do not belong to a permitted customer
  means:
  - 'No es un problema de permisos: la organización prohíbe esa configuración para todos (IP públicas, regiones fuera de la UE, claves de cuentas de servicio, miembros de otros dominios…).'
  - 'It isn''t a permissions problem: the organization forbids that setting for everyone (public IPs, non-EU regions, service account keys, members from other domains…).'
  steps:
  - text:
    - Mira qué políticas aplican al proyecto
    - See which policies apply to the project
    cmd: gcloud resource-manager org-policies list --project=PROYECTO
  - text:
    - Lee la política concreta
    - Read the specific policy
    cmd: gcloud resource-manager org-policies describe RESTRICCION --project=PROYECTO --effective
  causes:
  - - Se pide una VM con IP pública, un bucket público o una región no permitida
    - Someone asks for a VM with a public IP, a public bucket or a disallowed region
  - - Se intenta dar acceso a un correo de otro dominio
    - Someone tries to grant access to an email from another domain
  fix:
  - Cumple la política con la alternativa segura (IAP, Cloud NAT, región de la UE, grupo del dominio…). Una excepción solo la aprueba Seguridad.
  - Meet the policy with the safe alternative (IAP, Cloud NAT, an EU region, a domain group…). Only Security approves an exception.
  avoid:
  - Desactivar la restricción para salir del paso.
  - Turning off the constraint to get past it.
  labs:
  - bank-b02-vm-policy
  - bank-b16-region-policy
  - zentra-z12-external-consultant
  - zentra-z15-external-member
- id: leaver
  area: access
  symptom:
  - 'Baja urgente: una persona se va y hay que cortarle el acceso ya'
  - 'Urgent leaver: someone is leaving and access must be cut now'
  errors: []
  means:
  - El acceso a Google Cloud llega por grupos de Workspace. Hay que cortar la sesión y los grupos, y revisar lo que la persona tenía directamente o en claves.
  - Google Cloud access comes through Workspace groups. Cut the session and the groups, and check what the person held directly or through keys.
  steps:
  - text:
    - Mira sus grupos
    - See their groups
    cmd: gam info user EMAIL
  - text:
    - Busca permisos directos (no por grupo)
    - Look for direct grants (not through a group)
    cmd: gcloud projects get-iam-policy PROYECTO --flatten='bindings[].members' --filter='bindings.members:user:EMAIL'
  - text:
    - Revisa claves de cuentas de servicio que pudiera tener
    - Check service account keys they might hold
    cmd: gcloud iam service-accounts keys list --iam-account=SA
  causes:
  - - Accesos directos fuera de grupos
    - Direct grants outside groups
  - - Claves de cuentas de servicio descargadas
    - Downloaded service account keys
  fix:
  - Suspende la cuenta y cierra sesiones (`gam update user EMAIL suspended on`, `gam user EMAIL signout`), quita permisos directos y deja constancia en el ticket.
  - Suspend the account and sign it out (`gam update user EMAIL suspended on`, `gam user EMAIL signout`), remove direct grants and record it in the ticket.
  avoid:
  - 'Borrar la cuenta el primer día: se pierden sus datos y la auditoría.'
  - 'Deleting the account on day one: its data and audit trail are lost.'
  labs:
  - zentra-z11-urgent-leaver
  - bank-b12-leaver-joiner
- id: vm-no-internet
  area: network
  symptom:
  - Una VM sin IP pública no sale a internet (apt, APIs externas)
  - A VM without a public IP can't reach the internet (apt, external APIs)
  errors:
  - 'Could not connect to deb.debian.org: Connection timed out'
  - 'dial tcp: i/o timeout'
  means:
  - Sin IP pública, la única salida es **Cloud NAT** (más una ruta por defecto). Si el NAT no cubre esa subred o no existe, no hay camino.
  - Without a public IP, the only way out is **Cloud NAT** (plus a default route). If NAT doesn't cover that subnet or doesn't exist, there's no path.
  steps:
  - text:
    - Mira el router y su NAT
    - Check the router and its NAT
    cmd: gcloud compute routers nats describe NAT --router=ROUTER --region=REGION
  - text:
    - Comprueba la ruta por defecto
    - Check the default route
    cmd: gcloud compute routes list --filter='destRange=0.0.0.0/0'
  - text:
    - Busca quién lo cambió
    - Find who changed it
    cmd: gcloud logging read 'protoPayload.methodName:"routers"' --limit=5
  causes:
  - - Borraron o cambiaron el NAT
    - The NAT was deleted or changed
  - - El NAT solo cubre otras subredes
    - The NAT only covers other subnets
  - - Falta la ruta 0.0.0.0/0
    - The 0.0.0.0/0 route is missing
  fix:
  - Restaura el NAT para esa subred (si debe tener salida).
  - Restore NAT for that subnet (if it should have egress).
  avoid:
  - 'Darle IP pública a la VM: la política de la organización lo prohíbe y expone el servidor.'
  - 'Giving the VM a public IP: the org policy forbids it and it exposes the server.'
  labs:
  - zentra-z25-fx-no-egress
  - zentra-z43-default-route
  - bank-b03-no-egress
  - ace-d12-private-egress
- id: nat-ports
  area: network
  symptom:
  - Fallos intermitentes solo hacia internet con mucho tráfico
  - Intermittent failures only to the internet under heavy traffic
  errors:
  - allocation_status=DROPPED reason=OUT_OF_RESOURCES
  means:
  - Cloud NAT da a cada VM un número fijo de puertos por destino (64 por defecto). Si abre más conexiones simultáneas, las que sobran se descartan.
  - Cloud NAT gives each VM a fixed number of ports per destination (64 by default). If it opens more simultaneous connections, the extra ones are dropped.
  steps:
  - text:
    - Busca OUT_OF_RESOURCES en los registros del NAT
    - Look for OUT_OF_RESOURCES in the NAT logs
    cmd: gcloud logging read 'logName:nat_flows' --limit=5
  - text:
    - Mira los puertos asignados
    - See the allocated ports
    cmd: gcloud compute routers get-nat-mapping-info ROUTER --region=REGION
  causes:
  - - La aplicación abre una conexión por petición en lugar de reutilizarlas
    - The app opens one connection per request instead of reusing them
  fix:
  - Sube `--min-ports-per-vm` (o activa la asignación dinámica) y pide a la aplicación que reutilice conexiones.
  - Raise `--min-ports-per-vm` (or enable dynamic allocation) and ask the app to reuse connections.
  avoid:
  - ''
  - ''
  labs:
  - zentra-z28-nat-ports
- id: private-google-access
  area: network
  symptom:
  - Una VM privada no llega a Cloud Storage, BigQuery u otras APIs de Google
  - A private VM can't reach Cloud Storage, BigQuery or other Google APIs
  errors:
  - 'dial tcp storage.googleapis.com:443: i/o timeout'
  means:
  - Sin IP pública ni NAT, las APIs de Google solo se alcanzan con **Private Google Access**, que se activa por subred.
  - With no public IP or NAT, Google APIs are only reachable through **Private Google Access**, enabled per subnet.
  steps:
  - text:
    - Mira si la subred lo tiene
    - Check whether the subnet has it
    cmd: gcloud compute networks subnets describe SUBRED --region=REGION --format='value(privateIpGoogleAccess)'
  - text:
    - Busca quién lo cambió
    - Find who changed it
    cmd: gcloud logging read 'protoPayload.methodName:"setPrivateIpGoogleAccess"' --limit=3
  causes:
  - - Un Terraform o un cambio manual lo desactivó
    - A Terraform or manual change turned it off
  fix:
  - '`gcloud compute networks subnets update SUBRED --region=REGION --enable-private-ip-google-access`'
  - '`gcloud compute networks subnets update SUBNET --region=REGION --enable-private-ip-google-access`'
  avoid:
  - 'Meter una subred de datos en el NAT: le das internet a lo que no debe tenerlo.'
  - 'Adding a data subnet to NAT: you give internet to what shouldn''t have it.'
  labs:
  - zentra-z37-private-google-access
- id: firewall-blocked
  area: network
  symptom:
  - «Connection timed out» entre dos máquinas de la misma VPC
  - '"Connection timed out" between two machines in the same VPC'
  errors:
  - Connection timed out
  - 'curl: (28) Failed to connect'
  means:
  - Una regla de cortafuegos no deja pasar el tráfico. Cuando varias coinciden, **gana el número de prioridad más bajo**; una DENY con número más bajo que la ALLOW la anula.
  - A firewall rule blocks the traffic. When several match, **the lowest priority number wins**; a DENY with a lower number than the ALLOW overrides it.
  steps:
  - text:
    - Lista las reglas con prioridad, etiquetas y acción
    - List rules with priority, tags and action
    cmd: gcloud compute firewall-rules list --filter='network:RED' --sort-by=priority
  - text:
    - Comprueba las etiquetas de las VMs
    - Check the VMs' tags
    cmd: gcloud compute instances describe VM --zone=ZONA --format='value(tags.items)'
  - text:
    - Busca cambios recientes
    - Find recent changes
    cmd: gcloud logging read 'protoPayload.methodName:"firewalls"' --limit=5
  causes:
  - - Falta la regla ALLOW o el puerto
    - The ALLOW rule or the port is missing
  - - La VM perdió la etiqueta de red
    - The VM lost its network tag
  - - Una DENY ganó por prioridad
    - A DENY won on priority
  fix:
  - Corrige la regla concreta (puerto, origen, etiqueta o prioridad) con el OK de Seguridad si es suya.
  - Fix the specific rule (port, source, tag or priority) with Security's OK if it's theirs.
  avoid:
  - Abrir a 0.0.0.0/0 o borrar las reglas de Seguridad.
  - Opening to 0.0.0.0/0 or deleting Security's rules.
  labs:
  - zentra-z38-firewall-priority
  - ace-d18-api-db-firewall
  - ace-d05-subnet-isolation
- id: lb-502
  area: network
  symptom:
  - El balanceador devuelve 502 / «no healthy upstream»
  - The load balancer returns 502 / "no healthy upstream"
  errors:
  - 502 Bad Gateway
  - no healthy upstream
  - UNHEALTHY
  means:
  - Ningún backend está sano. El balanceador decide con su **health check**, que llega desde los rangos de Google `35.191.0.0/16` y `130.211.0.0/22`.
  - No backend is healthy. The load balancer decides through its **health check**, which comes from Google's ranges `35.191.0.0/16` and `130.211.0.0/22`.
  steps:
  - text:
    - Mira el estado de los backends
    - Check backend health
    cmd: gcloud compute backend-services get-health BACKEND --global
  - text:
    - Revisa el health check (puerto y ruta)
    - Check the health check (port and path)
    cmd: gcloud compute health-checks describe HC
  - text:
    - Comprueba que el cortafuegos deja pasar las sondas
    - Check the firewall lets the probes in
    cmd: gcloud compute firewall-rules list --filter='sourceRanges:35.191.0.0/16'
  causes:
  - - Cortafuegos sin los rangos de las sondas
    - Firewall without the probe ranges
  - - La VM perdió la etiqueta de red a la que apunta la regla
    - The VM lost the network tag the rule targets
  - - Health check al puerto o ruta equivocados
    - Health check to the wrong port or path
  - - Falta el *named port* del grupo
    - The group's named port is missing
  fix:
  - Corrige el health check o la regla de las sondas; espera a que el backend pase a HEALTHY.
  - Fix the health check or the probes' rule; wait for the backend to become HEALTHY.
  avoid:
  - ''
  - ''
  labs:
  - zentra-z24-healthcheck-path
  - zentra-z45-lost-tag
  - zentra-z46-named-port
  - bank-b21-lb-502-healthcheck
  - ace-d09-health-check
- id: dns-name
  area: network
  symptom:
  - Por IP funciona, por nombre no
  - It works by IP, not by name
  errors:
  - upstream request failed
  - Could not resolve host
  means:
  - Es DNS. En una zona **privada** de Cloud DNS, el registro puede apuntar a una IP antigua o la zona no ser visible desde esa VPC.
  - It's DNS. In a **private** Cloud DNS zone, the record may point to an old IP or the zone may not be visible from that VPC.
  steps:
  - text:
    - Mira el registro
    - Check the record
    cmd: gcloud dns record-sets list --zone=ZONA
  - text:
    - Compara con la IP real
    - Compare with the real IP
    cmd: gcloud compute instances describe VM --zone=ZONA --format='value(networkInterfaces[0].networkIP)'
  causes:
  - - Migración que no actualizó el registro
    - A migration that didn't update the record
  - - Terraform antiguo reaplicado
    - An old Terraform re-applied
  fix:
  - '`gcloud dns record-sets update NOMBRE. --zone=ZONA --type=A --ttl=60 --rrdatas=IP`'
  - '`gcloud dns record-sets update NAME. --zone=ZONE --type=A --ttl=60 --rrdatas=IP`'
  avoid:
  - ''
  - ''
  labs:
  - zentra-z39-private-dns
  - ace-d13-lb-dns
- id: ssh-iap
  area: network
  symptom:
  - No puedo entrar por SSH a una VM sin IP pública
  - I can't SSH into a VM without a public IP
  errors:
  - failed to connect to backend
  - Permission denied (publickey)
  means:
  - 'Se entra por **IAP**: el tráfico llega desde `35.235.240.0/20` y necesitas permiso para el túnel y, con OS Login, para iniciar sesión.'
  - 'You get in through **IAP**: traffic comes from `35.235.240.0/20` and you need permission for the tunnel and, with OS Login, to log in.'

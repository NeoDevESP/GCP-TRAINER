- id: disk-full
  area: compute
  symptom:
  - «No space left on device»
  - '"No space left on device"'
  errors:
  - No space left on device
  - 'write error: No space left on device'
  means:
  - 'El sistema de archivos está lleno. Antes de borrar nada, **mide** qué ocupa y **pregunta**: puede ser evidencia que no se puede tocar.'
  - 'The file system is full. Before deleting anything, **measure** what takes space and **ask**: it may be evidence that can''t be touched.'
  steps:
  - text:
    - Cuánto queda
    - How much is left
    cmd: gcloud compute ssh VM --zone=ZONA --tunnel-through-iap --command='df -h'
  - text:
    - Qué ocupa
    - What takes it
    cmd: gcloud compute ssh VM --zone=ZONA --tunnel-through-iap --command='sudo du -sh /var/*'
  - text:
    - Ficheros grandes
    - Big files
    cmd: gcloud compute ssh VM --zone=ZONA --tunnel-through-iap --command='sudo find / -size +500M'
  causes:
  - - Registros sin rotar o de depuración
    - Unrotated or debug logs
  - - Datos que crecen y deben conservarse
    - Data that grows and must be kept
  fix:
  - 'Si son registros: vaciar (`truncate`) y rotar. Si son datos: ampliar el disco (`gcloud compute disks resize`, y dentro `growpart` + `resize2fs`).'
  - 'If it''s logs: empty them (`truncate`) and rotate. If it''s data: grow the disk (`gcloud compute disks resize`, then `growpart` + `resize2fs` inside).'
  avoid:
  - Borrar ficheros sin saber qué son, o borrar un log abierto con `rm` (el espacio no se libera).
  - Deleting files without knowing what they are, or deleting an open log with `rm` (the space isn't freed).
  labs:
  - zentra-z36-disk-grow
  - bank-b17-disk-full
  - linux-l01-disk-full
- id: zone-stockout
  area: compute
  symptom:
  - «ZONE_RESOURCE_POOL_EXHAUSTED» al crear una VM
  - '"ZONE_RESOURCE_POOL_EXHAUSTED" when creating a VM'
  errors:
  - ZONE_RESOURCE_POOL_EXHAUSTED
  means:
  - 'La **zona** no tiene máquinas de ese tipo libres ahora mismo. No es tu cuota: pedir más cuota no crea máquinas.'
  - 'The **zone** has no free machines of that type right now. It isn''t your quota: more quota doesn''t create machines.'
  steps:
  - text:
    - Confirma que la cuota no es el problema
    - Confirm quota isn't the problem

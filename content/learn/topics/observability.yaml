id: observability
name: [Observabilidad, Observability]
intro: ["Saber qué pasa en producción: registros, métricas, alertas, SLOs, trazas y cómo gestionar un incidente.", "Knowing what happens in production: logs, metrics, alerts, SLOs, traces and how to run an incident."]
concepts:
  - id: logging
    term: [Cloud Logging, Cloud Logging]
    what: ["Recoge, busca y enruta registros de todos los servicios.", "Collects, searches and routes logs from every service."]
    points:
      - ["El Explorador de registros filtra por recurso, severidad y campos (p. ej. httpRequest.status>=500).", "Logs Explorer filters by resource, severity and fields (e.g. httpRequest.status>=500)."]
      - ["Los sinks exportan registros a Cloud Storage, BigQuery o Pub/Sub.", "Sinks export logs to Cloud Storage, BigQuery or Pub/Sub."]
      - ["Retención por defecto de _Default: 30 días; auditoría _Required: 400 días.", "Default retention for _Default: 30 days; _Required audit: 400 days."]
    tip: ["Guardar registros años por normativa → sink a Cloud Storage (o bucket de logs con retención larga).", "Keep logs for years for compliance → sink to Cloud Storage (or a log bucket with long retention)."]
  - id: monitoring
    term: [Cloud Monitoring y alertas, Cloud Monitoring and alerts]
    what: ["Métricas, paneles, comprobaciones de disponibilidad y políticas de alertas.", "Metrics, dashboards, uptime checks and alerting policies."]
    points:
      - ["El Agente de operaciones (Ops Agent) recoge memoria, disco y registros de las VMs.", "The Ops Agent collects memory, disk and logs from VMs."]
      - ["Las métricas basadas en registros convierten líneas de log en métricas alertables.", "Log-based metrics turn log lines into alertable metrics."]
      - ["Las comprobaciones de disponibilidad sondean una URL desde varias regiones.", "Uptime checks probe a URL from several regions."]
    tip: ["La memoria de una VM no aparece → instalar el Agente de operaciones.", "VM memory not shown → install the Ops Agent."]
  - id: slo
    term: ["SLI, SLO y presupuesto de error", "SLI, SLO and error budget"]
    what: ["SLI mide, SLO fija el objetivo y el presupuesto de error es el fallo permitido.", "SLI measures, SLO sets the target and the error budget is the allowed failure."]
    points:
      - ["SLI típico: % de peticiones correctas y rápidas.", "Typical SLI: % of good, fast requests."]
      - ["SLO 99,9 % mensual ≈ 43 minutos de fallo permitido.", "99.9% monthly SLO ≈ 43 minutes of allowed failure."]
      - ["Si se agota el presupuesto, se prioriza la fiabilidad sobre nuevas funciones.", "If the budget runs out, reliability takes priority over new features."]
      - ["Alertar por tasa de consumo (burn rate) del presupuesto, no por cada error.", "Alert on budget burn rate, not on every error."]
    tip: ["Pregunta de SRE sobre «cuándo congelar despliegues» → presupuesto de error agotado.", "SRE question on \"when to freeze deployments\" → exhausted error budget."]
  - id: apm
    term: ["Trace, Profiler y Error Reporting", "Trace, Profiler and Error Reporting"]
    what: ["Herramientas para ver latencia entre servicios, consumo de CPU y agrupar excepciones.", "Tools to see latency across services, CPU usage and grouped exceptions."]
    points:
      - ["Cloud Trace: qué llamada de la cadena es la lenta.", "Cloud Trace: which call in the chain is slow."]
      - ["Cloud Profiler: qué función consume CPU o memoria en producción.", "Cloud Profiler: which function consumes CPU or memory in production."]
      - ["Error Reporting: agrupa errores iguales y avisa de los nuevos.", "Error Reporting: groups identical errors and flags new ones."]
    tip: ["«Latencia alta en una arquitectura de microservicios» → Cloud Trace.", "\"High latency in a microservices architecture\" → Cloud Trace."]
  - id: incident
    term: [Gestión de incidentes, Incident management]
    what: ["Roles claros, mitigar primero y aprender después con un postmortem sin culpas.", "Clear roles, mitigate first and learn later with a blameless postmortem."]
    points:
      - ["Mitigar (rollback, escalar) antes de buscar la causa raíz.", "Mitigate (rollback, scale) before finding root cause."]
      - ["Coordinador del incidente, responsable de comunicaciones y de operaciones.", "Incident commander, communications lead and operations lead."]
      - ["El postmortem busca causas del sistema, no culpables.", "The postmortem looks for system causes, not culprits."]
    tip: ["Durante un incidente, lo primero es restaurar el servicio.", "During an incident, restoring service comes first."]
scenarios:
  - q: ["Quieres un aviso cuando aparezcan más de 10 errores 500 por minuto en los registros.", "You want an alert when more than 10 HTTP 500 errors per minute appear in logs."]
    options: [["Métrica basada en registros + política de alertas", "Log-based metric + alerting policy"], ["Un sink a BigQuery", "A sink to BigQuery"], ["Cloud Trace", "Cloud Trace"]]
    answer: 0
    why: ["La métrica cuenta las líneas y la alerta vigila la métrica.", "The metric counts lines and the alert watches the metric."]
  - q: ["Auditoría pide conservar registros 7 años al menor coste.", "Audit asks to keep logs 7 years at minimum cost."]
    options: [["Sink a un bucket de Cloud Storage en Archive", "Sink to a Cloud Storage bucket in Archive"], ["Dejar la retención por defecto", "Keep default retention"], ["Exportar a mano cada mes", "Export by hand monthly"]]
    answer: 0
    why: ["Archive es la clase más barata para datos que casi no se leen.", "Archive is the cheapest class for rarely read data."]
  - q: ["Una petición tarda 4 s y atraviesa 6 microservicios. ¿Cuál es el lento?", "A request takes 4 s across 6 microservices. Which one is slow?"]
    options: [["Cloud Trace", "Cloud Trace"], ["Error Reporting", "Error Reporting"], ["Cloud Logging", "Cloud Logging"]]
    answer: 0
    why: ["La traza distribuida muestra el tiempo de cada salto.", "Distributed tracing shows the time of each hop."]
  - q: ["La web cae tras un despliegue. ¿Primer paso?", "The website goes down after a deploy. First step?"]
    options: [["Revertir a la versión anterior", "Roll back to the previous version"], ["Encontrar la línea culpable", "Find the guilty line"], ["Escribir el postmortem", "Write the postmortem"]]
    answer: 0
    why: ["Mitigar primero; la causa raíz después.", "Mitigate first; root cause later."]
quiz:
  - q: ["¿Qué necesitas para ver la memoria usada dentro de una VM?", "What do you need to see memory used inside a VM?"]
    options: [["El Agente de operaciones", "The Ops Agent"], ["Nada, sale por defecto", "Nothing, it's default"], ["Cloud Trace", "Cloud Trace"]]
    answer: 0
    why: ["Las métricas del hipervisor no ven la memoria del SO invitado.", "Hypervisor metrics cannot see guest OS memory."]
  - q: ["Un SLO del 99,9 % mensual permite aproximadamente…", "A 99.9% monthly SLO allows approximately…"]
    options: [["43 minutos de fallo", "43 minutes of failure"], ["4 horas", "4 hours"], ["4 minutos", "4 minutes"]]
    answer: 0
    why: ["0,1 % de 30 días ≈ 43,2 minutos.", "0.1% of 30 days ≈ 43.2 minutes."]
  - q: ["¿A dónde NO puede exportar un sink de registros?", "Where can a log sink NOT export to?"]
    options: [["Cloud SQL", "Cloud SQL"], ["BigQuery", "BigQuery"], ["Pub/Sub", "Pub/Sub"], ["Cloud Storage", "Cloud Storage"]]
    answer: 0
    why: ["Destinos: Cloud Storage, BigQuery, Pub/Sub, buckets de logs y otros proyectos.", "Destinations: Cloud Storage, BigQuery, Pub/Sub, log buckets and other projects."]
  - q: ["¿Qué caracteriza un postmortem bien hecho?", "What makes a good postmortem?"]
    options: [["Sin culpas y con acciones concretas", "Blameless with concrete actions"], ["Identifica al culpable", "Identifies the culprit"], ["Solo lo lee el equipo afectado", "Only the affected team reads it"]]
    answer: 0
    why: ["Se centra en mejorar el sistema.", "It focuses on improving the system."]
  - q: ["¿Qué herramienta agrupa excepciones iguales de la aplicación?", "Which tool groups identical application exceptions?"]
    options: [["Error Reporting", "Error Reporting"], ["Cloud Profiler", "Cloud Profiler"], ["Uptime checks", "Uptime checks"]]
    answer: 0
    why: ["Error Reporting deduplica y avisa de errores nuevos.", "Error Reporting deduplicates and flags new errors."]

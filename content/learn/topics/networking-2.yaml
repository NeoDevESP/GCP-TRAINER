id: networking
concepts:
  - id: routes
    term: [Rutas y Cloud Router, Routes and Cloud Router]
    what: ["Las rutas deciden el siguiente salto del tráfico; Cloud Router las intercambia por BGP.", "Routes decide the next hop for traffic; Cloud Router exchanges them over BGP."]
    points:
      - ["Rutas de subred automáticas; ruta por defecto 0.0.0.0/0 hacia la pasarela de internet.", "Automatic subnet routes; default route 0.0.0.0/0 to the internet gateway."]
      - ["Rutas estáticas con prioridad y etiquetas; rutas dinámicas aprendidas por BGP.", "Static routes with priority and tags; dynamic routes learned via BGP."]
      - ["Modo de enrutamiento dinámico regional o global: con global, todas las regiones aprenden las rutas híbridas.", "Dynamic routing mode regional or global: with global, every region learns hybrid routes."]
    tip: ["VMs de otra región no llegan a la oficina por VPN → cambiar el modo de enrutamiento dinámico a global.", "VMs in another region can't reach the office over VPN → switch dynamic routing mode to global."]
  - id: psc
    term: [Private Service Connect y acceso a servicios privados, Private Service Connect and private services access]
    what: ["Formas de llegar a servicios gestionados por IP privada.", "Ways to reach managed services over private IPs."]
    points:
      - ["Private services access: peering con la red de Google para Cloud SQL, Memorystore, etc. (reserva un rango).", "Private services access: peering with Google's network for Cloud SQL, Memorystore, etc. (reserve a range)."]
      - ["Private Service Connect: un endpoint con IP de tu VPC hacia APIs de Google o servicios de otros productores.", "Private Service Connect: an endpoint with an IP in your VPC to Google APIs or other producers' services."]
      - ["Private Google Access: VMs sin IP pública llegan a las APIs de Google.", "Private Google Access: VMs without public IPs reach Google APIs."]
    tip: ["Consumir un servicio de otra empresa sin peering ni solapes de IP → Private Service Connect.", "Consume another company's service without peering or IP overlap → Private Service Connect."]
  - id: flow
    term: [Registros y diagnóstico de red, Network logs and diagnostics]
    what: ["VPC Flow Logs, Firewall Rules Logging y Network Intelligence Center.", "VPC Flow Logs, Firewall Rules Logging and Network Intelligence Center."]
    points:
      - ["VPC Flow Logs muestrean los flujos por subred: análisis de tráfico, seguridad y coste.", "VPC Flow Logs sample flows per subnet: traffic, security and cost analysis."]
      - ["Firewall Rules Logging registra qué regla permitió o bloqueó una conexión.", "Firewall Rules Logging records which rule allowed or blocked a connection."]
      - ["Connectivity Tests simula el camino entre dos puntos y dice dónde se corta.", "Connectivity Tests simulates the path between two endpoints and says where it breaks."]
    tip: ["«¿Por qué A no llega a B?» sin tocar nada → Connectivity Tests.", "\"Why can't A reach B?\" without changing anything → Connectivity Tests."]
  - id: tiers
    term: [Niveles de red, Network service tiers]
    what: ["Premium usa la red global de Google; Standard sale a internet cuanto antes y es más barato.", "Premium uses Google's global network; Standard exits to the internet sooner and is cheaper."]
    points:
      - ["El balanceador global de aplicaciones requiere nivel Premium.", "The global Application Load Balancer requires Premium tier."]
      - ["Standard solo ofrece recursos regionales.", "Standard only offers regional resources."]
    tip: ["Reducir coste de salida aceptando más latencia y solo una región → nivel Standard.", "Cut egress cost accepting more latency and a single region → Standard tier."]
  - id: fwpolicy
    term: [Políticas de cortafuegos jerárquicas, Hierarchical firewall policies]
    what: ["Reglas definidas en la organización o carpetas que se aplican antes que las de la VPC.", "Rules defined at organization or folder level, evaluated before VPC rules."]
    points:
      - ["Acciones allow, deny o goto_next (delegar a niveles inferiores).", "Actions allow, deny or goto_next (delegate to lower levels)."]
      - ["Políticas de red globales y regionales permiten usar tags seguros de IAM.", "Global and regional network policies can use IAM-governed secure tags."]
    tip: ["«Bloquear en toda la organización el acceso desde un rango, sin que nadie lo pueda saltar» → política jerárquica en la organización.", "\"Block a range across the organization so nobody can override\" → hierarchical policy at the org."]
  - id: ipplan
    term: [Planificación de direcciones IP, IP address planning]
    what: ["Elegir rangos RFC 1918 sin solapes y con espacio para crecer, incluidos los de GKE.", "Choose non-overlapping RFC 1918 ranges with room to grow, including GKE's."]
    points:
      - ["Una /24 da 252 IPs utilizables en Google Cloud (4 reservadas por subred).", "A /24 gives 252 usable IPs in Google Cloud (4 reserved per subnet)."]
      - ["GKE nativo de VPC usa rangos secundarios para pods y servicios.", "VPC-native GKE uses secondary ranges for pods and services."]
      - ["IP externas estáticas para mantener la misma IP al recrear un recurso.", "Static external IPs keep the same IP when a resource is recreated."]
    tip: ["¿Cuántas IPs utilizables tiene una subred /28? → 16 − 4 = 12.", "How many usable IPs in a /28 subnet? → 16 − 4 = 12."]
scenarios:
  - q: ["Un clúster GKE privado necesita descargar imágenes de un registro público de internet.", "A private GKE cluster must pull images from a public internet registry."]
    options: [["Cloud NAT en la región del clúster", "Cloud NAT in the cluster's region"], ["IP pública en cada nodo", "A public IP on every node"], ["Peering con el registro", "Peering with the registry"]]
    answer: 0
    why: ["Los nodos privados salen a internet a través de Cloud NAT.", "Private nodes reach the internet through Cloud NAT."]
  - q: ["Tras crear HA VPN con BGP, solo las VMs de us-central1 llegan a la oficina; las de europe-west1 no.", "After setting up HA VPN with BGP, only us-central1 VMs reach the office; europe-west1 VMs don't."]
    options: [["Poner el enrutamiento dinámico de la VPC en modo global", "Set the VPC dynamic routing mode to global"], ["Crear otra VPN en Europa obligatoriamente", "A second VPN in Europe is mandatory"], ["Abrir el cortafuegos a 0.0.0.0/0", "Open the firewall to 0.0.0.0/0"]]
    answer: 0
    why: ["En modo regional, las rutas aprendidas solo valen en la región del Cloud Router.", "In regional mode learned routes only apply in the Cloud Router's region."]
  - q: ["Una app no conecta con Cloud SQL por IP privada y quieres saber exactamente dónde falla sin cambiar nada.", "An app can't reach Cloud SQL over private IP and you want to know exactly where it breaks without changing anything."]
    options: [["Connectivity Tests", "Connectivity Tests"], ["Reiniciar la instancia", "Restart the instance"], ["Abrir todos los puertos", "Open every port"]]
    answer: 0
    why: ["Analiza rutas, cortafuegos y peering y señala el punto de bloqueo.", "It analyses routes, firewalls and peering and pinpoints the block."]
  - q: ["El equipo de seguridad quiere impedir SSH desde internet en todos los proyectos, sin que los equipos puedan anularlo.", "Security wants to block SSH from the internet in every project without teams being able to override it."]
    options: [["Política de cortafuegos jerárquica con deny en la organización", "Hierarchical firewall policy with deny at the organization"], ["Pedir a cada equipo que borre sus reglas", "Ask each team to delete their rules"], ["Una regla en cada VPC con prioridad 0", "A priority-0 rule in each VPC"]]
    answer: 0
    why: ["Las políticas jerárquicas se evalúan antes y los proyectos no pueden cambiarlas.", "Hierarchical policies are evaluated first and projects cannot change them."]
  - q: ["Una empresa ofrece su API a clientes en otras VPC y organizaciones, con rangos de IP que se solapan.", "A company offers its API to customers in other VPCs and orgs whose IP ranges overlap."]
    options: [["Publicarla con Private Service Connect", "Publish it with Private Service Connect"], ["Peering con cada cliente", "Peering with each customer"], ["IP pública sin cortafuegos", "Public IP without firewall"]]
    answer: 0
    why: ["PSC no requiere rangos únicos: cada consumidor usa una IP de su propia VPC.", "PSC needs no unique ranges: each consumer uses an IP from its own VPC."]
  - q: ["Tienes una VPN de 3 Gbps saturada y necesitas 20 Gbps estables hacia tu centro de datos, que está en la misma instalación de colocación que Google.", "Your 3 Gbps VPN is saturated and you need a stable 20 Gbps to your datacenter, which sits in the same colocation facility as Google."]
    options: [["Dedicated Interconnect (2×10 Gbps)", "Dedicated Interconnect (2×10 Gbps)"], ["Más túneles VPN clásicos", "More Classic VPN tunnels"], ["Nivel de red Standard", "Standard network tier"]]
    answer: 0
    why: ["Interconnect da ancho de banda alto y estable sin pasar por internet.", "Interconnect gives high, stable bandwidth without the internet."]
quiz:
  - q: ["¿Cuántas direcciones IP reserva Google Cloud en cada subred?", "How many IP addresses does Google Cloud reserve in each subnet?"]
    options: [["4", "4"], ["2", "2"], ["5", "5"], ["0", "0"]]
    answer: 0
    why: ["Red, pasarela, penúltima (reservada) y difusión.", "Network, gateway, second-to-last (reserved) and broadcast."]
  - q: ["¿Qué nivel de red requiere el balanceador de aplicaciones externo global?", "Which network tier does the global external Application Load Balancer need?"]
    options: [["Premium", "Premium"], ["Standard", "Standard"], ["Cualquiera", "Either"]]
    answer: 0
    why: ["Los recursos globales anycast solo existen en Premium.", "Global anycast resources only exist in Premium."]
  - q: ["¿Qué permite a una VM sin IP externa llamar a la API de Cloud Storage?", "What lets a VM without an external IP call the Cloud Storage API?"]
    options: [["Private Google Access en la subred", "Private Google Access on the subnet"], ["Cloud Armor", "Cloud Armor"], ["Una ruta estática a 0.0.0.0/0 sin pasarela", "A static route to 0.0.0.0/0 without a gateway"]]
    answer: 0
    why: ["Se activa por subred y no requiere NAT para las APIs de Google.", "It is enabled per subnet and needs no NAT for Google APIs."]
  - q: ["¿Qué muestran los VPC Flow Logs?", "What do VPC Flow Logs show?"]
    options: [["Muestras de flujos de red enviados y recibidos por las VMs", "Samples of network flows sent and received by VMs"], ["El contenido de los paquetes", "Packet contents"], ["Los cambios de IAM", "IAM changes"]]
    answer: 0
    why: ["Registran metadatos del flujo (IPs, puertos, bytes), no el contenido.", "They record flow metadata (IPs, ports, bytes), not content."]
  - q: ["¿Qué dos elementos componen HA VPN con SLA 99,99 %? (Elige 2)", "Which two elements make up HA VPN with a 99.99% SLA? (Choose 2)"]
    options: [["Dos túneles en las dos interfaces de la pasarela", "Two tunnels on the gateway's two interfaces"], ["Cloud Router con BGP", "Cloud Router with BGP"], ["Rutas estáticas únicamente", "Static routes only"], ["Un único túnel", "A single tunnel"]]
    answers: [0, 1]
    why: ["HA VPN exige enrutamiento dinámico y dos túneles para el SLA.", "HA VPN requires dynamic routing and two tunnels for the SLA."]
  - q: ["¿Qué balanceador usarías para tráfico TCP interno entre la capa web y la de base de datos?", "Which load balancer would you use for internal TCP traffic between the web and database tiers?"]
    options: [["Balanceador de red interno de paso directo", "Internal passthrough Network Load Balancer"], ["Balanceador de aplicaciones externo global", "Global external Application Load Balancer"], ["Cloud CDN", "Cloud CDN"]]
    answer: 0
    why: ["Tráfico privado de capa 4 dentro de la VPC.", "Private layer-4 traffic inside the VPC."]
  - q: ["¿Qué servicio cachea contenido en el borde de la red de Google para servirlo más rápido?", "Which service caches content at Google's edge to serve it faster?"]
    options: [["Cloud CDN", "Cloud CDN"], ["Cloud NAT", "Cloud NAT"], ["Cloud DNS", "Cloud DNS"]]
    answer: 0
    why: ["Cloud CDN funciona con el balanceador de aplicaciones externo.", "Cloud CDN works with the external Application Load Balancer."]
  - q: ["Una regla de cortafuegos permite el puerto 80 con target tag «web», pero la VM sigue sin recibir tráfico. ¿Qué falta?", "A firewall rule allows port 80 with target tag \"web\" but the VM still gets no traffic. What's missing?"]
    options: [["Añadir la etiqueta de red «web» a la VM", "Add the \"web\" network tag to the VM"], ["Reiniciar la VPC", "Restart the VPC"], ["Cambiar al nivel Standard", "Switch to Standard tier"]]
    answer: 0
    why: ["La regla solo aplica a VMs con esa etiqueta.", "The rule only applies to VMs carrying that tag."]
  - q: ["¿Qué ofrece Partner Interconnect frente a Dedicated?", "What does Partner Interconnect offer compared to Dedicated?"]
    options: [["Conexión a través de un proveedor, desde 50 Mbps, sin estar en una instalación de colocación de Google", "Connection through a provider, from 50 Mbps, without being in a Google colocation facility"], ["Más de 100 Gbps por enlace", "More than 100 Gbps per link"], ["Cifrado automático por IPsec", "Automatic IPsec encryption"]]
    answer: 0
    why: ["Dedicated exige llegar físicamente a un punto de Google; Partner usa un proveedor.", "Dedicated requires physically reaching a Google point; Partner uses a provider."]

id: architecture
concepts:
  - id: casestudy
    term: [Cómo leer un caso de estudio, How to read a case study]
    what: ["El examen de arquitecto usa empresas ficticias con requisitos de negocio y técnicos.", "The architect exam uses fictional companies with business and technical requirements."]
    points:
      - ["Subraya los requisitos: plazos, presupuesto, cumplimiento, ubicaciones, SLA.", "Underline requirements: deadlines, budget, compliance, locations, SLAs."]
      - ["Descarta opciones que incumplan cualquier requisito, aunque sean técnicamente válidas.", "Discard options that break any requirement, even if technically valid."]
      - ["Entre dos opciones válidas, gana la más gestionada y barata.", "Between two valid options, the most managed and cheapest wins."]
    tip: ["Lee los casos de estudio oficiales antes del examen: vienen en la guía.", "Read the official case studies before the exam: they are in the guide."]
  - id: global
    term: [Aplicaciones globales, Global applications]
    what: ["Servir a usuarios de todo el mundo con baja latencia y alta disponibilidad.", "Serve users worldwide with low latency and high availability."]
    points:
      - ["Balanceador global + backends en varias regiones + Cloud CDN.", "Global load balancer + multi-region backends + Cloud CDN."]
      - ["Datos: Spanner multirregional, Firestore multirregional o réplicas de lectura regionales.", "Data: multi-region Spanner, multi-region Firestore or regional read replicas."]
      - ["Residencia de datos puede obligar a separar por regiones.", "Data residency may force separation by region."]
    tip: ["Latencia baja en tres continentes y una sola URL → balanceador global con backends en esas regiones.", "Low latency on three continents with one URL → global load balancer with backends in those regions."]
  - id: decouple
    term: [Desacoplar y diseñar para el fallo, Decoupling and designing for failure]
    what: ["Componentes independientes que fallan sin arrastrar al resto.", "Independent components that fail without taking down the rest."]
    points:
      - ["Colas (Pub/Sub, Cloud Tasks) entre productores y consumidores.", "Queues (Pub/Sub, Cloud Tasks) between producers and consumers."]
      - ["Cloud Tasks: entrega a un destino concreto con control de tasa; Pub/Sub: difusión a muchos suscriptores.", "Cloud Tasks: delivery to a specific target with rate control; Pub/Sub: fan-out to many subscribers."]
      - ["Idempotencia para que los reintentos no dupliquen efectos.", "Idempotency so retries don't duplicate effects."]
      - ["Microservicios sin estado; el estado en servicios gestionados.", "Stateless microservices; state in managed services."]
    tip: ["Llamar a una API externa con un límite de 10 peticiones por segundo → Cloud Tasks con limitación de tasa.", "Call an external API limited to 10 requests per second → Cloud Tasks with rate limiting."]
scenarios:
  - q: ["Caso: una empresa de videojuegos lanza un título mundial, espera picos enormes el día de lanzamiento y quiere clasificaciones globales en tiempo real.", "Case: a gaming company launches a worldwide title, expects huge launch-day spikes and wants real-time global leaderboards."]
    options: [["GKE regional con autoescalado detrás de un balanceador global, y Spanner multirregional para las clasificaciones", "Regional GKE with autoscaling behind a global load balancer, and multi-region Spanner for leaderboards"], ["MIG regional con autoescalado en una sola región y Cloud SQL con réplicas de lectura para las clasificaciones", "Regional MIG with autoscaling in one region and Cloud SQL with read replicas for the leaderboards"], ["Cloud Run en varias regiones y Firestore regional para las clasificaciones", "Cloud Run in several regions and regional Firestore for the leaderboards"], ["GKE Autopilot en una región y Memorystore como almacén principal de las clasificaciones", "GKE Autopilot in one region and Memorystore as the primary leaderboard store"]]
    answer: 0
    why: ["Escalado elástico, entrada global y datos consistentes a escala mundial.", "Elastic scaling, global entry and globally consistent data."]
  - q: ["Caso: una empresa sanitaria debe cumplir normativa de datos de salud, migrar desde colocación y mantener conexión segura con sus centros.", "Case: a healthcare company must meet health-data regulation, migrate from colocation and keep a secure link to its sites."]
    options: [["Landing zone con controles de cumplimiento, Interconnect o HA VPN, y cifrado con CMEK", "Landing zone with compliance controls, Interconnect or HA VPN, and CMEK encryption"], ["Landing zone estándar, conexión por Cloud VPN clásica y cifrado con claves gestionadas por Google", "Standard landing zone, Classic Cloud VPN link and Google-managed encryption keys"], ["Migrar con Transfer Appliance, exponer las apps con IP pública y controlar el acceso con reglas de cortafuegos", "Migrate with Transfer Appliance, expose apps with public IPs and control access with firewall rules"], ["Replicar los datos en un bucket multirregional y dar acceso a los centros mediante URLs firmadas", "Replicate data to a multi-region bucket and give sites access through signed URLs"]]
    answer: 0
    why: ["Cumplimiento, conectividad híbrida y control de claves.", "Compliance, hybrid connectivity and key control."]
  - q: ["Caso: un fabricante recibe telemetría de 20 millones de vehículos, quiere predecir averías y analizar históricos baratos.", "Case: a manufacturer receives telemetry from 20 million vehicles, wants to predict failures and analyse history cheaply."]
    options: [["Pub/Sub → Dataflow → Bigtable (reciente) y BigQuery (histórico), con Vertex AI para predicción", "Pub/Sub → Dataflow → Bigtable (recent) and BigQuery (history), with Vertex AI for prediction"], ["Pub/Sub → Cloud Run → Cloud SQL, con BigQuery ML sobre exportaciones nocturnas", "Pub/Sub → Cloud Run → Cloud SQL, with BigQuery ML on nightly exports"], ["IoT directo a Cloud Storage cada hora y Dataproc por lotes para predecir averías", "Devices write to Cloud Storage hourly and batch Dataproc predicts failures"], ["Pub/Sub → Dataflow → Firestore para todo el histórico, con AutoML para predicción", "Pub/Sub → Dataflow → Firestore for all history, with AutoML for prediction"]]
    answer: 0
    why: ["Ingesta masiva, acceso de baja latencia, analítica y ML.", "Massive ingest, low-latency access, analytics and ML."]
  - q: ["Una tienda debe enviar correos de confirmación sin saturar a su proveedor, que admite 20 por segundo.", "A shop must send confirmation emails without overwhelming its provider, which accepts 20 per second."]
    options: [["Cloud Tasks con tasa máxima de 20/s", "Cloud Tasks with a max rate of 20/s"], ["Pub/Sub con una suscripción push al servicio de correo", "Pub/Sub with a push subscription to the email service"], ["Cloud Scheduler que lance un envío cada segundo", "Cloud Scheduler triggering a send every second"], ["Cloud Run con concurrencia máxima de 20", "Cloud Run with a maximum concurrency of 20"]]
    answer: 0
    why: ["Cloud Tasks controla la tasa y reintenta.", "Cloud Tasks controls rate and retries."]
quiz:
  - q: ["¿Qué diferencia principal hay entre Cloud Tasks y Pub/Sub?", "What is the main difference between Cloud Tasks and Pub/Sub?"]
    options: [["Tasks entrega a un destino concreto con control de tasa; Pub/Sub difunde a suscriptores desacoplados", "Tasks delivers to a specific target with rate control; Pub/Sub fans out to decoupled subscribers"], ["Pub/Sub garantiza el orden global de todos los mensajes; Cloud Tasks no", "Pub/Sub guarantees global ordering of all messages; Cloud Tasks does not"], ["Cloud Tasks solo admite destinos en App Engine; Pub/Sub admite cualquier URL", "Cloud Tasks only supports App Engine targets; Pub/Sub supports any URL"], ["Pub/Sub permite programar la entrega en una hora concreta; Cloud Tasks no", "Pub/Sub lets you schedule delivery at a specific time; Cloud Tasks does not"]]
    answer: 0
    why: ["Invocación explícita frente a publicación implícita.", "Explicit invocation versus implicit publishing."]
  - q: ["Entre dos soluciones que cumplen todos los requisitos, ¿cuál suele ser la correcta en el examen?", "Between two solutions that meet every requirement, which is usually correct in the exam?"]
    options: [["La más gestionada y de menor coste operativo", "The most managed with lowest operational cost"], ["La que da más control sobre la infraestructura para futuras personalizaciones", "The one giving most infrastructure control for future customization"], ["La que combina más servicios para cubrir posibles requisitos futuros", "The one combining more services to cover possible future requirements"], ["La que reutiliza exactamente la arquitectura actual on-premises", "The one that reuses exactly the current on-premises architecture"]]
    answer: 0
    why: ["Google favorece servicios gestionados y simplicidad.", "Google favours managed services and simplicity."]
  - q: ["¿Qué dos cosas protegen frente a la caída de una región entera? (Elige 2)", "Which two things protect against an entire region failing? (Choose 2)"]
    options: [["Backends en varias regiones tras un balanceador global", "Backends in several regions behind a global load balancer"], ["Base de datos multirregional o réplica en otra región", "Multi-region database or replica in another region"], ["MIG zonal", "Zonal MIG"], ["Discos SSD locales", "Local SSDs"]]
    answers: [0, 1]
    why: ["Cómputo y datos deben existir fuera de la región afectada.", "Compute and data must exist outside the affected region."]
  - q: ["¿Qué hace que los reintentos no provoquen cobros duplicados?", "What stops retries from causing duplicate charges?"]
    options: [["Operaciones idempotentes con clave de idempotencia", "Idempotent operations with an idempotency key"], ["Aumentar el tiempo de espera entre reintentos", "Increasing the delay between retries"], ["Usar transacciones distribuidas en todos los servicios", "Using distributed transactions in every service"], ["Limitar los reintentos a uno solo", "Limiting retries to a single one"]]
    answer: 0
    why: ["Repetir la misma operación produce el mismo resultado.", "Repeating the same operation gives the same result."]

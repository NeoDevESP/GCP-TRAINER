id: security
name: [Seguridad, Security]
intro: ["Proteger datos y cargas: secretos, cifrado, perímetros, protección web, detección de amenazas y respuesta a incidentes.", "Protecting data and workloads: secrets, encryption, perimeters, web protection, threat detection and incident response."]
concepts:
  - id: secrets
    term: [Secret Manager, Secret Manager]
    what: ["Guarda contraseñas y claves con versiones, IAM y auditoría.", "Stores passwords and keys with versions, IAM and audit."]
    points:
      - ["Nunca pongas secretos en el código, imágenes ni variables de entorno en claro.", "Never put secrets in code, images or plain environment variables."]
      - ["roles/secretmanager.secretAccessor permite leer el valor.", "roles/secretmanager.secretAccessor allows reading the value."]
      - ["Cloud Run y GKE pueden montar secretos directamente.", "Cloud Run and GKE can mount secrets directly."]
    tip: ["«Guardar la contraseña de la base de datos de forma segura» → Secret Manager.", "\"Store the database password securely\" → Secret Manager."]
  - id: kms
    term: [Cifrado y Cloud KMS, Encryption and Cloud KMS]
    what: ["Todo se cifra por defecto; con CMEK controlas tú la clave en Cloud KMS.", "Everything is encrypted by default; with CMEK you control the key in Cloud KMS."]
    points:
      - ["Cifrado por defecto: claves gestionadas por Google.", "Default encryption: Google-managed keys."]
      - ["CMEK: la clave está en tu Cloud KMS; puedes rotarla o desactivarla.", "CMEK: the key lives in your Cloud KMS; you can rotate or disable it."]
      - ["CSEK: tú aportas la clave en cada petición (Storage y Compute).", "CSEK: you supply the key on each request (Storage and Compute)."]
      - ["Cloud HSM: claves en hardware certificado FIPS 140-2 nivel 3.", "Cloud HSM: keys in FIPS 140-2 level 3 certified hardware."]
    tip: ["«La empresa debe poder revocar el acceso a sus datos cifrados» → CMEK.", "\"The company must be able to revoke access to its encrypted data\" → CMEK."]
  - id: vpcsc
    term: [VPC Service Controls, VPC Service Controls]
    what: ["Perímetro alrededor de servicios gestionados para evitar la exfiltración de datos.", "A perimeter around managed services to prevent data exfiltration."]
    points:
      - ["Impide copiar datos de un bucket o BigQuery del perímetro a un proyecto de fuera, aunque tengas IAM.", "Prevents copying data from an in-perimeter bucket or BigQuery to an outside project, even with IAM."]
      - ["Complementa a IAM: IAM es la identidad, el perímetro es el contexto.", "Complements IAM: IAM is identity, the perimeter is context."]
    tip: ["«Evitar exfiltración aunque se roben credenciales» → VPC Service Controls.", "\"Prevent exfiltration even if credentials are stolen\" → VPC Service Controls."]
  - id: armor
    term: [Cloud Armor, Cloud Armor]
    what: ["WAF y protección DDoS delante del balanceador de aplicaciones externo.", "WAF and DDoS protection in front of the external Application Load Balancer."]
    points:
      - ["Reglas por IP, geografía o reglas WAF preconfiguradas (SQLi, XSS).", "Rules by IP, geography or preconfigured WAF rules (SQLi, XSS)."]
      - ["Limitación de tasa (rate limiting) contra abusos.", "Rate limiting against abuse."]
    tip: ["Bloquear inyección SQL o un país en una web pública → Cloud Armor.", "Blocking SQL injection or a country on a public site → Cloud Armor."]
  - id: scc
    term: [Security Command Center, Security Command Center]
    what: ["Panel central de vulnerabilidades, malas configuraciones y amenazas.", "Central panel of vulnerabilities, misconfigurations and threats."]
    points:
      - ["Detecta buckets públicos, puertos abiertos, claves antiguas, etc.", "Detects public buckets, open ports, old keys, etc."]
      - ["Respuesta a incidentes: contener, erradicar, recuperar y documentar.", "Incident response: contain, eradicate, recover and document."]
    tip: ["«Vista centralizada de riesgos de seguridad de la organización» → Security Command Center.", "\"Centralized view of the organization's security risks\" → Security Command Center."]
  - id: iap
    term: [Identity-Aware Proxy (IAP), Identity-Aware Proxy (IAP)]
    what: ["Acceso a apps y VMs según la identidad del usuario, sin VPN.", "Access to apps and VMs based on user identity, without a VPN."]
    points:
      - ["Protege apps web detrás de un balanceador con login de Google.", "Protects web apps behind a load balancer with Google sign-in."]
      - ["El reenvío TCP de IAP permite SSH/RDP a VMs sin IP pública.", "IAP TCP forwarding allows SSH/RDP to VMs without public IPs."]
    tip: ["«Empleados acceden a una app interna sin VPN» → IAP (modelo de confianza cero).", "\"Employees access an internal app without VPN\" → IAP (zero trust)."]
scenarios:
  - q: ["Una app usa una clave de API de pago que ahora está en una variable de entorno visible.", "An app uses a payment API key currently in a visible environment variable."]
    options: [["Rotarla y guardarla en Secret Manager", "Rotate it and store it in Secret Manager"], ["Moverla a Secret Manager sin rotarla", "Move it to Secret Manager without rotating it"], ["Cifrarla con Cloud KMS y dejarla en la variable", "Encrypt it with Cloud KMS and keep it in the variable"], ["Restringir quién puede ver la configuración del servicio", "Restrict who can view the service configuration"]]
    answer: 0
    why: ["Ya está expuesta: se rota, y la nueva vive en Secret Manager.", "It is already exposed: rotate it and keep the new one in Secret Manager."]
  - q: ["Una web pública recibe ataques de inyección SQL.", "A public website is receiving SQL injection attacks."]
    options: [["Cloud Armor con reglas WAF", "Cloud Armor with WAF rules"], ["VPC Service Controls", "VPC Service Controls"], ["Identity-Aware Proxy", "Identity-Aware Proxy"], ["Reglas de cortafuegos de la VPC", "VPC firewall rules"]]
    answer: 0
    why: ["Cloud Armor filtra patrones de ataque web en el balanceador.", "Cloud Armor filters web attack patterns at the load balancer."]
  - q: ["Un banco teme que alguien con acceso copie datos de BigQuery a un proyecto personal.", "A bank fears someone with access copies BigQuery data to a personal project."]
    options: [["VPC Service Controls", "VPC Service Controls"], ["CMEK con Cloud KMS", "CMEK with Cloud KMS"], ["Quitar el rol BigQuery Data Viewer", "Remove the BigQuery Data Viewer role"], ["Sensitive Data Protection", "Sensitive Data Protection"]]
    answer: 0
    why: ["El perímetro bloquea mover datos fuera, aunque IAM lo permita.", "The perimeter blocks moving data out, even if IAM allows it."]
  - q: ["Hay que poder «apagar» el acceso a los datos de un bucket en caso de brecha.", "You must be able to \"switch off\" access to a bucket's data after a breach."]
    options: [["CMEK: desactivar la clave en Cloud KMS", "CMEK: disable the key in Cloud KMS"], ["Activar el versionado del bucket", "Enable bucket versioning"], ["Cambiar a CSEK", "Switch to CSEK"], ["Una política de retención bloqueada", "A locked retention policy"]]
    answer: 0
    why: ["Sin la clave, los datos cifrados son ilegibles.", "Without the key the encrypted data is unreadable."]
quiz:
  - q: ["¿Los datos en Google Cloud están cifrados si no haces nada?", "Is data in Google Cloud encrypted if you do nothing?"]
    options: [["Sí, siempre en reposo con claves de Google", "Yes, always at rest with Google keys"], ["Solo si activas CMEK", "Only if you enable CMEK"], ["Solo en tránsito, no en reposo", "Only in transit, not at rest"], ["Solo en Cloud Storage y BigQuery", "Only in Cloud Storage and BigQuery"]]
    answer: 0
    why: ["El cifrado en reposo es por defecto; CMEK añade control.", "Encryption at rest is by default; CMEK adds control."]
  - q: ["¿Quién necesita el rol Encrypter/Decrypter para que Cloud Storage use tu CMEK?", "Who needs Encrypter/Decrypter for Cloud Storage to use your CMEK?"]
    options: [["El agente de servicio de Cloud Storage", "The Cloud Storage service agent"], ["Cada usuario que lee los objetos", "Each user reading the objects"], ["La cuenta de servicio predeterminada de Compute Engine", "The Compute Engine default service account"], ["El administrador del bucket", "The bucket administrator"]]
    answer: 0
    why: ["El servicio cifra en tu nombre con su agente de servicio.", "The service encrypts on your behalf with its service agent."]
  - q: ["¿Qué rol permite leer el valor de un secreto?", "Which role allows reading a secret's value?"]
    options: [["Secret Manager Secret Accessor", "Secret Manager Secret Accessor"], ["Secret Manager Viewer", "Secret Manager Viewer"], ["Secret Manager Secret Version Manager", "Secret Manager Secret Version Manager"], ["Cloud KMS CryptoKey Decrypter", "Cloud KMS CryptoKey Decrypter"]]
    answer: 0
    why: ["Viewer ve metadatos; Accessor lee el valor.", "Viewer sees metadata; Accessor reads the value."]
  - q: ["¿Primer paso ante un bucket con backups expuesto públicamente?", "First step with a publicly exposed backup bucket?"]
    options: [["Contener: quitar allUsers", "Contain: remove allUsers"], ["Revisar los registros de acceso para ver si alguien descargó", "Review access logs to see if anyone downloaded"], ["Activar el versionado del bucket", "Enable bucket versioning"], ["Mover los backups a la clase Archive", "Move the backups to the Archive class"]]
    answer: 0
    why: ["Primero se contiene; después se previene, investiga y documenta.", "First contain; then prevent, investigate and document."]
  - q: ["¿Qué ofrece IAP frente a una VPN?", "What does IAP offer compared to a VPN?"]
    options: [["Acceso por identidad a cada app, sin abrir la red", "Per-app identity-based access without opening the network"], ["Túneles cifrados con IPsec entre sedes", "IPsec encrypted tunnels between sites"], ["Más ancho de banda hacia la VPC", "More bandwidth into the VPC"], ["Protección DDoS en capa 3 y 4", "Layer 3 and 4 DDoS protection"]]
    answer: 0
    why: ["IAP decide por usuario y aplicación (confianza cero).", "IAP decides per user and application (zero trust)."]

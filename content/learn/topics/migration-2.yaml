  - q: ["¿En qué orden conviene migrar las cargas? (Elige 2)", "In which order should workloads be migrated? (Choose 2)"]
    options: [["Primero cargas sencillas y poco críticas para aprender", "First simple, low-criticality workloads to learn"], ["Por oleadas agrupando dependencias", "In waves grouping dependencies"], ["Todo a la vez el mismo fin de semana", "Everything at once the same weekend"], ["Lo más crítico primero sin pruebas", "Most critical first without testing"]]

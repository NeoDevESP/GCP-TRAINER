  - q: ["¿Qué es un corte (cutover) en una migración de base de datos?", "What is a cutover in a database migration?"]
    options: [["El momento en que la aplicación pasa a usar la base de destino", "The moment the application switches to the target database"], ["Borrar la base de origen", "Deleting the source database"], ["Una copia de seguridad", "A backup"]]
    answer: 0
    why: ["Con replicación continua el corte dura muy poco.", "With continuous replication the cutover is very short."]

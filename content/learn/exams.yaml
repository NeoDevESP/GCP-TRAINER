        objectives:
          - ["Cloud Identity, federación e inicio de sesión único", "Cloud Identity, federation and single sign-on"]
          - ["Cuentas de servicio, Workload Identity Federation", "Service accounts, Workload Identity Federation"]
          - ["Autorización con IAM, condiciones y políticas de denegación", "Authorization with IAM, conditions and deny policies"]
          - ["Jerarquía de recursos y políticas de organización", "Resource hierarchy and organization policies"]
      - name: [Proteger las comunicaciones y los perímetros, Securing communications and establishing boundary protection]
        weight: 21
        topics: [networking, security]
        objectives:
          - ["Cortafuegos, Cloud Armor, IAP y balanceadores", "Firewalls, Cloud Armor, IAP and load balancers"]
          - ["VPC Service Controls y acceso privado", "VPC Service Controls and private access"]
          - ["Conectividad híbrida segura", "Secure hybrid connectivity"]
      - name: [Garantizar la protección de los datos, Ensuring data protection]
        weight: 20
        topics: [security, storage]
        objectives:
          - ["Datos sensibles con Sensitive Data Protection (DLP)", "Sensitive data with Sensitive Data Protection (DLP)"]
          - ["Cifrado con Cloud KMS, CMEK, EKM y HSM", "Encryption with Cloud KMS, CMEK, EKM and HSM"]
          - ["Secret Manager y protección de la IA", "Secret Manager and securing AI workloads"]
      - name: [Gestionar las operaciones, Managing operations]
        weight: 22
        topics: [security, observability, devops]
        objectives:
          - ["Seguridad de la infraestructura y la cadena de suministro", "Infrastructure and supply-chain security"]
          - ["Registro, supervisión y detección con Security Command Center", "Logging, monitoring and detection with Security Command Center"]
          - ["Respuesta a incidentes de seguridad", "Security incident response"]
      - name: [Cumplir requisitos normativos, Supporting compliance requirements]
        weight: 10
        topics: [security, architecture]
        objectives:
          - ["Responsabilidad compartida, residencia de datos y Assured Workloads", "Shared responsibility, data residency and Assured Workloads"]
  - cert: PCNE
    minutes: 120
    questions: "50-60"
    fee: "200 USD"
    validity: [2 años, 2 years]
    experience: ["3 años o más en la industria, incluido 1 año en Google Cloud", "3+ years of industry experience including 1+ year on Google Cloud"]
    format: ["Opción única y múltiple, con mucho cálculo de rangos, rutas y conectividad híbrida.", "Multiple choice and multiple select, with lots of range planning, routing and hybrid connectivity."]
    domains:
      - name: [Diseñar y planificar una red de Google Cloud, "Designing, planning, and prototyping a Google Cloud network"]
        weight: 26
        topics: [networking, architecture]
        objectives:
          - ["Diseñar la red global: alta disponibilidad, DNS, balanceo", "Design the overall network: availability, DNS, load balancing"]
          - ["Planificar direccionamiento IP y VPC compartida", "Plan IP addressing and Shared VPC"]
          - ["Diseñar la conectividad híbrida y para GKE", "Design hybrid and GKE connectivity"]
      - name: [Implementar redes VPC, Implementing Virtual Private Cloud (VPC) instances]
        weight: 21
        topics: [networking, gke]
        objectives:
          - ["Subredes, rutas, cortafuegos y peering", "Subnets, routes, firewalls and peering"]
          - ["VPC compartida y Private Service Connect", "Shared VPC and Private Service Connect"]
          - ["Redes de GKE: VPC nativa, clústeres privados", "GKE networking: VPC-native, private clusters"]
      - name: [Configurar servicios de red gestionados, Configuring managed network services]
        weight: 21
        topics: [networking, security]
        objectives:
          - ["Balanceadores, Cloud CDN y Cloud Armor", "Load balancers, Cloud CDN and Cloud Armor"]
          - ["Cloud DNS y Cloud NAT", "Cloud DNS and Cloud NAT"]
      - name: [Implementar conectividad híbrida, Implementing hybrid network interconnectivity]
        weight: 14
        topics: [networking]
        objectives:
          - ["Cloud Interconnect y HA VPN", "Cloud Interconnect and HA VPN"]
          - ["Cloud Router y BGP", "Cloud Router and BGP"]
      - name: ["Operar, supervisar y optimizar la red", "Managing, monitoring, and optimizing network operations"]
        weight: 18
        topics: [networking, observability]
        objectives:
          - ["Registros de flujo, Connectivity Tests y Network Intelligence Center", "Flow logs, Connectivity Tests and Network Intelligence Center"]
          - ["Diagnosticar y optimizar coste y rendimiento de red", "Troubleshoot and optimize network cost and performance"]
  - cert: PDE

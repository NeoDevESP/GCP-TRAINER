      title: ConfigMap deleted by a cleanup job
      summary: The shop page fails after the nightly cleanup; new catalog pods do not start.
      sample: cleanup-job deleted the catalog-config ConfigMap, so catalog pods failed with CreateContainerConfigError and the shop lost its backend; the ConfigMap was recreated with CATALOG_REGION and PAGE_SIZE.
      hints:
        - '`kubectl describe pod -l app=catalog` — what is the container waiting for?'
      dangerous:
        - removing envFrom from the deployment
        - recreating the cluster
      fixes:
        - recreate catalog-config with CATALOG_REGION and PAGE_SIZE
      text:
        catalog lee CATALOG_REGION (nuestra región) y PAGE_SIZE=50 del ConfigMap catalog-config.: catalog reads CATALOG_REGION (our region) and PAGE_SIZE=50 from the catalog-config ConfigMap.
        catalog vuelve a tener 2 réplicas listas: catalog back to 2 ready replicas

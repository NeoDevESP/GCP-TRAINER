    symptom: http-500
    layer: configuration
    skills: [gke.workloads, gke.troubleshooting]
    summary: "La página de la tienda falla tras la limpieza nocturna; los nuevos pods de catalog no arrancan."
    conflicts: [gk.bad-image, gk.selector, gk.netpol]
    faults:
      - type: command
        actor: "cleanup-job@{{.project}}.iam.gserviceaccount.com"
        run: |
          gcloud container clusters get-credentials shop-gke --zone={{.zone}}
          kubectl delete configmap catalog-config
    facts:
      developer: [{keywords: [[config, configmap, region, page, setting]], answer: "catalog lee CATALOG_REGION (nuestra región) y PAGE_SIZE=50 del ConfigMap catalog-config."}]
    hints:
      - text: "`kubectl describe pod -l app=catalog`: ¿a qué está esperando el contenedor?"
    evidence:
      commands: "kubectl (describe|get pods|get events|get configmap|get cm)"
      rootCause: [[configmap, config map, catalog-config], [deleted, borrad, missing, not found, cleanup]]
      sample: "cleanup-job borró el ConfigMap catalog-config, así que los pods de catalog fallaban con CreateContainerConfigError y la tienda se quedó sin backend; se recreó el ConfigMap con CATALOG_REGION y PAGE_SIZE."
    dangerous: ["quitar envFrom del deployment", "recrear el clúster"]
    fixes: ["recrear catalog-config con CATALOG_REGION y PAGE_SIZE"]

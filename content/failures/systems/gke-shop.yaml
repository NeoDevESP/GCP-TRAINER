      gcloud container clusters get-credentials shop-gke --zone={{.zone}}
      kubectl get pods -l app=catalog
      kubectl describe pod -l app=catalog
      kubectl create configmap catalog-config --from-literal=CATALOG_REGION={{.region}} --from-literal=PAGE_SIZE=50
      kubectl rollout restart deployment/catalog

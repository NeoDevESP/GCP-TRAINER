  title: storefront on GKE with Workload Identity
  topology: Internet → web (LoadBalancer) → catalog (ClusterIP, NetworkPolicy from web, ConfigMap) · Internet → reports (Workload Identity → gs://reports-*) · Internet → pdf (report-generator) · batch (data team)
  text:
    Kai (equipo de plataforma): Kai (platform team)

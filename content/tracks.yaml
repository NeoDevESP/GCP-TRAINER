# Learning paths. A track is an ordered list of labs aligned to a certification
# or a role. `reference` is the official Google learning path used by
# `labctl curriculum` for the quarterly sync. Phases follow the roadmap
# (MVP → V1 → V2 → V3).
tracks:
  - id: foundations
    title: 'Bases: TI, redes, herramientas, automatización y contenedores'
    description: 'La base del grafo de habilidades (Blueprint §4) antes del núcleo de GCP: modelos de cómputo, CIDR, salida estructurada y API, contenedores y scripting.'
    level: foundational
    certs: [ACE]
    phase: MVP
    labs: [fundamentals-f01-compute-models, netfund-n01-address-plan, devtools-t01-structured-output, containers-c01-hardened-image, automation-a01-nightly-sweep]
    en:
      title: Foundations — IT, networking, tooling, automation, containers
      description: The base of the skill graph (Blueprint §4) before GCP Core — compute models, CIDR, structured output and APIs, containers and scripting.
  - id: linux
    title: Linux para ingenieros cloud
    description: Discos, permisos, servicios y registros por SSH con IAP.
    level: foundational
    certs: [ACE]
    phase: MVP
    labs: [linux-l01-disk-full, linux-l02-permission-denied]
    en:
      title: Linux for cloud engineers
      description: Disks, permissions, services and logs over IAP SSH.
  - id: ace-30
    title: 'Associate Cloud Engineer: 30 días'
    description: Un laboratorio al día, desde el contexto y el IAM hasta los incidentes, el proyecto final y el jefe final. Construye las competencias de ACE trabajando con las manos.
    level: associate
    certs: [ACE]
    phase: MVP
    reference: https://cloud.google.com/learn/certification/cloud-engineer
    labs: [ace-d01-context, ace-d02-iam-storage-read, ace-d03-secure-bucket, ace-d04-web-vm, ace-d05-subnet-isolation, ace-d06-cloud-run, ace-d07-cloud-sql, ace-d08-logs-alert, ace-d09-health-check, ace-d10-checkpoint, ace-d11-app-403, ace-d12-private-egress, ace-d13-lb-dns, ace-d14-terraform, ace-d15-cloud-build, ace-d16-gke-two-services, ace-d17-gke-hpa, ace-d18-api-db-firewall, ace-d19-secret-env, ace-d20-sql-saturated, ace-d21-bigquery-cost, ace-d22-pubsub-ingestion, ace-d23-ml-endpoint, ace-d24-cmek, ace-d25-public-exposure, ace-d26-hybrid-design, ace-d27-deploy-rollback, ace-d28-architecture-review, ace-d29-capstone-orders, ace-d30-boss-incident]
    en:
      title: Associate Cloud Engineer — 30 days
      description: One lab per day from context and IAM to incidents, capstone and boss battle. Builds the ACE competences through hands-on work.
  - id: capstones
    title: Proyectos finales de carrera
    description: 'Un proyecto final por etapa profesional (Blueprint §22): junior, Cloud Engineer, DevOps, sénior (jefe final de la empresa) y arquitecto/SRE, más la plataforma profesional de datos y ML.'
    level: professional
    certs: [ACE, PCA, PCDE, PDE, PMLE]
    phase: V1
    labs: [cap-junior-secure-app, cap-engineer-migration, cap-devops-platform, cap-architect-global, cap-data-ml-platform]
    en:
      title: Career capstones
      description: One capstone per career stage (Blueprint §22) — Junior, Cloud Engineer, DevOps, Senior (company boss), Architect/SRE — plus the professional data & ML platform.
  - id: architect
    title: Arquitectura y recuperación ante desastres
    description: Casos prácticos del simulador de arquitectura y una conmutación regional real.
    level: professional
    certs: [PCA]
    phase: V1
    reference: https://cloud.google.com/learn/certification/cloud-architect
    labs: [arch-a01-global-expansion, arch-dr01-regional-failover, cap-architect-global]
    en:
      title: Architecture & disaster recovery
      description: Architecture Simulator case studies and a real regional failover.
  - id: devops
    title: 'DevOps: infraestructura como código y entrega'
    description: Operaciones con Terraform bajo presión y una plataforma de entrega completa.
    level: professional
    certs: [PCDE]
    phase: V1
    reference: https://cloud.google.com/learn/certification/cloud-devops-engineer
    labs: [devops-tf01-drift-import, cap-devops-platform]
    en:
      title: DevOps — infrastructure as code and delivery
      description: Terraform operations under pressure and a full delivery platform.
  - id: sre
    title: 'SRE: fiabilidad ante los fallos'
    description: Pesadilla en Kubernetes e ingeniería del caos con SLO.
    level: professional
    certs: [PCDE]
    phase: V1
    labs: [gke-k01-nightmare, sre-c01-zone-chaos]
    en:
      title: SRE — reliability under failure
      description: Kubernetes Nightmare and chaos engineering with SLOs.
  - id: gke
    title: Operaciones de GKE y Kubernetes
    description: Cargas, autoescalado y Workload Identity, y después incidentes de Kubernetes. Genera más con el generador de incidentes (sistema gke-shop).
    level: professional
    certs: [ACE, PCDE, PCSE]
    phase: V1
    reference: https://cloud.google.com/kubernetes-engine/docs/concepts/kubernetes-engine-overview
    labs: [ace-d16-gke-two-services, ace-d17-gke-hpa, gke-k02-workload-identity, gke-k01-nightmare]
    en:
      title: GKE & Kubernetes operations
      description: Workloads, autoscaling and Workload Identity, then Kubernetes incidents. Generate more with the incident generator (system gke-shop).
  - id: security
    title: Ingeniería de seguridad
    description: Mínimo privilegio, secretos y claves, cifrado, exposición y una respuesta completa a un incidente de credenciales filtradas.
    level: professional
    certs: [PCSE]
    phase: V1
    reference: https://cloud.google.com/learn/certification/cloud-security-engineer
    labs: [ace-d02-iam-storage-read, ace-d19-secret-env, ace-d24-cmek, ace-d25-public-exposure, gke-k02-workload-identity, sec-s01-leaked-key]
    en:
      title: Security engineering
      description: Least privilege, secrets and keys, encryption, exposure and a full incident response to a leaked credential.
  - id: network
    title: Ingeniería de redes
    description: Direccionamiento, diseño de VPC, salida privada, balanceo de carga, conectividad híbrida y emparejamiento con servicios compartidos.
    level: professional
    certs: [PCNE]
    phase: V2
    reference: https://cloud.google.com/learn/certification/cloud-network-engineer
    labs: [netfund-n01-address-plan, ace-d05-subnet-isolation, ace-d12-private-egress, ace-d13-lb-dns, ace-d18-api-db-firewall, net-n02-shared-services-peering, ace-d26-hybrid-design]
    en:
      title: Network engineering
      description: Addressing, VPC design, private egress, load balancing, hybrid connectivity and peering with shared services.
  - id: data
    title: Datos y bases de datos
    description: Operación y recuperación de Cloud SQL, control de costes de BigQuery e ingesta en streaming.
    level: professional
    certs: [PCDE, PCA]
    phase: V2
    labs: [ace-d07-cloud-sql, ace-d20-sql-saturated, data-d01-sql-recovery, ace-d21-bigquery-cost, ace-d22-pubsub-ingestion]
    en:
      title: Data & databases
      description: Cloud SQL operations and recovery, BigQuery cost control and streaming ingestion.
  - id: zentra
    title: 'Zentra: de cero a Soporte N2 en un banco digital'
    description: 'Entras en Soporte GCP de Zentra, un banco digital europeo que vive entero en Google Cloud. Una Semana 0 de talleres desde cero, una Semana 1 con el oficio de soporte (tickets, prioridades, escalados, P1, cambios, postmortem) y siete semanas de diez casos, de nivel básico a profesional: accesos, incidencias de los equipos, guardia, capacidad y datos, cierre de mes y operaciones. Cada semana termina con una prueba.'
    level: associate
    certs: [ACE, PCSE]
    phase: V3
    labs: []
    stages:
      - id: w0
        title: 'Semana 0 · Desde cero'
        level: basic
        description: 'Si nunca has tocado la nube, empieza aquí: diez talleres guiados que explican cada concepto antes del comando. Qué es Google Cloud, la terminal, gcloud, redes, cortafuegos, permisos, almacenamiento, registros y Linux. Termina con la prueba de la semana.'
        labs: [zentra-t01-what-is-cloud, zentra-t02-terminal, zentra-t03-gcloud-read, zentra-t04-networks, zentra-t05-firewall, zentra-t06-permissions, zentra-t07-storage, zentra-t08-logs, zentra-t09-linux, zentra-t10-week0-test]
        en: {title: 'Week 0 · From zero', description: 'If you have never touched the cloud, start here: ten guided workshops that explain each concept before the command. What Google Cloud is, the terminal, gcloud, networking, firewalls, permissions, storage, logs and Linux. Ends with the week test.'}
      - id: oficio
        title: 'Semana 1 · El oficio de soporte'
        level: basic
        description: 'Lo que no enseña ninguna certificación: cómo se trabaja un ticket en un banco. Tipos y prioridades, primer contacto, escribir al cliente y notas internas, escalar a otro equipo y a Google, un P1, gestión de cambios, decir que no con alternativa y el postmortem sin culpables. Termina con un turno completo y su traspaso.'
        labs: [zentra-s01-triage, zentra-s02-first-contact, zentra-s03-writing, zentra-s04-escalate-team, zentra-s05-google-case, zentra-s06-p1-incident, zentra-s07-change, zentra-s08-say-no, zentra-s09-postmortem, zentra-s10-week1-test]
        en: {title: 'Week 1 · The support craft', description: 'What no certification teaches: how a ticket is worked at a bank. Types and priorities, first contact, writing to the customer and internal notes, escalating to another team and to Google, a P1, change management, saying no with an alternative and the blameless postmortem. Ends with a full shift and its handover.'}
      - id: w1
        title: 'Semana 2 · Bienvenida'
        level: basic
        description: 'Tutoriales guiados desde cero: la consola, los registros, VMs privadas, Cloud Run, secretos, alertas, costes y tu primer ticket completo. Termina con la prueba de la semana.'
        labs: [zentra-z01-first-day, zentra-z02-who-is-who, zentra-z03-log-detective, zentra-z04-private-vm, zentra-z05-private-run, zentra-z06-secrets, zentra-z07-noc-alert, zentra-z08-finops-basics, zentra-z53-first-ticket, zentra-z54-week1-test]
        en: {title: 'Week 2 · Welcome', description: 'Guided tutorials from scratch: the console, logs, private VMs, Cloud Run, secrets, alerts, costs and your first full ticket. Ends with the week test.'}
      - id: w2
        title: 'Semana 3 · Accesos'
        level: basic
        description: 'Altas, cambios y bajas, externos, APIs, auditores, accesos temporales y cuentas de servicio con mínimo privilegio. Termina con la revisión trimestral de accesos.'
        labs: [zentra-z09-joiner, zentra-z10-mover, zentra-z11-urgent-leaver, zentra-z12-external-consultant, zentra-z13-enable-api, zentra-z14-auditors, zentra-z15-external-member, zentra-z49-temporary-access, zentra-z55-service-account, zentra-z56-access-review]
        en: {title: 'Week 3 · Access', description: 'Joiners, movers and leavers, outsiders, APIs, auditors, temporary access and least-privilege service accounts. Ends with the quarterly access review.'}
      - id: w3
        title: 'Semana 4 · Incidencias de los equipos'
        level: intermediate
        description: 'Pagos, BigQuery, GKE, Cloud Armor, despliegues, claves filtradas, Cloud SQL e imágenes. Termina con el lanzamiento de la tarjeta virtual.'
        labs: [zentra-z16-publish-denied, zentra-z17-push-backlog, zentra-z18-bq-denied, zentra-z19-wi-namespace, zentra-z20-armor-blocks-customers, zentra-z21-bad-release, zentra-z22-leaked-key, zentra-z57-sql-client, zentra-z58-image-pull, zentra-z59-week3-test]
        en: {title: 'Week 4 · Team incidents', description: 'Payments, BigQuery, GKE, Cloud Armor, releases, leaked keys, Cloud SQL and images. Ends with the virtual card launch.'}
      - id: w4
        title: 'Semana 5 · Guardia'
        level: intermediate
        description: 'Incidentes de producción con el reloj corriendo: endpoints, sondas, salida a internet, secretos, parámetros, ruido en los registros, apagados y permisos. Termina con el día de la nómina.'
        labs: [zentra-z23-push-endpoint, zentra-z24-healthcheck-path, zentra-z25-fx-no-egress, zentra-z26-secret-version, zentra-z60-sql-flag, zentra-z61-red-herring, zentra-z62-stopped-by-schedule, zentra-z63-scaled-to-zero, zentra-z64-invoker-removed, zentra-z27-payday-boss]
        en: {title: 'Week 5 · On call', description: 'Production incidents against the clock: endpoints, probes, egress, secrets, flags, noisy logs, shutdowns and permissions. Ends with payday.'}
      - id: w5
        title: 'Semana 6 · Capacidad y datos'
        level: advanced
        description: 'NAT sin puertos, zonas sin máquinas, cuotas, ubicación y coste de BigQuery, Cloud SQL para DORA, réplicas, Memorystore y autoescalado. Termina con la campaña de cashback.'
        labs: [zentra-z28-nat-ports, zentra-z29-zone-stockout, zentra-z30-cpu-quota, zentra-z31-bq-location, zentra-z32-sql-ha, zentra-z33-redis-network, zentra-z34-hpa-unknown, zentra-z65-bigquery-cost, zentra-z66-read-replica, zentra-z67-week5-test]
        en: {title: 'Week 6 · Capacity and data', description: 'NAT out of ports, zones without machines, quotas, BigQuery location and cost, Cloud SQL for DORA, replicas, Memorystore and autoscaling. Ends with the cashback campaign.'}
      - id: w6
        title: 'Semana 7 · Cierre de mes'
        level: advanced
        description: 'Conexiones agotadas, discos con evidencia regulatoria, Private Google Access, cortafuegos, DNS, APIs, sondas, costes y restauración de bases de datos. Termina con el informe trimestral al regulador.'
        labs: [zentra-z35-sql-connections, zentra-z36-disk-grow, zentra-z37-private-google-access, zentra-z38-firewall-priority, zentra-z39-private-dns, zentra-z40-api-disabled, zentra-z41-readiness-probe, zentra-z42-month-end-costs, zentra-z68-restore-database, zentra-z69-week6-test]
        en: {title: 'Week 7 · Month-end close', description: 'Exhausted connections, disks with regulatory evidence, Private Google Access, firewall, DNS, APIs, probes, costs and database restores. Ends with the quarterly regulator report.'}
      - id: w7
        title: 'Semana 8 · Operaciones'
        level: professional
        description: 'Rutas, escucha en localhost, etiquetas y puertos con nombre, exposición de datos, permisos, WORM, consultas lentas y despliegues canario. Termina con la caída de una zona de Google.'
        labs: [zentra-z43-default-route, zentra-z44-listen-localhost, zentra-z45-lost-tag, zentra-z46-named-port, zentra-z47-public-kyc-bucket, zentra-z48-key-permissions, zentra-z50-retention-lock, zentra-z51-slow-query, zentra-z70-canary, zentra-z52-zone-outage]
        en: {title: 'Week 8 · Operations', description: 'Routes, localhost listeners, tags and named ports, data exposure, permissions, WORM, slow queries and canary releases. Ends with a Google zone outage.'}
    en:
      title: 'Zentra: from zero to L2 support at a digital bank'
      description: 'You join GCP Support at Zentra, a European digital bank that runs entirely on Google Cloud. A Week 0 of from-zero workshops, a Week 1 on the support craft (tickets, priorities, escalations, P1s, changes, postmortems) and seven weeks of ten cases, from basic to professional: access, team incidents, on call, capacity and data, month-end close and operations. Each week ends with a test.'
  - id: support-bank
    title: Soporte GCP en banca
    description: 'El día a día de soporte de plataforma GCP en un banco regulado: peticiones de acceso, políticas de organización, redes privadas, permisos entre servicios, secretos, incidentes de seguridad, GKE, Cloud SQL, costes, auditoría, rotación de secretos, discos llenos, tickets mal dirigidos y caídas de Google. Tickets reales, preguntas al solicitante, respuestas escritas y escalados, sin saltarse las normas.'
    level: associate
    certs: [ACE, PCSE]
    phase: V3
    labs: [bank-b01-access-request, bank-b02-vm-policy, bank-b03-no-egress, bank-b04-app-db, bank-b05-run-403, bank-b06-secret-access, bank-b07-public-bucket, bank-b08-region-outage, bank-b09-gke-crashloop, bank-b10-sql-connections, bank-b11-bill-spike, bank-b12-leaver-joiner, bank-b13-audit-sink, bank-b14-secret-rotation, bank-b15-sa-key-request, bank-b16-region-policy, bank-b17-disk-full, bank-b18-not-gcp, bank-b19-gke-oomkilled, bank-b20-oslogin-ssh, bank-b21-lb-502-healthcheck, bank-b22-sink-no-writer, bank-b23-priority-pressure, bank-b24-gke-imagepull, bank-b25-wrong-identity, bank-b26-provider-outage, bank-b27-run-sql-timeout]
    en:
      title: GCP support in banking
      description: 'Day-to-day GCP platform support in a regulated bank: access requests, organization policies, private networking, service-to-service permissions, secrets, security incidents, GKE, Cloud SQL, costs, auditing, secret rotation, full disks, misrouted tickets and Google outages. Real tickets, questions to the requester, written replies and escalations, without bending the rules.'
  - id: serverless
    title: Sin servidor, datos gestionados y big data
    description: 'Cloud Functions, Cloud Scheduler, App Engine, Dataflow, Memorystore, Spanner y Firestore: los servicios gestionados del día a día con eventos, canarios, streaming y SQL real.'
    level: professional
    certs: [ACE, PCDE, PCA]
    phase: V2
    labs: [serverless-s01-event-function, serverless-s02-appengine-canary, serverless-s03-streaming-pipeline, serverless-s04-redis-cache, serverless-s05-spanner-orders, serverless-s06-firestore-profiles]
    en:
      title: Serverless, managed data and big data
      description: 'Cloud Functions, Cloud Scheduler, App Engine, Dataflow, Memorystore, Spanner and Firestore: everyday managed services with events, canaries, streaming and real SQL.'
  - id: ml
    title: Servicio de modelos de ML y MLOps
    description: Sirve modelos con mínimo privilegio y monitorización y despliega versiones nuevas como canarios.
    level: professional
    certs: [PMLE]
    phase: V2
    reference: https://cloud.google.com/learn/certification/machine-learning-engineer
    labs: [ace-d23-ml-endpoint, ml-m01-canary-model]
    en:
      title: ML serving & MLOps
      description: Serve models with least privilege and monitoring, then roll out new versions as canaries.
  - id: finops
    title: FinOps
    description: Lee la factura, encuentra anomalías, actúa sobre las recomendaciones con los responsables y añade barreras.
    level: associate
    certs: [ACE, PCA]
    phase: V1
    labs: [finops-f01-bill-shock]
    en:
      title: FinOps
      description: Read the bill, find anomalies, act on recommendations with the owners, add guardrails.
  - id: career
    title: 'Carrera: entrevistas'
    description: Modo entrevista con preguntas progresivas, repreguntas y un ejercicio en directo.
    level: associate
    certs: [ACE]
    phase: V1
    labs: [career-i01-cloud-engineer-interview]
    en:
      title: Career — interviews
      description: Interview Mode with progressive questions, follow-ups and a live exercise.

# Learning paths. A track is an ordered list of labs aligned to a certification
# or a role. `reference` is the official Google learning path used by
# `labctl curriculum` for the quarterly sync. Phases follow the roadmap
# (MVP → V1 → V2 → V3).
tracks:
  - id: foundations
    title: Foundations — IT, networking, tooling, automation, containers
    description: The base of the skill graph (Blueprint §4) before GCP Core — compute models, CIDR, structured output and APIs, containers and scripting.
    level: foundational
    certs: [ACE]
    phase: MVP
    labs: [fundamentals-f01-compute-models, netfund-n01-address-plan, devtools-t01-structured-output, containers-c01-hardened-image, automation-a01-nightly-sweep]
  - id: linux
    title: Linux for cloud engineers
    description: Disks, permissions, services and logs over IAP SSH.
    level: foundational
    certs: [ACE]
    phase: MVP
    labs: [linux-l01-disk-full, linux-l02-permission-denied]
  - id: ace-30
    title: Associate Cloud Engineer — 30 days
    description: One lab per day from context and IAM to incidents, capstone and boss battle. Builds the ACE competences through hands-on work.
    level: associate
    certs: [ACE]
    phase: MVP
    reference: https://cloud.google.com/learn/certification/cloud-engineer
    labs: [ace-d01-context, ace-d02-iam-storage-read, ace-d03-secure-bucket, ace-d04-web-vm, ace-d05-subnet-isolation, ace-d06-cloud-run, ace-d07-cloud-sql, ace-d08-logs-alert, ace-d09-health-check, ace-d10-checkpoint, ace-d11-app-403, ace-d12-private-egress, ace-d13-lb-dns, ace-d14-terraform, ace-d15-cloud-build, ace-d16-gke-two-services, ace-d17-gke-hpa, ace-d18-api-db-firewall, ace-d19-secret-env, ace-d20-sql-saturated, ace-d21-bigquery-cost, ace-d22-pubsub-ingestion, ace-d23-ml-endpoint, ace-d24-cmek, ace-d25-public-exposure, ace-d26-hybrid-design, ace-d27-deploy-rollback, ace-d28-architecture-review, ace-d29-capstone-orders, ace-d30-boss-incident]
  - id: capstones
    title: Career capstones
    description: One capstone per career stage (Blueprint §22) — Junior, Cloud Engineer, DevOps, Senior (company boss), Architect/SRE — plus the professional data & ML platform.
    level: professional
    certs: [ACE, PCA, PCDE, PDE, PMLE]
    phase: V1
    labs: [cap-junior-secure-app, cap-engineer-migration, cap-devops-platform, cap-architect-global, cap-data-ml-platform]
  - id: architect
    title: Architecture & disaster recovery
    description: Architecture Simulator case studies and a real regional failover.
    level: professional
    certs: [PCA]
    phase: V1
    reference: https://cloud.google.com/learn/certification/cloud-architect
    labs: [arch-a01-global-expansion, arch-dr01-regional-failover, cap-architect-global]
  - id: devops
    title: DevOps — infrastructure as code and delivery
    description: Terraform operations under pressure and a full delivery platform.
    level: professional
    certs: [PCDE]
    phase: V1
    reference: https://cloud.google.com/learn/certification/cloud-devops-engineer
    labs: [devops-tf01-drift-import, cap-devops-platform]
  - id: sre
    title: SRE — reliability under failure
    description: Kubernetes Nightmare and chaos engineering with SLOs.
    level: professional
    certs: [PCDE]
    phase: V1
    labs: [gke-k01-nightmare, sre-c01-zone-chaos]
  - id: gke
    title: GKE & Kubernetes operations
    description: Workloads, autoscaling and Workload Identity, then Kubernetes incidents. Generate more with the incident generator (system gke-shop).
    level: professional
    certs: [ACE, PCDE, PCSE]
    phase: V1
    reference: https://cloud.google.com/kubernetes-engine/docs/concepts/kubernetes-engine-overview
    labs: [ace-d16-gke-two-services, ace-d17-gke-hpa, gke-k02-workload-identity, gke-k01-nightmare]
  - id: security
    title: Security engineering
    description: Least privilege, secrets and keys, encryption, exposure and a full incident response to a leaked credential.
    level: professional
    certs: [PCSE]
    phase: V1
    reference: https://cloud.google.com/learn/certification/cloud-security-engineer
    labs: [ace-d02-iam-storage-read, ace-d19-secret-env, ace-d24-cmek, ace-d25-public-exposure, gke-k02-workload-identity, sec-s01-leaked-key]
  - id: network
    title: Network engineering
    description: Addressing, VPC design, private egress, load balancing, hybrid connectivity and peering with shared services.
    level: professional
    certs: [PCNE]
    phase: V2
    reference: https://cloud.google.com/learn/certification/cloud-network-engineer
    labs: [netfund-n01-address-plan, ace-d05-subnet-isolation, ace-d12-private-egress, ace-d13-lb-dns, ace-d18-api-db-firewall, net-n02-shared-services-peering, ace-d26-hybrid-design]
  - id: data
    title: Data & databases
    description: Cloud SQL operations and recovery, BigQuery cost control and streaming ingestion.
    level: professional
    certs: [PCDE, PCA]
    phase: V2
    labs: [ace-d07-cloud-sql, ace-d20-sql-saturated, data-d01-sql-recovery, ace-d21-bigquery-cost, ace-d22-pubsub-ingestion]
  - id: ml
    title: ML serving & MLOps
    description: Serve models with least privilege and monitoring, then roll out new versions as canaries.
    level: professional
    certs: [PMLE]
    phase: V2
    reference: https://cloud.google.com/learn/certification/machine-learning-engineer
    labs: [ace-d23-ml-endpoint, ml-m01-canary-model]
  - id: finops
    title: FinOps
    description: Read the bill, find anomalies, act on recommendations with the owners, add guardrails.
    level: associate
    certs: [ACE, PCA]
    phase: V1
    labs: [finops-f01-bill-shock]
  - id: career
    title: Career — interviews
    description: Interview Mode with progressive questions, follow-ups and a live exercise.
    level: associate
    certs: [ACE]
    phase: V1
    labs: [career-i01-cloud-engineer-interview]

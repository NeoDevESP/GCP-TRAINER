sections:
- id: quienes
  title:
  - Zentra en un minuto
  - Zentra in one minute
  body:
  - |-
    Zentra nació en 2019 como una app para pagar sin comisiones en el extranjero y hoy es un **banco digital con licencia bancaria europea**: cuentas con IBAN propio, tarjetas, pagos instantáneos, cambio de divisas, ahorro y préstamos. No tiene oficinas: todo pasa en la app, y la app vive en Google Cloud.

    Que seamos un banco lo cambia todo en soporte: estamos **regulados** (supervisión bancaria, normativa europea de resiliencia operativa DORA, PCI DSS para tarjetas, protección de datos), auditan lo que hacemos y cada caída sale en las redes en minutos. Por eso hay normas que parecen lentas y no se saltan nunca.
  - |-
    Zentra was born in 2019 as an app to pay abroad without fees and is now a **digital bank with a European banking licence**: accounts with their own IBAN, cards, instant payments, currency exchange, savings and loans. It has no branches: everything happens in the app, and the app lives on Google Cloud.

    Being a bank changes everything in support: we're **regulated** (banking supervision, the EU's DORA operational resilience rules, PCI DSS for cards, data protection), what we do gets audited and every outage hits social media within minutes. That's why some rules look slow and are never bent.

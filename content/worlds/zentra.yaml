glossary:
- term:
  - Ledger (libro mayor)
  - Ledger
  def:
  - Registro contable de cada movimiento de dinero. Si discrepa, es un incidente grave.
  - Accounting record of every money movement. If it diverges, it's a major incident.
- term:
  - SEPA Instant
  - SEPA Instant
  def:
  - Transferencias europeas en menos de 10 segundos, 24x7.
  - European transfers in under 10 seconds, 24x7.
- term:
  - PCI DSS
  - PCI DSS
  def:
  - Estándar de seguridad para datos de tarjetas. Obliga a aislar y auditar ese entorno.
  - Security standard for card data. Requires isolating and auditing that environment.
- term:
  - DORA
  - DORA
  def:
  - 'Reglamento europeo de resiliencia operativa digital: gestión de incidentes TIC, pruebas y proveedores.'
  - 'EU Digital Operational Resilience Act: ICT incident management, testing and third parties.'
- term:
  - KYC
  - KYC
  def:
  - 'Conoce a tu cliente: verificación de identidad al abrir la cuenta.'
  - 'Know your customer: identity checks when opening an account.'
- term:
  - AML
  - AML
  def:
  - Prevención del blanqueo de capitales; el antifraude alimenta sus alertas.
  - Anti-money laundering; anti-fraud feeds its alerts.
- term:
  - SCA
  - SCA
  def:
  - Autenticación reforzada del cliente exigida por PSD2 para pagar.
  - Strong customer authentication required by PSD2 for payments.
- term:
  - CAB
  - CAB
  def:
  - Comité que aprueba los cambios en producción.
  - Board that approves production changes.
- term:
  - RTO / RPO
  - RTO / RPO
  def:
  - Tiempo máximo de caída y datos máximos que se pueden perder en un desastre.
  - Maximum downtime and maximum data loss allowed in a disaster.
- term:
  - SLO
  - SLO
  def:
  - Objetivo de fiabilidad de un servicio (p. ej. 99,95 % de pagos correctos al mes).
  - A service's reliability target (e.g. 99.95% successful payments a month).
- term:
  - CSIRT
  - CSIRT
  def:
  - Equipo de respuesta a incidentes de seguridad.
  - Security incident response team.
- term:
  - CMEK
  - CMEK
  def:
  - Claves de cifrado gestionadas por el cliente en Cloud KMS.
  - Customer-managed encryption keys in Cloud KMS.
- term:
  - OU
  - OU
  def:
  - 'Unidad organizativa de Workspace: agrupa cuentas y les aplica políticas.'
  - 'Workspace organizational unit: groups accounts and applies policies to them.'
- term:
  - Grupo de seguridad
  - Security group
  def:
  - Grupo de Google marcado para dar accesos; no admite miembros externos.
  - A Google group flagged for granting access; doesn't accept external members.

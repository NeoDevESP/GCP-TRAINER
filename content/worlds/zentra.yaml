  body:
  - |-
    Una sola organización, **zentra.dev**, con carpetas por función y entorno. Cada servicio tiene su proyecto por entorno, con nombre `zentra-SERVICIO-ENTORNO`. Todos los proyectos llevan las etiquetas `equipo`, `entorno`, `coste` y `datos` (`pci`, `personales` o `ninguno`).

    En los casos prácticos trabajarás dentro de uno de estos proyectos (su ID real cambia en cada partida, pero el papel es el del proyecto que diga el ticket).
  - |-
    A single organization, **zentra.dev**, with folders by function and environment. Each service has a project per environment, named `zentra-SERVICE-ENV`. Every project carries the labels `equipo`, `entorno`, `coste` and `datos` (`pci`, `personales` or `ninguno`).

    In the practice cases you'll work inside one of these projects (its real ID changes every run, but its role is the project the ticket names).

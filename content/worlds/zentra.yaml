  - 'Ten rules that aren''t up for debate at Zentra. Many tickets will ask you to bend one "just this once": your job is to solve the problem **without** breaking them, and explain why.'
  cards:
  - title:
    - 1 · Datos en la UE
    - 1 · Data in the EU
    text:
    - Ningún recurso fuera de regiones europeas.
    - No resource outside European regions.
    meta:
    - ''
    - ''
  - title:
    - 2 · Sin IP públicas
    - 2 · No public IPs
    text:
    - Se entra por IAP y se sale por NAT.
    - In through IAP, out through NAT.
    meta:
    - ''
    - ''
  - title:
    - 3 · Accesos por grupos
    - 3 · Access through groups
    text:
    - Ni un rol a una persona; y nunca roles básicos (Owner, Editor) en producción.
    - Not one role to a person; and never basic roles (Owner, Editor) in production.
    meta:
    - ''
    - ''
  - title:
    - 4 · Sin claves de cuentas de servicio
    - 4 · No service account keys
    text:
    - Suplantación o Workload Identity.
    - Impersonation or Workload Identity.
    meta:
    - ''
    - ''
  - title:
    - 5 · Secretos en Secret Manager
    - 5 · Secrets in Secret Manager
    text:
    - Nunca en variables, código ni tickets.
    - Never in variables, code or tickets.
    meta:
    - ''
    - ''
  - title:
    - 6 · Cambios por pipeline y CAB
    - 6 · Changes through pipeline and CAB
    text:
    - En producción, a mano solo en emergencia, documentado y llevado luego al código.
    - In production, by hand only in an emergency, documented and then put into code.
    meta:
    - ''
    - ''
  - title:
    - 7 · Lo mínimo para resolver
    - 7 · The minimum to resolve
    text:
    - El cambio más pequeño que arregla la causa, no el que tapa el síntoma.
    - The smallest change that fixes the cause, not the one that hides the symptom.
    meta:
    - ''
    - ''
  - title:
    - 8 · Nunca destruir evidencias
    - 8 · Never destroy evidence
    text:
    - 'En seguridad: contener, conservar y escalar al CSIRT.'
    - 'In security: contain, preserve and escalate to the CSIRT.'

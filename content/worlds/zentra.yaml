- id: red
  title:
  - La red
  - The network
  body:
  - 'Una **VPC compartida** (`zentra-vpc`, en el proyecto host `zentra-red-host`) da red a todos los proyectos de servicio. Nada tiene IP pública: se entra a las VMs por **IAP** y se sale a internet por **Cloud NAT**. Cloud SQL y Memorystore se alcanzan por IP privada (acceso a servicios privados) y Cloud Run sale a la VPC con *Direct VPC egress*. El CPD antiguo, donde sigue el conector con la red de pagos europea, se une por **Interconnect** con BGP.'
  - 'A **Shared VPC** (`zentra-vpc`, in the host project `zentra-red-host`) gives networking to every service project. Nothing has a public IP: you reach VMs through **IAP** and go out to the internet through **Cloud NAT**. Cloud SQL and Memorystore are reached by private IP (private services access) and Cloud Run reaches the VPC with *Direct VPC egress*. The old data centre, where the connector to the European payments network still lives, joins over **Interconnect** with BGP.'
  cards:
  - title:
    - Subredes
    - Subnets
    text:
    - apps 10.40.1.0/24 · datos 10.40.2.0/24 · gke 10.40.8.0/22 (europe-west1); réplica en europe-west4 para recuperación.
    - apps 10.40.1.0/24 · data 10.40.2.0/24 · gke 10.40.8.0/22 (europe-west1); mirror in europe-west4 for recovery.
    meta:
    - zentra-vpc
    - zentra-vpc
  - title:
    - Cortafuegos
    - Firewall
    text:
    - Denegar por defecto. Se permite por etiquetas de red y por cuenta de servicio; IAP (35.235.240.0/20) a tcp:22; sondas de salud (35.191.0.0/16, 130.211.0.0/22).
    - Deny by default. Allowed by network tags and service account; IAP (35.235.240.0/20) to tcp:22; health probes (35.191.0.0/16, 130.211.0.0/22).
    meta:
    - Equipo de Red
    - Network team
  - title:
    - Salida
    - Egress
    text:
    - Cloud NAT zentra-nat con IP fijas que el proveedor de divisas tiene en su lista de permitidas.
    - Cloud NAT zentra-nat with fixed IPs the FX provider has allow-listed.
    meta:
    - Si cambian, el proveedor bloquea
    - If they change, the provider blocks us

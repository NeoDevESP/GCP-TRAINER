# Zentra: the fictional European digital bank of the "zentra" route.
# Every text is a [es, en] pair.
id: zentra
name: Zentra
track: zentra
tagline:
- El banco digital europeo que vive entero en Google Cloud. Tu nuevo trabajo.
- The European digital bank that runs entirely on Google Cloud. Your new job.
intro:
- |-
  Acabas de entrar en el equipo de **Soporte de Plataforma GCP** de Zentra. Este manual es lo que te darían el primer día: quiénes somos, cómo se organizan los equipos, cómo están montados la identidad y Google Cloud, cómo funciona la app por dentro y las normas que nunca se saltan. Los casos de la ruta Zentra ocurren aquí, con estas personas y estos sistemas: cuanto mejor conozcas la empresa, antes resolverás los tickets.

  Zentra es una empresa ficticia creada para aprender; cualquier parecido con un banco real es casualidad.
- |-
  You've just joined Zentra's **GCP Platform Support** team. This handbook is what you'd get on day one: who we are, how the teams are organized, how identity and Google Cloud are laid out, how the app works inside and the rules that are never bent. The Zentra route's cases happen here, with these people and these systems: the better you know the company, the faster you'll solve the tickets.

  Zentra is a fictional company made for learning; any resemblance to a real bank is coincidental.

- id: identidad
  title:
  - 'Identidad: Google Workspace y Cloud Identity'
  - 'Identity: Google Workspace and Cloud Identity'
  body:
  - |-
    Todo empleado tiene una cuenta **@zentra.dev** en Google Workspace: es su correo y también su identidad en Google Cloud. Las cuentas se organizan en **unidades organizativas (OU)** y los permisos de GCP **nunca se dan a personas: se dan a grupos de Google**. Para dar acceso a alguien se le mete en el grupo de su equipo; para quitárselo, se le saca.

    Convención de grupos: `gcp-EQUIPO[-ROL]@zentra.dev` (p. ej. `gcp-pagos-dev`, `gcp-sre`, `gcp-auditores`). Los grupos de acceso a GCP son **grupos de seguridad** y **no admiten miembros externos**; los consultores externos van en la OU `/Externos` y su acceso caduca.

    Herramientas que usarás: `gcloud identity groups …` para los grupos y `gam` para consultar usuarios, grupos, OU y el informe de auditoría de administración (`gam report admin`).
  - |-
    Every employee has a **@zentra.dev** Google Workspace account: it's their email and also their Google Cloud identity. Accounts are organized in **organizational units (OUs)** and GCP permissions are **never granted to people: they're granted to Google groups**. To give someone access you add them to their team's group; to remove it, you take them out.

    Group naming: `gcp-TEAM[-ROLE]@zentra.dev` (e.g. `gcp-pagos-dev`, `gcp-sre`, `gcp-auditores`). GCP access groups are **security groups** and **don't accept external members**; external consultants live in the `/Externos` OU and their access expires.

    Tools you'll use: `gcloud identity groups …` for groups and `gam` to look up users, groups, OUs and the admin audit report (`gam report admin`).
  diagram:

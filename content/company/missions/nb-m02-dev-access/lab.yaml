id: nb-m02-dev-access
title: "REQ: web developers need to deploy in dev"
summary: Grant a team exactly what it needs in development and nothing in production.
level: basic
branch: iam
type: challenge
mode: career
skills: [iam.roles, iam.leastprivilege]
difficulty: 2
minutes: 30
company: {stage: junior, project: dev-web, kind: REQ, after: [nb-m01-orientation]}
ticket:
  id: REQ-117
  kind: REQ
  priority: P3
  summary: "The web team (group web-devs@nebula.dev) must deploy Cloud Run services and manage files in the dev assets bucket of {{.dev_web}}. Please give them owner so they stop asking."
  reporter: Leo (web team)
actors:
  - role: developer
    name: Leo (web team)
    fallback: "Just give us owner, it's only dev!"
    facts:
      - {keywords: [[prod, production, produccion]], answer: "No, we don't need production. Deployments to prod go through the pipeline."}
      - {keywords: [[bucket, files, archivos, assets, storage]], answer: "Only gs://dev-assets-{{.dev_web}} — upload, overwrite and delete images."}
  - role: security
    name: Aisha (CISO office)
    facts:
      - {keywords: [[owner, editor, basic, basico]], answer: "Basic roles are banned by policy, even in dev. Use predefined roles."}
story: |
  Leo asks for **owner** on `{{.dev_web}}` for `group:web-devs@nebula.dev`. Find out what they really need
  (use `ask developer "..."` and `ask security "..."`) and grant least privilege. Resolve the ticket with a note.
objectives:
  - Clarify the real need with the requester
  - Grant predefined roles at the right scope
  - No access to production, no basic roles
solution: |
  ask developer "do you need production access?"
  ask developer "which bucket or files do you need?"
  gcloud projects add-iam-policy-binding {{.dev_web}} --member=group:web-devs@nebula.dev --role=roles/run.developer
  gcloud storage buckets add-iam-policy-binding gs://dev-assets-{{.dev_web}} --member=group:web-devs@nebula.dev --role=roles/storage.objectAdmin
  ticket resolve "Granted run.developer on dev-web and objectAdmin on the dev assets bucket only; owner is not allowed by policy."
rubric:
  - name: Team can work
    validator: functional
    points: 35
    all: true
    checks:
      - {type: iam, principal: "group:web-devs@nebula.dev", permission: run.services.create, resource: project, desc: "Can deploy Cloud Run in dev-web"}
      - {type: iam, principal: "group:web-devs@nebula.dev", permission: storage.objects.delete, resource: "bucket:dev-assets-{{.dev_web}}/img.png", desc: "Can manage the dev assets"}
  - name: Least privilege
    validator: security
    points: 40
    critical: true
    all: true
    checks:
      - {type: no_basic_roles, members: ["group:web-devs@nebula.dev"], desc: "No basic roles"}
      - {type: iam, on: "{{.prod_web}}", principal: "group:web-devs@nebula.dev", permission: run.services.create, resource: project, expect: false, desc: "No access to production"}
      - {type: iam, principal: "group:web-devs@nebula.dev", permission: compute.instances.delete, resource: project, expect: false, desc: "No compute admin in dev"}
  - name: Requirements clarified
    validator: diagnosis
    points: 10
    checks:
      - {type: asked, actor: developer, min: 1, desc: "Asked the requester what they need"}
  - name: Ticket closed
    validator: evidence
    points: 15
    checks:
      - {type: ticket_resolved, desc: "Resolution note on the ticket"}

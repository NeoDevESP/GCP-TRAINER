id: nb-m05-budget
title: "COST: FinOps quiere visibilidad del gasto de la tienda"
summary: Configura un presupuesto con umbrales de alerta y explica lo que los presupuestos pueden y no pueden hacer.
level: intermediate
branch: finops
type: challenge
mode: career
skills: [foundations.billing, finops.visibility]
difficulty: 2
minutes: 25
company: {stage: engineer, project: prod-web, kind: COST, after: [nb-m01-orientation]}
ticket:
  id: COST-12
  kind: COST
  priority: P3
  summary: "Necesitamos una alerta antes de que el proyecto de la tienda supere los 1.000 EUR al mes: al 50 %, 90 % y 100 %."
  reporter: Marta (FinOps)
actors:
  - role: finance
    name: Marta (FinOps)
    facts:
      - {keywords: [[cap, stop, limit, limite, corta, tope, deten, parar]], answer: "¿El presupuesto detendrá el gasto automáticamente? Necesitamos saberlo, lo ha preguntado el consejo."}
story: |
  Crea un presupuesto llamado `storefront-monthly` de **1000 EUR** en `{{.prod_web}}` con umbrales del 50 %, 90 % y 100 %,
  revisa la estimación actual y responde en el ticket a la pregunta de Marta.
objectives:
  - Estima el gasto actual
  - Presupuesto con tres umbrales
  - Explica la diferencia entre presupuestos y límites
solution: |
  gcloud billing estimate
  gcloud billing budgets create --billing-account=0X0X0X-0X0X0X-0X0X0X --display-name=storefront-monthly --budget-amount=1000EUR --threshold-rule=percent=0.5 --threshold-rule=percent=0.9 --threshold-rule=percent=1.0
  ticket update "Budget storefront-monthly created at 1000 EUR with alerts at 50, 90 and 100 percent. Budgets only alert, they do not cap spending."
rubric:
  - name: Presupuesto
    validator: cost
    points: 50
    all: true
    checks:
      - {type: exists, path: "budgets[\"storefront-monthly\"]", expect: {amount: 1000, thresholds: {minLen: 3}}, desc: "Presupuesto de 1000 EUR con tres umbrales"}
  - name: Medido
    validator: diagnosis
    points: 20
    checks:
      - {type: command, regex: "billing estimate|budgets list", desc: "Gasto actual revisado"}
  - name: Explicado
    validator: evidence
    points: 30
    checks:
      - {type: ticket_update, public: false, keywords: [[alert, alerta], [cap, limit, stop, no corta, do not, tope, limite, deten, parar, 'no ']], desc: "Se ha explicado que los presupuestos alertan pero no limitan el gasto"}
en:
  title: 'COST: FinOps wants spend visibility on the storefront'
  summary: Configure a budget with alert thresholds and explain what budgets can and cannot do.
  story: |
    Create a budget named `storefront-monthly` of **1000 EUR** on `{{.prod_web}}` with thresholds 50%, 90% and 100%,
    check the current estimate, and answer Marta's question on the ticket.
  objectives:
    - Estimate current spend
    - Budget with three thresholds
    - Explain budgets vs caps
  ticket:
    summary: We need an alert before the storefront project exceeds 1,000 EUR per month — at 50%, 90% and 100%.
  text:
    Presupuesto: Budget
    Presupuesto de 1000 EUR con tres umbrales: 1000 EUR budget with three thresholds
    Medido: Measured
    Gasto actual revisado: Checked current spend
    Explicado: Explained
    Se ha explicado que los presupuestos alertan pero no limitan el gasto: Explained that budgets alert but do not cap
    Marta (FinOps): Marta (FinOps)
    ¿El presupuesto detendrá el gasto automáticamente? Necesitamos saberlo, lo ha preguntado el consejo.: Will the budget stop the spending automatically? We need to know, the board asked.

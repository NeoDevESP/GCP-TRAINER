id: nb-m08-guardrails
title: "CHG: organisation guardrails for Production"
summary: Enforce preventive controls at folder level so every current and future production project inherits them.
level: advanced
branch: architecture
type: challenge
mode: career
skills: [iam.orgpolicy, architecture.governance]
difficulty: 4
minutes: 40
company: {stage: senior, project: security-monitoring, kind: CHG, after: [nb-m04-marketing-assets]}
setup: |
  gcloud resource-manager folders add-iam-policy-binding {{.folder_production}} --member=user:student@gcplab.dev --role=roles/orgpolicy.policyAdmin
ticket:
  id: CHG-240
  kind: CHG
  priority: P2
  summary: "After last quarter's findings the board wants guardrails: no public buckets and no service-account keys in Production, including future projects."
  reporter: Aisha (CISO office)
actors:
  - role: security
    name: Aisha (CISO office)
    facts:
      - {keywords: [[development, dev, sandbox]], answer: "Only Production for now — dev teams still use keys for a legacy tool, we'll migrate them next quarter."}
      - {keywords: [[future, new, nuevo, inherit, hered]], answer: "Yes, any new project created in the Production folder must get the same rules automatically."}
story: |
  Enforce `storage.publicAccessPrevention` and `iam.disableServiceAccountKeyCreation` on the **Production folder**
  (id `{{.folder_production}}`) so all production projects inherit them — but not Development. You were granted
  Organization Policy Administrator on that folder. Document the change.
objectives:
  - Choose the right level of the hierarchy
  - Enforce both constraints
  - Leave Development unaffected
solution: |
  gcloud resource-manager folders list
  ask security "does it apply to development?"
  gcloud resource-manager org-policies enable-enforce storage.publicAccessPrevention --folder={{.folder_production}}
  gcloud resource-manager org-policies enable-enforce iam.disableServiceAccountKeyCreation --folder={{.folder_production}}
  ticket update "Enforced publicAccessPrevention and disableServiceAccountKeyCreation on the Production folder; all production projects inherit them, Development is unchanged."
rubric:
  - name: Guardrails inherited
    validator: security
    points: 50
    all: true
    checks:
      - {type: org_policy, on: "{{.prod_web}}", constraint: storage.publicAccessPrevention, desc: "prod-web inherits public access prevention"}
      - {type: org_policy, on: "{{.prod_data}}", constraint: iam.disableServiceAccountKeyCreation, desc: "prod-data inherits no-SA-keys"}
  - name: Right scope
    validator: state
    points: 25
    checks:
      - {type: org_policy, on: "{{.dev_web}}", constraint: iam.disableServiceAccountKeyCreation, enforced: true, not: true, desc: "Development not affected"}
  - name: Documented
    validator: evidence
    points: 25
    checks:
      - {type: ticket_update, public: false, keywords: [[folder, carpeta], [inherit, hered]], desc: "Change documented"}

# Builds and publishes the image of the single-service Cloud Run deployment
# (deploy/cloudrun/deploy.sh or deploy.ps1). Content validation and the lab
# checks run inside the image build (labctl validate).
#
#   gcloud builds submit --config deploy/cloudrun/cloudbuild.yaml \
#     --substitutions=_IMAGE=REGION-docker.pkg.dev/PROJECT/REPO/app:TAG .
substitutions:
  _IMAGE: ""
options:
  logging: CLOUD_LOGGING_ONLY   # required with a user-specified build service account
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/Dockerfile", "--target", "runtime", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
